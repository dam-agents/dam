[tools]
nodejs = "24"

# Go
go = "1.24"

# Kubernetes
helm = "latest"
kubeconform = "latest"
"lima" = "2"

# misc
fd = "latest"
yq = "latest"
gum = "latest"

[settings]
experimental = true
task.disable_spec_from_run_scripts = true
raw = true

# GHA runners don't have Node's release signing key in their GPG keyring,
# so mise's default GPG verify fails on first install of a new Node major
# (e.g. 24.16.0). SHA256 checksum verify still runs and remains the
# primary integrity check.
[settings.node]
gpg_verify = false

[hooks]
postinstall = ["{{ mise_bin }} setup"]

[task_config]
includes = [
    "./tasks.toml",
    "packages/agent-runtime/tasks.toml",
    "packages/agent-runtime-api/tasks.toml",
    "packages/api-server/tasks.toml",
    "packages/api-server-api/tasks.toml",
    "packages/cli/tasks.toml",
    "packages/controller/tasks.toml",
    "packages/db/tasks.toml",
    "packages/ui/tasks.toml",
    "deploy/helm/tasks.toml",
    "deploy/tasks.toml",
]
