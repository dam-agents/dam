schemaVersion: v1
id: plain-wiki
name: Plain Wiki
description: >-
  A knowledge base agent that keeps markdown files and organizes them for you.
  Lightweight, and works with no network beyond the model.
category: knowledge
icon: document
# The template's bootstrap installs this command; the first session runs it.
onboarding: { command: wiki-onboard }
knowledgeBase:
  template: plain-wiki
# The toolkit is the workspace: seeded at the commit the catalog resolved, then
# its own bootstrap runs from that checkout — nothing is fetched at install.
seed:
  url: https://github.com/dam-agents/plain-wiki
  ref: main
install:
  command: bash bootstrap.sh
providers: [ibm-litellm, anthropic, openai]
parameters:
  - name: what the knowledge base should cover
    required: true
  - name: files or notes to start from
    required: false
