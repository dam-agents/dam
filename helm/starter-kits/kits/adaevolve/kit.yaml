schemaVersion: v1
id: adaevolve
name: AdaEvolve
description: >-
  Multi-island adaptive code and algorithm optimization (SkyDiscover). Brings its own agent, built on Claude Code.
category: research
icon: chart
docsUrl: https://github.com/dam-agents/dam/blob/main/packages/agents/skydiscover/README.md
# No intake turn — the workload takes its brief from the user's first prompt.
onboarding: false
image:
  ref: quay.io/dam-agents/skydiscover # @ci-pin skydiscover-image-tag
  harness: claude-code
  providers: [ibm-litellm, openai]
resources:
  storage: 5Gi
connections:
  - accepts: [github, github-enterprise]
    note: Needed to clone private target repositories and publish results.
env:
  - name: SKYDISCOVER_SEARCH
    value: adaevolve
