schemaVersion: v1
id: spotlights
name: Spotlights
tagline: Find the few places in a codebase worth optimizing.
description: >-
  Points the Spotlights engine at a target repository and an optimization
  objective, and returns a ranked map of the few code regions worth
  optimizing, each with change proposals grounded in the code and the
  research literature.
category: research
icon: search
docsUrl: https://github.com/AI-native-Systems-Research/spotlights
harnesses: [claude-code]
# The engine runs both claude and codex, so the provider must serve Claude
# and GPT models through one gateway.
providers: [ibm-litellm]
resources:
  cpu: "2"
  memory: 4Gi
  storage: 10Gi
  note: >-
    A run clones the target repository and drives claude and codex as
    subprocesses for 20-45 minutes per module.
install:
  # uv puts the CLIs in ~/.local/bin, which is not on the image's PATH;
  # ~/.local/share/aube/bin is, and it is in the home, so the links last.
  command: |
    set -eu
    uv tool install --force "git+https://github.com/AI-native-Systems-Research/spotlights.git@v0.1.1"
    mkdir -p "$HOME/.local/share/aube/bin"
    for bin in spotlights-engine signal-pipeline spotlights-objectives; do
      if [ -x "$HOME/.local/bin/$bin" ]; then
        ln -sf "$HOME/.local/bin/$bin" "$HOME/.local/share/aube/bin/$bin"
      fi
    done
    spotlights-engine init
onboarding:
  prompt: >-
    The Spotlights engine (`spotlights-engine`) is installed, and
    `spotlights-engine init` has added its slash commands to the work
    directory. Run `spotlights-engine doctor` and fix anything it reports
    before you go on. Then ask the user for the target repository and the
    optimization objective. If they are unsure about the objective, run
    `/spotlights-objective-setting` with them. Clone the repository under the
    work directory and confirm with the user which modules to include.
    `--include` takes the extractor's qualified names, which start at the
    repository root (`pkg/sub`, not `sub`); a run whose names match nothing
    logs the available ones and stops after extraction. Pin the models with
    `--claude-model "$ANTHROPIC_DEFAULT_OPUS_MODEL" --codex-model
    "$OPENAI_MODEL"`. A run resumes from its `--artifacts-dir`, and refuses
    to resume once any option has changed, so pass a fresh `--artifacts-dir`
    whenever you change one. Tell the user that one module takes about 20-45
    minutes and $15-20 in model cost before you start a run, and start it
    with `platform-keep` so it finishes after your turn ends.
connections:
  - accepts: [github, github-enterprise]
    note: Needed to clone private target repositories.
