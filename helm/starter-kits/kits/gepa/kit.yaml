schemaVersion: v1
id: gepa
name: GEPA
description: >-
  Reflective prompt and text-optimization agent. Brings its own agent, built on Claude Code.
category: research
icon: idea
docsUrl: https://github.com/dam-agents/dam/blob/main/packages/agents/gepa/README.md
# No intake turn — the workload takes its brief from the user's first prompt.
onboarding: false
image:
  ref: quay.io/dam-agents/gepa # @ci-pin gepa-image-tag
  harness: claude-code
  # No bedrock yet: LiteLLM, GEPA's loop client, can call Bedrock, but this
  # image has not been tested on it. List it once it has.
  providers: [ibm-litellm, curve-bender, anthropic]
resources:
  storage: 5Gi
connections:
  - accepts: [github, github-enterprise]
    note: Needed to clone private target repositories and publish results.
