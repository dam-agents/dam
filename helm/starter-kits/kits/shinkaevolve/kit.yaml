schemaVersion: v1
id: shinkaevolve
name: ShinkaEvolve
description: >-
  Sample-efficient evolutionary program-optimization agent. Brings its own agent, built on Claude Code.
category: research
docsUrl: https://github.com/dam-agents/dam/blob/main/packages/agents/shinkaevolve/README.md
image:
  ref: quay.io/dam-agents/shinkaevolve # @ci-pin shinkaevolve-image-tag
  harness: claude-code
  providers: [ibm-litellm, openai]
resources:
  storage: 5Gi
connections:
  - accepts: [ibm-litellm, openai]
    required: true
    note: >-
      OPENAI-compatible model provider; the IBM LiteLLM proxy is the recommended choice.
  - accepts: [github, github-enterprise]
    note: Needed to clone private target repositories and publish results.
parameters:
  - name: target repository or problem definition
    required: true
  - name: optimization goal and how it is measured
    required: true
