schemaVersion: v1
id: llm-wiki
name: LLM Wiki
description: >-
  A knowledge base agent that builds a structured wiki with a knowledge graph,
  from the llm-wiki toolkit. Point it at repos and documents, then ask it
  questions.
category: knowledge
icon: chart
# The template's bootstrap installs this command; the first session runs it.
onboarding: { command: wiki-onboard }
knowledgeBase:
  template: llm-wiki
install:
  command: "set -o pipefail; curl -fsSL https://raw.githubusercontent.com/dam-agents/llm-wiki-v2/main/bootstrap.sh | bash"
  harnessEnv: LLM_WIKI_HARNESS
providers: [ibm-litellm, anthropic, openai]
parameters:
  - name: what the knowledge base should cover
    required: true
  - name: repositories or documents to read from
    required: false
