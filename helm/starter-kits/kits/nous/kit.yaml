schemaVersion: v1
id: nous
name: Nous
description: >-
  Hypothesis-driven experimentation campaigns against a target system the
  agent clones, builds, patches and measures. Runs on the pre-built Nous
  image.
category: research
icon: microscope
docsUrl: https://github.com/dam-agents/dam/blob/main/packages/agents/nous/README.md
# No intake turn — the workload takes its brief from the user's first prompt.
onboarding: false
image:
  ref: quay.io/dam-agents/nous # @ci-pin nous-image-tag
  harness: claude-code
  # No bedrock: Nous's gate summaries are OpenAI-format calls, served by the
  # in-pod gateway only when Claude Code uses it; on Bedrock it does not, and
  # a Bedrock connection injects no OpenAI endpoint.
  providers: [ibm-litellm, curve-bender, anthropic]
resources:
  cpu: "2"
  memory: 4Gi
  storage: 10Gi
  note: >-
    A campaign clones, builds and runs the target system, with a git worktree
    per arm and its own Python environment — more CPU, memory and disk than a
    chat agent.
connections:
  - accepts: [github, github-enterprise]
    note: Needed to clone private target repositories and publish results.
hibernationTimeoutMin: 0
