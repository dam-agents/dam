schemaVersion: v1
id: k-search
name: K-Search
description: >-
  LLM-driven GPU kernel optimization with evaluation on Modal. Brings its own
  agent.
category: research
icon: search
docsUrl: https://github.com/dam-agents/dam/blob/main/packages/agents/k-search/README.md
# No intake turn — the workload takes its brief from the user's first prompt.
onboarding: false
image:
  ref: quay.io/dam-agents/k-search # @ci-pin k-search-image-tag
  # No bedrock: the kernel search calls an OpenAI-compatible endpoint
  # (OPENAI_BASE_URL), and a Bedrock connection injects none.
  providers: [ibm-litellm, curve-bender, openai]
resources:
  cpu: "2"
  memory: 4Gi
  storage: 5Gi
connections:
  - accepts: [modal]
    required: true
    note: Kernel evaluation runs on Modal cloud GPUs.
