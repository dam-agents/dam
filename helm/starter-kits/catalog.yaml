# The platform's built-in starter kit catalog. Shipped inside the chart and
# mounted into the api-server; the `platform` catalog on every install.
# Workload kits pin their image by the same publish step that pins every
# other image (`# @ci-pin <component>-image-tag`). A kit whose code is a
# repository of its own is not copied here — it carries its own kit.yaml and
# the curated catalog points at it, so the kit and its code are one commit.
kits:
  - path: kits/nous
  - path: kits/openevolve
  - path: kits/shinkaevolve
  - path: kits/gepa
  - path: kits/adaevolve
  - path: kits/evox
  - path: kits/k-search
  # A definition kit: its kit.yaml lives in the repository holding the agent it
  # installs, so the kit and its code are one commit. Listed here rather than in
  # a moving catalog because it is off by default and the switch that turns it
  # on is a chart value.
  - id: software-developer
    url: https://github.com/dam-agents/software-developer
