# E2E test cluster overlay. Layered on top of values-local.yaml
# by `mise run e2e`. Flips the e2e.enabled gate so the api-server registers
# its control tRPC namespace and the mock harness becomes drivable from
# Playwright. values-local.yaml already enables `keycloak.testUser` (dev/dev).

e2e:
  enabled: true

# Shorten the queued-prompt park window from its 90s default. A spec that
# proves prompts outlive an abandoned tab has to wait the window out in real
# time, so the production value would cost every such spec a minute and a
# half of sleeping.
controller:
  agent:
    harnessTemplateDefaults:
      env:
        - name: QUEUE_PARK_MS
          value: "8000"

# Only the mock image is built for the e2e cluster — disable the agent
# templates values-local.yaml leaves enabled (default and nous). Any
# enabled template is rendered, and cluster:install then imports its
# dist/oci tar; in CI that image is neither pulled (only
# controller/api-server/ui/keycloak/mock are) nor built (SKIP_IMAGE_BUILD=1),
# so a stray enabled template fails the load on the missing tar.
harnessTemplates:
  default:
    enabled: false
  nous:
    enabled: false

# The runner's CPU request drops to a tenth for the reason the agents' does
# above: it shares the CI runner's four cores with the control plane and every
# agent's gateway, and its 500m would leave one of them Pending. The memory
# request and limit stay, since the runner admits machines against its limit.
virtualization:
  runner:
    resources:
      requests:
        cpu: 50m

# Keycloak's first boot is the longest step of the e2e install: the chart's
# realm import hook, and so the install, waits for it. On a CI run at the
# chart's 1-CPU limit the JVM took 25 s to start and the schema creation on the
# empty database 28 s more, with Postgres at 500m. Both are CPU-bound, and the
# runner's cores are mostly idle while they run. Only the limits rise: the
# requests stay, so nothing else loses room on the single node.
keycloak:
  resources:
    limits:
      cpu: "2"
postgres:
  resources:
    limits:
      cpu: "1"

# The e2e lanes run the rows path end to end, so CI exercises the control
# tables, the anchors, the change feed and every writer the switch release
# leaves behind. The install takes the switch's values on its first boot: it
# absorbs an empty custom-resource set (the CRDs still ship with the chart, but
# nothing here creates an Agent through them), records the marker, and serves
# from `control`. The CRD-mode pairing the fence refuses is not a lane of its
# own: nothing in the suite writes a custom resource.
agentStore:
  authority: postgres
  cutover:
    acknowledged: true
  previewReport: false
