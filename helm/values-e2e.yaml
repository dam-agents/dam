# E2E test cluster overlay. Layered on top of values-local.yaml
# by `mise run e2e`. Flips the e2e.enabled gate so the api-server registers
# its control tRPC namespace and the mock harness becomes drivable from
# Playwright. values-local.yaml already enables `keycloak.testUser` (dev/dev).

e2e:
  enabled: true

# Shorten the queued-prompt park window from its 90s default. A spec that
# proves prompts outlive an abandoned tab has to wait the window out in real
# time, so the production value would cost every such spec a minute and a
# half of sleeping.
# Requests at a tenth of the limits, not half: the smoke suite runs two
# Playwright workers, and a spec that brings up its own mock agent overlaps a
# phase of the e2e-agent chain. At half, two mock agents (500m each, plus
# their gateway's 100m) do not fit beside the control plane on the
# single-node CI cluster, and the second one stays Pending. The mock replays
# scripts and needs no reserved CPU. Limits, and so Budgets, are unchanged.
controller:
  requestsFromLimits:
    fraction: "0.1"
  agent:
    templateDefaults:
      env:
        - name: QUEUE_PARK_MS
          value: "8000"

# Override values-local's transitional NFS server (#2988): the e2e cluster
# must prove the platform runs with no shared filesystem available.
nfsProvisioner:
  enabled: false

# Only the mock image is built for the e2e cluster — disable the agent
# templates values-local.yaml leaves enabled (claude-code and nous). Any
# enabled template is rendered, and cluster:install then imports its
# dist/oci tar; in CI that image is neither pulled (only
# controller/api-server/ui/keycloak/mock are) nor built (SKIP_IMAGE_BUILD=1),
# so a stray enabled template fails the load on the missing tar.
harnessTemplates:
  claude-code:
    enabled: false
  nous:
    enabled: false

# Only read with virtualization.enabled, which E2E_VIRTUALIZATION turns on (the
# vm lane); values-local.yaml sets the rest of the runner. Its CPU request drops
# to a tenth for the reason the agents' does above: in that lane the runner
# shares the CI runner's four cores with the control plane, every agent's
# gateway and the runtime migration spec's one container agent, and its 500m
# would leave one of them Pending. The memory request and limit stay, since the
# runner admits machines against its limit.
virtualization:
  runner:
    resources:
      requests:
        cpu: 50m
