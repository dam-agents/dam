{{- if or .Values.apiServer.db.password .Values.apiServer.objectStorage.accessKeyId }}
{{- /* Operator-supplied external credentials (no generate-and-persist lookup
       needed). Keys match the api-server's secretKeyRefs and the shared
       postgres/seaweedfs Secrets, so each ref resolves whether the credential
       comes from here or from the bundled service's Secret. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.apiserver.secrets.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.apiServer.db.password }}
  POSTGRES_APISERVER_PASSWORD: {{ .Values.apiServer.db.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.apiServer.objectStorage.accessKeyId }}
  accessKeyId: {{ .Values.apiServer.objectStorage.accessKeyId | b64enc | quote }}
  secretAccessKey: {{ .Values.apiServer.objectStorage.secretAccessKey | default "" | b64enc | quote }}
  {{- end }}
{{- end }}
