{{- if .Values.apiServer.networkPolicy.enabled }}
{{- /*
  Pruned to a coarse perimeter only.

  Per-agent / per-pair admission moved entirely to mesh AuthorizationPolicy
  (the controller renders per-agent policies; chart renders the pod-level
  DENY in auth-policy-pod-deny.yaml). NetworkPolicy in ambient mode is
  identity-blind and sees mesh-to-mesh traffic only as HBONE 15008, so
  fine-grained gating here would be either trivially permissive or trivially
  broken. Coarse perimeter remains useful: it bounds blast radius if the
  mesh control plane fails and keeps non-mesh traffic out.

  Shape:
    - http (4000) from anywhere — UI, ingress controller, in-cluster — and,
      on the same port, from the agent namespace over HBONE, where an Agent's
      gateway ends the chain of the Connection that drives this install.
      Application-layer auth (the bearer, a Keycloak JWT or an API key) is the
      gate; a gateway holds such a key only while an Agent it serves holds
      that Connection.
    - harness (4001) from the release namespace only — the waypoint Pod
      synthesised by Istio lives here. The cryptographic per-agent
      check is the per-agent AuthorizationPolicy on the harness path,
      not netpol.
    - ext-authz (4002) from the release namespace, where the waypoint
      the per-agent ext-authz Services are bound to runs, and from the
      agent namespace, whose gateways still call a Service that is not
      relabelled yet. The per-agent check is the AuthorizationPolicy at
      the waypoint; auth-policy-pod-deny.yaml gates the direct path.
    - HBONE (15008) listed alongside each app port so the kernel-level
      netpol sees the right thing for ambient-routed traffic (Istio
      iptables redirect happens in NAT/MANGLE before FILTER).
*/}}
{{- $appName := include "platform.apiserver.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $appName }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: apiserver
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Public HTTP (tRPC). UI, mobile, ingress controller, anything in-cluster.
    - ports:
        - protocol: TCP
          port: {{ .Values.apiServer.port }}

    # The same port, reached by an Agent's gateway from the ambient mesh: the
    # chain of the Connection that drives this install ends here, and the
    # mesh's hop arrives as HBONE. Only the agent namespace is admitted, and
    # the API key that chain injects is the authentication — a gateway without
    # that Connection has no key to send and is refused there.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.agentNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.apiServer.port }}
        - protocol: TCP
          port: 15008

    # Harness — only from release namespace (where the istio waypoint Pod
    # lives). The waypoint enforces the per-agent principal-to-`:id`
    # check; this rule just keeps the port off-limits to other namespaces.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.apiServer.harnessServerPort }}
        - protocol: TCP
          port: 15008  # HBONE — required for any mesh-to-mesh hop

    # ext-authz — from the release namespace, where the waypoint the
    # per-agent ext-authz Services are bound to runs, and from the agent
    # namespace, whose gateways reach a Service not yet relabelled
    # directly. The release namespace's HBONE is admitted by the harness
    # rule too; naming it here keeps the ext-authz hop independent of it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.agentNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.apiServer.extAuthzPort }}
        - protocol: TCP
          port: 15008
{{- end }}
