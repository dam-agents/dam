{{/*
API Server RBAC — ServiceAccount, Roles, RoleBindings (release ns + agent ns)
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
---
# Read-only Role in release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
rules:
  # No configmaps/pods here: the release namespace holds neither anything the
  # api-server reads — templates are file-mounted, and reachability is the
  # Agent's Ready condition. (The one ConfigMap it reads lives in the agent
  # namespace: the Agent store's marker.)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "platform.apiserver.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.apiserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Read/write Role in agent namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
rules:
  # the api-server is the sole writer of the Agent custom
  # resource spec (create/patch/delete); the controller owns its status.
  - apiGroups: ["agent-platform.ai"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # UserBudgets are controller-enforced. The api-server reads the caller's own
  # (a direct get by the CEL-pinned name) for the reserved-vs-ceiling meter
  # (#1900), and lists and writes them for platform operators (#5727).
  - apiGroups: ["agent-platform.ai"]
    resources: ["userbudgets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Secrets for credentials. The chart-shipped agent templates are mounted as
  # files, loaded at boot, not read through the K8s API.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # One ConfigMap, read once at startup: the marker the switch leaves when
  # Agents and budgets become authoritative in Postgres. Reading it is how a
  # build that still reconciles the custom resources learns to refuse to start
  # rather than serve a store nothing writes. Nothing else of the api-server's
  # reads a ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  # Leader election for the work that must have one holder install-wide (the
  # channel workers, the live-events agent watch): a single Lease carrying every
  # such role, created and renewed by the holder and deleted when it stands
  # down. Same primitive and namespace the controller elects on.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
  # No persistentvolumeclaims: the controller owns the PVC lifecycle.
  # No pods: reachability is the Agent's Ready condition, a crashed pod is the
  # restart count the controller publishes on that same status, and restarting
  # an agent is a roll-rev annotation patch — the api-server never reads pods.
  # Withheld deliberately: anything the api-server needs to know about an
  # agent's pods, the controller observes and publishes as Agent status.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "platform.apiserver.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.apiserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
