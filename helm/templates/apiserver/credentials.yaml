{{- $oauth := .Values.apiServer.oauthAppDefaults | default dict }}
{{- $credentials := dict
      "POSTGRES_APISERVER_PASSWORD" (.Values.apiServer.db.password | default "")
      "GITHUB_ENTERPRISE_TOKEN" (dig "enterprise" "token" "" (.Values.github | default dict))
      "SLACK_BOT_TOKEN" (.Values.apiServer.slackBotToken | default "")
      "SLACK_APP_TOKEN" (.Values.apiServer.slackAppToken | default "")
      "SLACK_CLIENT_SECRET" (.Values.apiServer.slackClientSecret | default "")
      "TELEGRAM_BOT_TOKEN" (.Values.apiServer.telegramBotToken | default "")
      "IMGBB_API_KEY" (.Values.apiServer.imgbbApiKey | default "")
      "PLATFORM_DEFAULT_GITHUB_CLIENT_SECRET" (dig "github" "clientSecret" "" $oauth)
      "PLATFORM_DEFAULT_GHE_CLIENT_SECRET" (dig "githubEnterprise" "clientSecret" "" $oauth)
      "PLATFORM_DEFAULT_SLACK_CLIENT_SECRET" (dig "slack" "clientSecret" "" $oauth) }}
{{- $present := dict }}
{{- range $key, $value := $credentials }}
  {{- if $value }}{{- $_ := set $present $key $value }}{{- end }}
{{- end }}
{{- if or $present .Values.apiServer.objectStorage.accessKeyId }}
{{- /* Operator-supplied credentials (no generate-and-persist lookup needed).
       Every token, client secret and password the api-server takes from values
       lives here and reaches the pod through a secretKeyRef, never as a literal
       env value, so reading the Deployment never reveals one. Keys match the
       api-server's secretKeyRefs and the shared postgres/seaweedfs Secrets, so
       each ref resolves whether the credential comes from here or from the
       bundled service's Secret. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.apiserver.secrets.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $present }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- if .Values.apiServer.objectStorage.accessKeyId }}
  accessKeyId: {{ .Values.apiServer.objectStorage.accessKeyId | b64enc | quote }}
  secretAccessKey: {{ .Values.apiServer.objectStorage.secretAccessKey | default "" | b64enc | quote }}
  {{- end }}
{{- end }}
