{{/*
Agent templates. One ConfigMap in the RELEASE namespace with a
`<name>.yaml` data key per enabled `.Values.harnessTemplates` entry. It is
mounted into the api-server pod (see apiserver/app.yaml) and loaded once at
boot — the api-server no longer reads templates dynamically via the K8s API,
so this CM needs no label selector and no agent-namespace placement.

Only fields the template differs on are rendered. Anything omitted falls
through at reconcile time to `controller.agent.templateDefaults.*` (chart
fallback) or `controller.agent.base.*` (chart-only policy).

The literal string `$HOME` in mount paths is substituted
HERE (chart render time) with the fixed agent home (/home/agent). The
rendered spec ships absolute paths — the controller and agent-runtime
never see `$HOME`.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.fullname" . }}-harness-templates
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
data:
  {{- range $name, $tmpl := .Values.harnessTemplates }}
  {{- if and $tmpl $tmpl.enabled }}
  {{- /* The Backend is chosen per agent at create, not declared by a template.
         An install carrying the old key would otherwise render a template that
         silently produces container agents, so it is refused here instead. */}}
  {{- if $tmpl.backend }}
  {{- fail (printf "harnessTemplates.%s: backend is no longer a template field — the Backend is chosen per agent at create time. Remove it from your values." $name) }}
  {{- end }}
  {{- $home := "/home/agent" }}
  {{ $name }}.yaml: |
    version: agent-platform.ai/v1
    image: "{{ $tmpl.image.repository }}:{{ $tmpl.image.tag | default $.Chart.AppVersion }}"
    description: {{ $tmpl.description | quote }}
    {{- with $tmpl.displayName }}
    name: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.category }}
    category: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.harness }}
    harness: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.providers }}
    providers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $tmpl.tags }}
    tags:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $tmpl.docsUrl }}
    docsUrl: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.releaseNotesUrl }}
    releaseNotesUrl: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.setupNote }}
    setupNote:
      title: {{ .title | quote }}
      body: {{ .body | quote }}
    {{- end }}
    {{- if $tmpl.experimental }}
    experimental: true
    {{- end }}
    {{- with $tmpl.image.pullPolicy }}
    imagePullPolicy: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.storageSize }}
    storageSize: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.hibernationTimeout }}
    hibernationTimeout: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.runtimeClassName }}
    runtimeClassName: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if and $tmpl.imagePullSecret $tmpl.imagePullSecretRef }}
    {{- fail (printf "harnessTemplates.%s: set either imagePullSecret (chart-managed Secret) or imagePullSecretRef (pre-existing Secret), not both" $name) }}
    {{- end }}
    {{- if $tmpl.imagePullSecret }}
    imagePullSecretRef: {{ include "platform.harnessTemplate.pullSecretName" (dict "root" $ "name" $name) | quote }}
    {{- end }}
    {{- with $tmpl.imagePullSecretRef }}
    imagePullSecretRef: {{ . | quote }}
    {{- end }}
    {{- with $tmpl.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $tmpl.mounts }}
    mounts:
      {{- range . }}
      - path: {{ .path | replace "$HOME" $home | quote }}
        persist: {{ .persist }}
        {{- with .size }}
        size: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- $env := $tmpl.env | default list }}
    {{- if and $.Values.clickstack.enabled $tmpl.telemetry }}
    {{- $env = concat $env (include "platform.agentTelemetry.env" (dict "root" $ "templateName" $name "rail" $tmpl.telemetry) | fromYamlArray) }}
    {{- end }}
    {{- with $env }}
    env:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $tmpl.skillSources }}
    skillSources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- end }}
