{{- $v := .Values.virtualization }}
{{- if and $v.enabled $v.imageCache.hostPath }}
{{- /*
The per-node image cache service: the only writer of the node directory that
`imageCache.hostPath` names. Every runner on the node mounts that directory
read-only and asks this service, over a Unix socket in the directory itself,
for the tree of the image a machine boots. The service resolves the tag,
fetches and unpacks the image with the pull credentials the runner forwards,
and evicts inside `imageCache.budget` — sparing every tree a runner holds.
Because no runner can write the directory, a guest that escapes into its
runner cannot rewrite a tree another owner's machine boots.

It is in the boot path: a runner on a node without it can boot only the
trees its own machines already hold, and refuses any other image as
unavailable. So it runs wherever a runner can, on the runner's own
nodeSelector and tolerations.

It also preloads the harness images this install ships, at deploy time, and
pins them against eviction. A runner exists only once one of its owner's
agents needs one, so without this the first machine on every node after
every deploy waits out the fetch with a user watching. The images are
arguments here rather than read from the cluster: a redeploy rolls this
DaemonSet, and the new tags are pinned from its first pass.

It runs in the agent namespace so that the install's default agent pull
Secrets, which live there, can be mounted as a volume. It holds no cluster
credential at all.
*/}}
{{- $name := printf "%s-vm-image-cache" (include "platform.fullname" .) }}
{{- $cache := $v.imageCache }}
{{- $pullSecrets := .Values.controller.agent.base.imagePullSecrets | default list | uniq }}
{{- $images := list }}
{{- range $key, $tmpl := .Values.harnessTemplates }}
{{- if and $tmpl $tmpl.enabled }}
{{- $images = append $images (printf "%s:%s" $tmpl.image.repository ($tmpl.image.tag | default $.Chart.AppVersion)) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-image-cache
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-image-cache
spec:
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vm-image-cache
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vm-image-cache
        istio.io/dataplane-mode: none
    spec:
      enableServiceLinks: false
      {{- include "platform.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- /*
      The runner's own resolver policy, because this reaches the same
      registries by the same route — the cluster's DNS is a Service backed by
      pods, which a confined runner cannot reach, so `Default` is the node's
      resolver and `ClusterFirst` is for an install whose registry is inside
      the cluster.
      */}}
      dnsPolicy: {{ $v.runner.dnsPolicy | default "Default" }}
      {{- with $v.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vm-image-cache
          image: "{{ $v.runner.image.repository }}:{{ $v.runner.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $v.runner.image.pullPolicy | default "IfNotPresent" }}
          {{- /*
          The runner image, whose ENTRYPOINT starts a runner — replaced here,
          not extended. Both halves of the cache ship in it so they cannot
          disagree about what a cache entry is. The socket path is the one the
          controller tells every runner to dial, inside the same mount.
          */}}
          command: ["vm-image-cache"]
          args:
            - --image-dir=/var/lib/platform/images
            - --socket=/var/lib/platform/images/.cache.sock
            - --image-budget={{ $cache.budget }}
            - --interval={{ $cache.preloadInterval }}
            - --images={{ join "," $images }}
            {{- if $pullSecrets }}
            - --pull-secret-dir=/etc/vm-image-cache/pull-secrets
            {{- end }}
          securityContext:
            {{- /*
            What unpacking an image faithfully costs: a rootfs carries the
            owners and modes its files were built with, so tar chowns each
            entry (CHOWN), sets a mode on a file it has just given away
            (FOWNER), and keeps writing into directories that are read-only or
            no longer its own (DAC_OVERRIDE). The profile matches the runner's
            for the same unpack.
            */}}
            runAsUser: 0
            capabilities:
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
            appArmorProfile:
              type: Unconfined
          resources:
            {{- toYaml $cache.resources | nindent 12 }}
          volumeMounts:
            - name: image-cache
              mountPath: /var/lib/platform/images
            {{- if $pullSecrets }}
            - name: pull-secrets
              mountPath: /etc/vm-image-cache/pull-secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: image-cache
          hostPath:
            path: {{ $cache.hostPath }}
            type: DirectoryOrCreate
        {{- if $pullSecrets }}
        {{- /*
        One directory per Secret, numbered in list order so the service tries
        them in the order the kubelet would, under the key the Secret was
        written with. Optional: a Secret that is missing, or lacks one of the
        two keys, is skipped as the kubelet skips it, rather than keeping the
        pod from starting.
        */}}
        - name: pull-secrets
          projected:
            defaultMode: 0400
            sources:
              {{- range $i, $secret := $pullSecrets }}
              - secret:
                  name: {{ $secret }}
                  optional: true
                  items:
                    - key: .dockerconfigjson
                      path: {{ printf "%03d" $i }}/.dockerconfigjson
                    - key: .dockercfg
                      path: {{ printf "%03d" $i }}/.dockercfg
              {{- end }}
        {{- end }}
{{- with $v.runner.scc }}
---
{{- /*
The same SCC the node cache already obliges an OpenShift install to name for
its runners: this pod mounts that same host directory and runs as uid 0, and
the chart's own agent SCC refuses a hostPath.
*/}}
{{ include "platform.sccRoleBinding" (dict "root" $ "namespace" $.Values.agentNamespace "name" $name "component" "vm-image-cache" "scc" .) }}
{{- end }}
{{- end }}
