{{- $v := .Values.virtualization }}
{{- if and $v.enabled $v.runner.releaseHostPath (not $v.runner.hostAddress) }}
{{- /*
The per-node runner release stager: the only writer of the node directory that
`runner.releaseHostPath` names. It runs this chart's runner image and copies the
runner release that image carries — the runner, platform-init and
platform-runc — into the directory under the image reference the controller
names the release by, keeping the newest few. A chart upgrade rolls this
DaemonSet, which stages the new release; each runner pod's loader then hands
its machines to it. Runner pods mount the directory read-only, so a guest that
escapes into its runner cannot replace the release another owner's runner
takes next.

It also stages the VM runtime the release was built against — the smolvm
release with its libkrun and guest agent — once per runtime, so a release
built against another runtime than a pod's image brings its own.

It runs wherever a runner can, on the runner's own nodeSelector,
tolerations and affinity. A runner on a node it has not reached yet keeps its release until
it does. It needs no capability: it is root writing a directory root owns,
and the image build leaves root, the owner of every file it copies, able to
read them.
*/}}
{{- $name := printf "%s-vm-runner-releases" (include "platform.fullname" .) }}
{{- $openshift := .Values.openshift.scc.anyuidCapNet.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner-releases
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner-releases
spec:
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vm-runner-releases
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vm-runner-releases
        istio.io/dataplane-mode: none
    spec:
      enableServiceLinks: false
      {{- include "platform.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with $v.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.runner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: stage
          image: {{ include "platform.vmRunner.image" $ | quote }}
          imagePullPolicy: {{ $v.runner.image.pullPolicy | default "IfNotPresent" }}
          {{- /*
          The runner image, whose ENTRYPOINT starts a runner pod's loader —
          replaced here. The release is named by the very reference the
          controller writes into each runner's release ConfigMap. The runtime
          is the smolvm tree the image installs.
          */}}
          command: ["vm-runner-loader", "stage"]
          args:
            - --builtin=/usr/local/libexec/vm-runner
            - --runtime=/opt/smolvm
            - --into=/var/lib/platform/releases
            - --release={{ include "platform.vmRunner.image" $ }}
            {{- if $openshift }}
            {{- /*
            As the image cache does: the directory the kubelet creates carries
            the host's own label, which confined runners may not read, so the
            stager labels it and everything it stages for containers, at the
            plain s0 that every runner's own category pair can read.
            */}}
            - --selinux-label=system_u:object_r:container_file_t:s0
            {{- end }}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            {{- if $openshift }}
            {{- /*
            The label is set from inside the container, which container_t may
            not do to a host directory, so the stager runs as spc_t, as the
            image cache does.
            */}}
            seLinuxOptions:
              type: spc_t
              level: s0
            {{- end }}
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: releases
              mountPath: /var/lib/platform/releases
      volumes:
        - name: releases
          hostPath:
            path: {{ $v.runner.releaseHostPath }}
            type: DirectoryOrCreate
{{- with $v.runner.scc }}
---
{{- /*
The SCC the runners that mount this directory already need on OpenShift: this
pod mounts the same host directory, as uid 0 and spc_t.
*/}}
{{ include "platform.sccRoleBinding" (dict "root" $ "namespace" $.Values.agentNamespace "name" $name "component" "vm-runner-releases" "scc" .) }}
{{- end }}
{{- end }}
