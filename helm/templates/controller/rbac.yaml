{{/*
Controller RBAC — ServiceAccount, Role/ClusterRole, RoleBinding/ClusterRoleBinding.
When agentNamespace == release namespace, namespace-scoped RBAC is used (no cluster-admin required).
*/}}
{{- $clusterScoped := ne .Values.agentNamespace .Release.Namespace -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if $clusterScoped }}
kind: ClusterRole
{{- else }}
kind: Role
{{- end }}
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}
  {{- if not $clusterScoped }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  # the reconciled resources are agent-platform.ai/v1 Agent + Run
  # custom resources. The controller watches them and is the sole writer of
  # their status subresource. The api-server owns spec *intent*; the one
  # controller spec write — hence `patch` — is the fill-if-absent Size
  # materialization (#1900), which only ever sets a missing
  # `resources.limits` dimension and never touches a set value.
  - apiGroups: ["agent-platform.ai"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["agent-platform.ai"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  # The children the controller renders (Envoy bootstrap CM, StatefulSets,
  # Services, …) are owner-refed to the Agent CR with blockOwnerDeletion.
  # K8s admission only permits that if the creator can update the owner's
  # finalizers, so the controller needs the agents finalizers subresource.
  # (Previously the children were owned by the agent ConfigMap, hence the old
  # configmaps/finalizers grant — now dead.)
  - apiGroups: ["agent-platform.ai"]
    resources: ["agents/finalizers"]
    verbs: ["update"]
  # Per-user compute ceilings (#1900). Operator-written; the controller only
  # reads them at the 0→1 budget check — a live direct get by the CEL-pinned
  # name (`budget-<owner>`), so no list or watch is needed.
  - apiGroups: ["agent-platform.ai"]
    resources: ["userbudgets"]
    verbs: ["get"]
  # ConfigMaps for the chart-shipped templates and the controller-rendered Envoy
  # bootstrap CM (owner-refed to the Agent/Run).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # per-agent ServiceAccounts give the agent + gateway pods
  # their SPIFFE workload identity. Owner-refed to the agent CM; K8s
  # GC reaps them on agent deletion.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # per-agent Istio AuthorizationPolicies (gateway admission,
  # harness path-prefix at the waypoint, ext-authz Service principal).
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-pair agent egress and gateway ingress NetworkPolicies, plus each
  # VM runner's: the kernel gates on who reaches a gateway, so the agent
  # cannot bypass HTTPS_PROXY and no other pod can borrow its credentials.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if .Values.virtualization.enabled }}
  # vm agents: the controller runs one VM runner per owner, so it creates and
  # removes those Deployments itself (see `virtualization` in values.yaml).
  # Gated, because on a split-namespace install this is a ClusterRole and
  # Deployment write includes the platform's own Deployments.
  # Read-only, and only to explain why a VM runner is not ready: the
  # Deployment reports zero ready replicas and nothing else, while the pod
  # carries the scheduling or image failure the agent's status should name.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The runner pod's memory request follows the machines it holds, changed
  # in place so the Deployment never recreates the pod (and every machine
  # with it). Only the resize subresource: it cannot touch anything but a
  # container's resources. A cluster without it keeps the install's request.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "delete"]
{{- end }}
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if .Values.virtualization.enabled }}
  # Delete only, and only to clear the endpoint slice an earlier release wrote
  # by hand for a vm agent: Kubernetes maintains that Service's endpoints now,
  # and two slices naming one Service are unioned. Creating one is what
  # OpenShift's restricted endpoints admission refuses; removing one needs no
  # such grant. Goes when the cleanup in vm_agent.go does.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["delete"]
{{- end }}

  # Agent workspace PVCs: list/delete for reclamation + orphan GC. The warm
  # pool (#692) additionally creates pre-provisioned spares and updates them to
  # claim one for a new agent (relabel), so create/update/patch are required
  # when it's enabled — harmless to grant unconditionally.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Read-only StorageClass access so the warm pool can warn at startup when its
  # configured class binds WaitForFirstConsumer (which defeats pre-warming).
  # Best-effort: the manager degrades to a logged warning without this (e.g.
  # under namespace-scoped RBAC, where cluster-scoped StorageClasses aren't
  # grantable).
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    # Run executor pods are bare Pods, not StatefulSets, so the controller
    # needs full CRUD on pods in the agent namespace to bring them up and
    # tear them down. Owner-refed to the Run CR.
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if and .Values.controller .Values.controller.envoyMitm .Values.controller.envoyMitm.enabled }}
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
---
# CRDs are cluster-scoped, so the startup schema assert needs a
# ClusterRole even under otherwise namespace-scoped RBAC; resourceNames limits
# it to read-only access on the two platform CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}-crd-read
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
    resourceNames: ["agents.agent-platform.ai", "userbudgets.agent-platform.ai"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}-crd-read
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "platform.controller.serviceAccountName" . }}-crd-read
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.virtualization.enabled (not $clusterScoped) }}
---
# A runner's claim is sized from its owner's demand only on a class that can
# grow it later; elsewhere it is created at runner.storage. StorageClasses are
# cluster-scoped, so a namespace-scoped install needs this read-only grant to
# tell the two apart. Without it every runner claim is created at the ceiling.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}-storageclass-read
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}-storageclass-read
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "platform.controller.serviceAccountName" . }}-storageclass-read
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if $clusterScoped }}
kind: ClusterRoleBinding
{{- else }}
kind: RoleBinding
{{- end }}
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}
  {{- if not $clusterScoped }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  {{- if $clusterScoped }}
  kind: ClusterRole
  {{- else }}
  kind: Role
  {{- end }}
  name: {{ include "platform.controller.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
