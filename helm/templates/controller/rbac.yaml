{{/*
Controller RBAC — ServiceAccount, Role/ClusterRole, RoleBinding/ClusterRoleBinding.
When agentNamespace == release namespace, namespace-scoped RBAC is used (no cluster-admin required).
*/}}
{{- $clusterScoped := ne .Values.agentNamespace .Release.Namespace -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if $clusterScoped }}
kind: ClusterRole
{{- else }}
kind: Role
{{- end }}
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}
  {{- if not $clusterScoped }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  # Before the switch the reconciled resources are agent-platform.ai/v1 Agent
  # custom resources: the controller watches them and is the sole writer of
  # their status subresource. The api-server owns spec *intent*; the one
  # controller spec write — hence `patch` — is the fill-if-absent Size
  # materialization (#1900), which only ever sets a missing
  # `resources.limits` dimension and never touches a set value.
  {{- if ne .Values.agentStore.authority "crd" }}
  {{- if eq .Values.agentStore.authority "postgres" }}
  # The rows own the fleet. Read-only access stays for diagnostics; every write
  # is gone, and the controller refuses to start if its identity can still make
  # one, so the status subresource's guarantee survives the custom resource.
  - apiGroups: ["agent-platform.ai"]
    resources: ["agents"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # An anchor ConfigMap carries blockOwnerDeletion on the children it owns, and
  # admission only lets the creator set that with the owner's finalizer
  # subresource.
  - apiGroups: [""]
    resources: ["configmaps/finalizers"]
    verbs: ["update"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
  {{- else }}
  - apiGroups: ["agent-platform.ai"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["agent-platform.ai"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  # The children the controller renders (Envoy bootstrap CM, runner
  # Deployments, Services, …) are owner-refed to the Agent CR with
  # blockOwnerDeletion.
  # K8s admission only permits that if the creator can update the owner's
  # finalizers, so the controller needs the agents finalizers subresource.
  # (Previously the children were owned by the agent ConfigMap, hence the old
  # configmaps/finalizers grant — now dead.)
  - apiGroups: ["agent-platform.ai"]
    resources: ["agents/finalizers"]
    verbs: ["update"]
  {{- end }}
  # Per-user pools. Operator-written; the controller only reads them when it
  # sizes an owner's runner or starts one of their machines — a live direct
  # get by the CEL-pinned name (`budget-<owner>`), so no list or watch is
  # needed. The contract release reads the budget rows instead.
  {{- if ne .Values.agentStore.authority "contract" }}
  - apiGroups: ["agent-platform.ai"]
    resources: ["userbudgets"]
    verbs: ["get"]
  {{- end }}
  # ConfigMaps for the chart-shipped templates and the controller-rendered Envoy
  # bootstrap CM (owner-refed to the Agent/Run).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # per-agent ServiceAccounts give the agent + gateway pods
  # their SPIFFE workload identity. Owner-refed to the agent CM; K8s
  # GC reaps them on agent deletion.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # per-agent Istio AuthorizationPolicies (gateway admission,
  # harness path-prefix at the waypoint, ext-authz Service principal).
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-pair agent egress and gateway ingress NetworkPolicies, plus each
  # VM runner's: the kernel gates on who reaches a gateway, so the agent
  # cannot bypass HTTPS_PROXY and no other pod can borrow its credentials.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Every agent runs on a VM runner, and the controller runs one per owner, so
  # it creates and removes those Deployments itself (see `virtualization` in
  # values.yaml). Gated, because on a split-namespace install this is a
  # ClusterRole and Deployment write includes the platform's own Deployments.
  # Read-only, and only to explain a failure the agent's status should name:
  # why a VM runner is not ready (its Deployment reports zero ready replicas
  # and nothing else, while the pod carries the scheduling or image failure).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "create"]
  # The runner pod's memory request follows the machines it holds, changed
  # in place so the Deployment never recreates the pod (and every machine
  # with it). Only the resize subresource: it cannot touch anything but a
  # container's resources. A cluster without it keeps the install's request.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["update", "patch"]
  # watch: a runner's pod becoming ready requeues that owner's vm agents.
  # patch: a settled roll's annotations are cleared as one merge patch.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # A runner's release ConfigMap, from controllers before releases were named
  # over the machine API, is owner-refed to its Deployment with
  # blockOwnerDeletion, which admission only permits with this. Remove once
  # no install has such a ConfigMap left.
  - apiGroups: ["apps"]
    resources: ["deployments/finalizers"]
    verbs: ["update"]
  # A runner pod refused at admission leaves no Pod object, only its
  # ReplicaSet's FailedCreate condition. Reading it lets the roll skip a
  # refusal that names one owner, which is only counted while another
  # runner already runs the same pod shape: a refusal of the shape itself
  # refuses every runner and must halt the roll.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # A vm agent on a runner outside the cluster (virtualization.runner.hostAddress)
  # has no runner pod for its Service to select; the controller names the
  # runner's address in the Service's own EndpointSlice instead.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "create", "update"]

  # Machine disks: reclaiming an owner's orphaned claims and the runner's own
  # pool of them.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    # A gateway pod on a superseded revision is deleted, and a rotated
    # credential is announced by patching the pod's annotations so the kubelet
    # syncs its Secret volumes at once.
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
{{- if ne .Values.agentStore.authority "contract" }}
# CRDs are cluster-scoped, so the startup schema assert needs a
# ClusterRole even under otherwise namespace-scoped RBAC; resourceNames limits
# it to read-only access on the two platform CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}-crd-read
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
    resourceNames: ["agents.agent-platform.ai", "userbudgets.agent-platform.ai"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}-crd-read
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "platform.controller.serviceAccountName" . }}-crd-read
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# Nodes are cluster-scoped, so the vm preflight needs a ClusterRole even under
# otherwise namespace-scoped RBAC. Read-only, and only to check that some node
# advertises the device resources a VM runner asks for, to sum what those
# nodes hold for the operators' pool metrics, and to watch which of them are
# ready, since a not-ready agent's reconcile asks that on every retry; without
# it the controller logs that it cannot tell, rather than refusing the install.
# Storage capacities live in the storage driver's namespace, so their list is
# cluster-wide too; without it the pool metrics leave storage capacity out.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}-vm-nodes-read
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}-vm-nodes-read
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "platform.controller.serviceAccountName" . }}-vm-nodes-read
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if $clusterScoped }}
kind: ClusterRoleBinding
{{- else }}
kind: RoleBinding
{{- end }}
metadata:
  name: {{ include "platform.controller.serviceAccountName" . }}
  {{- if not $clusterScoped }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  {{- if $clusterScoped }}
  kind: ClusterRole
  {{- else }}
  kind: Role
  {{- end }}
  name: {{ include "platform.controller.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
