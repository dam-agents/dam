{{- if .Values.virtualization.enabled }}
{{- /* Credentials between the controller and the VM runner: the bearer
       token and the node's TLS server pair, minted here, mounted into the
       node pod and pinned by the controller; persisted across upgrades via
       lookup (postgres-secrets.yaml pattern). */ -}}
{{- $name := printf "%s-vm-runner" (include "platform.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- $tlsCrt := "" }}
{{- $tlsKey := "" }}
{{- if $existing }}
  {{- $token = index $existing.data "token" | default "" | b64dec }}
  {{- $tlsCrt = index $existing.data "tls.crt" | default "" | b64dec }}
  {{- $tlsKey = index $existing.data "tls.key" | default "" | b64dec }}
{{- end }}
{{- if not $token }}
  {{- $token = randAlphaNum 48 }}
{{- end }}
{{- if not $tlsCrt }}
  {{- $cert := genSelfSignedCert $name (list) (list $name (printf "%s.%s" $name .Release.Namespace) (printf "%s.%s.svc" $name .Release.Namespace)) 3650 }}
  {{- $tlsCrt = $cert.Cert }}
  {{- $tlsKey = $cert.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
  tls.crt: {{ $tlsCrt | b64enc | quote }}
  tls.key: {{ $tlsKey | b64enc | quote }}
{{- end }}
