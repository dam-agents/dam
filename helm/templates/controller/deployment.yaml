{{/*
Controller Deployment — Go reconciler + scheduler
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- include "platform.annotations" (dict "root" $ "component" .Values.controller) | nindent 2 }}
spec:
  replicas: {{ .Values.controller.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
      {{- include "platform.podAnnotations" (dict "root" $ "component" .Values.controller) | nindent 6 }}
    spec:
      enableServiceLinks: false
      {{- include "platform.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "platform.controller.serviceAccountName" . }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.controller.logLevel | default "info" | quote }}
            - name: PLATFORM_HEALTH_PORT
              value: {{ .Values.controller.healthPort | default 8081 | quote }}
            # Which store is authoritative for Agents and budgets. The binary
            # refuses to run the pairing the cluster's marker contradicts.
            - name: PLATFORM_AGENT_STORE
              value: {{ .Values.agentStore.authority | quote }}
            - name: PLATFORM_AGENT_STORE_MARKER
              value: {{ include "platform.agentStore.markerName" . | quote }}
            {{- if eq .Values.agentStore.authority "postgres" }}
            # The controller's own login, on the api-server's database: it
            # reads definitions and writes observations, and nothing else. The
            # credential is rendered only by a release that reads Postgres.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.controller.db.password.secretName" . }}
                  key: POSTGRES_CONTROLLER_PASSWORD
            - name: PLATFORM_DATABASE_URL
              value: {{ include "platform.controller.postgres.dsn" . | quote }}
            {{- end }}
            - name: PLATFORM_RELEASE_NAME
              value: {{ include "platform.fullname" . }}
            # Value of `app.kubernetes.io/instance` on chart-rendered apiserver
            # pods — i.e. the literal Helm `.Release.Name`. (`instance` here is
            # the standard K8s release label, unrelated to the retired Instance
            # domain concept.) Used by the controller to populate the selector
            # on per-agent ext-authz Services so they actually resolve to
            # apiserver pods even when release name and `platform.fullname`
            # diverge.
            - name: PLATFORM_INSTANCE_LABEL
              value: {{ .Release.Name | quote }}
            - name: PLATFORM_AGENT_NAMESPACE
              value: {{ .Values.agentNamespace }}
            - name: PLATFORM_RELEASE_NAMESPACE
              value: {{ .Release.Namespace }}
            # Chart-wide agent defaults, each its own JSON env var; the
            # controller fails loudly on unknown fields so values.yaml typos
            # surface at startup.
            #   - AGENT_BASE: chart-only policy, never overridable by an agent
            #     ConfigMap.
            #   - AGENT_TEMPLATE_DEFAULTS: fallbacks for fields a template can
            #     override (template wins when set).
            - name: AGENT_BASE
              value: {{ .Values.controller.agent.base | toJson | quote }}
            # `$HOME` literals in mount paths are substituted at
            # chart render time with the fixed agent home, so the
            # controller and api-server only ever see absolute paths.
            - name: AGENT_TEMPLATE_DEFAULTS
              value: {{ .Values.controller.agent.templateDefaults | toJson | replace "$HOME" "/home/agent" | quote }}
            # Every agent's machine runs on its owner's VM runner; see
            # `virtualization` in values.yaml.
            {{- $r := .Values.virtualization.runner }}
            {{- $cache := .Values.virtualization.imageCache | default dict }}
            {{- $devices := $r.devices | default (dict "devices.kubevirt.io/kvm" "1") }}
            {{- $runner := dict
                  "image" (include "platform.vmRunner.image" .)
                  "imagePullPolicy" ($r.image.pullPolicy | default "IfNotPresent")
                  "imagePullSecrets" (.Values.imagePullSecrets | default list)
                  "serviceAccountName" (include "platform.vmRunner.serviceAccountName" .)
                  "storage" $r.storage "storageClass" $r.storageClass
                  "devices" $devices
                  "reserveMiB" $r.reserveMiB "headroomMiB" $r.headroomMiB "bootMiB" $r.bootMiB "machineCPUs" $r.machineCPUs "nestedVirtualization" ($r.nestedVirtualization | default false)
                  "releaseHostPath" (include "platform.vmRunner.releaseDir" .)
                  "seccomp" (include "platform.vmRunner.seccomp" .)
                  "imageCacheHostPath" (include "platform.vmImageCache.dir" .) "imageCacheBudget" ($cache.budget | default "" | toString)
                  "nodeSelector" $r.nodeSelector "tolerations" $r.tolerations "affinity" $r.affinity
                  "resources" $r.resources
                  "priorityClassName" (include "platform.vmRunner.priorityClassName" .)
                  "hostAddress" ($r.hostAddress | default "")
                  "rollout" (dict "maxConcurrent" ($r.rollout.maxConcurrent | default 1 | int) "maxConcurrentPercent" ($r.rollout.maxConcurrentPercent | default 0 | int) "settleTimeout" ($r.rollout.settleTimeout | default "10m") "stalledTimeout" ($r.rollout.stalledTimeout | default "30m") "idleWait" ($r.rollout.idleWait | default "24h")) }}
            - name: AGENT_VM
              value: {{ dict "runner" $runner "gateway" (dict "perOwner" (dig "perOwner" false (.Values.virtualization.gateway | default dict))) | toJson | quote }}
            - name: VM_RUNNER_CA_ISSUER
              value: {{ .Values.virtualization.runnerCA.issuerName | quote }}
            # Per-user compute ceiling defaults (#1900); a UserBudget CR
            # overrides them for one user. Enforced at the 0→1 scale-up.
            - name: DEFAULT_USER_CPU_BUDGET
              value: {{ .Values.controller.userBudgets.defaultCpu | quote }}
            - name: DEFAULT_USER_MEMORY_BUDGET
              value: {{ .Values.controller.userBudgets.defaultMemory | quote }}
            # The Size materialized into any Agent spec lacking a limits
            # dimension (#1900) — fill-if-absent on reconcile; see
            # controller.agent.legacyAgentSize in values.yaml.
            - name: AGENT_LEGACY_CPU_LIMIT
              value: {{ .Values.controller.agent.legacyAgentSize.cpu | quote }}
            - name: AGENT_LEGACY_MEMORY_LIMIT
              value: {{ .Values.controller.agent.legacyAgentSize.memory | quote }}
            # harness traffic routes through the waypoint-fronted
            # `-apiserver-harness` Service. The bare apiserver Service no
            # longer carries the harness port.
            - name: PLATFORM_HARNESS_SERVER_URL
              value: {{ include "platform.apiserver.harnessUrl" . | quote }}
            - name: PLATFORM_HARNESS_SERVER_PORT
              value: {{ .Values.apiServer.harnessServerPort | quote }}
            # SPIFFE trust domain — used to render the principal
            # string in the per-agent AuthorizationPolicies the
            # controller writes alongside each agent.
            - name: PLATFORM_ISTIO_TRUST_DOMAIN
              value: {{ .Values.istio.trustDomain | quote }}
            - name: PLATFORM_ISTIO_WAYPOINT_NAME
              value: {{ .Values.istio.waypointName | quote }}
            {{- with include "platform.objectstorage.agentAuthorityHttp" . }}
            # Plain-HTTP object-store authority — gateways render dedicated
            # routes for it (harness-route shape) for presigned uploads.
            - name: PLATFORM_OBJECT_STORE_AUTHORITY
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.clickstack.enabled }}
            # Telemetry attribution: when the bundled telemetry backend is on,
            # each gateway gains a collector egress chain that MITM-terminates
            # this host and stamps the trusted x-platform-agent-id header. Empty
            # otherwise, so the chain (and the leaf SAN entry) are not rendered.
            - name: PLATFORM_TELEMETRY_COLLECTOR_HOST
              value: {{ include "platform.clickstack.collector.host" . | quote }}
            - name: PLATFORM_TELEMETRY_COLLECTOR_PORT
              value: "4318"
            # The controller's own operational telemetry (reconcile traces,
            # queue metrics, logs) exports OTLP straight to the same collector.
            # In-mesh and plain http — ztunnel supplies mTLS; the collector's
            # AuthorizationPolicy already admits this namespace. The SDK only
            # activates when this endpoint env is present.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "platform.clickstack.collector.host" . }}:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "platform-controller"
            # The gateways' OWN telemetry exporter (rendered into each Envoy
            # bootstrap). gRPC, unlike the controller SDK env above: Envoy's
            # stats sink speaks nothing else, and one transport then carries
            # all three gateway signals. Separate vars so the two consumers
            # never constrain each other (the Go SDK is OTLP/HTTP-only).
            - name: PLATFORM_GATEWAY_OTLP_ENDPOINT
              value: "http://{{ include "platform.clickstack.collector.host" . }}:4317"
            - name: PLATFORM_GATEWAY_OTLP_PROTOCOL
              value: "grpc"
            {{- end }}
            - name: ENVOY_IMAGE
              value: {{ .Values.controller.envoyImage | quote }}
            {{- with .Values.controller.gatewayUpstreamExtraCAs }}
            - name: PLATFORM_GATEWAY_UPSTREAM_EXTRA_CAS
              value: {{ . | quote }}
            {{- end }}
            # Where gateways may send traffic beyond the public internet; see
            # controller.gatewayEgress.
            - name: GATEWAY_EGRESS
              value: {{ .Values.controller.gatewayEgress | toJson | quote }}
            - name: MACHINE_DNS_IMAGE
              value: {{ .Values.controller.machineDNSImage | quote }}
            - name: ENVOY_PORT
              value: {{ .Values.controller.envoyPort | default 10000 | quote }}
            # ext-authz uses per-agent Services rendered by the
            # controller (one Service per agent, AuthorizationPolicy-gated
            # to the agent's own SA principal). The host is computed at
            # render time as `<release>-extauthz-<id>.<release-ns>.svc.cluster.local`
            # from PLATFORM_RELEASE_NAME + PLATFORM_RELEASE_NAMESPACE; no
            # static EXT_AUTHZ_HOST is needed.
            - name: EXT_AUTHZ_PORT
              value: {{ .Values.apiServer.extAuthzPort | quote }}
            - name: EXT_AUTHZ_HOLD_SECONDS
              value: {{ .Values.apiServer.approvalHoldSeconds | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: health
              containerPort: {{ .Values.controller.healthPort | default 8081 }}
          {{- if .Values.probes.enabled }}
          # UNIT_BOUNDARY_DESCRIPTION: the kubelet is what turns a leader that holds the Lease with no fleet behind it into a restart. Readiness is the store answering in the last half minute, not leadership — a standby must read ready or a one-replica rollout waits for a leader it cannot have; liveness allows two minutes of silence. CRD mode has no store, so both are always healthy. The startup budget covers the first list and, after the switch, the anchor pass.
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- if and (eq .Values.agentStore.authority "postgres") .Values.apiServer.db.caCert }}
          volumeMounts:
            - name: pg-ca
              mountPath: /etc/platform/pg-ca
              readOnly: true
          {{- end }}
      {{- if and (eq .Values.agentStore.authority "postgres") .Values.apiServer.db.caCert }}
      volumes:
        - name: pg-ca
          configMap:
            name: {{ include "platform.fullname" . }}-apiserver-db-ca
      {{- end }}
