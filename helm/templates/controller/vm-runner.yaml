{{- if .Values.virtualization.enabled }}
{{- /*
The VM runners themselves are not rendered here: the controller creates one
per owner, so that a guest escape reaches only that owner's machines, and it
mints each runner's credentials itself. What the chart owns is the identity
every runner runs as, and the SCC that identity needs on OpenShift; the pod
shape those runners get is `virtualization.runner` in values.yaml, handed to
the controller as AGENT_VM.
*/}}
{{- $name := printf "%s-vm-runner" (include "platform.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner
{{- with .Values.virtualization.runner.scc }}
---
{{- /* OpenShift: `use` on a built-in SCC comes as an auto-generated ClusterRole. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-scc
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: vm-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
