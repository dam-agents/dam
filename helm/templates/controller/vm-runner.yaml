{{- if .Values.virtualization.enabled }}
{{- /*
The VM runner: one pod that holds /dev/kvm and runs vm-backend agents as
smolvm microVMs, driven by the controller over its machine API (see
`virtualization` in values.yaml). Its Service is headless so the controller
can publish the pod's own IP and machine ports as each vm agent's endpoint.
Machine disks live on the PVC, so a pod restart keeps every workspace.
*/}}
{{- $name := printf "%s-vm-runner" (include "platform.fullname" .) }}
{{- $node := .Values.virtualization.node }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner
  annotations:
    # Every vm agent's workspace lives here; an uninstall must not take them.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $node.storage }}
  {{- with $node.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner
spec:
  clusterIP: None
  selector:
    {{- include "platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner
  ports:
    - name: machine-api
      port: 4600
      targetPort: 4600
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner
  {{- include "platform.annotations" (dict "root" $ "component" $node) | nindent 2 }}
spec:
  replicas: 1
  # Two pods would both claim the machine store; a roll is a stop of every
  # machine anyway (they are processes of this pod).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vm-runner
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vm-runner
        # smolvm NATs each machine out of a nested netns; ztunnel's redirect
        # breaks that, so this pod stays off the ambient mesh.
        istio.io/dataplane-mode: none
      {{- $checksums := dict "checksum/credentials" (include (print $.Template.BasePath "/controller/vm-runner-secret.yaml") . | sha256sum) }}
      {{- include "platform.podAnnotations" (dict "root" $ "component" $node "internal" $checksums) | nindent 6 }}
    spec:
      {{- include "platform.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with $node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vm-runner
          image: "{{ $node.image.repository }}:{{ $node.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $node.image.pullPolicy | default "IfNotPresent" }}
          args:
            - --tls-cert=/etc/vm-runner/tls.crt
            - --tls-key=/etc/vm-runner/tls.key
            - --allow-from={{ join "," $node.ingressCidrs }}
          ports:
            - name: machine-api
              containerPort: 4600
          readinessProbe:
            httpGet:
              path: /healthz
              port: machine-api
              scheme: HTTPS
          securityContext:
            # Root for smolvm's per-machine uid switch and NET_ADMIN for the
            # netns + NAT it gives each machine; KVM comes as a device grant,
            # not privilege (see `virtualization.node.devices`).
            runAsUser: 0
            privileged: {{ $node.privileged }}
            capabilities:
              add: ["NET_ADMIN"]
            # containerd's default AppArmor profile stops libkrun from booting
            # a guest at all (measured: the VM process exits before the guest
            # kernel prints a line); the capability set above is the gate here.
            appArmorProfile:
              type: Unconfined
          resources:
            {{- $res := deepCopy ($node.resources | default dict) }}
            {{- if not $node.privileged }}
            {{- $dp := .Values.virtualization.devicePlugin }}
            {{- $devices := $node.devices | default (ternary (dict (printf "%s/kvm" $dp.domain) 1 (printf "%s/tun" $dp.domain) 1) (dict "devices.kubevirt.io/kvm" 1 "devices.kubevirt.io/tun" 1) $dp.enabled) }}
            {{- $_ := set $res "limits" (merge (deepCopy ($res.limits | default dict)) $devices) }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/smolvm
              subPath: smolvm
            - name: state
              mountPath: /var/lib/vm-runner
              subPath: vm-runner
            - name: credentials
              mountPath: /etc/vm-runner
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ $name }}
        - name: credentials
          secret:
            secretName: {{ $name }}
            defaultMode: 0400
---
{{- /*
The vm counterpart of agent-ingress-platform-only: a guest's published port
and the machine API accept only the api-server (ACP/tRPC relay) and the
controller (machine API, busy-probe). agent-runtime in the guest serves
unauthenticated on the same assumption its pod form does.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: vm-runner
spec:
  podSelector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vm-runner
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: apiserver
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 4600
        - protocol: TCP
          port: 31000
          endPort: 31099
{{- with $node.scc }}
---
{{- /* OpenShift: `use` on a built-in SCC comes as an auto-generated ClusterRole. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-scc
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: vm-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
