{{- if .Values.virtualization.enabled }}
{{- /* Credentials between the controller and the sandbox node: the bearer
       token and the node's TLS server pair, minted here and carried to the
       node by the provisioner Job; persisted across upgrades via lookup
       (postgres-secrets.yaml pattern). The SSH identity is operator-supplied. */ -}}
{{- $node := .Values.virtualization.node }}
{{- if or (empty $node.host) (empty $node.sshUser) (empty $node.sshKey) }}
{{- fail "virtualization.enabled requires virtualization.node.host, .sshUser and .sshKey (the sandbox node the chart provisions over SSH)" }}
{{- end }}
{{- $name := printf "%s-sandbox-node" (include "platform.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- $tlsCrt := "" }}
{{- $tlsKey := "" }}
{{- if $existing }}
  {{- $token = index $existing.data "token" | default "" | b64dec }}
  {{- $tlsCrt = index $existing.data "tls.crt" | default "" | b64dec }}
  {{- $tlsKey = index $existing.data "tls.key" | default "" | b64dec }}
{{- end }}
{{- if not $token }}
  {{- $token = randAlphaNum 48 }}
{{- end }}
{{- if not $tlsCrt }}
  {{- $cert := genSelfSignedCert "platform-sandbox-node" (list $node.host) (list $node.host) 3650 }}
  {{- $tlsCrt = $cert.Cert }}
  {{- $tlsKey = $cert.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
  tls.crt: {{ $tlsCrt | b64enc | quote }}
  tls.key: {{ $tlsKey | b64enc | quote }}
  ssh-key: {{ $node.sshKey | b64enc | quote }}
{{- end }}
