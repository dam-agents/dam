{{- if .Values.virtualization.enabled }}
{{- $node := .Values.virtualization.node }}
{{- if or (empty $node.url) (empty $node.address) (empty $node.token) }}
{{- fail "virtualization.enabled requires virtualization.node.url, .address and .token (the sandbox node running sandbox-node)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-sandbox-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
type: Opaque
stringData:
  token: {{ $node.token | quote }}
{{- end }}
