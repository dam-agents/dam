{{- $tools := .Values.harnessTools }}
{{- if $tools.hostPath }}
{{- /*
The per-node installer of the harnesses' tools: the only writer of the node
directory `harnessTools.hostPath` names. Every container agent pod mounts that
directory read-only, and every VM runner on the node shares it read-only into
each machine of the default image. That image bakes no tools; its init
container here runs the image's own installer against the directory, so the
image and the tools on the node agree on every version. Then the pod idles: a
DaemonSet rather than a Job because it has to reach every node an agent or a
runner may land on, including one that joins later, and a deploy that changes
the image rolls it, which installs the new versions beside the old ones.

It runs in the agent namespace and holds no cluster credential.
*/}}
{{- $name := printf "%s-harness-tools" (include "platform.fullname" .) }}
{{- $v := .Values.virtualization }}
{{- $tolerations := concat ($tools.tolerations | default list) (.Values.controller.agent.base.tolerations | default list) }}
{{- if $v.enabled }}
{{- $tolerations = concat $tolerations ($v.runner.tolerations | default list) }}
{{- end }}
{{- $image := printf "%s:%s" $tools.image.repository ($tools.image.tag | default $.Chart.AppVersion) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: harness-tools
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: harness-tools
spec:
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: harness-tools
  {{- /*
  Every node at once: what agents use is the directory, which a pod being
  replaced leaves in place, and each node's installer writes only its own.
  One node at a time outlasts the Helm release's wait.
  */}}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: harness-tools
        istio.io/dataplane-mode: none
    spec:
      enableServiceLinks: false
      {{- /* The idler is PID 1, which ignores SIGTERM; nothing is lost by killing it. */}}
      terminationGracePeriodSeconds: 0
      {{- include "platform.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- /*
      The tools' download hosts are public names, which the node's resolver
      answers without the cluster's DNS.
      */}}
      dnsPolicy: Default
      {{- with $tools.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: install
          image: {{ $image | quote }}
          imagePullPolicy: {{ $tools.image.pullPolicy | default "IfNotPresent" }}
          {{- /*
          The image's ENTRYPOINT prepares an agent; the installer needs none of
          it. Root, because the directory and every install in it are root's:
          agents, runners and guests only read them. DAC_OVERRIDE, because mise
          still writes the agent's own dirs (its home, data dir, lockfile), and
          an SCC that drops every capability leaves root unable to.
          */}}
          command: ["install-harness-tools"]
          {{- if .Values.openshift.scc.anyuidCapNet.enabled }}
          {{- /*
          As the image cache does: the directory the kubelet creates carries the
          host's own label, which confined pods may not read, so it is labelled
          for containers at the plain s0 every pod can read, and everything
          installed into it inherits that.
          */}}
          args: ["system_u:object_r:container_file_t:s0"]
          {{- end }}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_OVERRIDE"]
            {{- if .Values.openshift.scc.anyuidCapNet.enabled }}
            seLinuxOptions:
              type: spc_t
              level: s0
            {{- end }}
          resources:
            {{- toYaml $tools.resources | nindent 12 }}
          volumeMounts:
            - name: harness-tools
              mountPath: /usr/share/mise
      containers:
        - name: idle
          image: {{ $image | quote }}
          imagePullPolicy: {{ $tools.image.pullPolicy | default "IfNotPresent" }}
          command: ["sleep", "infinity"]
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 32Mi
      volumes:
        - name: harness-tools
          hostPath:
            path: {{ $tools.hostPath }}
            type: DirectoryOrCreate
{{- with ($tools.scc | default $v.runner.scc) }}
---
{{- /*
An SCC that admits a hostPath and leaves the SELinux type to the pod: this
pod mounts the node directory and runs its installer as uid 0 and spc_t.
*/}}
{{ include "platform.sccRoleBinding" (dict "root" $ "namespace" $.Values.agentNamespace "name" $name "component" "harness-tools" "scc" .) }}
{{- end }}
{{- end }}
