{{- if and .Values.openshift.scc.anyuidCapNet.enabled .Values.virtualization.enabled }}
{{- $name := printf "%s-runtime-migration" (include "platform.fullname" .) }}
{{/*
SCC for the runtime migration's copy Job on OpenShift, bound to the
`platform-migration` ServiceAccount alone. The Job reads an agent's old
home volume read-only and streams it to its owner's VM runner. When it is
a block volume it runs as uid 0 holding DAC_READ_SEARCH and no
other capability: the volume's root holds a root-owned 0700 lost+found the
agent's uid cannot open, and DAC_READ_SEARCH reads every file and directory
while writing nothing. Everything else is as tight as restricted-v2: drop
ALL, no privilege escalation, runtime/default seccomp, no host namespaces
or host volumes, and only the volume types the Job mounts.

Kept apart from the agents' `anyuid-cap-net` SCC, which every
ServiceAccount in the agent namespace may use, so no agent pod or other
workload there can ask for DAC_READ_SEARCH.

Priority `null` (= 0) keeps the storage migration's grant path as it is:
that Job runs as the same ServiceAccount with the runtime's default
capabilities, and admission tries a higher-priority SCC it holds — the
`anyuid` grant operators bind — before this one, which it would fail
anyway since this SCC drops ALL.
*/}}
{{- include "platform.scc" (dict
  "root" $
  "name" $name
  "capabilities" (list "DAC_READ_SEARCH")
  "volumes" (list "emptyDir" "persistentVolumeClaim" "projected")) }}
---
{{- include "platform.sccUse" (dict
  "root" $
  "name" (printf "%s-scc-use" $name)
  "scc" $name
  "binding" (printf "%s-scc" $name)
  "subjects" (list (dict
    "kind" "ServiceAccount"
    "name" "platform-migration"
    "namespace" .Values.agentNamespace))) }}
{{- end }}
