{{- if .Values.clickstack.enabled }}
{{- /*
Mesh gate for the collector: ALLOW only the release + agent namespaces (Istio ALLOW denies
all else, L4 via ztunnel), replacing ClickStack's HyperDX-token gate.
See docs/architecture/observability.md.
*/ -}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "platform.fullname" . }}-clickstack-collector-allow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickstack-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: clickstack-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace | quote }}
              - {{ .Values.agentNamespace | quote }}
    {{- if .Values.monitoring.enabled }}
    # The Prometheus port serves identity-free platform metrics and nothing
    # else. A Prometheus outside the mesh has no identity to name, so without
    # scrapeFromNamespaces any source reaches this one port.
    - to:
        - operation:
            ports: ["9464"]
      {{- with .Values.monitoring.serviceMonitor.scrapeFromNamespaces }}
      from:
        - source:
            namespaces:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
