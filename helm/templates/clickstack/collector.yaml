{{- if .Values.clickstack.enabled }}
{{- /*
Platform-owned OTel collector; replaces the subchart's OpAMP/token-gated one so collector
access is gated by the Istio AuthorizationPolicy alongside. Reuses the subchart's
clickstack-config/clickstack-secret for the ClickHouse connection.
See docs/architecture/observability.md.
*/ -}}
{{- $name := include "platform.clickstack.collector.fullname" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickstack-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            # Retain request headers as client metadata so the
            # resource/agent-identity processor can read the gateway-stamped
            # x-platform-agent-id and x-platform-invocation-id headers.
            include_metadata: true
          http:
            endpoint: 0.0.0.0:4318
            include_metadata: true
      # The VM runners are off the mesh, so they cannot push through the
      # AuthorizationPolicy that gates the OTLP receivers; this collector pulls
      # from them instead. Discovery is by pod, in the agent namespace, and only
      # the port each runner names `metrics` — which its NetworkPolicy opens to
      # this pod and no other. No pod label is copied onto a series: a runner is
      # per owner, and its owner label is a person in disguise.
      prometheus/vm-runners:
        config:
          scrape_configs:
            - job_name: vm-runner
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [{{ .Values.agentNamespace | quote }}]
                  selectors:
                    - role: pod
                      label: "app.kubernetes.io/component=vm-runner,app.kubernetes.io/instance={{ include "platform.fullname" . }}"
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  regex: metrics
                  action: keep
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      # Trusted agent attribution. The paired gateway Envoy stamps the
      # x-platform-agent-id header (overwriting anything the agent set) on every
      # plaintext request it forwards for the agent, not only the ones it
      # recognizes as telemetry, and on the telemetry route itself; promote it to
      # the platform.agent.id resource attribute. Those are the only two routes
      # that reach these receivers, so a request arriving here — by any of this
      # Service's names, on either port — carries a gateway value rather than the
      # agent's own claim, and this processor need not ask which route it took.
      # delete-then-set so a forged value can never survive a missing header:
      # unconditionally drop any client-supplied platform.agent.id, then set it
      # ONLY from the trusted header. MUST run before `batch`, which emits a new
      # context and drops per-request client metadata. Telemetry with no header
      # (platform components) ends up with no platform.agent.id, which is how the
      # read path tells agent telemetry apart.
      #
      # platform.invocation.id gets the same delete-then-upsert treatment from
      # the x-platform-invocation-id header. The gateway stamps that header only
      # for an Invocation target whose attribution was overridden to its root
      # Driver — it carries the target's own id so the merged child row stays
      # distinguishable. A missing header leaves the attribute absent (upsert
      # from a missing context key is a no-op), which is exactly the non-target
      # case. See docs/architecture/observability.md.
      resource/agent-identity:
        attributes:
          - key: platform.agent.id
            action: delete
          - key: platform.agent.id
            from_context: "metadata.x-platform-agent-id"
            action: upsert
          - key: platform.invocation.id
            action: delete
          - key: platform.invocation.id
            from_context: "metadata.x-platform-invocation-id"
            action: upsert
      # Codex writes its log records with no body, its event name in
      # `event.name`, its own counter names and its thread id as
      # `conversation.id`, so they are reshaped here into the records the
      # read path takes spend from: body from the event name, `session.id`
      # from the thread id, and the per-call usage record renamed to
      # codex.response_completed with Claude Code's counters, input net of
      # cache reads. Codex also writes every tool call's arguments and an
      # output preview into its records, with no setting to stop it, so only
      # the structural attributes listed here are kept. Agents can send
      # anything here, so this shapes a record and never attributes it.
      # See docs/architecture/observability.md.
      transform/codex:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - IsMatch(log.attributes["event.name"], "^codex\\.")
            statements:
              - >-
                keep_keys(log.attributes, ["event.name", "event.kind", "event.timestamp",
                "conversation.id", "parent.conversation.id", "turn.id", "parent.turn.id",
                "root.turn.id", "app.version", "originator", "terminal.type", "model",
                "slug", "auth_mode", "provider_name", "approval_policy", "sandbox_policy",
                "reasoning_summary", "reasoning_effort", "model_reasoning_effort",
                "service_tier", "speed", "duration_ms", "ttft_ms", "attempt", "endpoint",
                "http.response.status_code", "success", "outcome", "status", "decision",
                "source", "error.message", "tool_name", "tool_namespace", "call_id",
                "tool_result_seq", "output_truncated", "prompt_length", "text_input_count",
                "image_input_count", "local_image_input_count", "input_token_count",
                "output_token_count", "cached_token_count", "cache_write_token_count",
                "reasoning_token_count", "tool_token_count", "usage.estimated_usd",
                "turn.interrupted", "startup.phase", "startup.status", "context_window",
                "auto_compact_token_limit"])
              - set(log.attributes["session.id"], log.attributes["conversation.id"])
              - set(log.body, log.attributes["event.name"])
          - context: log
            conditions:
              - log.attributes["event.name"] == "codex.sse_event" and log.attributes["event.kind"] == "response.completed" and log.attributes["input_token_count"] != nil
            statements:
              - set(log.body, "codex.response_completed")
              - set(log.attributes["input_tokens"], Int(log.attributes["input_token_count"]) - Int(log.attributes["cached_token_count"]))
              - set(log.attributes["output_tokens"], Int(log.attributes["output_token_count"]))
              - set(log.attributes["cache_read_tokens"], Int(log.attributes["cached_token_count"]))
              - set(log.attributes["cache_creation_tokens"], Int(log.attributes["cache_write_token_count"]))
      batch: {}
      {{- if .Values.monitoring.enabled }}
      # Only the VM pool series reach the Prometheus export: the controller's
      # pool gauges and the runners' own. Neither names a user, and no
      # resource attribute becomes a label, so nothing scraped here does.
      # The name alone is not enough, since an agent may name a metric
      # anything: anything an agent sent carries platform.agent.id (set above
      # from the gateway's header, never from the agent), and only the
      # runners' scrape job and the controller are let through.
      filter/vm-pool:
        error_mode: ignore
        metrics:
          metric:
            - 'not IsMatch(name, "^platform[._]vm_")'
            - 'resource.attributes["platform.agent.id"] != nil'
            - 'resource.attributes["service.name"] != "vm-runner" and resource.attributes["service.name"] != "platform-controller"'
      {{- end }}
    exporters:
      clickhouse:
        endpoint: ${env:CLICKHOUSE_ENDPOINT}
        username: ${env:CLICKHOUSE_USER}
        password: ${env:CLICKHOUSE_PASSWORD}
        database: default
        create_schema: true
        # Lands in the CREATE TABLE DDL only; existing tables keep their TTL.
        ttl: {{ .Values.clickstack.collector.ttl }}
      {{- if .Values.monitoring.enabled }}
      prometheus:
        endpoint: 0.0.0.0:9464
        resource_to_telemetry_conversion:
          enabled: false
      {{- end }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/agent-identity, transform/codex, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/agent-identity, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp, prometheus/vm-runners]
          processors: [memory_limiter, resource/agent-identity, batch]
          exporters: [clickhouse]
        {{- if .Values.monitoring.enabled }}
        metrics/vm-pool:
          receivers: [otlp, prometheus/vm-runners]
          processors: [memory_limiter, resource/agent-identity, filter/vm-pool, batch]
          exporters: [prometheus]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickstack-collector
spec:
  type: ClusterIP
  ports:
    - port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
      appProtocol: grpc
    - port: 4318
      targetPort: otlp-http
      protocol: TCP
      name: otlp-http
    {{- if .Values.monitoring.enabled }}
    - port: 9464
      targetPort: prometheus
      protocol: TCP
      name: prometheus
    {{- end }}
  selector:
    app.kubernetes.io/component: clickstack-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickstack-collector
  {{- include "platform.annotations" (dict "root" $ "component" .Values.clickstack.collector) | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: clickstack-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: clickstack-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "platform.podAnnotations" (dict "root" $ "component" .Values.clickstack.collector) | nindent 6 }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ $name }}
      {{- include "platform.imagePullSecrets" . | nindent 6 }}
      # The ClickHouse exporter creates its schema (otel_logs/otel_metrics_*/…)
      # once, at collector start; it never retries the DDL, only the inserts.
      # ClickHouse is heavier to boot than this collector, so on a fresh install
      # the collector would otherwise win the race, silently skip schema
      # creation, and every export would fail forever with "table does not
      # exist". Gate startup on ClickHouse answering /ping so create_schema runs
      # against a live server.
      initContainers:
        - name: wait-for-clickhouse
          image: {{ .Values.clickstack.hyperdx.deployment.waitForMongodb.image }}
          command:
            - sh
            - -c
            - |
              until wget -q -T 3 -O /dev/null "{{ include "platform.clickstack.clickhouse.httpUrl" . }}/ping"; do
                echo "waiting for ClickHouse to be ready..."; sleep 3
              done
      containers:
        - name: collector
          image: {{ .Values.clickstack.collector.image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          # ClickHouse conn from HyperDX's clickstack-config/secret (rendered with the subchart, not the
          # disabled bundled collector), so co-gated with this collector under clickstack.enabled.
          # OPAMP_SERVER_URL there is ignored (no opamp in our config).
          envFrom:
            - configMapRef:
                name: clickstack-config
            - secretRef:
                name: clickstack-secret
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 13133
              name: health
            {{- if .Values.monitoring.enabled }}
            - containerPort: 9464
              name: prometheus
            {{- end }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          {{- end }}
          resources:
            {{- toYaml .Values.clickstack.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
---
# Pod discovery for the VM runner scrape above: read-only, and only in the
# agent namespace, where the controller creates the runners.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickstack-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-vm-runner-discovery
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickstack-collector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-vm-runner-discovery
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickstack-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-vm-runner-discovery
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
