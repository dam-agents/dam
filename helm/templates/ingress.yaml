{{- if .Values.ingress.enabled }}
{{- $domains := list .Values.domain }}
{{- range .Values.ingress.aliasDomains }}
{{- if . }}
{{- $domains = append $domains . }}
{{- end }}
{{- end }}
{{- /*
  Resolve override hosts. When `urls.{service}` is set, the bundled Ingress
  routes that hostname instead of generating convention-based rules for
  that service. UI and API share a single host (path-based routing splits
  `/api/*` to the api-server and everything else to the UI), so an `urls.api`
  override is no longer needed and is treated as a UI override fallback.
*/ -}}
{{- $uiHost := "" -}}
{{- if or .Values.urls.ui .Values.urls.api -}}
{{- $uiHost = include "platform.url.host" (include "platform.url.ui" .) -}}
{{- end -}}
{{- $keycloakHost := "" -}}
{{- if .Values.urls.keycloak -}}
{{- $keycloakHost = include "platform.url.host" .Values.urls.keycloak -}}
{{- end -}}
{{- $shareHost := include "platform.url.host" (include "platform.url.share" .) -}}
{{- $contentHost := include "platform.url.host" (include "platform.url.content" .) -}}
{{- $uiSvc := include "platform.ui.fullname" . -}}
{{- $apiSvc := include "platform.apiserver.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- /* Public share host — artifact-library content and the read-only
           knowledge-base MCP endpoint (/mcp/kb) — and the content host — the
           artifact documents and raw bytes the share page frames. All paths
           of both go to the api-server, which host-gates each onto its own
           app; the content app has no other routes. */}}
    {{- range $host := list $shareHost $contentHost }}
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $apiSvc }}
                port:
                  name: http
    {{- end }}
    {{- if $uiHost }}
    - host: {{ $uiHost }}
      http:
        paths:
          {{- include "platform.ingress.appPaths" (dict "uiSvc" $uiSvc "apiSvc" $apiSvc) | nindent 10 }}
    {{- end }}
    {{- if and .Values.keycloak.enabled $keycloakHost }}
    - host: {{ $keycloakHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform.keycloak.fullname" . }}
                port:
                  name: http
    {{- end }}
    {{- /* The backchannel's hosts: the app, Keycloak, and the share and
           content hosts, whose requests the api-server host-gates onto the
           apps built for the backchannel. */}}
    {{- if .Values.backchannel.enabled }}
    {{- range $host := list (include "platform.backchannel.url" (dict "root" $ "sub" "share")) (include "platform.backchannel.url" (dict "root" $ "sub" "content")) }}
    - host: {{ include "platform.url.host" $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $apiSvc }}
                port:
                  name: http
    {{- end }}
    - host: {{ include "platform.url.host" (include "platform.backchannel.url" (dict "root" $)) }}
      http:
        paths:
          {{- include "platform.ingress.appPaths" (dict "uiSvc" $uiSvc "apiSvc" $apiSvc) | nindent 10 }}
    {{- if .Values.keycloak.enabled }}
    - host: {{ include "platform.url.host" (include "platform.backchannel.url" (dict "root" $ "sub" "keycloak")) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform.keycloak.fullname" . }}
                port:
                  name: http
    {{- end }}
    {{- end }}
    {{- /* The catch-all app rule (host-less) has an Ingress of its own
           (`ingress-catchall.yaml`): an Ingress's routers share one priority,
           so in this one it tied the explicit hosts. */ -}}
    {{- /* Convention-based rules: bare `${domain}` is the single app host. */ -}}
    {{- range $domain := $domains }}
    {{- if not $uiHost }}
    - host: {{ $domain }}
      http:
        paths:
          {{- include "platform.ingress.appPaths" (dict "uiSvc" $uiSvc "apiSvc" $apiSvc) | nindent 10 }}
    {{- end }}
    {{- if and $.Values.keycloak.enabled (not $keycloakHost) }}
    - host: {{ printf "keycloak.%s" $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "platform.keycloak.fullname" $ }}
                port:
                  name: http
    {{- end }}
    {{- end }}
{{- end }}
