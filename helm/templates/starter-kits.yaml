{{/*
The built-in starter kit catalog. Every file under helm/starter-kits/kits/<id>/
becomes a data key (slashes folded to `__`) when the kit is enabled
(`starterKits.builtin.kits.<id>.enabled`, default true); catalog.yaml is
re-rendered to list only enabled kits, so a disabled kit never reaches the
api-server. A kit that brings its own image can be pointed at another one per
install (`starterKits.builtin.kits.<id>.image`), which is how the local cluster
runs a workload kit on the image it built itself — the ref is swapped into the
kit's own `image.ref` at render, nothing else about the kit changes.
apiserver/app.yaml projects the keys back to their paths under
/etc/platform/starter-kits, where the api-server reads the `platform` catalog
with the same reader every other catalog gets.
*/}}
{{- if .Values.starterKits.builtin.enabled }}
{{- $root := . }}
{{- $catalog := .Files.Get "starter-kits/catalog.yaml" | fromYaml }}
{{- $enabledEntries := list }}
{{- range $catalog.kits }}
{{- $id := .id | default (trimPrefix "kits/" (.path | default "")) }}
{{- if not $id }}
{{- fail (printf "starter kit catalog entry %v has no id and no path to derive one from; an entry naming a repository must set `id`, or starterKits.builtin.kits.<id>.enabled can never switch it off" .) }}
{{- end }}
{{- if include "platform.starterKits.kitEnabled" (dict "root" $root "id" $id) }}
{{- $enabledEntries = append $enabledEntries . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.fullname" . }}-starter-kits
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
data:
  catalog.yaml: |-
    {{- dict "kits" $enabledEntries | toYaml | nindent 4 }}
  {{- range $path, $bytes := .Files.Glob "starter-kits/kits/*/**" }}
  {{- $id := index (splitList "/" $path) 2 }}
  {{- if include "platform.starterKits.kitEnabled" (dict "root" $root "id" $id) }}
  {{- $key := $path | trimPrefix "starter-kits/" | replace "/" "__" | quote }}
  {{- $override := dig $id "image" "" ($root.Values.starterKits.builtin.kits | default dict) }}
  {{- if and $override (hasSuffix "/kit.yaml" $path) }}
  {{- $kit := $bytes | toString | fromYaml }}
  {{- if not $kit.image }}
  {{- fail (printf "starterKits.builtin.kits.%s.image: kit %s brings no image of its own, so there is nothing to override" $id $id) }}
  {{- end }}
  {{- $_ := set $kit.image "ref" $override }}
  {{ $key }}: |-
    {{- $kit | toYaml | nindent 4 }}
  {{- else }}
  {{ $key }}: |-
    {{- $bytes | toString | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
