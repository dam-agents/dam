{{- if .Values.keycloak.enabled }}
{{- $appName := include "platform.keycloak.fullname" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $appName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.keycloak.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $appName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  {{- include "platform.annotations" (dict "root" $ "component" .Values.keycloak) | nindent 2 }}
spec:
  replicas: 1
  # Rolling, surge-first: the old pod keeps serving logins and JWKS until the
  # new one is ready, so a Keycloak roll is not an auth outage. In production
  # mode (`start`, scheme https) the overlapping pods form an Infinispan
  # cluster via jdbc-ping through the shared DB, so in-flight login flows
  # survive the roll too; scheme http (local/e2e) uses a local cache, where an
  # in-flight login may bounce once. A failed startup (e.g. schema migration)
  # leaves the old pod serving instead of taking auth down.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      # Not `platform.labels`: it embeds the chart version (helm.sh/chart),
      # which would change the pod template — and needlessly roll the pod —
      # on every release. Same deliberate omission as postgres/redis.
      labels:
        app.kubernetes.io/component: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "platform.podAnnotations" (dict "root" $ "component" .Values.keycloak) | nindent 6 }}
    spec:
      enableServiceLinks: false
      {{- include "platform.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h {{ include "platform.keycloak.db.host" . }} -p {{ .Values.keycloak.db.port }} -U {{ .Values.keycloak.db.user }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy | default "IfNotPresent" }}
          # The image is pre-built with the base features and the KC_DB and
          # KC_HEALTH_ENABLED set below (packages/keycloak-theme/.mise/tasks/oci),
          # so an optimized start skips the Quarkus augmentation a plain start
          # runs first. Extra features differ from that build, and then
          # Keycloak augments at every start as before.
          {{- if .Values.keycloak.extraFeatures }}
          args: [{{ if eq .Values.scheme "https" }}"start"{{ else }}"start-dev"{{ end }}, "--features=token-exchange,admin-fine-grained-authz:v1{{ range .Values.keycloak.extraFeatures }},{{ . }}{{ end }}"]
          {{- else }}
          args: ["start", "--optimized"{{ if ne .Values.scheme "https" }}, "--cache=local"{{ end }}]
          {{- end }}
          ports:
            - containerPort: {{ .Values.keycloak.port }}
              name: http
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: {{ include "platform.keycloak.db.url" . | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.keycloak.db.user | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.keycloak.db.password.secretName" . }}
                  key: POSTGRES_KEYCLOAK_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.admin.user | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.keycloak.secrets.fullname" . }}
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_LOG_CONSOLE_OUTPUT
              value: {{ .Values.keycloak.log.consoleOutput | quote }}
            - name: KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL
              value: {{ .Values.keycloak.events.successLevel | quote }}
            - name: KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_ERROR_LEVEL
              value: {{ .Values.keycloak.events.errorLevel | quote }}
            - name: KC_HTTP_PORT
              value: {{ .Values.keycloak.port | quote }}
            - name: KC_HOSTNAME
              value: {{ include "platform.url.keycloak" . | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            # Login-theme knobs — resolved by theme.properties `${env.…}`
            # placeholders in the Keycloakify-built theme.
            - name: PLATFORM_ALLOW_PASSWORD
              value: {{ .Values.keycloak.login.allowPassword | quote }}
            {{- with .Values.keycloak.login.requestAccessUrl }}
            - name: PLATFORM_REQUEST_ACCESS_URL
              value: {{ . | quote }}
            {{- end }}
            - name: PLATFORM_SHARE_CLIENT_ID
              value: {{ .Values.keycloak.shareClientId | quote }}
            {{- with .Values.keycloak.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.enabled }}
          # An optimized start is up in about ten seconds; a failed readiness
          # check only holds traffic back. Checked every 2s so the pod turns
          # Ready, and the realm import hook and the api-server behind it
          # start, within 2s of Keycloak being ready instead of up to 10s
          # later. The failure threshold keeps 30s of failed checks before a
          # Ready pod is pulled, as the 10s period with the default of 3 did.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
          {{- end }}
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          {{- /* volumeMounts and volumes always render, as [] when empty, so a
          deployer's post-render JSON patch can append with an `add .../-` op. */}}
          {{- if .Values.keycloak.db.caCert }}
          volumeMounts:
            - name: pg-ca
              mountPath: /etc/keycloak/pg-ca
              readOnly: true
          {{- else }}
          volumeMounts: []
          {{- end }}
      {{- if .Values.keycloak.db.caCert }}
      volumes:
        - name: pg-ca
          configMap:
            name: {{ include "platform.fullname" . }}-keycloak-db-ca
      {{- else }}
      volumes: []
      {{- end }}
{{- end }}
