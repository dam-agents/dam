{{- if .Values.keycloak.enabled }}
{{- $secretName := include "platform.keycloak.secrets.fullname" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $adminPassword := "" }}
{{- if .Values.keycloak.admin.password }}
  {{- /* Explicit password always wins (e.g. --set keycloak.admin.password=admin) */ -}}
  {{- $adminPassword = .Values.keycloak.admin.password }}
{{- else if $existingSecret }}
  {{- $adminPassword = index $existingSecret.data "KEYCLOAK_ADMIN_PASSWORD" | b64dec }}
{{- else }}
  {{- $adminPassword = randAlphaNum 32 }}
{{- end }}
{{- /* platform-api client secret (for confidential client) */ -}}
{{- $apiClientSecret := "" }}
{{- if .Values.keycloak.apiClientSecret }}
  {{- $apiClientSecret = .Values.keycloak.apiClientSecret }}
{{- else if and $existingSecret (hasKey $existingSecret.data "PLATFORM_API_CLIENT_SECRET") }}
  {{- $apiClientSecret = index $existingSecret.data "PLATFORM_API_CLIENT_SECRET" | b64dec }}
{{- else }}
  {{- $apiClientSecret = randAlphaNum 40 }}
{{- end }}
{{- /* Shared secret Keycloak's access-list check sends to the api-server.
       Kept across upgrades by reading the existing Secret first; only the two
       pods hold it. */ -}}
{{- $accessCheckSecret := "" }}
{{- if and $existingSecret (hasKey $existingSecret.data "ACCESS_LIST_CHECK_SECRET") }}
  {{- $accessCheckSecret = index $existingSecret.data "ACCESS_LIST_CHECK_SECRET" | b64dec }}
{{- else }}
  {{- $accessCheckSecret = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
{{- /* When keycloak.db.password is set (external DB), the KC_DB_PASSWORD
       secretKeyRef resolves to POSTGRES_KEYCLOAK_PASSWORD here — see
       platform.keycloak.db.password.secretName. The key matches the
       in-cluster postgres Secret so the same secretKeyRef works either way. */}}
data:
  KEYCLOAK_ADMIN_PASSWORD: {{ $adminPassword | b64enc | quote }}
  PLATFORM_API_CLIENT_SECRET: {{ $apiClientSecret | b64enc | quote }}
  ACCESS_LIST_CHECK_SECRET: {{ $accessCheckSecret | b64enc | quote }}
  {{- if .Values.keycloak.db.password }}
  POSTGRES_KEYCLOAK_PASSWORD: {{ .Values.keycloak.db.password | b64enc | quote }}
  {{- end }}
{{- end }}
