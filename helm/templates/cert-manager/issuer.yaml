{{- if and .Values.controller.envoyMitm .Values.controller.envoyMitm.enabled }}
{{/*
Cluster issuers backing the experimental Envoy credential-injector path.
The bootstrap issuer signs the platform-mitm-ca Certificate; the CA
issuer then signs per-agent leaf certs that Envoy uses to terminate the
agent's TLS for credential injection.

ClusterIssuers are cluster-scoped — names collide globally. The bootstrap
issuer's name can be overridden via .Values.controller.envoyMitm.bootstrapIssuerName;
the CA issuer's name is fixed because the controller mints leaves from it by
that name.
*/}}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.controller.envoyMitm.bootstrapIssuerName }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-mitm
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-mitm-ca-issuer
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-mitm
spec:
  ca:
    secretName: {{ .Values.controller.envoyMitm.caSecretName }}
{{- end }}
