{{- if .Values.openshift.scc.anyuidCapNet.enabled }}
{{- $name := printf "%s-anyuid-cap-net" (include "platform.fullname" .) }}
{{/*
Custom `anyuid-cap-net` SCC for agent pods on OpenShift. Tightens
anyuid as far as it goes while admitting the `iptablesInit` init
container: requires drop ALL caps, no priv escalation, runtime/default
seccomp (all from restricted-v2). The two real relaxations are:

  - runAsUser: RunAsAny — the iptablesInit init container needs root
    because containerd doesn't promote capabilities.add into the
    ambient set, so non-root processes can't exercise NET_ADMIN.
  - allowedCapabilities: NET_ADMIN + NET_RAW — opt-in via container
    caps.add, and the iptablesInit init container's alone.

No VM workload runs under this SCC: a runner mounts the node image cache's
hostPath, which it refuses, so `virtualization.runner.scc` is what admits a
runner — and its DAC_OVERRIDE, which this SCC does not carry.

Priority intentionally `null` (= 0): admission prefers more restrictive
SCCs the SA already has access to (restricted-v2 default), and only
falls through to this one for pods that actually request a capability it
adds — NET_ADMIN for an agent's iptables init.
*/}}
{{- include "platform.scc" (dict
  "root" $
  "name" $name
  "capabilities" (list "NET_ADMIN" "NET_RAW")
  "volumes" (list "configMap" "csi" "downwardAPI" "emptyDir" "ephemeral" "persistentVolumeClaim" "projected" "secret")) }}
---
{{- include "platform.sccUse" (dict
  "root" $
  "name" (printf "%s-use" $name)
  "scc" $name
  "binding" (printf "%s-agent-anyuid-cap-net" (include "platform.fullname" .))
  "subjects" (list (dict
    "kind" "Group"
    "apiGroup" "rbac.authorization.k8s.io"
    "name" (printf "system:serviceaccounts:%s" .Values.agentNamespace)))) }}
{{- end }}
