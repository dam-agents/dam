# -- Brand customization — display name, slash-command identifier, and UI
# theme accent colors. Surfaced to the UI at runtime via `GET /api/brand`
# (the api-server reads these from BRAND_* env vars set below). The
# internal codename ("platform") and the K8s annotation domain
# ("agent-platform.ai/...") are permanent and unrelated to brand; this
# section is the only knob users see.
brand:
  # Display name shown in the PWA manifest, OAuth dynamic client_name,
  # skill-publish git author, and the Keycloak realm display name (sign-in
  # heading).
  name: DAM
  # Lowercase identifier (DNS/URL-safe). Used for the Slack slash command
  # (`/<short> login`), GitHub publish branch prefix, and git-author email
  # local-part.
  short: dam
  # Browser tab title of the web app and the Keycloak sign-in pages. Set a
  # per-environment variant here (e.g. "IBM Research DAM - Staging"). Empty
  # string falls back to `name`.
  title: "IBM Research DAM"
  # Organisation that runs this install. The Public Agent Page uses it to tell
  # a visitor arriving from Slack that the platform is open to them. Empty
  # string drops that sentence.
  vendor: "IBM Research"
  # What `name` stands for. The sign-in page shows one meaning above its
  # heading and swaps it for another at random every few seconds, never the
  # same one twice in a row. An empty list shows no meaning.
  nameMeanings:
    - Deploy Agents Massively
    - Diabolical Agent Masterminds
    - Debugging At Midnight
    - Dispatch Agents Mindfully
    - Does Anything, Mostly
    - Distributed Algorithmic Madness
    - Delightfully Aggressive Multitasking
    - Drive Agents, Make Coffee
    - Did Anyone Merge?
    - Dashboards And Mayhem
    - Diagnosing Another Mystery
    - Deny, Allow, Mediate
    - Dangerously Autonomous Machines
    - Don't Ask Me
    - Digital Army of Minions
    - Delegated Autonomous Magic
    - Denier of AI Mischief
    - Distributed Actors of Malevolence
    - Damage Avoidance Mechanism
    - Don't Approve Manually
  # UI theme — applied at runtime as CSS custom properties so a brand
  # change requires no UI rebuild.
  theme:
    light:
      accent: "#0F62FE"
      accentHover: "#0353E9"
      accentLight: "#edf5ff"
    dark:
      accent: "#4589FF"
      accentHover: "#78A9FF"
      accentLight: "#0f1f3a"
  # Optional SVG override for the brand icon. The api-server serves it at
  # `/api/brand/icon.svg` and rasterizes on demand for the favicon, PWA
  # install icons, and apple-touch-icon. Empty string falls back to the
  # bundled default. Use `helm install --set-file brand.icon=./my-logo.svg`
  # for the easiest override workflow.
  icon: ""

# -- Terms of Use shown at the api-server acceptance gate. Both fields are
# required; the chart refuses to install when either is unset. Bump
# `terms.version` on every material change to re-prompt every user; the
# server records `sha256(text)` on each Acceptance row as proof binding.
terms:
  # Markdown content rendered at /terms and on the login page. Supply via
  # `helm install --set-file terms.text=./TERMS.md`.
  text: ""
  # Free-form re-prompt trigger (e.g. "2026-05-25", "v1"). Operator
  # judgment — whitespace edits don't bump this.
  version: ""

# -- Whether new users can start. `open` lets anyone who can sign in accept
# the Terms of Use and use the platform. `closed` is the kill switch for
# runaway growth: a user who has never accepted any Terms version is turned
# away at the Terms page with a message that sign-ups are closed, while every
# user who accepted before keeps working, including through a Terms re-accept.
signUps: open

# -- Outbound links surfaced in the UI, changeable per install without a
# rebuild (the api-server serves them over `links.all`).
links:
  # Where "Request more" next to the compute meter points — a chat channel,
  # form, or ticket queue. Complete URL. Empty string uses the UI's bundled
  # default, which is install-specific and slated for removal — set this.
  computeRequest: ""
  # Where "Request it" on the Slack setup surfaces points — the form people
  # use to ask for the Slack app in a workspace that does not have it yet.
  # Complete URL. Empty string hides that line; there is no bundled default.
  slackInstallRequest: ""

# -- Experimental features, one mode each: `experimental` leaves the per-user
# switch in the hidden settings tab; `on` or `off` hides the switch and decides
# for every user, whatever they stored. A feature `features` does not name
# takes `featureDefault`, so an install that sets it `off` also keeps features
# added by later releases off until it names them.
featureDefault: experimental
features: {}

# -- Base domain for the app. UI and API share this host; the ingress
# splits `/api/*` to the api-server and everything else to the UI. Keycloak
# lives at `keycloak.{domain}`.
# Override for production, e.g. "example.com"
domain: localhost
# -- Port appended to public URLs (empty for standard 80/443)
port: "4444"
# -- URL scheme (http for local dev, https for production)
scheme: http

# -- Explicit external URLs.
#
# `urls.ui` overrides the app host (UI + API). `urls.api` is honored as a
# back-compat fallback when `urls.ui` is unset. `urls.keycloak` overrides
# the Keycloak host.
#
# Each override must be a complete URL including scheme. The hostname is
# what the cluster expects in the Host header (used as the rule host when
# `ingress.enabled: true`); Keycloak uses the full URL as its issuer and as
# `KC_HOSTNAME`, and the API server uses it for browser-facing redirects.
#
# If you keep the bundled Ingress enabled with TLS, remember to align
# `ingress.tls[].hosts` with the override hostnames — see the note on
# `ingress.tls` below.
urls:
  ui: "" # default: {scheme}://{domain}{:port}
  api: "" # back-compat fallback for urls.ui; same host
  keycloak: "" # default: {scheme}://keycloak.{domain}{:port}
  # Public share host for the artifact library (and a by-link knowledge-base
  # MCP endpoint kept for external use). Always served from its own origin so
  # user-generated content never shares the app origin's cookies or tokens;
  # routed to the api-server, which host-gates it onto the share-host app.
  # This host is browser-facing only — consumer agents read shared knowledge
  # bases over the in-cluster harness channel, never by dialing this host, so
  # it does not need to be resolvable from a machine.
  share: "" # default: {scheme}://share.{domain}{:port}
  # Content host that serves only artifact documents and raw bytes, framed by
  # the share host. A second origin so artifact code can never act on the
  # share host (no cookie, no sign-in, no app route there). Routed to the
  # api-server, which host-gates it onto the content app.
  content: "" # default: {scheme}://content.{domain}{:port}
  # Environment addresses, with `{host}` where each address's
  # `<endpoint>-<environment>` label goes. Only with `environments.domain`,
  # whose host it must name: `{host}.<environments.domain>`.
  environments: "" # default: {scheme}://{host}.{environments.domain}{:port}

# -- A second address set, for an install inside an Environment: the agent
# that installed it reaches it only through the Environment Link, at addresses
# on its own machine, while reviewers use the public ones above. On, the
# install also answers on `<domain>`, `keycloak.<domain>`, `share.<domain>`
# and `content.<domain>`, with `scheme` and `port` here; sign-in, the API and
# share pages work on either set, and each request is served on the set its
# host names. Keycloak then takes its address from each request instead of
# `urls.keycloak`, so whatever routes to it must pass the browser's host and
# scheme (`Host`, or `X-Forwarded-Host` and `X-Forwarded-Proto`). Links the
# platform writes into messages stay on the public addresses. The host names
# must differ from the public ones.
backchannel:
  enabled: false
  scheme: http
  domain: localhost
  # -- The port the agent's browser uses, which the forward listens on. It is
  # part of every address the browser sends, so the issuer, the redirect URIs
  # and the cookies follow it. Empty for 80/443.
  port: "4444"

# -- Pull secrets for all pods managed by this chart.
# The node image cache and every machine inherit these secrets too.
# Example:
#   imagePullSecrets:
#     - name: my-registry-secret
imagePullSecrets: []

# -- Annotations added to every chart-managed workload (Deployments,
# StatefulSets and the setup/migration Jobs). Use for cluster-wide policy or
# tooling that targets workload objects. Per-component `annotations` override
# these on collision; chart-internal annotations (e.g. Helm hooks) always win.
commonAnnotations: {}

# -- Annotations added to the pod template of every chart-managed workload.
# This is what injection operators read — e.g. set
# `instrumentation.opentelemetry.io/inject-sdk: "true"` here to opt the whole
# platform into OpenTelemetry auto-instrumentation. Per-component
# `podAnnotations` override these; chart-internal annotations (config
# checksums) always win.
commonPodAnnotations: {}

# -- Kubelet probes for chart-managed pods (api-server, ui, keycloak,
# postgres, redis). Set
# `enabled: false` to drop all readiness/liveness/startup probes — escape
# hatch for clusters where the kubelet's probe behavior is causing churn
# (false-positive restarts, slow rollouts).
probes:
  enabled: true

# -- Istio ambient mesh settings. Istio is a hard prerequisite of
# this chart — `validate-istio.yaml` fails install if the mesh is missing.
# `mise run cluster:install` provisions Istio out-of-band (mirroring how
# cert-manager is treated). There is no `enabled: false` mode for a real
# deployment; an unauthenticated harness port is not a supported
# configuration. The one exception is the local-only `enforce` below.
istio:
  # SPIFFE trust domain. Default for an istioctl ambient install.
  trustDomain: cluster.local
  # Name of the waypoint Gateway that fronts the api-server's harness
  # Service. Istio's mesh-controller synthesises the waypoint Deployment
  # + Pod from the Gateway resource declared in apiserver/waypoint.yaml.
  waypointName: apiserver-waypoint
  # LOCAL-ONLY. `false` renders every AuthorizationPolicy but puts no
  # workload in the mesh, so nothing enforces them: no mTLS, and any pod can
  # call the harness and ext-authz ports as any agent. It exists for local
  # clusters whose kernel cannot run the ambient dataplane. The chart refuses
  # it unless the cluster carries the marker only `mise run cluster:install
  # -- --no-mesh` creates, which that task refuses to do under CI — so an
  # offline render (helm template, GitOps) and any real cluster fail.
  enforce: true

# -- How every agent runs: as a persistent microVM (smolvm), hosted by the
# **VM runner** — one pod per owner, created by the controller, that holds
# /dev/kvm and runs the platform's vm-runner agent plus smolvm. There is no
# other backend, so the install needs a runner: `runner.resources.limits.memory`,
# `runner.releaseHostPath` and (unless the Mac host runner is in use)
# `imageCache.hostPath` are required, and the chart refuses an install without
# them. A machine persists the agent's home,
# bind-mounted from its one storage disk by platform-init, which the runner
# runs as every machine's entrypoint; the rest of the guest is a root overlay
# whose upper layer is on that disk too, kept across stops until an image of
# another root generation boots, with /tmp, /var/tmp and /var/cache emptied on
# every boot. An Agent whose mounts ask to persist a path outside HOME is
# refused rather than silently losing it. The controller drives its machine API over TLS
# and a bearer token: the controller mints the token, and cert-manager issues
# the runner's certificate from the runners' own CA (`runnerCA` below), so
# virtualization needs cert-manager; the agent Service resolves to the
# machine's port on that pod, and the machine may reach nothing but its
# gateway. One runner per owner; per-user fair-use limits for machines are the
# upgrade path.
# The chart refuses values the controller cannot use. The controller then checks
# the install against the cluster at startup and every few minutes — a node
# advertising `runner.devices`, the runner ServiceAccount, the image budget, the
# memory limit against `reserveMiB`, egress that reaches the cluster's own
# ranges — logs what it finds, and names any problem on a vm agent whose
# runner is not ready.
# -- Environments: sandboxes an agent creates for others to open, one per pull
# request for example.
environments:
  # -- Domain under which each Environment endpoint gets an address of its
  # own, `<endpoint>-<environment>.<domain>`: one wildcard DNS name and one
  # wildcard certificate cover them all. Empty: Environments get no addresses.
  # Their URLs take `scheme` and `port` unless `urls.environments` sets them.
  domain: ""
  # -- Most Environments one agent may hold at once.
  maxPerAgent: 5
  # -- Furthest ahead an Environment's expiry may be set, in days.
  expiryMaxDays: 30
  # -- The one wildcard Ingress for `*.<domain>`, which sends every
  # Environment address to the api-server; visitors sign in on the share
  # host (`urls.share`), which hands each address a session of its own. Rendered only with a domain. On OpenShift it becomes a
  # wildcard Route, which the cluster must allow once:
  # `oc patch ingresscontroller/default -n openshift-ingress-operator --type=merge -p '{"spec":{"routeAdmission":{"wildcardPolicy":"WildcardsAllowed"}}}'`.
  ingress:
    # -- Annotations for the wildcard Ingress, e.g.
    # `cert-manager.io/cluster-issuer: <issuer>` to have cert-manager issue
    # the wildcard certificate into `tls.secretName`; a wildcard certificate
    # needs an issuer with a DNS-01 solver.
    annotations: {}
    # -- TLS for `*.<domain>`: one wildcard certificate, never one per
    # address. Empty `secretName` serves the addresses without TLS (the local
    # cluster).
    tls:
      secretName: ""

virtualization:
  # The shape of every runner pod the controller creates (one per owner).
  runner:
    # Published charts pin this by digest, which a rebuild that changes nothing
    # in the image keeps, so an upgrade that leaves the runner unchanged doesn't
    # roll the pod and stop every machine (unless this release declares a
    # reboot key the pod it reaches does not run, which rolls the pods to
    # reboot them; a pod whose own release declares no key takes it in
    # place). A digest wins over the tag.
    image:
      repository: quay.io/dam-agents/vm-runner
      tag: ""
      digest: "" # @ci-pin vm-runner-image-digest
      pullPolicy: IfNotPresent
    # KVM arrives as a device-plugin resource, which is the only way the
    # runner gets it — it is never a privileged pod. Empty = KubeVirt's
    # (`devices.kubevirt.io/kvm`, present on every node virt-handler runs on).
    # The chart ships no plugin of its own: a plugin is per node, so on nodes
    # several installs share it is the cluster's, run once. Any plugin
    # exposing /dev/kvm works, if the node's /dev/kvm is mode 0666: the
    # runner pod runs in a user namespace, where the device keeps its host
    # owner unmapped, so a 0660 root:kvm device does not open (systemd's own
    # default is 0666; Debian and Ubuntu lower it). E.g. squat's generic-device-plugin, as
    # `squat.ai/kvm`, which local dev applies from helm/extra/kvm-device-plugin.yaml;
    # a cluster with none cannot host vm agents, and the controller says so at
    # startup when no schedulable node matching `nodeSelector` advertises it.
    devices: {}
    # OpenShift: name of a *built-in* SCC to bind to the runner's
    # ServiceAccount — the SCC that admits a runner, since no SCC the chart
    # renders admits the hostPath of the node image cache and of the release
    # directory, which every runner mounts. Required whenever
    # `openshift.enabled` is on.
    # It must allow DAC_OVERRIDE, the one capability a runner adds (so its
    # VMMs read image files the image keeps from root), and it also admits
    # the node image cache, which sets its own SELinux type (see `imageCache`),
    # so it must have `seLinuxContext.type: RunAsAny`. Empty = no extra binding
    # rendered.
    scc: ""
    # One claim, two directories with two lifetimes: `disks/` holds the
    # machine disks — every vm agent's storage — and `machines/` the
    # per-machine bookkeeping a restarted runner rebuilds. The unpacked agent
    # images are on the node, in `imageCache` below. The claim outlives a pod
    # restart and a chart upgrade, but not its owner: the sweep removes a
    # runner once that owner has no vm agents left, and takes the claim with
    # it.
    # `storage` is each owner's storage pool, and the size of their claim; an
    # owner's UserBudget `storage` replaces it for that owner. Every machine
    # disk is sparse and may grow to the whole pool, so what counts is what
    # the owner's agents write: the runner asks its guests to shed
    # scratch at 75% and refuses new disks, starts and growth at 90%, and the
    # api-server refuses a new vm agent there. The claim also holds the
    # bookkeeping.
    # Raising the pool grows existing claims in place, which needs a class
    # that allows volume expansion; a refused resize costs a warning in the
    # controller log and leaves that runner at the size it has. Kubernetes
    # never shrinks a claim: lowering this changes no claim that exists.
    storage: 100Gi
    # The runner pod runs in a user namespace, so its claim needs a filesystem
    # that supports idmapped mounts (ext4, xfs, btrfs, e.g. on Ceph RBD);
    # CephFS and NFS do not, and a runner on one never starts.
    storageClass: ""
    # Placement: a node with KVM (e.g. KubeVirt's virt nodes and their
    # taints). `affinity` is a pod affinity, for what a selector cannot say,
    # e.g. keeping runners off GPU nodes whose large images fill the disk.
    # The node image cache and release stager DaemonSets follow all three.
    nodeSelector: {}
    tolerations: []
    # affinity: {}  # unset by default; an empty one would roll every runner
    # PriorityClass every runner pod runs under, and its value. The chart always
    # renders its own, cluster-scoped and named after the release (installs share
    # nodes); runners use the class named here instead when you set one that
    # already exists. The rendered class stays even then, because a runner
    # Deployment keeps the class it was rolled with until its pod rolls again. A
    # runner holds every machine of one owner, so that one pod going down costs
    # the owner every agent they have: a node under memory pressure takes the
    # pods with no class (0) before it. `preemptionPolicy: Never`
    # keeps it the other way round too — a runner never preempts anything to be
    # placed, so a full node waits for room rather than evicting a gateway or
    # the platform's own control plane. The chart gives that
    # control plane no class of its own, which leaves it below this value; an
    # install that wants it above gives it a class above this one.
    priorityClassName: ""
    priority: 1000
    # REQUIRED — the install fails without limits.memory. Machines are
    # processes of this pod, so that limit is also what the runner admits them
    # against (it refuses one that does not fit,
    # keeping `reserveMiB` for itself), and never past the memory the node has
    # allocated the pod: a start that the pod's request does not cover waits
    # for the resize below to be applied. It is the owner's whole memory pool,
    # unless their UserBudget sets `memory` (and `cpu`, which caps the CPU
    # limit below); the controller then resizes that owner's pod in place:
    # vm agents have no size of their own and do not count toward the user's
    # budget; every machine may grow to half of the limit less `reserveMiB`,
    # so one agent can use most of the pool while a runaway guest hits its
    # own OOM killer, which takes that machine and not the runner.
    # A running machine counts at what its
    # guest measurably uses plus `headroomMiB`, never above its size, so an
    # owner can run more machines than their sizes add up to; near the limit
    # the controller hibernates the owner's idle agents. `requests.memory` is
    # the floor: the controller keeps the running pod's memory request, in
    # place, at that count plus `reserveMiB`, up to the limit, so the
    # scheduler reserves what guests use, and at the floor alone while no
    # machine runs, since an idle runner holds a few MiB. Set it below the
    # limit for that to happen; with no request Kubernetes uses the limit and
    # nothing moves.
    # It needs in-place pod resize (the `pods/resize` subresource,
    # Kubernetes 1.33+); on an older cluster the request stays where it is
    # set, and the controller logs that once. A node with no room defers or
    # refuses the resize, which the controller reports too. The controller
    # also sets the running pod's CPU limit in place, to `machineCPUs` for
    # every machine that should run plus one more for the runner, so one
    # owner's runaway VMM cannot take the node. A pod is created at the
    # owner's whole CPU pool, which is the most that resize would ever give
    # it, so a runner the cluster cannot resize is still bounded. That pool
    # is a UserBudget `cpu` or a `limits.cpu` here; an install that sets
    # neither gets one derived from the memory pool it does set — every
    # machine that memory holds at `bootMiB`, plus one for the runner — and
    # only an install with no memory limit either renders none. A
    # `limits.cpu` here caps that limit: below the machines' vCPUs it
    # throttles every guest at once.
    resources: {}
    # Memory the runner keeps for itself rather than committing to machines.
    reserveMiB: 512
    # Memory each running machine is counted at beyond what it was last
    # measured using, for its guest to grow into before the controller acts.
    headroomMiB: 256
    # The warm-up floor: what a machine is counted at, at least, until the
    # runner has measured it and for two minutes after its boot began,
    # never above its size. The agent's harness starts only once the guest
    # answers and grows to 2 to 3 GiB within the next minute, so a machine
    # measured right after its boot holds little of what it will hold.
    # Counting a boot at its full size, half the pool, would let only two
    # machines boot at once; at the floor, pool / floor machines warm up
    # together, and a start refused for that is retried every 30 s. Each
    # machine also boots with this much RAM, or its size when that is less,
    # and is grown to its size once the guest is up: a boot costs time for
    # every GiB it starts with.
    bootMiB: 3072
    # vCPUs every machine gets. They are threads of the runner, so an idle
    # machine costs nothing; the runner's CPU limit covers these vCPUs for
    # every machine that should run (see `resources`).
    machineCPUs: 4
    # true = runners may give the node's virtualization extensions to the
    # machines whose Agent asks for them (spec.backend.vm.nestedVirtualization,
    # or controller.agent.templateDefaults.nestedVirtualization for all),
    # so that guest can run KVM itself — e.g. a vm agent that hosts its own
    # install. Every other machine boots without them. A runner
    # nests only where the node's KVM allows it, which is the kernel default
    # (kvm_intel and kvm_amd `nested=1`) and needs a module reload to change,
    # so this value is the install's switch. A nesting guest reaches the host
    # kernel's nested-virtualization code, which has had guest-to-host
    # escapes. Changing this value rolls every runner, which reboots its
    # owner's machines; an Agent changing its ask restarts only its own.
    nestedVirtualization: false
    # Machines are processes of their runner, so any change to the runner pod
    # — a controller release that renders the pod differently, or a runner
    # image the pod's loader cannot take in place — reboots every machine
    # that owner has. The controller rolls
    # such a change across owners rather than all at once: at most
    # `maxConcurrent` runners are mid-roll at a time, or, where
    # `maxConcurrentPercent` is set, that share of the runners the install
    # has (rounded up, at least one), which is what keeps a full roll of a
    # large install to hours rather than days. A runner stays
    # mid-roll until its new pod is ready and every machine that was ready
    # before the roll is ready again. `settleTimeout` bounds that wait, so a
    # machine that never comes back (its agent was stopped mid-roll) does not
    # stall everyone else's upgrade. A new owner's runner is created at once.
    # A pass visits each runner about once every five minutes while its
    # agents run, and on the controller's ten-minute sweep otherwise, so a
    # full roll takes roughly owners / the roll's width × (runner restart +
    # machine boot).
    # A runner whose owner has an agent in the middle of a turn does not take
    # a free place in the roll: it is offered again on the next pass, and
    # other owners roll meanwhile. `idleWait` bounds that wait; past it, the
    # runner rolls even with an agent busy. It outlasts a multi-hour kept job
    # and only stops an owner who is never idle from missing every release.
    # A new runner image is handed to each pod in place instead, and each
    # hand-off takes a place in the same width until the runner runs the
    # release and its machines answer again; a hand-off that fails, sees an
    # ensure refused, or outlasts `settleTimeout` halts the release. Time
    # spent waiting for the node's stager to stage the release does not
    # count. The controller's sweep follows that many hand-offs at once.
    # A hand-off leaves a running machine on the runtime it booted, so a
    # release whose fix only a machine that booted it has — a new libkrun,
    # guest kernel or platform-init — reaches running machines only by
    # rebooting them. Such a release declares a reboot key the pod before it
    # does not run (`packages/vm-runner/reboot-id`): a runner refuses it, its
    # pod rolls instead, and that roll does not wait for a busy agent, so the
    # fix reaches every machine within the roll rather than after `idleWait`.
    # The key covers what a machine booted alone: a release that changes only
    # the pod's runner or its loader keeps the key before it and is taken in
    # place. The loader travels in the release too, and the pod becomes it, so
    # only the release that first ships a loader able to do that declares a key
    # of its own, and that roll is what delivers it.
    # A pod built from a release that declares no key takes the release in
    # place, since there is nothing to compare it with.
    # A roll for a changed pod shape keeps its idle wait. A runner that
    # already holds the release as failed keeps its pod: a pod on the release
    # would fail the same way and take its machines with it.
    rollout:
      maxConcurrent: 1
      # Set instead of `maxConcurrent` to express the width as a percentage
      # of the install's runners; `maxConcurrent` is then ignored.
      maxConcurrentPercent: 0
      settleTimeout: 10m
      # A roll whose new pod never becomes ready is a broken release, and it
      # keeps its place so the release goes no further. `stalledTimeout`
      # bounds that hold while another runner is ready on the new pod: past
      # it the place is released and the next runner may roll, so one
      # owner's stall does not freeze every owner's upgrade. With no ready
      # runner on the new pod the hold has no bound. The stalled runner
      # keeps its `agent-platform.ai/runner-roll-stalled` mark and a Warning
      # Event.
      stalledTimeout: 30m
      idleWait: 24h
    # A directory on each node where a stager DaemonSet copies the runner
    # release this chart's runner image carries: the runner, the two guest
    # binaries it hands every machine, and the loader above it. Required with
    # runner pods. A runner pod keeps the image it was created with, and a
    # new runner image reaches
    # it without a restart: the controller names the release over the
    # runner's machine API, the pod's loader drains the old runner, starts
    # the new one from this directory, and the new runner adopts every
    # machine still running, so no machine reboots, unless the release
    # declares a reboot key the pod it reaches does not run, which rolls the
    # pods to reboot the machines, while a pod whose own release declares no
    # key takes it in place. A release that carries another loader makes the
    # pod's loader become it before it starts the release's runner, so a
    # release that changes only the loader reaches the pods in place; a
    # release's loader that cannot start leaves the pod on the loader and the
    # release it has, held as failed. A release built against another VM
    # runtime (a new smolvm, libkrun or crane) brings its runtime along: machines
    # already running keep the runtime they booted, and machines started after
    # the hand-off boot the new one. A release the pod's loader cannot load (a
    # newer base image's libc) rolls the pods through `rollout` too, as does
    # a release declaring another reboot key than its pod's release.
    # The stager is the only writer; runners mount it read-only. Each
    # install stages into its own subdirectory, named after
    # `agentNamespace`, because every stager keeps only the newest few
    # releases in its directory. On OpenShift it needs `scc`, as the node
    # image cache does: the stager labels the directory for
    # containers, as spc_t, so the confined runners can read it.
    releaseHostPath: /var/lib/platform-vm-runner-releases
    # How smolvm checks every VMM's syscalls, from after its device setup,
    # against the allowlist a running microVM needs. `audit` logs a call
    # outside it as a kernel audit record (`type=1326`, in the node's audit
    # log or kernel log, never the pod's) and lets it through; `enforce`
    # kills the VMM on such a call, which stops its machine; `off` installs no
    # filter. The pod's own seccomp profile bounds every VMM in each mode.
    # Changing this value rolls every runner, which reboots its owner's
    # machines.
    seccomp: enforce
    # Local dev on macOS only. Set, the controller creates no runner pods:
    # every vm machine, whatever its owner, runs on one vm-runner process on
    # the host, which uses the host's own hypervisor instead of one nested in
    # the cluster's VM. This is the address pods reach that host at (lima:
    # 192.168.5.2). The chart renders that runner's token Secret and serving
    # certificate; `mise run cluster:install` starts it. There is no per-owner
    # boundary: one owner's escaped guest reaches every owner's machines.
    hostAddress: ""
  # One gateway pod per owner serves every vm Agent of that owner, each on
  # ports of its own behind the agent's own gateway Service, so a wake starts
  # no gateway pod. Off: each vm Agent keeps a gateway pod of its own, which
  # hibernation scales to zero.
  gateway:
    perOwner: false
  # The CA the controller trusts a runner's serving certificate by. It is the
  # runners' own and signs nothing else: the envoyMitm CA signs gateway leaves
  # for hostnames taken from users' credential hosts, so a leaf naming a
  # runner's Service host would let its key pass for that runner to the
  # controller. Rendered as cluster issuers, like the envoyMitm pair, so the
  # CA key sits in cert-manager's namespace and not the agent namespace.
  # Cluster-scoped names collide globally; override them if needed.
  runnerCA:
    bootstrapIssuerName: platform-vm-runner-bootstrap
    issuerName: platform-vm-runner-ca-issuer
    # Must equal cert-manager's --cluster-resource-namespace flag (default
    # `cert-manager`).
    secretNamespace: cert-manager
    secretName: platform-vm-runner-ca
    duration: 87600h # 10y
    renewBefore: 720h # 30d
  # A directory on each node that every runner scheduled there shares, and
  # the only place a runner gets an image from. REQUIRED. A machine may reach
  # only its gateway, so the guest cannot pull its own image; it is fetched and
  # unpacked here once, and the next owner on that node boots the same tree
  # without touching the registry. It is this install's own directory under the
  # one etc/openshift-node-config has the nodes create and label, named
  # `<release namespace>/<release name>`, so the installs sharing a node never
  # take each other's.
  # An install with no registry (local dev) stages
  # pre-flattened trees here too, named after the image reference
  # (`mise run image:stage-vm`), which the runners boot before they ask the
  # service.
  #
  # A host directory rather than a ReadWriteMany claim: RWX is the expensive
  # class to ask an install for, and it buys cluster-wide dedup where per-node
  # is enough. On OpenShift it needs `runner.scc`, since the chart's own agent
  # SCC refuses hostPath — and that SCC must have `seLinuxContext.type:
  # RunAsAny`: SELinux confines every container to `container_t`, which may
  # neither write nor read the directory the kubelet creates for a hostPath
  # (it carries the host's `var_lib_t`), so when `openshift.enabled`
  # is on the cache pod runs as `spc_t` at level `s0` and labels the directory
  # `container_file_t` as it starts. Every tree it unpacks inherits that label,
  # which is what lets the runners, still confined, boot from it. Under a
  # `MustRunAs` SCC admission refuses the cache pod; without the label it
  # exits on start with the operation it was refused.
  #
  # The image cache service is a DaemonSet in `agentNamespace`, on the
  # runners' nodeSelector and tolerations, that is the ONLY writer of this
  # directory. Runners mount it read-only and ask the
  # service, over a Unix socket inside it, for each image a machine boots; the
  # service resolves the tag, fetches and unpacks it with the pull credentials
  # the runner forwards for that machine, and evicts. So a guest that escapes
  # into its runner cannot rewrite a tree another owner's machine boots. It is
  # in the boot path: with it down, a runner boots only the trees its own
  # machines already hold and refuses any other image as unavailable.
  #
  # Runners hold the trees their machines boot by naming them to the service
  # every minute; eviction never takes a held tree. An entry fetched with
  # credentials that an anonymous read cannot reach is served only to a runner
  # whose forwarded credentials read the image's manifest in a repository the
  # entry was fetched from, so naming a digest, under any registry, is not
  # enough to borrow another owner's private image. The service keeps what is
  # public in memory, so after it restarts each such entry is checked against
  # the registry again. The service runs with every capability dropped but
  # the four an unpack needs — CHOWN, FOWNER, FSETID and DAC_OVERRIDE — so an
  # SCC named in `runner.scc` must admit FSETID too.
  #
  # `budget` is what the cached images may occupy, evicting least-recently-
  # written first so a tag per deploy does not fill the disk. It is a byte
  # count and it is required: a node's filesystem is shared with everything
  # else the node runs, so a share of it would let the images eat space that
  # is not theirs. Keep it well under the disk it sits on. A fetch never
  # unpacks more than its image is taken to need, and the directory is closed
  # to every host uid but root.
  #
  # The service also preloads every enabled `harnessTemplates` image at
  # deploy time and every `preloadInterval` after, and pins them against
  # eviction, so the first machine on a node after a deploy does not wait out
  # the fetch. It preloads with `controller.agent.base.imagePullSecrets`,
  # mounted into it as a volume, so a private harness image is preloaded when
  # the install default can read it; one only a per-template Secret reads is
  # fetched when a machine first needs it. Size `budget` to hold the preloaded
  # set with room to spare: pins are never evicted, so a budget below their
  # total leaves the cache permanently over it and saying so in its log.
  imageCache:
    # The root the node image caches live under: on every node a runner runs
    # on, the chart keeps this install's cache in its own subdirectory of it,
    # `<release namespace>/<release name>` — the pair the cluster already keeps
    # unique. Nodes are shared, and an install given another install's cache
    # directory is a second writer of it: the two take turns unlinking each
    # other's socket and serving each other's trees. So the value is a root and
    # never the directory itself, it is absolute, and it stays outside
    # `runner.releaseHostPath`'s per-install subdirectory, which the release
    # stager prunes.
    hostPath: ""
    # The directory a previous release served, kept alive while the runners
    # that release gave their mounts are still rolling out: the rollout waits
    # out a busy owner's turn (`runner.rollout.idleWait`, a day by default), and
    # until it reaches a runner, that runner dials the socket in the old
    # directory. Setting this runs a second cache service over that directory,
    # which preloads nothing; remove it once every runner has rolled. It has to
    # be the whole host directory the previous release served, and to hold this
    # install's new cache directory neither directly nor from above — so the
    # new root is normally a sibling of it, not the same one.
    legacyPath: ""
    budget: 20Gi
    preloadInterval: 5m
    # How the service resolves the registries it fetches from. `ClusterFirst`
    # puts every lookup through the cluster DNS pods, which its egress policy
    # admits by construction. `Default` leaves it to the node's own resolver:
    # that resolver's address then has to be one the policy admits, and it
    # admits the public internet only — a node-local resolver (a link-local
    # stub, say) needs its address in `egressCidrs`.
    dnsPolicy: ClusterFirst
    # In-cluster registries the service may also reach, for a registry that is
    # a Service here or a mirror of one — OpenShift's internal registry, for
    # example. Policy is applied after a Service's address is translated to a
    # pod, and that pod's address lies in a range the service's egress policy
    # closes, so the pods are named and not the Service. `podLabels` is
    # required: an empty one would admit every pod in the namespace, and its
    # keys and values have to be labels the API server takes.
    peers: []
    # Ranges the service may also reach OUTSIDE the cluster, for a registry on
    # a private address that no pod selector can name — a mirror on the
    # enterprise network, say. An in-cluster registry is a `peers` entry: the
    # policy applies after a Service's address becomes a pod address, which no
    # range follows. The service already reaches the public internet minus
    # every range this cluster owns (private, loopback, link-local, CGNAT and
    # this-network, which hold the platform's own datastores, the node and the
    # cloud metadata endpoints); inside a range named here those endpoints
    # lose that protection, so name the narrowest range that holds the mirror.
    # Each entry is an address/prefix, never `/0`.
    egressCidrs: []
    # Unpacking is I/O rather than CPU, and the tree is streamed rather than
    # held, so this is small on purpose. Leave the CPU limit unset: a
    # throttled unpack is a slow first boot. The ephemeral-storage request is
    # for eviction, not scheduling: the tree goes to the host directory rather
    # than to the pod, so the pod holds about a megabyte and its logs a few
    # tens, and kubelet evicts the pods over their requests first, where a pod
    # with no request is over one at any use. Keep it above what the logs
    # reach and no larger: the pod reserves it on every node, and the
    # scheduler preempts a runner to place the cache when the node has nothing
    # to spare. No ephemeral-storage limit beside it: a limit caps what the
    # pod already never uses, and a pod over its limit is evicted first.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
        ephemeral-storage: 128Mi
      limits:
        memory: 1Gi

# -- Target namespace for agent workloads (agents, templates, runs)
agentNamespace: platform-agents

# -- Whether to create the agent namespace (disable if it already exists or is managed externally)
createAgentNamespace: true

# -- OpenShift-specific knobs. No-op on vanilla Kubernetes.
openshift:
  # true = this cluster is OpenShift. The chart renders no SCC of its own, so
  # this tells the chart to require the built-in SCCs `virtualization.runner.scc`
  # and `virtualization.imageCache.scc` name (both mount hostPaths no
  # restrictive SCC admits) and to run the node image cache as spc_t, so it can
  # label the directory it serves.
  enabled: false

# -- Shared local PostgreSQL instance
# Set enabled: false when using external/cloud DBs for all services.
postgres:
  enabled: true
  # -- Extra annotations for the StatefulSet object / its pod template
  # (merged over commonAnnotations / commonPodAnnotations).
  annotations: {}
  podAnnotations: {}
  image: registry.access.redhat.com/hi/postgresql:18

  # -- Four Postgres login roles: one per service, the controller's, plus a
  # dedicated SUPERUSER for DBA work. The app roles are NOSUPERUSER and own only
  # their own database, so a leaked app credential is bounded to one service's
  # data; the controller's owns nothing and is granted what it reconciles.
  # A group role beside them, `usage_readers`, is a credential-less NOLOGIN
  # group: it holds SELECT on the usage_src_* source passthrough views and
  # grants nobody anything until an operator adds a member. The api-server
  # reconciles those grants after every migration run, naming this role, so
  # the name is fixed rather than configurable.
  # The admin role has `ALTER ROLE … SET log_statement = 'all'` attached so
  # DBA sessions are statement-logged by default. Passwords are
  # auto-generated on first install if left null.
  #
  # `adminUser` is the cluster's bootstrap superuser (Postgres `POSTGRES_USER`
  # at init). It defaults to `platform` — the name an existing single-role
  # cluster already bootstrapped with — so an upgrade reuses that superuser
  # in place rather than renaming it (Postgres forbids renaming the role you
  # are connected as, and the bootstrap superuser cannot be demoted anyway).
  #
  # The role/database layout is applied by the idempotent SQL in
  # `postgres.yaml` (ConfigMap key `01-roles.sql`), run both on first PGDATA
  # init and by the post-install/post-upgrade migration Job
  # (`postgres-migrate-roles.yaml`); the latter converges an existing
  # single-superuser cluster with no manual SQL.
  apiserverUser: platform_apiserver
  apiserverPassword: null
  keycloakUser: platform_keycloak
  keycloakPassword: null
  # The controller's own login: NOSUPERUSER, and holding only the privileges
  # the api-server grants it on the `control` schema — the status observations
  # it writes and a column list of the definitions it reads. It owns no
  # database and can reach no other schema. Named here because the api-server
  # reconciles its grants after every migration run, so the name is fixed.
  controllerUser: platform_controller
  controllerPassword: null
  adminUser: platform
  adminPassword: null

  storage: 5Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Timing of the `pg_isready` health checks (gated by top-level
  # `probes.enabled`). A Postgres that is only slow under load — a rollout
  # of the api-server opening its pool, say — must not be killed for it:
  # a restart turns a short slowdown into a longer outage, and Keycloak
  # loses its database with it. So liveness gives each check 10s and kills
  # only after 6 misses in a row (90s at the 15s period); readiness takes
  # the pod out of the Service sooner, which is safe to do. The check
  # command itself is fixed: it targets the `postgres` database so it does
  # not log a FATAL error on every run.
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 10

  # -- Event logging. Authentication events (connect, disconnect, failed
  # auth) and admin events (DDL — CREATE/ALTER/DROP, GRANT/REVOKE, ROLE
  # changes) are surfaced on the pod's stderr so the external log
  # collector picks them up. The image's default logging-collector +
  # file output is disabled in favor of plain stderr (kubectl logs).
  # These are passed to the server as `-c` flags (see postgres.yaml)
  # because the image's postgresql.conf has no drop-in include dir.
  #
  # JSON-format logs aren't used: PG's `jsonlog` destination requires
  # the file-based logging_collector, which writes to files instead of
  # stderr. Plain text with a structured prefix is the canonical
  # Postgres-in-K8s pattern; the external log shipper parses the
  # prefix.
  log:
    # -- Prefix on every log line. Default is a key=value-ish layout:
    # timestamp, pid, user@db (only on backend processes via %q), client
    # host, application_name.
    linePrefix: "%m [%p] %q%u@%d from %h app=%a "

    # -- Authentication events (PG 18 enum). Comma-separated subset of:
    # receipt, authentication, authorization, setup_durations. Failed
    # auth is always logged regardless of this setting.
    connections: "authentication,authorization"

    # -- Log session-close events (with session duration).
    disconnections: "on"

    # -- Admin-statement audit. `ddl` covers CREATE / ALTER / DROP
    # including roles and grants. Set to `all` for full query log
    # (very noisy), `mod` to also catch INSERT/UPDATE/DELETE.
    statement: "ddl"

# -- Shared Redis instance.
# Used as the cross-replica pub/sub primitive — first consumer is HITL ext_authz
# wake-ups. Persistence uses AOF with `everysec`; the
# platform tolerates losing recent ephemeral data on restart (Postgres remains
# the source of truth for anything durable).
redis:
  enabled: true
  # -- Use an external Redis instead of the bundled single-replica one:
  # set `enabled: false` and point this at it (redis://host:port). Auth, if
  # any, goes in the URL — the bundled auth Secret is not created when
  # disabled. Required when disabling: the api-server refuses to boot
  # without a Redis.
  externalUrl: ""
  # -- Extra annotations for the StatefulSet object / its pod template
  # (merged over commonAnnotations / commonPodAnnotations).
  annotations: {}
  podAnnotations: {}
  image: registry.access.redhat.com/hi/valkey:9.0
  port: 6379
  storage: 1Gi
  storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -- Shared SeaweedFS object store (Apache-2.0), single node. Holds
# artifact-library content; agents upload and browsers download
# directly, using short-lived links the api-server mints after ownership
# checks. Disable to use an external store (`apiServer.objectStorage`) or
# none at all (artifact uploads are then unavailable).
seaweedfs:
  enabled: true
  # -- Extra annotations for the StatefulSet object / its pod template
  # (merged over commonAnnotations / commonPodAnnotations).
  annotations: {}
  podAnnotations: {}
  image: mirror.gcr.io/chrislusf/seaweedfs:4.48
  # -- S3 identity of the api-server. Secret key auto-generated on first
  # install if null, persisted across upgrades in a Secret.
  accessKeyId: platform
  secretAccessKey: null
  storage: 10Gi
  storageClass: ""
  # Measured at 283Mi idle on a store holding little content, so the old 128Mi
  # request under-accounted it by more than half and left it high on the
  # kubelet's eviction order. The footprint grows with what the library holds.
  resources:
    requests:
      cpu: 50m
      memory: 320Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Alert rules for operators on the users' VM pools and on what the cluster
# holds for them. Needs clickstack.enabled: the platform collector exports the
# pool series in Prometheus form on port 9464, and a ServiceMonitor and a
# PrometheusRule render when the cluster serves monitoring.coreos.com/v1
# (prometheus-operator, OpenShift user-workload monitoring); without that API
# nothing renders. No series names a user; the alerts point at the Warning
# Events on the user's vm Agents for that.
monitoring:
  enabled: false
  # Extra labels on the ServiceMonitor and PrometheusRule, for a Prometheus
  # whose rule or monitor selector needs them.
  labels: {}
  thresholds:
    # Share of a user's pool (memory committed, claim used).
    warning: 0.75
    critical: 0.9
    # Share of scheduler periods the runner's CPU limit throttled.
    throttled: 0.2
    # The users' pools against what the nodes (memory) or the storage driver
    # (storage) hold.
    overcommit: 1.5

# -- Agent-telemetry backend (ClickStack). Off by default. Requires the ClickHouse and MongoDB
# operator charts installed out-of-band first (the cluster:install task). See docs/architecture/observability.md.
# Keys other than `enabled`/`collector` are forwarded to the clickstack subchart.
clickstack:
  enabled: false

  # Our own OTLP collector (replaces the subchart's OpAMP/token-gated one): static config,
  # no auth, gated by the AuthorizationPolicy in templates/clickstack/.
  collector:
    annotations: {}
    podAnnotations: {}
    # Mirror of otel/opentelemetry-collector-contrib. Registered in
    # .mise/tasks/image/mirror, which CI runs on every main push.
    image: quay.io/dam-agents/opentelemetry-collector-contrib:0.162.0
    # Retention for the otel_* tables, matching the ClickStack bundled collector's
    # default. Only applied when the exporter creates the tables — changing it later
    # requires ALTER TABLE ... MODIFY TTL by hand.
    ttl: 720h
    # The memory_limiter processor refuses OTLP ingest above its soft limit,
    # which upstream defines as limit_percentage minus spike_limit_percentage
    # of this limit — 55% with the values in templates/clickstack/collector.yaml.
    # At 512Mi that put refusal at 281Mi with the collector idling at 387Mi,
    # which is how it accumulated 99 SIGKILLs. At 1Gi the soft limit is 563Mi.
    resources:
      requests:
        cpu: 100m
        memory: 448Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # --- forwarded to the clickstack subchart ---
  # Third-party images pinned to the quay.io/dam-agents mirror. Their upstreams
  # are registered in .mise/tasks/image/mirror, which CI runs on every main push
  # — bump a tag here and add the matching line there.
  # Production must override clickstack.hyperdx.secrets.* (placeholders by default).

  otel-collector:
    enabled: false # we run our own collector (above)

  hyperdx:
    deployment:
      image:
        repository: quay.io/dam-agents/hyperdx
        # 2.41.0 is under the 7-day age floor until 2026-10-20; taken early
        # because it fixes the next (GHSA-vcvr-r3jv-pc5j), handlebars, shell-quote
        # and proxy-addr criticals of 2.40.0. Drop this comment after that date.
        tag: "2.41.0"
      waitForMongodb:
        image: "quay.io/dam-agents/busybox:1.38.0"

  clickhouse:
    # Without an explicit image the operator injects its built-in default
    # (docker.io/clickhouse/clickhouse-keeper:latest) — pin to the mirror and
    # match the server tag. Merges over the subchart's keeper.spec defaults.
    keeper:
      spec:
        containerTemplate:
          image:
            repository: quay.io/dam-agents/clickhouse-keeper
            tag: "26.8-alpine"
    cluster:
      spec:
        containerTemplate:
          image:
            repository: quay.io/dam-agents/clickhouse-server
            tag: "26.8-alpine"
        dataVolumeClaimSpec:
          resources:
            requests:
              storage: 20Gi

# -- Keycloak (OIDC identity provider)
keycloak:
  enabled: true
  # -- Extra annotations for the Deployment object / its pod template
  # (merged over commonAnnotations / commonPodAnnotations).
  annotations: {}
  podAnnotations: {}
  # The Keycloak image is a first-party build that bakes the
  # Keycloakify theme JAR on top of upstream Keycloak. The upstream
  # version is pinned in the keycloak-theme package's `oci` task.
  # In published charts CI replaces the empty tag with the image's content
  # tag (the commit that last touched its inputs — see build.yml `publish`),
  # so a release that doesn't change the image doesn't roll the pod.
  # Empty falls back to .Chart.AppVersion.
  image:
    repository: quay.io/dam-agents/keycloak
    tag: "" # @ci-pin keycloak-image-tag
    pullPolicy: IfNotPresent
  configCliImage: quay.io/adorsys/keycloak-config-cli:latest-26.5.5
  port: 8080

  # -- Additional Keycloak server features. The chart always enables a required
  # base — `token-exchange` (the API server depends on it) and
  # `admin-fine-grained-authz:v1` — and appends these to it, rendered into the
  # single `--features=` arg (a second `--features` would override, not merge).
  # List only extras here, e.g. `opentelemetry-logs` to enable OTLP log export.
  # The image is pre-built for the base alone, so with any extra Keycloak
  # re-runs its build at every start, which takes about 25 seconds.
  extraFeatures: []

  # -- Admin credentials (for Keycloak admin console)
  admin:
    user: admin
    # password is auto-generated if not set
    password: null

  # -- Realm and OIDC client configuration
  realm: platform
  clientId: platform-ui
  apiAudience: platform-api
  # -- Realm role required to access the API. Users without this role get 403.
  # Leave empty to allow all authenticated users.
  requiredRole: ""
  # -- Realm role granting read access to the inspector endpoints
  # (`GET /api/usage`, `GET /api/usage/report`). The chart auto-creates this role
  # plus an `inspectors` group mapped to it; grant access by adding users to
  # the group via the Keycloak admin UI. For bulk assignment use `kcadm.sh`
  # or the Keycloak admin REST API; for SSO-federated installs, map your
  # upstream group to the `inspectors` group. Set to empty string to disable
  # usage-data access entirely (the endpoint will not be mounted).
  inspectorRole: "platform-inspector"
  # -- Realm role required to connect a Slack workspace. Connecting a
  # workspace is install-wide, not per-Agent, so it is an operator action
  # rather than something any user may start. The chart auto-creates this role
  # plus a `slack-installers` group mapped to it; grant access by adding users
  # to the group via the Keycloak admin UI. Holders also see the Slack
  # workspaces tab in Settings — it is hidden from everyone else. Leave empty
  # to disable the install surface entirely (neither route is mounted);
  # workspaces already connected keep working either way.
  slackInstallerRole: "platform-slack-installer"
  # -- Realm role of the platform operators: the people who run this install
  # for all its users, for example by setting each user's spend ceiling. Only
  # an interactive sign-in counts; an API key never acts as an operator. The chart auto-creates this role plus an `operators` group mapped
  # to it; grant it by adding users to the group via the Keycloak admin UI, or
  # map your upstream SSO group to the `operators` group. Leave empty for an
  # install with no operators: every operator action is then refused.
  operatorRole: "platform-operator"
  # -- Confidential client for API server
  apiClientId: platform-api
  apiClientSecret: ""
  # -- Public client for the dam CLI (Device Authorization Grant, RFC 8628).
  # Surfaced to the CLI via `/api/auth/config` as `cliClientId`.
  cliClientId: platform-cli
  # -- Public client for the artifact share host's viewer sign-in
  # (authorization code + PKCE). Its only redirect is
  # `{urls.share}/auth/callback`; post-logout returns to
  # `{urls.share}/auth/login`. No api audience mapper: its tokens are
  # rejected by the api-server on purpose.
  shareClientId: platform-share

  # -- Additional redirect URIs and web origins to register on the public
  # `clientId` client. The chart always allows `{urls.ui}/*` and the Vite
  # dev port; use these to register extra dev hosts (e.g. `127.0.0.1:4444`,
  # tunnel URLs) without editing the realm template. Each entry is passed
  # through verbatim — wildcards (`/*`) are supported by Keycloak.
  extraRedirectUris: []
  extraWebOrigins: []

  # -- Login page presentation. With `allowPassword: false` the page shows
  # only the identity-provider CTA(s) — for deployments (e.g. w3id, IBMid) where
  # SSO is the expected sign-in path; it falls back to the password form
  # when no identity provider is configured on the realm. The default keeps
  # the username/password form, with any identity-provider buttons offered
  # below it.
  login:
    allowPassword: true

  # -- Event logging. Login + admin events are emitted to stdout via the
  # built-in `jboss-logging` event listener so they ride the cluster log
  # pipeline to whatever external log service is collecting pod logs.
  #
  # Login events are NOT persisted to the Keycloak DB (eventsEnabled: false
  # in the realm import) — pod logs are the source of truth. Admin-event
  # metadata IS persisted (low volume), but request-body detail is NOT
  # (adminEventsDetailsEnabled: false in the realm import): those bodies can
  # carry plaintext credentials on user-create/update and Keycloak keeps
  # them indefinitely (no built-in expiration), while the log pipeline is
  # the audit source of truth regardless. Set `adminEventsEnabled: false`
  # in the realm import to stop admin events firing on the listener too.
  #
  # The listener emits successes at `debug` and errors at `warn` by
  # default. We raise success-level to `info` so successful logins appear
  # under the default root log level without touching log categories.
  # See https://www.keycloak.org/server/all-provider-config (search for
  # `spi-events-listener-jboss-logging`).
  events:
    # -- Log level for successful auth / admin events.
    successLevel: "info"
    # -- Log level for error events (LOGIN_ERROR, etc.).
    errorLevel: "warn"

  # -- Keycloak logging output.
  log:
    # -- Console output format. Only `default` and `json` are valid;
    # Keycloak rejects any other value at startup. `default` is
    # human-readable plain text; `json` is structured one-record-per-line,
    # friendlier for external log aggregators (Loki / ELK / Datadog).
    # Local dev overrides this to `default` in `values-local.yaml` for
    # readable `kubectl logs`.
    consoleOutput: "json"

  # -- Extra environment variables appended verbatim to the Keycloak container.
  # The chart does not model Keycloak's still-evolving OpenTelemetry options, so
  # wire observability here. All signals push over OTLP to a collector — traces,
  # metrics, and logs share one endpoint and one auth header:
  #   extraEnv:
  #     - name: KC_TRACING_ENABLED
  #       value: "true"
  #     - name: KC_TRACING_ENDPOINT
  #       value: "http://otel-collector:4317"
  #     - name: KC_TELEMETRY_HEADER_AUTHORIZATION  # token from a Secret, never inline
  #       valueFrom:
  #         secretKeyRef: { name: otel-creds, key: authorization }
  # Each entry is a raw corev1.EnvVar (name/value or name/valueFrom). Appended
  # after the chart's own env, so an entry reusing a built-in KC_ name overrides
  # it (Kubernetes env is last-wins).
  extraEnv: []

  # -- Test user bootstrapped via realm import.
  # DISABLED by default — production deployments must not ship a known credential.
  # Local dev and e2e tests (via values-local.yaml) enable it.
  testUser:
    enabled: false
    username: null
    password: null

  # -- More test users bootstrapped via realm import, for QA installs that need
  # more than one account. Empty by default — the same rule as `testUser`.
  # Each entry: `username`, `password`, optional `firstName`/`lastName`, and
  # `groups` — any of `inspectors`, `slack-installers`, `operators` (ignored
  # when that role is disabled). The email is `<username>@platform.local`; `requiredRole`,
  # when set, is granted as for `testUser`.
  extraTestUsers: []

  # -- Database connection (empty host = use shared local postgres)
  db:
    host: ""
    port: 5432
    user: platform_keycloak
    password: null
    database: keycloak
    # Postgres TLS mode for an external DB: require | verify-ca | verify-full.
    # null = no TLS (the in-cluster postgres). verify-ca/verify-full need caCert.
    sslmode: null
    # CA certificate (PEM) used to verify the external DB's TLS certificate.
    # Required for sslmode verify-ca/verify-full when the DB presents a private CA.
    caCert: ""

  # Idles at 623Mi, above the old 512Mi request, which put it high on the
  # kubelet's eviction order. No explicit heap size is set, so the JVM sizes
  # its heap as a percentage of the limit and non-heap has to fit in what is
  # left — at a 1Gi limit a filled heap leaves too little for metaspace,
  # threads and code cache.
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi

# -- Ingress (hostnames derived from `domain` and `urls` values above)
#
# Set `enabled: false` to skip rendering the bundled Ingress entirely — useful
# when you're routing traffic via an external Ingress controller, Gateway API,
# service mesh, or LoadBalancer that you manage outside the chart. In that
# mode you should populate the `urls:` block above so the chart's internal
# config (Keycloak issuer, OAuth redirect URIs, NEXTAUTH_URL, KC_HOSTNAME,
# API server browser-facing URLs) matches the hostnames your external router
# actually serves.
#
# When `enabled: true`, the Ingress generates one rule per service:
#   - If a `urls.{service}` override is set, the override hostname is routed.
#   - Otherwise `{prefix}.{domain}` (and any `aliasDomains`) are routed.
ingress:
  enabled: true
  className: ""
  annotations: {}
  # -- Extra alias domains that mirror convention-based subdomain routes
  # (hostname only, no port). Ignored for any service with an explicit
  # `urls.{service}` override.
  aliasDomains: ["localtest.me"]
  # -- When true, adds a host-less Ingress rule for the app (UI + `/api/*`)
  # that matches *any* Host header — including IP literals (`127.0.0.1`)
  # which the K8s Ingress validator otherwise rejects in `host:` fields.
  # Useful for local dev where you want to reach the cluster by IP or by
  # an unplanned alias. Off by default — convention-based hostnames cover
  # production, and a catch-all weakens host-based isolation.
  catchAllAppHost: false
  # -- TLS rules passed through verbatim to `Ingress.spec.tls`. The chart does
  # NOT auto-derive `hosts` from rules — when you set any `urls.{service}`
  # override, you must also list those hostnames here (or reference them via
  # cert-manager annotations on the Ingress) so the certificate covers what
  # the Ingress actually serves. Mismatches will not be caught at lint time.
  tls: []
  # For production with TLS (convention-based hostnames):
  #   aliasDomains: []
  #   tls:
  #     - secretName: platform-tls
  #       hosts: ["example.com", "keycloak.example.com", "share.example.com", "content.example.com"]
  #
  # For production with TLS + URL overrides — list the override hostnames:
  #   aliasDomains: []
  #   tls:
  #     - secretName: platform-tls
  #       hosts: ["app.example.com", "api.example.com", "auth.example.com", "share.example.com", "content.example.com"]

# -- UI (nginx serving static SPA, reverse-proxies /api to API server)
ui:
  # -- Extra annotations for the Deployment object / its pod template
  # (merged over commonAnnotations / commonPodAnnotations).
  annotations: {}
  podAnnotations: {}
  image:
    repository: quay.io/dam-agents/ui
    tag: "" # defaults to appVersion
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -- API Server
apiServer:
  # -- CurveBender offered to every user of this install, called with the
  # deployment's key instead of one each user enters. An empty key offers no
  # shared CurveBender: the provider exists only where a key does, and every
  # user otherwise connects their own. Name an existing Secret in the release
  # namespace in `apiKeySecret`, or set `apiKey` from a secret values layer,
  # which lands in the chart's credentials Secret. The api-server reads the key
  # at start, so after rotating it in an existing Secret restart the api-server;
  # it then rewrites the copy each user's Connection holds. Calls are metered
  # per user like any other provider. The gateway injects it on four path
  # prefixes alone -- /v1/models, /v1/messages, /v1/chat/completions and
  # /v1/responses, each at a segment boundary -- so the proxy's management and
  # shared-state routes are outside its scope, but that scope is no proof the
  # key is limited: mint it for inference only, with LiteLLM
  # `allowed_routes: ["llm_api_routes"]`.
  curveBenderDeployment:
    apiKeySecret:
      name: ""
      key: api-key
    apiKey: ""
  # -- Extra annotations for the Deployment object / its pod template
  # (merged over commonAnnotations / commonPodAnnotations).
  annotations: {}
  podAnnotations: {}
  image:
    repository: quay.io/dam-agents/api-server
    tag: ""
    pullPolicy: IfNotPresent
  port: 4000
  harnessServerPort: 4001
  # -- api-server replica count. Cross-replica coordination runs through
  # Redis/Postgres: periodic jobs, session presence, OAuth handoff state and
  # refresh backoff, terminal supersede, and a Redis lease that elects the one
  # replica running the Slack/Telegram channel workers (their transports admit
  # a single consumer per install; other replicas marshal outbound channel
  # calls to the holder). The per-agent MCP endpoint is stateless, so any
  # replica serves any harness call.
  replicas: 1
  # -- Minimum severity emitted by the structured logger
  # (`error`|`warn`|`info`|`debug`). The security audit trail is logged at
  # common levels (denials → warn, allowed/successful actions → info), so the
  # default `info` keeps the full trail on; raise to `warn` to keep only
  # denials/failures, or `error` to silence the trail. There is no separate
  # audit on/off switch — visibility is governed here as usual.
  logLevel: info
  # -- ext_authz gRPC listener for the Envoy sidecar's HITL gate.
  # Single endpoint: Envoy's HTTP filter (L7,
  # TLS-terminated chains) and network filter (L4, catch-all chain) both
  # call this port; the handler reads whichever attributes are populated.
  # Cluster-internal only; never routed via ingress.
  extAuthzPort: 4002
  # -- Legacy: the bot token (xoxb-...) of the app's own workspace, from installs
  # set up before workspaces connected through the install flow. Never served:
  # at boot it is imported into that workspace's K8s Secret and the channel
  # bindings made back then are moved onto that workspace. Remove it once it
  # has been imported; leave empty on a new install.
  slackBotToken: ""
  # -- Slack app-level token (xapp-...) for Socket Mode. Setting it enables
  # Slack; every workspace, the app's own included, then connects through the
  # install flow and keeps its bot token in a K8s Secret.
  slackAppToken: ""
  # -- Slack app credentials (Basic Information -> App Credentials). The install
  # flow signs its exchange with them, and token rotation its refreshes, so
  # Slack needs them to connect any workspace. The app must have
  # `<urls.ui>/api/slack/install/callback` registered as a redirect URL, and
  # public distribution activated to connect workspaces other than its own.
  # That URL is only ever fetched by the installing admin's browser, so it does
  # not need to be reachable from the internet.
  slackClientId: ""
  slackClientSecret: ""
  # -- Set once token rotation is turned on in the Slack app (OAuth &
  # Permissions; it needs a redirect URL registered, and cannot be turned off
  # again). Rotation is one switch on the app, but each workspace's existing
  # token keeps not expiring until exchanged, so on boot the api-server
  # exchanges every one of them for a rotating pair in its K8s Secret. Needs
  # `slackClientId` and `slackClientSecret`. Refreshing rotating tokens does not
  # depend on this flag, so setting it back to false changes nothing for tokens
  # already exchanged.
  slackTokenRotation: false
  # -- Slack enterprise (organization) id that a connecting workspace must
  # belong to, read from Slack's own install response. Empty means any
  # workspace an operator invites may connect, which is what a standalone
  # (non-Enterprise-Grid) app has to use — Slack reports no organization for
  # those. Set it on an Enterprise Grid install: a Slack conversation id and a
  # Slack user id each identify one thing only inside one organization, and two
  # organizations connected at once would let a conversation reach the wrong
  # Agent and a person inherit another person's platform identity.
  slackEnterpriseId: ""
  # -- Bot token (from @BotFather) for the platform-wide Telegram bot.
  # Leave empty to disable Telegram. Chat admins connect a chat to an agent
  # by sending the bind command in the chat and picking the agent in the web
  # UI, or via a one-time connect link created in the UI.
  telegramBotToken: ""
  # -- The bot's @handle without the @ (e.g. "dam_ibm_bot"). Used to build
  # t.me connect links and for mention detection; when empty the api-server
  # discovers it at startup via the Bot API.
  telegramBotName: ""
  # -- ImgBB API key (https://api.imgbb.com). Slack fetches a message's icon
  # from the public internet, so agent avatars are uploaded to ImgBB for Slack
  # replies to show them. The images are public to anyone with the URL and
  # named by a hash, never by the agent name. Leave empty and Slack replies
  # still carry the agent's name, with the app's own icon.
  imgbbApiKey: ""
  # -- Activity tracking saga: when enabled, the api-server captures user
  # logins and channel turns into the `activity_events` table for the
  # usage reporting endpoints. Disable to stop all writes (the read
  # endpoints are independently gated by `keycloak.inspectorRole`).
  activityTracking:
    enabled: true
    # -- HMAC key used to pseudonymize Keycloak `sub` values written to
    # `activity_events`, `actor_roles`, and `instances.owner_sub` (GDPR
    # Art. 32 risk reduction). Leave empty to have the chart generate and
    # persist one in a Secret; rotating breaks every existing row, so it
    # must remain stable. Provide your own (≥32 chars) for cross-cluster
    # consistency or compliance audit trails.
    hmacKey: ""
  # -- Agent case-study editions (submitted by the agent-case-study skill).
  caseStudies:
    # -- Days an edition is kept past the end of the week it covers before
    # the retention sweep deletes it. Editions are weekly, so one agent
    # produces roughly 52 rows a year.
    # Pending final retention rules from the data-collection legal review
    # (#3262).
    retentionDays: 365
    # -- Days a withdrawn (tombstoned) edition is kept before the same sweep
    # purges it for good. Shorter than retentionDays: withdrawal is an explicit
    # owner action, and the grace window exists only to make it recoverable.
    # Retention stays the outer bound — a withdrawal near the retention
    # horizon is purged by age rather than kept the full grace.
    tombstoneGraceDays: 30
  # -- API keys for headless / CI use.
  apiKeys:
    # -- HMAC pepper for at-rest API-key token digests. Leave empty to have
    # the chart generate and persist one in a Secret; rotating it invalidates
    # every existing API key, so it must remain stable. Provide your own
    # (≥32 chars) for cross-cluster consistency.
    hmacKey: ""
  # -- Knowledge base sharing: caps for the published read-only snapshots.
  # Consumers read them over the in-cluster harness route
  # (/api/agents/:id/kb); the same serving app is also reachable on the share
  # host as a by-link endpoint. Needs object storage to be configured.
  kbShares:
    # -- Largest single text file a publish includes (bytes).
    perFileMaxBytes: 2097152
    # -- Total text content cap per published snapshot (bytes).
    totalMaxBytes: 209715200
    # -- Most files a publish includes before it fails loudly.
    maxFiles: 5000
    # -- Hard deadline for one consumer grep call; the worker thread running
    # the consumer-supplied regex is terminated when it lapses (ms).
    grepDeadlineMs: 2000
    # -- Most shared-knowledge-base connections one account may hold.
    maxConnectionsPerOwner: 20
  # -- Default hold window (seconds) for HITL ext_authz approvals. The held
  # call resolves on user verdict or denies on timeout; the durable
  # pending_approvals row outlives the hold and is consumed by the agent's
  # next retry. Default 30 minutes. Per-CLI read
  # timeouts are an external ceiling.
  approvalHoldSeconds: 1800

  # -- How long a provider outage lasts before the owners of the affected
  # agents get a message (a Go duration). Detection already takes up to about
  # two minutes, and most overload bursts end within ten.
  outageAlertDelay: "15m"

  # -- Frame silence (seconds) on a channel turn before the relay asks the
  # agent runtime whether the turn is still running; a turn the runtime
  # reports alive is never abandoned, however long it takes. A value below
  # approvalHoldSeconds is raised to it at load, so a turn blocked on an
  # egress approval is never probed before the hold resolves. Default 30
  # minutes.
  acpTurnStallProbeSeconds: 1800

  # -- Bounds on the one-time schedules an agent creates for itself, so an
  # agent that keeps scheduling itself cannot run turns without end. Users
  # are not bound by these.
  oneTimeSchedules:
    # -- Most not-yet-delivered one-time schedules an agent may hold.
    agentMaxOpen: 20
    # -- Most one-time schedules an agent may create in a sliding hour.
    agentMaxPerHour: 30

  # -- Prices of the model calls that the gateway meters, and the default
  # Spend Ceiling.
  spend:
    # -- Default Spend Ceiling per user: the most dollars of Metered Spend on
    # paid providers that one user's Agents may spend in a UTC day. At the
    # ceiling the gateway refuses the next model call and asks nothing. A
    # quoted decimal string with at most two decimals, e.g. "50" or "12.50";
    # null turns the default ceiling off. A platform operator overrides it for
    # one user, with `dam spend ceiling` or in the Operator tab of Settings.
    defaultUserCeilingUsd: null
    # -- Operator prices: dollars per million tokens, and dollars per web
    # search (`webSearch`). They win over every other price. A row can add a
    # prompt-size `threshold` with the prices above it, `flex` and `priority`
    # tier prices, and `factors` keyed by speed or inference geography. The
    # rows below are IBM LiteLLM's own prices, read from its /model/info with
    # a temporary Management key on 2026-10-13. No public price list has them.
    priceOverrides:
      - {provider: ibm-litellm, model: aws/claude-opus-5-5, input: 3.04, output: 15.2, cacheRead: 0.152, cacheWrite5m: 3.8, cacheWrite1h: 8, webSearch: 0.01}
      - {provider: ibm-litellm, model: aws/claude-opus-5, input: 3.8, output: 19, cacheRead: 0.38, cacheWrite5m: 4.75, cacheWrite1h: 10, webSearch: 0.01}
      - {provider: ibm-litellm, model: aws/claude-opus-4-8, input: 3.8, output: 19, cacheRead: 0.38, cacheWrite5m: 4.75, cacheWrite1h: 10, webSearch: 0.01}
      - {provider: ibm-litellm, model: aws/claude-opus-4-5, input: 3.8, output: 19, cacheRead: 0.5, cacheWrite5m: 6.25, cacheWrite1h: 10, webSearch: 0.01}
      - {provider: ibm-litellm, model: aws/claude-sonnet-5-5, input: 1.52, output: 7.6, cacheRead: 0.152, cacheWrite5m: 1.9, cacheWrite1h: 4, webSearch: 0.01}
      - {provider: ibm-litellm, model: aws/claude-sonnet-5, input: 1.52, output: 7.6, cacheRead: 0.152, cacheWrite5m: 1.9, cacheWrite1h: 4, webSearch: 0.01}
      - {provider: ibm-litellm, model: aws/claude-sonnet-4-6, input: 2.28, output: 11.4, cacheRead: 0.228, cacheWrite5m: 2.85, cacheWrite1h: 6, webSearch: 0.01}
      - {provider: ibm-litellm, model: azure/gpt-6-astra, input: 10, output: 50, cacheRead: 1, cacheWrite5m: 12.5, webSearch: 0.01, threshold: {promptTokens: 272000, input: 20, output: 75, cacheRead: 2}}
      - {provider: ibm-litellm, model: azure/gpt-5.6-sol, input: 5, output: 30, cacheRead: 0.5, cacheWrite5m: 5, webSearch: 0.01, threshold: {promptTokens: 272000, input: 8, output: 30, cacheRead: 0.8}, flex: {input: 2, output: 10, cacheRead: 0.2}, priority: {input: 8, output: 40, cacheRead: 0.8}}
      - {provider: ibm-litellm, model: azure/gpt-5.6-terra, input: 2, output: 12, cacheRead: 0.2, cacheWrite5m: 2.5, webSearch: 0.01, threshold: {promptTokens: 272000, input: 4, output: 18, cacheRead: 0.4}, flex: {input: 1, output: 6, cacheRead: 0.1}, priority: {input: 4, output: 24, cacheRead: 0.4}}
      - {provider: ibm-litellm, model: azure/gpt-5.6-luna, input: 0.2, output: 1.2, cacheRead: 0.02, cacheWrite5m: 0.25, webSearch: 0.01, threshold: {promptTokens: 272000, input: 0.4, output: 1.8, cacheRead: 0.04}, flex: {input: 0.1, output: 0.6, cacheRead: 0.01}, priority: {input: 0.4, output: 2.4, cacheRead: 0.04}}
      - {provider: ibm-litellm, model: azure/gpt-5.5, input: 2.5, output: 15, cacheRead: 0.5, webSearch: 0.01, threshold: {promptTokens: 272000, input: 10, output: 45, cacheRead: 1}, flex: {input: 2.5, cacheRead: 0.25}, priority: {input: 12.5, output: 75, cacheRead: 1.25}}
      - {provider: ibm-litellm, model: azure/gpt-5.3-codex, input: 1.75, output: 14, cacheRead: 0.175, priority: {input: 3.5, output: 28, cacheRead: 0.35}}
      - {provider: ibm-litellm, model: gcp/gemini-3.1-pro-preview, input: 2, output: 12, cacheRead: 0.2, webSearch: 0.014, threshold: {promptTokens: 200000, input: 4, output: 18, cacheRead: 0.4, cacheWrite5m: 0.25}, flex: {input: 1, output: 6, cacheRead: 0.2}, priority: {input: 3.6, output: 21.6, cacheRead: 0.36}}
      - {provider: ibm-litellm, model: Azure/text-embedding-3-small-1, input: 0.02, output: 0.02}
      - {provider: ibm-litellm, model: Azure/text-embedding-3-large-1, input: 0.13, output: 0.13}
      - {provider: ibm-litellm, model: rits/deepseek-ai/DeepSeek-V3.2, input: 0, output: 0}
      - {provider: ibm-litellm, model: rits/moonshotai/Kimi-K2.5, input: 0, output: 0}

  # -- Hard ceiling for file-import bundle uploads, in bytes. Enforced at
  # the api-server proxy boundary (rejects oversized Content-Length AND
  # destroys the upstream pipe when streamed bytes pass the cap). The
  # default 5 GiB is generous enough for a `.git/`-bearing project import
  # while sitting below the controller-default agent PVC of 10 GiB.
  # **Lower this on clusters with smaller per-agent PVCs** — e.g. the
  # bundled `claude-code` template ships with `homeMountSize: 5Gi`, so a
  # 5 GiB import could fill the disk.
  maxImportBundleBytes: 5368709120

  # -- Hard ceiling (bytes) for a single stored artifact object.
  # null = 50 MiB default.
  maxArtifactBytes: null

  # -- Ceiling on the concurrency a satellite may declare for itself. A
  # satellite's manifest sets its own limit; this clamps it, because the job
  # queue is the platform's storage even though the machine is the user's.
  # null = 64 default.
  satelliteMaxConcurrentCeiling: null

  # -- How long an agent's wait on a satellite job blocks before it returns
  # "still running" and the agent is told to ask again. Must stay under the
  # shortest request timeout on the harness route. null = 5 minutes.
  satelliteWaitDeadlineMs: null

  # -- Minimum dam CLI version this server accepts (semver, e.g. "1.2.0").
  # Empty/unset means no floor — every CLI is accepted (a soft-warn fires
  # if the CLI is behind the CLI this release recommends, its own version).
  # Set this to retire a known-broken older client.
  minClientCliVersion: ""

  # -- Ingress NetworkPolicy for the api-server pod.
  # Restricts the agent-facing ports (`harness`, `ext-authz`) to ingress from
  # pods carrying `agent-platform.ai/agent` (agent + executor pods) in agentNamespace.
  # The HTTP port stays open so the UI / ingress controller can reach it;
  # JWT auth at the application layer protects that one. Disable in
  # environments without NetworkPolicy support (e.g. some bare clusters).
  networkPolicy:
    enabled: true

  # -- Hosts seeded into the `trusted` egress preset.
  # Each entry becomes an active `(agent, host, *, *, allow, source=preset:trusted)`
  # row when an agent is created with `egressPreset: trusted`. Values are
  # hostnames — no schemes, no paths. A hostname matches exactly, so a
  # `pkg.go.dev` rule does not cover `proxy.golang.org`; a leading `*.`
  # stands for exactly one label, so `*.pkg.dev` covers
  # `us-docker.pkg.dev` but not `a.b.pkg.dev`.
  #
  # Seeded from Anthropic's published default-allowed-domain list for
  # Claude Code so harnesses with "claude --trust-defaults" behavior keep
  # working without per-host inbox prompts:
  #   https://code.claude.com/docs/en/claude-code-on-the-web#default-allowed-domains
  # and widened to the package registry / toolchain-download host of every
  # mainstream language ecosystem, so that fetching dependencies and building
  # never needs an egress approval. The line drawn: a registry or a vendor's
  # own download host is in; a general-purpose object store (raw
  # `storage.googleapis.com`, `*.blob.core.windows.net`) or a service that
  # builds and serves arbitrary user repos (jitpack.io) is out — those are
  # open-ended egress channels, not registries, and stay per-agent opt-in.
  # Most entries below were captured by running the real toolchain (rustup +
  # cargo, maven, gradle, bundler, composer, dotnet, mix, pub, cabal, cpanm,
  # R, deno) in a sandbox and recording the DNS queries.
  #
  # Operators can append, remove, or replace entries here; rules are seeded
  # once at agent-create time, so editing this list does not retroactively
  # touch existing agents (they keep whatever was seeded for them).
  trustedHosts:
    # Anthropic
    - api.anthropic.com
    - statsig.anthropic.com
    - claude.ai
    # NPM / Yarn / pnpm / Deno / Bun. Plain `npm install` only needs the
    # registry; the other three are mise's npm backend, which lists versions
    # off api.npmjs.org, resolves JSR's npm-compat registry and checks the
    # package against the OSV vulnerability database.
    - registry.npmjs.org
    - registry.yarnpkg.com
    - nodejs.org
    - jsr.io
    - npm.jsr.io
    - api.npmjs.org
    - api.osv.dev
    - deno.land
    - dl.deno.land
    - bun.sh
    # Python
    - pypi.org
    - files.pythonhosted.org
    - conda.anaconda.org
    # GitHub
    - github.com
    - api.github.com
    - codeload.github.com
    - objects.githubusercontent.com
    - raw.githubusercontent.com
    - release-assets.githubusercontent.com
    # Container registries. The registry host alone never pulls: Docker Hub
    # first hands out an anonymous token from auth.docker.io, then 307s the
    # blob off to whichever CDN serves the caller's region. ghcr.io redirects
    # its blobs the same way. gcr.io and registry.k8s.io hand their blobs to
    # a per-region Artifact Registry host nobody can enumerate, which is what
    # the `*.pkg.dev` wildcard is for.
    - quay.io
    - index.docker.io
    - registry-1.docker.io
    - auth.docker.io
    - production.cloudfront.docker.com
    - production.cloudflare.docker.com
    - ghcr.io
    - pkg-containers.githubusercontent.com
    - gcr.io
    - registry.k8s.io
    - "*.pkg.dev"
    - registry.access.redhat.com
    # Go modules
    - proxy.golang.org
    - sum.golang.org
    - go.dev
    # Rust. Cargo's sparse index (the default since 1.70) lives on its own
    # host, and rustup pulls every toolchain from static.rust-lang.org.
    - crates.io
    - index.crates.io
    - static.crates.io
    - sh.rustup.rs
    - static.rust-lang.org
    # CDNs commonly used by toolchains
    - cdn.jsdelivr.net
    - unpkg.com
    # Mise (toolchain manager). Every mise backend was exercised against this
    # list: core/aqua/ubi/github/vfox/packslip/spm/asdf resolve through
    # github.com + api.github.com, and cargo/gem/go/npm/pypi/dotnet through
    # the registry their ecosystem already lists above. dist.pkgx.dev, the
    # forge hosts and conda.anaconda.org are what the remaining backends add.
    # The `http` and `s3` backends take an arbitrary URL — by construction no
    # allowlist can cover them, and they stay per-agent opt-in.
    - mise.jdx.dev
    - cdn.mise.run
    - mise-versions.jdx.dev
    - mise-java.jdx.dev
    - dist.pkgx.dev
    # Other code-hosting forges (mise `gitlab:` / `forgejo:` backends)
    - gitlab.com
    - codeberg.org
    # Java / JVM. Maven Central answers on both hostnames; Gradle serves its
    # own distributions and resolves plugins off a separate artifact host.
    - download.java.net
    - api.adoptium.net
    - repo.maven.apache.org
    - repo1.maven.org
    - maven.google.com
    - services.gradle.org
    - plugins.gradle.org
    - plugins-artifacts.gradle.org
    # Ruby
    - rubygems.org
    - index.rubygems.org
    # PHP
    - packagist.org
    - repo.packagist.org
    - getcomposer.org
    # .NET
    - api.nuget.org
    - dot.net
    - builds.dotnet.microsoft.com
    # Elixir / Erlang
    - hex.pm
    - repo.hex.pm
    - builds.hex.pm
    # Dart / Flutter
    - pub.dev
    # Haskell
    - hackage.haskell.org
    - downloads.haskell.org
    # Perl. cpanm asks cpanmetadb for the distribution that holds a module,
    # then fetches the tarball from a CPAN mirror.
    - www.cpan.org
    - cpanmetadb.plackperl.org
    - cpan.metacpan.org
    - fastapi.metacpan.org
    # R
    - cran.r-project.org
    - cloud.r-project.org
    # Swift
    - download.swift.org
    # C / C++
    - center.conan.io
    # Zig. Official host only: zig's downloads rotate over community mirrors
    # whose hostnames change, so a mirrored fetch still needs an approval.
    - ziglang.org
    # Kubernetes ecosystem tooling
    - get.helm.sh
    - dl.k8s.io
    # Istio's release host, which redirects every download to its R2 bucket.
    # The Google Cloud Storage bucket still serves releases up to 1.30.
    - blob.istio.io
    - istio-release.r2.istio.io
    - istio-release.storage.googleapis.com
    - mirror.openshift.com
    # Supply-chain signing (cosign's TUF root)
    - tuf-repo-cdn.sigstore.dev
    # Vendor download hosts
    - dl.google.com
    - archive.apache.org
    - tmaproduction.blob.core.windows.net
    # Bob Shell (IBM)
    - api.us-east.bob.ibm.com
    # arXiv API
    - export.arxiv.org
    # Debian packages: apt-get on a machine, where the agent is root.
    - deb.debian.org
    # Kernel sources and Alpine packages, for images built on them.
    - "*.kernel.org"
    - "*.alpinelinux.org"

  # -- Optional platform-wide defaults for OAuth app credentials. When a field
  # is set the connect form for the matching app collapses the corresponding
  # input behind an "override" toggle — every user shares the admin-registered
  # app by default, but can still substitute their own credentials when needed.
  # Leave empty to require each user to supply their own client id / secret.
  #
  # `appSlug` is only relevant when the registered app is a GitHub App (not
  # an OAuth App). The slug is the URL-friendly identifier from the app's
  # GitHub URL (`https://github.com/apps/{slug}`). When set, the platform
  # offers users a one-click installation step after authorizing the app —
  # GitHub Apps see no private data without an installation, so without this
  # the user would only have access to public repos. Leave empty for OAuth
  # Apps.
  oauthAppDefaults:
    github:
      clientId: ""
      clientSecret: ""
      appSlug: ""
    githubEnterprise:
      host: ""
      clientId: ""
      clientSecret: ""
      appSlug: ""
    # The Slack app must be registered out of band (Slack offers no dynamic
    # client registration) with the platform OAuth callback as a redirect URL
    # and the Slack MCP user-token scopes enabled.
    slack:
      clientId: ""
      clientSecret: ""

  # -- Database connection (empty host = use shared local postgres)
  db:
    host: ""
    port: 5432
    user: platform_apiserver
    password: null
    database: platform
    # -- Connection-pool size, per replica. One pool serves both request
    # handlers and the runtime-delivery worker; delivery jobs hold a
    # connection only for their short queries, never across the call to the
    # agent, so this sits far below `runtimeDelivery.concurrency`. A pool
    # closes connections idle for 30 s, but under load each pod holds up to
    # poolMax, and mid-rollout so do the surge pod and the pod still draining:
    # keep (replicas + 2) × poolMax under the server's `max_connections`
    # (Postgres defaults to 100, less 3 reserved, shared with Keycloak).
    poolMax: 32
    # Postgres TLS mode for an external DB: require | verify-ca | verify-full.
    # null = no TLS (the in-cluster postgres). verify-ca/verify-full need caCert.
    sslmode: null
    # CA certificate (PEM) used to verify the external DB's TLS certificate.
    # Required for sslmode verify-ca/verify-full when the DB presents a private CA.
    caCert: ""
  # -- Runtime-state delivery to agent pods.
  runtimeDelivery:
    # -- Concurrent deliveries per replica. A job parked on a slow agent holds
    # a worker slot and nothing else, so this is sized to exceed the agents
    # that can be mid-delivery at once: no agent's delivery waits on another's
    # for a slot. Lower it only to roll back that guarantee.
    concurrency: 256

  # -- Object-store connection (empty endpoint = use shared local seaweedfs)
  objectStorage:
    endpoint: ""
    # -- Endpoint as agent pods dial it (upload links are signed against it;
    # plain-HTTP values need an explicit port). Empty derives it: the shared
    # store's cluster-DNS FQDN, or `endpoint`. Only for unusual topologies.
    agentEndpoint: ""
    # -- Browser-reachable endpoint for direct download links. Empty relays
    # downloads through the api-server (buffered — pair a raised
    # maxArtifactBytes with this). Usually `endpoint` for external stores;
    # the shared store would need its S3 port exposed via ingress.
    publicEndpoint: ""
    region: "us-east-1"
    # -- Created by the api-server at startup when missing (pre-create it
    # to run with credentials lacking CreateBucket).
    bucket: "platform-artifacts"
    # -- Static credentials for an external endpoint — both set or both
    # empty (empty = AWS SDK default provider chain, e.g. IRSA). The shared
    # local store uses its own chart-generated credentials.
    accessKeyId: ""
    secretAccessKey: null
    # -- Path-style addressing, needed by SeaweedFS and most self-hosted
    # stores. Set false for AWS S3.
    forcePathStyle: true
  # Every session stream, agent status poll and driver request funnels through
  # this one pod, so it is sized as a control plane and not as a chat backend.
  # Half a core let the event loop miss its health probe under load, and the
  # kubelet restart took every in-flight request with it.
  resources:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

# -- Where Agents and user budgets are authoritative.
#
# A move out of the Kubernetes API into Postgres, in three releases: the expand
# release carries the tables, the controller's database login and the startup
# fences; the switch release absorbs the custom resources and both components
# read Postgres; the contract release stops reading or writing them, drops
# their RBAC, and refuses to start until the rollback window has closed and the
# archive is attested.
#
# The two components refuse to start rather than serve the wrong store. A build
# still on the custom resources exits once the switch has marked the store as
# Postgres, and a build configured for Postgres exits until the switch has
# absorbed the resources. The marker is a ConfigMap `<release>-agent-store` the
# switch writes into the agent namespace.
agentStore:
  # -- Which store is authoritative: `crd` (the custom resources), `postgres`
  # (the switch release) or `contract` (past the rollback window). `postgres`
  # recreates both Deployments, the api-server absorbs the custom resources in
  # one transaction, and it serves only once the new controller leads and has
  # ensured every anchor. `contract` reads no custom resource and renders no
  # RBAC for them; its api-server refuses to start until `contract-check`
  # passes, then records `contract-at` in the marker for the cluster-wide CRD
  # retirement. Both refuse to render without `cutover.acknowledged`.
  authority: crd
  # -- Freeze both components for a rollback: both Deployments render zero
  # replicas, so nothing writes rows while the reverse exporter restores the
  # custom resources. Set it with `authority=postgres` and the acknowledgement,
  # wait for the rollout (Flux applies it on its interval, ten minutes by
  # default), run the exporter, then pin the previous release and clear it.
  frozen: false
  # -- Log, at api-server startup, what an absorb would write: which records
  # would become rows, which would be refused and why, what the move would drop,
  # and where the recorded connection grants disagree with the database. Writes
  # nothing. Leave it off outside a cutover: the report is for an operator
  # reading one install's log once.
  previewReport: false
  backup:
    # -- age public key (`age1…`) the operator-held archive is encrypted to.
    # Public, so it lives here; the identity is the operator's and never enters
    # the cluster. `export-snapshot` uses it unless given `--recipient`.
    recipient: ""
  cutover:
    # -- Set by the operator to time the switch release. It refuses to render
    # until this is true, because a production install auto-upgrades on a semver
    # range and the cutover is an outage of a minute or two. It fails the render
    # when `authority` is `crd`, so it is never carried into a later release.
    acknowledged: false
  contract:
    # -- SHA-256 of the encrypted file `export-snapshot` wrote, taken from the
    # file itself (the export records it when it runs). The contract release
    # refuses to start until this is the ciphertext digest of the export the
    # platform recorded for this install, encrypted to the install's
    # `backup.recipient` — which is what makes the operator's file, not a digest
    # copied from a log, the attestation D79A asks for. Required by
    # `authority: contract`, unless `emptyArchive` says the install never
    # absorbed a custom resource.
    backupSha256: ""
    # -- An install created after this cluster's CRDs were retired: it never had
    # a custom resource to archive, so the contract release checks that the
    # archive is empty instead of waiting for a digest. Never set it on an
    # install that absorbed something.
    emptyArchive: false
    # -- A rehearsal's clock (`2026-10-25T00:00:00Z`), so the one-week rollback
    # window is proved without waiting it out. It fails the render unless
    # `rehearsal` is true, and the marker the gate then writes carries
    # `contract-clock: rehearsal`, which `delete-crs` refuses
    # without `--rehearsal`. Empty in an install.
    now: ""
    # -- Set it true only on a rehearsal cluster, beside `now`: it is what
    # makes moving the window an explicit act, and what marks the install's
    # gate as one no real deletion may trust.
    rehearsal: false

# -- Controller (Go reconciler + scheduler)
controller:
  # -- Extra annotations for the controller Deployment object / its pod
  # template (merged over commonAnnotations / commonPodAnnotations). These
  # apply to the controller pod itself, not the agent machines it launches
  # (those have their own knobs under controller.agent).
  annotations: {}
  podAnnotations: {}
  image:
    repository: quay.io/dam-agents/controller
    tag: ""
    pullPolicy: IfNotPresent

  # -- slog level for the controller: debug | info | warn | error.
  logLevel: info

  # -- Port the controller's /healthz and /readyz endpoints listen on. The
  # chart's probes restart a leader that holds the Lease while its Agent store
  # has not answered for two minutes.
  healthPort: 8081

  db:
    # The controller's own login on the platform database, which it reads
    # definitions from and writes observations to once `agentStore.authority` is
    # `postgres`. It connects to the same database as the api-server — one
    # platform database per install — so host, port and TLS come from
    # `apiServer.db`; only the identity is its own.
    user: platform_controller
    # -- Password for an external database. Left null, the bundled database's
    # chart-generated credential is used; set it, and the chart puts it in the
    # api-server's credentials Secret, which the deployment reads through a
    # secretKeyRef.
    password: null

  # -- Agent configuration. Three layers, applied at reconcile time:
  #   1. `base`             — chart-only policy, never overridable by an agent.
  #   2. `templateDefaults` — chart-wide fallbacks for fields a template
  #                           can override (template wins when set).
  #   3. harnessTemplates.*   — per-template values (further down).
  # Use the literal string `$HOME` in mount paths; the chart substitutes
  # it at render time with the fixed agent home (/home/agent).
  agent:
    base:
      # Install-wide default pull secrets, listed after an Agent's own
      # `imagePullSecretRef`. The runner fetches with them instead of the
      # kubelet (see `virtualization.imageCache`).
      imagePullSecrets: [] # must exist in agentNamespace

      # Lifecycle. A machine starts fast, so every agent takes this and
      # ignores its own hibernationTimeout; "0s" disables hibernation.
      vmIdleTimeout: "5m"

    templateDefaults:
      # (agentHome is retired: the agent home is fixed at /home/agent; a value
      # still set here is ignored with a startup warning.)

      storageSize: "10Gi"
      # Default agent Size when neither the user's slider nor the template
      # chooses one. Limits are the user-facing concept (#1900): the Budget
      # bounds Σ limits of a user's running agents, so limits ARE the
      # agent's "power". A `requests` set here (or in a template) is carried
      # onto the Agent as written — an operator escape hatch, not a user
      # concept.
      #
      # UPGRADE NOTE (#1900): this default now matches the limits pre-Sizes
      # agents ran with (1 CPU / 2Gi), so an upgrade neither grows nor shrinks
      # an existing sandbox — NEW sandboxes get it directly, existing ones are
      # backfilled at the identical `legacyAgentSize` below.
      resources:
        limits:
          cpu: "1"
          memory: "2Gi"
      mounts:
        - path: $HOME
          persist: true
        - path: /tmp
          persist: false
      # No default env. `PORT` is baked into agent-runtime (defaults to 8080).
      # Platform-injected envs (HOME, HTTPS_PROXY, API_SERVER_URL, etc.) are
      # set unconditionally by the controller.
      #
      # `QUEUE_PARK_MS` is settable here: how long a session's queued prompts
      # wait for a client to come back before they are recorded as undelivered
      # (agent-runtime's own default is 90s). The e2e overlay shortens it so a
      # spec need not spend the full window in a real wait.
      #
      # `MEM_REAPER` / `MEM_REAPER_THRESHOLD` tune agent-runtime's early-OOM
      # reaper: at the threshold fraction of the agent's memory ceiling (default
      # 0.93) it SIGKILLs the largest tool process spawned under the harness,
      # so the harness survives instead of the whole agent being OOM-killed.
      # The ceiling is the pod's cgroup limit for a container, and the machine's
      # own memory on the vm Backend, which has no cgroup limit; a container
      # without a limit is left unwatched rather than measured against the node
      # it shares. Set `MEM_REAPER=off` to disable.
      env: []
      skillSources: []
      # true = every vm agent asks for nested virtualization, as if its Agent
      # set spec.backend.vm.nestedVirtualization. It is only an ask: a machine
      # nests only when `virtualization.runner.nestedVirtualization` lets the
      # runners nest and the node's KVM allows it. Applied at reconcile, so
      # turning it on or off also changes existing vm agents and restarts
      # their machines. While it is on, an Agent cannot opt out.
      nestedVirtualization: false

    # -- Size the controller materializes into any Agent spec that lacks a
    # limits dimension (#1900): fill-if-absent on reconcile, never touching
    # a set value — this is what makes `spec.resources.limits` effectively
    # required without schema-level enforcement. Defaults to the limits
    # pre-Sizes agents were actually running with under the old chart
    # defaults (1 CPU / 2Gi), so an upgrade never shrinks an existing
    # sandbox out from under its workload — a workload that used 1–2Gi
    # would otherwise OOM on its next wake. Operators who overrode the old
    # `templateDefaults.resources.limits` should mirror that override here
    # before upgrading.
    legacyAgentSize:
      cpu: "1"
      memory: "2Gi"

  # -- Per-user compute Ceiling defaults (#1900): the maximum CPU and memory
  # one user's running agents can use concurrently, as the sum of their Sizes
  # (`spec.resources.limits`, which hard-cap usage; the uniform per-agent
  # gateway overhead is deliberately not counted — price it into these
  # defaults). Enforced by the controller at the 0→1 scale-up; a user at the
  # ceiling must pause, stop, or shrink a running sandbox before starting
  # another. A platform operator raises (or lowers) them per user in the
  # Operator tab of Settings or with `dam budget`, which write a UserBudget CR
  # named `budget-<keycloak-sub>` in the agent namespace.
  userBudgets:
    defaultCpu: "8"
    defaultMemory: "16Gi"

  replicas: 1
  # -- Image for the Envoy credential-injector sidecar.
  # Envoy publishes only to Docker Hub; pulled via mirror.gcr.io (Google's
  # pull-through cache, higher anonymous rate limits) — byte-identical to
  # envoyproxy/envoy:distroless-v1.39.4 (same manifest digest).
  envoyImage: mirror.gcr.io/envoyproxy/envoy:distroless-v1.39.4
  # -- PEM CA certificates every agent gateway trusts upstream, on top of the
  # public roots, and every agent trusts beside its gateway's CA, for the hosts
  # its gateway passes through untouched. The api-server trusts them too
  # (NODE_EXTRA_CA_CERTS), for its own Slack, GitHub and OAuth calls. Needed
  # when something on the cluster's egress path intercepts TLS with its own
  # CA: a corporate TLS-inspecting proxy, or the platform's own gateway when
  # the platform runs inside one of its agents (`mise run cluster:install`
  # sets it there). Empty leaves each gateway on its image's own roots. Set
  # with --set-file, e.g.
  # `--set-file controller.gatewayUpstreamExtraCAs=proxy-ca.crt`.
  gatewayUpstreamExtraCAs: ""
  # -- Where each agent gateway may send traffic. The controller renders a
  # per-agent egress NetworkPolicy so an approved hostname that resolves to a
  # private address (an owner's DNS record, or DNS rebinding after approval)
  # cannot carry the agent into the cluster, the node, or the cloud metadata
  # endpoint. A gateway reaches the public internet minus 10/8, 172.16/12,
  # 192.168/16, 100.64/10, 127/8, 169.254/16, 0/8 (and ::1, fc00::/7,
  # fe80::/10), plus the platform's own pods it dials (api-server, harness
  # waypoint, object store, telemetry collector) and the cluster DNS pods.
  gatewayEgress:
    # Private ranges a gateway may also reach — enterprise services agents
    # call through their gateway: an internal Git host, an in-house API, a
    # Kubernetes API server a connection targets, a node-local DNS cache
    # (169.254.20.10/32). The metadata endpoints (169.254.169.254,
    # 100.100.100.200, fd00:ec2::254) stay closed even inside a range listed
    # here.
    extraCidrs: []
    # The cluster DNS pods each gateway resolves upstream names through, on
    # their own ports — policy applies after the DNS Service address is
    # translated to a pod, so the pods are named, not the Service.
    # OpenShift: namespace `openshift-dns`, podLabels
    # `dns.operator.openshift.io/daemonset-dns: default`, ports [5353].
    clusterDns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
      ports: [53]
    # In-cluster pods every gateway may also reach, in the same shape as
    # clusterDns — an in-house service an agent calls through its gateway,
    # for example `{namespace: tools, podLabels: {app: api}, ports: [8443]}`.
    # podLabels is required. `mesh: true` marks a peer in the ambient mesh and
    # also opens HBONE (15008); over it ztunnel carries any inner port, so
    # `ports` binds only a peer outside the mesh.
    peers: []
  # -- Image for a vm Agent's machine resolver, beside Envoy in its gateway
  # pod: it answers every name with the gateway's address and resolves nothing
  # upstream. CoreDNS publishes to Docker Hub; pulled via mirror.gcr.io like
  # Envoy.
  machineDNSImage: mirror.gcr.io/coredns/coredns:1.14.7
  # -- Port the Envoy sidecar listens on inside the agent pod (proxy on 127.0.0.1).
  envoyPort: 10000
  # -- TLS interception support for the credential injector. The chart
  # provisions a self-signed CA via cert-manager and a CA ClusterIssuer
  # (`platform-mitm-ca-issuer`) that the controller uses to mint per-agent leaf
  # certs for Envoy to terminate the agent's TLS and inject credential headers.
  # Requires cert-manager to be installed in the cluster (platform's cluster:install
  # task does this).
  envoyMitm:
    enabled: true
    # -- Name of the bootstrap cluster issuer. Cluster-scoped, so consider
    # collisions with other charts. The CA issuer is always
    # `platform-mitm-ca-issuer`, the name the controller mints leaves from.
    bootstrapIssuerName: platform-selfsigned-bootstrap
    # -- Where the CA Secret lives. Must equal cert-manager's
    # --cluster-resource-namespace flag (default `cert-manager`).
    caSecretNamespace: cert-manager
    caSecretName: platform-mitm-ca
    # -- CA validity. cert-manager will renew before expiry automatically.
    caDuration: 87600h # 10y
    caRenewBefore: 720h # 30d
  # Gateway Envoy OpenTelemetry has no knobs here on purpose. Envoy is a C++
  # data plane no SDK or zero-code instrumentation can reach, so the controller
  # configures it natively in the rendered bootstrap — the exporter target
  # comes from PLATFORM_GATEWAY_OTLP_* (chart-set to the collector's gRPC port
  # under `clickstack.enabled`), falling back to the controller's inherited
  # OTEL_* env for BYO collectors; sampling always comes from the relayed
  # OTEL_TRACES_SAMPLER. With no OTLP endpoint present, gateways emit nothing.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Agent templates, keyed by template name. Override values files merge
# per entry; set an entry to `null` to drop it. Fields named identically to
# `controller.agent.templateDefaults.*` override the chart-wide default for
# agents created from this template.
# The rendered image ref (`repository:tag`, tag defaulting to the chart
# appVersion) is the template's version identity: existing agents are offered
# an upgrade when it differs from what they captured at create. The published
# chart pins each CI-built image to its source sha (@ci-pin), so an upgrade is
# offered exactly when the image changed. Pinning `tag` to a fixed value in an
# override opts that template out of upgrade detection, and non-image drift
# (mounts/env/resources) is never detected.
# `$HOME` in mount paths is substituted at chart render time with the fixed
# agent home, /home/agent.
# The built-in `default` entry boots quay.io/dam-agents/default, which carries
# every harness in `harnesses` and bakes their tools. Its sessions choose the
# harness, so the template names none.
# Workload images (research frameworks and other pre-built agents) are starter
# kits in the built-in catalog (`starterKits`), not templates.
# `aliases` lists retired template ids that resolve to this one, so agents
# created from them still find their template (image upgrades, usage).
# `experimental: true` badges the image as alpha.
# `providers` lists the model-provider connection types the image can run on
# (any of anthropic, ibm-litellm, curve-bender, openai, bob, bedrock) — which env the harness inside
# reads. Omit it to offer every provider. Validated when templates load.
# `harness` names the one harness family a custom image wraps (claude-code,
# codex, pi, bob); its sessions have no harness choice. Any other value fails
# template validation and the entry is skipped at api-server boot (logged).
# Knowledge-base creation passes it to the KB template's installer so the
# installed tooling lands where that harness reads it.
#
# To predefine an *experimental external agent* (a private-registry image users
# just pick from the template list, with no manual "Private registry" entry),
# add an entry with `imagePullSecret`:
#
#   bugstone:
#     enabled: true
#     experimental: true
#     description: "Experimental DAM bug-hunting agent"
#     image:
#       repository: icr.io/dam-agents/bugstone
#       tag: ""
#     storageSize: "5Gi"
#     imagePullSecret:                 # renders a dockerconfigjson Secret in agentNamespace
#       server: icr.io
#       username: iamapikey
#       password: "<registry-api-key>" # keep out of plaintext values in prod (sealed/SOPS/external secret)
#
# Or, to reference a pull Secret you manage yourself (it must already exist in
# `agentNamespace`), set `imagePullSecretRef` instead — mutually exclusive with
# `imagePullSecret`:
#
#   bugstone:
#     # ...
#     imagePullSecretRef: "icr-pull-secret"
#
harnessTemplates:
  default:
    enabled: true
    displayName: "Coding agent"
    description: "Runs Bob, Claude, Codex or Pi, chosen per session"
    aliases: [claude-code, codex, pi-agent, bob]
    image:
      repository: quay.io/dam-agents/default
      tag: "" # @ci-pin default-image-tag
    storageSize: "5Gi"
    # The largest of the harnesses' needs: Bob recommends ≥4 GB RAM.
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

# -- The harnesses the default image carries, keyed by the name the agent
# runtime knows them by. A session chooses one; `default` preselects it where a
# session has no harness of its own yet, and seeds the harness of new agents.
# `providers` lists the model-provider connection types the harness can run on;
# the session picker offers only their models. `telemetry` names the export
# rail the harness reads (claude-code, bob, pi or codex, see
# docs/architecture/observability.md); it applies only with clickstack.enabled.
harnesses:
  default: claude-code
  catalog:
    claude-code:
      enabled: true
      displayName: "Claude"
      description: "Anthropic's coding agent"
      releaseNotesUrl: "https://code.claude.com/docs/en/whats-new"
      providers: [ibm-litellm, curve-bender, anthropic, bedrock]
      telemetry: claude-code
      tags: ["Anthropic"]
    codex:
      enabled: true
      displayName: "Codex"
      description: "OpenAI Codex coding agent"
      releaseNotesUrl: "https://github.com/openai/codex/releases"
      providers: [ibm-litellm, curve-bender, openai]
      # Codex reads its exporters from config.toml alone; the image's launch
      # scripts render this rail into `-c otel.*` flags.
      telemetry: codex
      tags: ["OpenAI"]
    pi:
      enabled: true
      displayName: "Pi"
      description: "Pi coding agent with multi-LLM support"
      providers: [ibm-litellm, curve-bender, anthropic, openai, bedrock]
      # Pi has no exporter of its own; the image's extension writes the
      # per-call log records on this rail.
      telemetry: pi
      tags: ["Any provider"]
    bob:
      enabled: true
      displayName: "Bob"
      description: "Bob shell agent"
      releaseNotesUrl: "https://bob.ibm.com/docs/shell/changelog"
      providers: [ibm-litellm, curve-bender, bob]
      # Bob exports OTLP traces rather than the per-call log records Claude
      # Code writes, so it rides its own env rail.
      telemetry: bob
      tags: ["Anthropic", "Mistral", "Granite"]
    copilot:
      enabled: true
      displayName: "Copilot"
      description: "GitHub Copilot CLI coding agent"
      releaseNotesUrl: "https://github.com/github/copilot-cli/releases"
      # Copilot's BYOK provider speaks Chat Completions through the Model
      # Router, which meters its spend; no export rail.
      providers: [ibm-litellm, curve-bender, openai]
      tags: ["Any provider"]

# -- E2E test affordances. Gated test-only surface: the api-server
# registers a control tRPC namespace that drives the mock Agent harness over
# the existing ACP relay. Default off — flipped on by the e2e/local install.
e2e:
  enabled: false

# -- GitHub hosts the PLATFORM ITSELF reads, as opposed to the ones an agent
# reaches through a user's connection. Public github.com is always readable and
# is always read anonymously; this block adds one GitHub Enterprise host
# (github.ibm.com, ghe.acme.com, …) and the credential to read it with, so a
# repository that already holds a ready-to-use agent can be offered as a starter
# kit instead of being rebuilt in-platform.
#
# The credential is the INSTALL'S, not a user's: what it reads is refreshed on a
# cadence with no user in context. It is sent to `enterprise.host` and nowhere
# else — a URL naming any other host is refused rather than reached with the
# token — so it wants read-only scope on the repositories it must see.
#
# This is not how an AGENT reaches an enterprise repository. An agent's own
# clone rides the gateway with the `github-enterprise` connection its kit
# requires, and never sees this token.
#
# Leave `enterprise.token` empty to read no enterprise host at all. It is meant
# to arrive through a secret values layer rather than a values file in git; the
# chart stores it in the api-server's Secret, not the pod spec.
# An empty `enterprise.host` falls back to the enterprise host the connection
# presets already name (apiServer.oauthAppDefaults.githubEnterprise.host), so a
# single-host install spells it once; setting it here does not change what those
# presets offer users.
#
# Read today by the starter-kit catalog reader. Rendered as
# GITHUB_ENTERPRISE_HOST / GITHUB_ENTERPRISE_TOKEN.
github:
  enterprise:
    host: ""
    token: ""

# -- Starter kit catalogs. The api-server reads every catalog listed here, in
# order, through one reader; kits are addressed as `<catalog>/<kit>`.
# `builtin` is the platform's own catalog, shipped inside this chart
# (helm/starter-kits) and mounted into the api-server — versioned with the
# release, no network needed — unless one of its entries names a repository
# (`id` + `url`), which is resolved over the network on every refresh.
# `catalogs` adds external ones: each names a git repository holding
# catalog.yaml, on public github.com or on the `github.enterprise` host above,
# with `ref` to pin and `dir` to read a subdirectory — never written into the
# url. Rendered as STARTER_KITS_CATALOGS.
starterKits:
  builtin:
    enabled: true
    name: platform
    # Per-kit switch, the same one the workload templates had: a kit whose
    # image this install does not build or cannot pull is left out of the
    # rendered catalog and never reaches the UI. Missing entry = enabled.
    # `image` points a kit that brings its own image at another ref for this
    # install (values-local.yaml uses it to run the workload kits on the images
    # the local cluster builds); it is swapped into the kit's `image.ref` at
    # render and is refused for a kit without an image of its own.
    kits:
      nous: { enabled: true }
      openevolve: { enabled: true }
      shinkaevolve: { enabled: true }
      gepa: { enabled: true }
      adaevolve: { enabled: true }
      evox: { enabled: false }
      k-search: { enabled: false }
      spotlights: { enabled: true }
      software-developer: { enabled: false }
      micro-manager: { enabled: true }
  # External catalogs, read in order after the built-in one. Each names a
  # public repository holding catalog.yaml, with `ref` to pin a branch, tag or
  # commit and `dir` to read a subdirectory. A version is never written into
  # the URL: a URL carrying one is refused, so there is a single place a ref is
  # spelled and no install is quietly served the default branch.
  # A catalog that pins nothing **moves**: the refresh job re-reads it
  # periodically, so a kit added there reaches this install without a redeploy,
  # and every kit is still resolved to an exact commit as it is read.
  catalogs:
    - name: curated
      url: https://github.com/dam-agents/dam-starter-kits
      # ref: v1.4.0          # pin a branch, tag or commit
      # dir: catalogs/public # read catalog.yaml from a subdirectory

# -- Platform-wide skill sources (shared catalog visible to all users).
# Rendered into the api-server pod as SKILL_SOURCES_SEED. The same
# `{name, gitUrl, path?}` shape works for per-template sources under
# `<templateKey>.skillSources`. `path` is an optional repo-relative
# subdirectory to scan; omit it to scan `skills/` then the repo root.
skills:
  skillSources: []
  # Example:
  # skillSources:
  #   - name: "Anthropic Skills"
  #     gitUrl: "https://github.com/anthropics/skills"
  #   - name: "Acme Monorepo Skills"
  #     gitUrl: "https://github.com/acme/monorepo"
  #     path: ".claude/skills"

# -- Curated catalog of public git repos an agent's working directory can be
# seeded from at creation (cloned once into /home/agent/work, shortly after the
# agent starts, via a one-shot `workspace-seed` event — never tracked or pushed
# afterward). Rendered into the `git-repos` ConfigMap and loaded by the
# api-server at boot. Each entry maps to the harness template names it's
# compatible with; the Add Agent dialog filters by the chosen harness (omit
# `compatibleTemplates` to disable an entry). Public repos only.
gitRepos:
  - id: google-workspace
    name: Google Workspace
    url: https://github.com/dam-agents/google-workspace.git
    description: "Tools and skills for working with Google Workspace"
    compatibleTemplates: [claude-code]
  - id: spotify-dj
    name: Spotify DJ
    url: https://github.com/dam-agents/spotify-dj.git
    description: "Build sets, run playback, curate playlists, and discover music on Spotify"
    compatibleTemplates: [claude-code]
  - id: link-guardian
    name: Link Guardian
    url: https://github.com/dam-agents/link-guardian.git
    description: "Monitor and validate links to guard against broken or malicious URLs"
    compatibleTemplates: [claude-code, bob]
  - id: arxiv-scanner
    name: arXiv Scanner
    url: https://github.com/willallstet/arxiv-scanner.git
    description: "Onboards a GitHub repo and scans arXiv for related work"
    compatibleTemplates: [claude-code]
