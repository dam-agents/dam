[tasks.check]
depends = ["//:setup:pnpm", ":check:*"]

[tasks.fix]
depends = [":fix:*"]

[tasks.scan]
depends = [":scan:*"]

[tasks."check:tsc"]
extends = "ts:check:tsc"

[tasks."check:lint"]
extends = "ts:check:lint"

[tasks."check:format"]
extends = "ts:check:format"
run = "pnpm exec prettier --check 'src/**/*.ts' '!src/proto-gen/**'"

[tasks."fix:lint"]
extends = "ts:fix:lint"

[tasks."fix:format"]
extends = "ts:fix:format"
run = "pnpm exec prettier --write 'src/**/*.ts' '!src/proto-gen/**'"

# Guards the write-side event registry: every type in src/events.ts must have
# an emit site and a subscriber. Both halves drift silently past tsc and lint,
# because a declared-but-unsubscribed event is perfectly well-typed.
[tasks."check:events"]
wait_for = ["//:setup:pnpm"]
run = "node scripts/event-coverage.mjs"
sources = ["src/**/*.ts", "tsconfig.json", "scripts/event-coverage.mjs"]
outputs = []
cache = { enabled = true }
deny_net = true
deny_write = true

[tasks."gen:proto"]
description = "Regenerate ts-proto types from proto/external_auth.proto"
run = '''
mkdir -p src/proto-gen
node_modules/.bin/grpc_tools_node_protoc \
  --plugin=protoc-gen-ts_proto=node_modules/.bin/protoc-gen-ts_proto \
  --ts_proto_out=src/proto-gen \
  --ts_proto_opt=outputServices=grpc-js,esModuleInterop=true,useExactTypes=false,unknownFields=true,outputJsonMethods=false,outputClientImpl=false,fileSuffix=.gen \
  --proto_path=proto \
  proto/external_auth.proto
'''

[tasks.test]
extends = "ts:test"
run = "pnpm exec vitest run --config vitest.unit.config.ts"

[tasks.dev]
depends = ["//:setup:pnpm"]
run = "pnpm exec tsx watch --env-file=.env src/index.ts"

[tasks.image]
dir = "{{vars.repo_root}}"
run = '''
#!/usr/bin/env bash
[ -n "${SKIP_IMAGE_BUILD:-}" ] && exit 0
docker build -f packages/api-server/Dockerfile -t platform-api-server:latest .
'''

[tasks."scan:trivy"]
extends = "image:scan:trivy"
