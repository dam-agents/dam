[task_config]
includes = ["{{vars.repo_root}}/.mise/ts-package.toml", ".mise/tasks"]

[tasks."check:format"]
extends = "ts:check:format"
run = "pnpm exec prettier --check 'src/**/*.ts' '!src/proto-gen/**'"

[tasks."fix:format"]
extends = "ts:fix:format"
run = "pnpm exec prettier --write 'src/**/*.ts' '!src/proto-gen/**'"

[tasks.test]
extends = "ts:test"
run = "pnpm exec vitest run --config vitest.unit.config.ts"
sources = ["src/**", "vitest*.config.ts", "tsconfig.json", "{{vars.repo_root}}/pnpm-lock.yaml", "{{vars.repo_root}}/packages/vm-runner/contract/vocabulary.json", "{{vars.repo_root}}/packages/controller/contract/*.json", "{{vars.repo_root}}/helm/values.yaml", "{{vars.repo_root}}/helm/starter-kits/**", "{{vars.repo_root}}/packages/db/drizzle/*.sql"]

[tasks."test:harness-config-concurrency"]
description = "Check the permission-mode reset against hello and the Config save on a real PostgreSQL"
run = '''
set -euo pipefail
: "${HARNESS_CONFIG_DATABASE_URL:?point it at a disposable database}"
(cd "{{vars.repo_root}}/packages/db" && DATABASE_URL="$HARNESS_CONFIG_DATABASE_URL" pnpm exec drizzle-kit migrate >/dev/null)
HARNESS_CONFIG_DATABASE_URL="$HARNESS_CONFIG_DATABASE_URL" pnpm exec tsx scripts/harness-config-concurrency.ts
'''

[tasks."test:profiles-integrity"]
description = "Check the profile references, seed marker and delete refusal against a real PostgreSQL"
run = '''
set -euo pipefail
: "${PROFILES_DATABASE_URL:?point it at a disposable database}"
(cd "{{vars.repo_root}}/packages/db" && DATABASE_URL="$PROFILES_DATABASE_URL" pnpm exec drizzle-kit migrate >/dev/null)
PROFILES_DATABASE_URL="$PROFILES_DATABASE_URL" pnpm exec tsx scripts/profiles-integrity.ts
'''

[tasks."test:control-grants"]
description = "Check the controller role's privileges against a real PostgreSQL"
# The api-server that grants to the controller owns its tables and holds no
# CREATEROLE, so an install's real shape is two identities: point
# CONTROL_GRANTS_DATABASE_URL at the database as its owner, and
# CONTROL_GRANTS_ADMIN_DATABASE_URL at the same database as a role that may
# create logins. Left unset, the one URL does both, which is fine on a
# disposable server.
run = '''
set -euo pipefail
: "${CONTROL_GRANTS_DATABASE_URL:?point it at a disposable database with the migrations applied, on a server where creating and dropping platform_controller is acceptable}"
pnpm exec tsx scripts/control-grants-check.ts
'''

[tasks."test:agent-store"]
description = "Check the Postgres Agent and budget adapters against a real PostgreSQL"
run = '''
set -euo pipefail
: "${AGENT_STORE_DATABASE_URL:?point it at a disposable database with the migrations applied}"
pnpm exec tsx scripts/agent-store-check.ts
'''
