// Minimal subset of Envoy's `envoy.service.auth.v3.Authorization` service —
// just the fields we read in the network ext_authz handler. Proto3 is
// forward-compatible: Envoy serializes the full message and our handler
// silently drops unknown fields. The wire format for declared fields must
// match Envoy's source-of-truth proto, so field numbers are pinned here.
//
// Source: github.com/envoyproxy/envoy → api/envoy/service/auth/v3/external_auth.proto
//                                       api/envoy/service/auth/v3/attribute_context.proto
//                                       api/envoy/config/core/v3/base.proto (Metadata, HeaderValue)
//                                       api/envoy/type/v3/http_status.proto

syntax = "proto3";

package envoy.service.auth.v3;

import "google/protobuf/struct.proto";

service Authorization {
  rpc Check (CheckRequest) returns (CheckResponse);
}

message CheckRequest {
  AttributeContext attributes = 1;
}

message AttributeContext {
  Peer source = 1;
  Peer destination = 2;
  Request request = 4;
  // Populated on model-provider chains: the gateway's spend meter writes its
  // metadata namespace before the ext_authz filter runs.
  Metadata metadata_context = 11;
  TLSSession tls_session = 12;
}

message Metadata {
  map<string, google.protobuf.Struct> filter_metadata = 1;
}

message Peer {
  Address address = 1;
}

message Address {
  SocketAddress socket_address = 1;
}

message SocketAddress {
  string address = 2;
  uint32 port_value = 3;
}

message Request {
  HttpRequest http = 2;
}

// Populated for L7 ext_authz on the credentialed-egress chains; empty on the
// L4 (network) ext_authz path.
message HttpRequest {
  string method = 2;
  map<string, string> headers = 3;
  string path = 4;
  string host = 5;
  string scheme = 7;
}

// Populated for L4 ext_authz when the listener has a TLS inspector — that's
// where the SNI we gate on comes from.
message TLSSession {
  string sni = 1;
}

// Standard google.rpc.Status — we only ever set `code`.
message Status {
  int32 code = 1;
  string message = 2;
}

// envoy/type/v3/http_status.proto: the enum StatusCode is a varint on the
// wire, so int32 carries the same bytes.
message HttpStatus {
  int32 code = 1;
}

// envoy/config/core/v3/base.proto. Envoy sets (overwrites) a denied-response
// header when `append` is unset, so the other fields are left out.
message HeaderValue {
  string key = 1;
  string value = 2;
}

message HeaderValueOption {
  HeaderValue header = 1;
}

// Sent with a non-OK status to give the downstream client a shaped refusal
// (status, headers, body) instead of Envoy's default bare 403.
message DeniedHttpResponse {
  HttpStatus status = 1;
  repeated HeaderValueOption headers = 2;
  string body = 3;
}

message CheckResponse {
  Status status = 1;
  // OkHttpResponse (field 3) exists upstream; we never send it.
  DeniedHttpResponse denied_response = 2;
}
