# Go reads its module and build caches from $HOME, so checks deny only the
# network; the go deps provider pre-downloads modules before any task runs.
[deps.go]
auto = true

# Regenerate deepcopy methods and CRD manifests from the api/ Go types
# (controller-gen). Run after editing any type under api/. CRDs land in the
# Helm chart's crds/ directory.
[tasks.generate]
run = """
controller-gen object paths=./api/...
controller-gen crd paths=./api/... output:crd:dir={{vars.repo_root}}/helm/crds
# controller-gen stamps a "DO NOT EDIT" header on the Go deepcopy output but not
# on CRD YAML; prepend one so the manifests aren't mistaken for hand-editable.
for f in {{vars.repo_root}}/helm/crds/*.yaml; do
  tmp=$(mktemp)
  echo '# Code generated by controller-gen. DO NOT EDIT.' > "$tmp"
  cat "$f" >> "$tmp"
  mv "$tmp" "$f"
done
"""

[tasks.check]
depends = [":check:*"]

[tasks."check:fmt"]
run = """
unformatted=$(gofmt -s -l .)
if [ -n "$unformatted" ]; then
  echo "Files not formatted:" >&2
  echo "$unformatted" >&2
  exit 1
fi
"""
sources = ["**/*.go"]
outputs = []
cache.enabled = true
deny_net = true
deny_write = true

[tasks."check:crd-backwards-compatibility"]
dir = "{{vars.repo_root}}"
sources = ["helm/crds/*.yaml"]
usage = 'flag "--baseline <ref>" help="Git ref to compare against (default: latest v* tag)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
baseline="${usage_baseline:-$(git tag -l 'v*' --sort=-v:refname | head -1)}"
if [ -z "$baseline" ]; then
  echo "crd-compat: no v* tag found for a baseline; run git fetch --tags or pass --baseline" >&2
  exit 1
fi
if ! git rev-parse -q --verify "$baseline^{commit}" >/dev/null; then
  echo "crd-compat: baseline ref '$baseline' does not resolve to a commit" >&2
  exit 1
fi
crds=helm/crds
legacy="deploy/helm/platform/crds deploy/helm/platform/files/crds" # chart locations at older baselines
config=packages/controller/crdify.yaml # downgrades description-only diffs to advisory
status=0
# CRDs deliberately retired from the platform. A removal here must ship with
# an explicit in-cluster cleanup (the retired definition carries
# helm.sh/resource-policy: keep, so Helm never deletes it itself).
removed_ok="agent-platform.ai_forks.yaml agent-platform.ai_runs.yaml" # #2987: person-scoped forks removed; runs: dam-run executor removed (local exec shim)
for f in $(git ls-tree -r --name-only "$baseline" -- "$crds" $legacy); do
  if [ ! -f "$crds/$(basename "$f")" ]; then
    case " $removed_ok " in
      *" $(basename "$f") "*)
        echo "crd-compat: $f removed deliberately — allowed"
        continue ;;
    esac
    echo "crd-compat: $f shipped in $baseline but was removed" >&2
    status=1
  fi
done
# Schema-generation bumps are enforced per-PR by check:crd-schema-generation
# (baseline = origin/main, not a release tag) so a schema change can't slip
# through against a v* tag that predates the CRDs.
for f in "$crds"/*.yaml; do
  base=""
  for dir in "$crds" $legacy; do
    if git cat-file -e "$baseline:$dir/$(basename "$f")" 2>/dev/null; then base="$baseline:$dir/$(basename "$f")"; break; fi
  done
  if [ -z "$base" ]; then
    echo "crd-compat: $f is new since $baseline — skipped"
    continue
  fi
  if ! crdify --config "$config" "git://${base%%:*}?path=${base#*:}" "file://$f"; then
    echo "crd-compat: $f is incompatible with $baseline (see findings above)" >&2
    status=1
  fi
done
exit $status
'''

# any functional CRD .spec change must bump agent-platform.ai/crd-schema-generation.
# Descriptions are stripped before comparing: the generation gate (crdcheck.Assert)
# only guards against admission pruning writes for fields an older live CRD lacks,
# which doc-only edits never cause — so a description change must not force a bump.
# Baseline is the origin/main merge-base, so every PR that touches a schema must
# bump (not just the first since a release); an unresolvable baseline is a hard
# error, never a silent skip (a v* tag predating the CRDs is how #932 slipped through).
[tasks."check:crd-schema-generation"]
dir = "{{vars.repo_root}}"
sources = ["helm/crds/*.yaml"]
usage = 'flag "--baseline <ref>" help="Git ref to compare against (default: origin/main merge-base)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${usage_baseline:-}" ]; then
  base_ref="$usage_baseline"
elif base_ref=$(git merge-base HEAD origin/main 2>/dev/null); then
  :
elif base_ref=$(git merge-base HEAD main 2>/dev/null); then
  :
else
  echo "crd-generation: cannot resolve a baseline (no origin/main or main reachable); pass --baseline <ref>" >&2
  exit 1
fi
if ! git rev-parse -q --verify "$base_ref^{commit}" >/dev/null; then
  echo "crd-generation: baseline ref '$base_ref' does not resolve to a commit" >&2
  exit 1
fi
crds=helm/crds
legacy=deploy/helm/platform/crds # chart location before the move to helm/
gen='.metadata.annotations["agent-platform.ai/crd-schema-generation"] // "0"'
spec='.spec | del(.. | .description?)' # descriptions are docs, not a functional schema change
status=0
for f in "$crds"/*.yaml; do
  base="$base_ref:$crds/$(basename "$f")"
  git cat-file -e "$base" 2>/dev/null || base="$base_ref:$legacy/$(basename "$f")"
  if ! git cat-file -e "$base" 2>/dev/null; then
    echo "crd-generation: $(basename "$f") is new since $base_ref — no prior schema to compare"
    continue
  fi
  if [ "$(git show "$base" | yq "$spec")" = "$(yq "$spec" "$f")" ]; then
    continue
  fi
  new_gen=$(yq "$gen" "$f")
  old_gen=$(git show "$base" | yq "$gen")
  if [ "$new_gen" -le "$old_gen" ]; then
    echo "crd-generation: $(basename "$f") .spec changed vs $base_ref but agent-platform.ai/crd-schema-generation is still $new_gen (was $old_gen) — bump the constant in api/v1/schema_generation.go and its +kubebuilder:metadata:annotations marker, then run mise run //packages/controller:generate" >&2
    status=1
  fi
done
exit $status
'''

# The chart's CRD manifests must be exactly what controller-gen produces from
# the api/ Go types — catches hand-edits to the "generated" YAML and Go-side
# schema changes committed without `mise run //packages/controller:generate`. The Go doc
# comments are part of the contract: they compile into the CRD descriptions,
# which is why .mise/tasks/strip-comments exempts packages/controller/api/.
[tasks."check:crd-generated"]
deny_net = true
sources = ["api/**/*.go", "{{vars.repo_root}}/helm/crds/*.yaml"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
controller-gen crd paths=./api/... output:crd:dir="$tmp"
crds={{vars.repo_root}}/helm/crds
status=0
for g in "$tmp"/*.yaml; do
  name=$(basename "$g")
  hdr="$tmp/hdr-$name"
  { echo '# Code generated by controller-gen. DO NOT EDIT.'; cat "$g"; } > "$hdr"
  if [ ! -f "$crds/$name" ]; then
    echo "crd-generated: $name is generated from api/ but missing from the chart — run: mise run //packages/controller:generate" >&2
    status=1
  elif ! diff -u "$crds/$name" "$hdr"; then
    echo "crd-generated: $name drifted from controller-gen output — run: mise run //packages/controller:generate (never edit the manifest by hand)" >&2
    status=1
  fi
done
for f in "$crds"/*.yaml; do
  if [ ! -f "$tmp/$(basename "$f")" ]; then
    echo "crd-generated: $(basename "$f") is in the chart but controller-gen no longer produces it — delete it or restore its api/ type" >&2
    status=1
  fi
done
exit $status
'''

[tasks."check:vet"]
run = "go vet ./..."
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = []
cache.enabled = true
deny_net = true

[tasks."check:staticcheck"]
run = "staticcheck ./..."
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = []
cache.enabled = true
deny_net = true

[tasks."check:build"]
run = "go build -o dist/ ./..."
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["dist/**"]
cache.enabled = true
deny_net = true

[tasks.fix]
depends = [":fix:*"]

[tasks."fix:fmt"]
run = "gofmt -s -w ."

[tasks.test]
run = "go test ./..."
# schema_generation_test.go reads the chart CRDs.
sources = ["**/*.go", "go.mod", "go.sum", "{{vars.repo_root}}/helm/crds/*.yaml"]
outputs = []
cache.enabled = true

[tasks.scan]
depends = [":scan:*"]

[tasks."scan:govulncheck"]
description = "Check the Go call graph against the vuln DB"
sources = ["**/*.go", "go.mod", "go.sum"]
usage = 'flag "--json" help="Emit govulncheck streaming JSON instead of text"'
run = '''
#!/usr/bin/env bash
set -uo pipefail
if [[ "${usage_json:-false}" == "true" ]]; then
  exec govulncheck -format json ./...
fi
exec govulncheck ./...
'''

[tasks.image]
dir = "{{vars.repo_root}}"
run = '''
#!/usr/bin/env bash
[ -n "${SKIP_IMAGE_BUILD:-}" ] && exit 0
docker build -t platform-controller:latest packages/controller/
'''

[tasks."scan:trivy"]
extends = "image:scan:trivy"

[tasks.build]
run = "CGO_ENABLED=0 go build -o dist/controller ."
