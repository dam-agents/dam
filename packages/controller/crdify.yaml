# crdify check config for controller:check:crd-backwards-compatibility.
# Description text is documentation, never cluster-breaking, and any .spec
# change (descriptions included) is already gated per-PR by
# controller:check:crd-schema-generation. So description diffs are advisory
# here, not a backwards-compatibility failure.
# `unhandled` is crdify's catch-all for schema fields it has no model for —
# x-kubernetes-validations (CEL) among them, which it cannot reason about and so
# reports as an error on sight. Every CEL rule we add would fail this gate
# forever, including ones that cannot invalidate a single stored object: the
# vm-backend rules only bite when `backend.type == "vm"`, and `backend` did not
# exist at any baseline they are compared against.
#
# Same rationale as `description` above — the change is still gated per-PR by
# controller:check:crd-schema-generation, and a CEL rule is reviewed there.
# crdify's modelled validations (removed fields, narrowed enums, newly required
# fields, tightened bounds — the changes that actually break stored objects)
# keep their default Error enforcement; only the unmodelled catch-all is
# advisory. crdify offers no narrower scope than this top-level key.
unhandledEnforcement: None

validations:
  - name: description
    enforcement: None
