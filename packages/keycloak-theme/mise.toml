[tasks.gen]
description = "Generate kc.gen.tsx from current keycloakify config"
wait_for = ["//:common:setup:pnpm"]
run = "pnpm exec keycloakify update-kc-gen"
sources = ["vite.config.ts", "package.json"]
outputs = ["src/kc.gen.tsx"]
cache = { enabled = true }

[tasks.build]
description = "Build the theme JAR (update-kc-gen + tsc + vite build + keycloakify build)"
depends = ["//:common:setup:pnpm"]
sources = ["src/**/*", "public/**/*", "vite.config.ts", "package.json"]
outputs = ["dist_keycloak/**/*"]
cache = { enabled = true }
run = '''
#!/usr/bin/env bash
set -eo pipefail
export XDG_CACHE_HOME="$PWD/node_modules/.cache"
export KEYCLOAKIFY_USE_DEFAULT_MAVEN_REPO=true
pnpm exec keycloakify update-kc-gen
pnpm exec tsc --noEmit
pnpm exec vite build
pnpm exec keycloakify build
'''

[tasks.run]
description = "Boot Keycloak in Docker with the theme JAR loaded (full-fidelity preview)"
depends = [":gen"]
# Relies on the `build-keycloak-theme` script in package.json: start-keycloak
# discovers the app-build step from it and refuses to run if it's absent.
run = "pnpm exec keycloakify start-keycloak -p ./"

[tasks.eject-page]
description = "Eject a Keycloak page into src/login/pages/ to customize it"
depends = ["//:common:setup:pnpm"]
run = "pnpm exec keycloakify eject-page"

[tasks.check]
depends = ["//:common:setup:pnpm", ":check:*"]

[tasks.fix]
depends = [":fix:*"]

[tasks.scan]
depends = [":scan:*"]

# tsc and eslint read the generated kc.gen.tsx, so they run after `gen`.
[tasks."check:tsc"]
extends = "ts:check:tsc"
depends = [":gen", { task = "^check:tsc", optional = true }]

[tasks."check:lint"]
extends = "ts:check:lint"
depends = [":gen"]

[tasks."check:format"]
extends = "ts:check:format"

[tasks."fix:lint"]
extends = "ts:fix:lint"
depends = [":gen"]

[tasks."fix:format"]
extends = "ts:fix:format"

[tasks.image]
dir = "{{vars.repo_root}}"
depends = [":build"]
run = '''
#!/usr/bin/env bash
set -eo pipefail
[ -n "${SKIP_IMAGE_BUILD:-}" ] && exit 0
docker build -f packages/keycloak-theme/Dockerfile -t platform-keycloak:latest .
'''

[tasks."scan:trivy"]
extends = "image:scan:trivy"
vars = { image = "keycloak", local_image = "platform-keycloak" }
