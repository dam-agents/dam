# Codex: `mise oci build -E codex`. Mirrors packages/agents/codex.

[tools]
"npm:@openai/codex" = "0.153.4"
"npm:@zed-industries/codex-acp" = "0.16.0"

[oci.env]
PLATFORM_HARNESS = "codex"
# Satisfies the CLI's startup check; the real credential is injected on the wire.
OPENAI_API_KEY = "dummy-placeholder"

[[oci.copy]]
host = "../../harness/codex/etc"
image = "/etc"

[[oci.copy]]
host = "../../harness/codex/usr"
image = "/usr"
