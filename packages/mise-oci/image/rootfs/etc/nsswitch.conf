# Debian's stock nsswitch.conf plus extrausers for the accounts: the image's
# `agent` user lives in /var/lib/extrausers, because a `mise oci` layer can only
# replace /etc/passwd whole and apt's maintainer scripts already wrote to it.

passwd:         files extrausers
group:          files extrausers
shadow:         files extrausers
gshadow:        files

hosts:          files dns
networks:       files

protocols:      db files
services:       db files
ethers:         db files
rpc:            db files

netgroup:       nis
