# The Debian Claude Code image as a `mise oci` config. The image task stages
# this file as the build's mise.toml; everything else in the image is rootfs/
# and agent-runtime, which the task builds on the host.
#
# It started from platform-base and claude-code and diverges from them on
# purpose: every tool is baked in, with no lazy installs, tool shims or oc.

[settings]
experimental = true
minimum_release_age = "7d"
npm.package_manager = "npm"
python.compile = false

[tools]
# 26 rather than platform-base's 24: 26.8.2 and later bundle npm 11.19.1, the
# release platform-base self-upgrades npm to, so no hook edits the install.
node = "26"
pnpm = "12.3.4"
jq = "latest"
fd = "latest"
rg = "latest"
gh = "2.101.0"
uv = "latest"
python = "3.12"
kubectl = "latest"
# Neither daemon is started for the agent: /etc/docker/daemon.json and
# /etc/rancher/k3s/config.yaml put their data on the vm Backend's disk, and
# AGENTS.md says how to start them.
k3s = "latest"
# The harness; the claude CLI rides along inside it.
"npm:@agentclientprotocol/claude-agent-acp" = "0.75.1"

# gws from its release rather than npm: mise's npm backend skips install scripts,
# and the npm package fetches its binary in one, so it would only download
# gws on first use.
[tools."http:gws"]
version = "0.22.5"

[tools."http:gws".platforms]
linux-x64 = { url = "https://github.com/googleworkspace/cli/releases/download/v{{version}}/google-workspace-cli-x86_64-unknown-linux-gnu.tar.gz" }
linux-arm64 = { url = "https://github.com/googleworkspace/cli/releases/download/v{{version}}/google-workspace-cli-aarch64-unknown-linux-gnu.tar.gz" }

# Docker's static bundle (dockerd, containerd 2.x, runc, docker-proxy) rather
# than Debian's docker.io, which is a release line behind.
[tools."http:docker"]
version = "29.8.1"

[tools."http:docker".platforms]
linux-x64 = { url = "https://download.docker.com/linux/static/stable/x86_64/docker-{{version}}.tgz" }
linux-arm64 = { url = "https://download.docker.com/linux/static/stable/aarch64/docker-{{version}}.tgz" }

# Applied by `mise oci build` into a side rootfs with the host's apt-get, maintainer
# scripts included. Fedora's list from platform-base, in Debian names, plus the
# NSS module the agent account needs and libatomic, which node 26 links against.
[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:catatonit" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:gawk" = "latest"
"apt:git" = "latest"
"apt:iptables" = "latest"
"apt:libatomic1" = "latest"
"apt:libnss-extrausers" = "latest"
"apt:openssh-server" = "latest"
"apt:openssl" = "latest"
"apt:patch" = "latest"
"apt:procps" = "latest"
"apt:unzip" = "latest"
"apt:xz-utils" = "latest"
"apt:zip" = "latest"

[oci]
from = "docker.io/library/debian:trixie-slim"
# The same MISE_DATA_DIR platform-base uses, so paths the shared scripts and
# manifests name keep resolving.
mount_point = "/usr/local/share/mise"
user = "65532"
workdir = "/app"
entrypoint = ["/usr/bin/catatonit", "--", "/usr/local/bin/agent-entrypoint"]
cmd = ["node", "dist/server.js"]

[oci.env]
# Replaces the base image's PATH rather than extending it, and the tool bin
# directories are prepended to it at build time.
PATH = "/usr/local/share/tool-bin:/app/node_modules/.bin:/usr/local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
HOME = "/home/agent"
SSL_CERT_FILE = "/etc/ssl/certs/ca-certificates.crt"
REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
PYTHONPATH = "/usr/local/lib/platform-python"
PORT = "8080"
PLATFORM_HARNESS = "claude-code"
CLAUDE_CODE_EXECUTABLE = "/usr/local/share/tool-bin/claude"
DISABLE_TELEMETRY = "1"
DISABLE_ERROR_REPORTING = "1"
DISABLE_FEEDBACK_COMMAND = "1"
DISABLE_FEEDBACK_SURVEY = "1"
DISABLE_AUTOUPDATER = "1"

[oci.labels]
"org.opencontainers.image.description" = "Experimental Debian Claude Code agent image built with mise oci"
