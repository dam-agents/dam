# Fetched by mise on the build host, then copied into /usr/local/bin rather than
# packaged as tools: a packaged tool's bin directory goes ahead of the docker and
# k3s shims on PATH, and those shims have to run first to start the daemons.
# Docker's static bundle rather than Debian's docker.io because the shared
# dam-containerd edits a containerd 2.x config, and trixie ships containerd 1.7.

[tools]
k3s = "latest"

[tools."http:docker"]
version = "29.8.1"

[tools."http:docker".platforms]
linux-x64 = { url = "https://download.docker.com/linux/static/stable/x86_64/docker-{{version}}.tgz" }
linux-arm64 = { url = "https://download.docker.com/linux/static/stable/aarch64/docker-{{version}}.tgz" }
