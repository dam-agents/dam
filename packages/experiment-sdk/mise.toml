# ruff/pytest run from the locked dev group (uv run --frozen), never uvx-latest:
# an unpinned linter changes its ruleset under CI whenever a release ships.
# The uv deps provider syncs the locked dev group before any task runs, so the
# checks can deny the network. uv writes its cache outside the tree, so writes
# are not denied.
[deps.uv]
auto = true
run = "uv sync --frozen --group dev"

[tasks.check]
depends = [":check:*"]

[tasks."check:lint"]
run = "uv run --frozen --group dev ruff check src tests"
sources = ["src/**/*.py", "tests/**/*.py", "pyproject.toml", "uv.lock"]
outputs = []
cache = { enabled = true }
deny_net = true

[tasks."check:format"]
run = "uv run --frozen --group dev ruff format --check src tests"
sources = ["src/**/*.py", "tests/**/*.py", "pyproject.toml", "uv.lock"]
outputs = []
cache = { enabled = true }
deny_net = true

[tasks.fix]
depends = [":fix:*"]

[tasks."fix:format"]
run = "uv run --frozen --group dev ruff format src tests"
deny_net = true

[tasks.test]
description = "Run the experiment SDK pytest suite against a stub platform endpoint"
run = "uv run --frozen --group dev pytest -q"
sources = ["src/**/*.py", "tests/**/*.py", "pyproject.toml", "uv.lock"]
outputs = []
cache = { enabled = true }
