# ruff/pytest run from the locked dev group (uv run --frozen), never uvx-latest:
# an unpinned linter changes its ruleset under CI whenever a release ships.
# `setup` syncs the venv once so the checks can run with the network denied.
# uv writes its cache outside the tree, so writes are not denied.
[tasks.setup]
run = "uv sync --frozen --group dev"
sources = ["pyproject.toml", "uv.lock"]
cache = { enabled = false }

[tasks.check]
depends = [":setup", ":check:*"]

[tasks."check:lint"]
wait_for = [":setup"]
run = "uv run --frozen --group dev ruff check src tests"
sources = ["src/**/*.py", "tests/**/*.py", "pyproject.toml", "uv.lock"]
outputs = []
cache = { enabled = true }
deny_net = true

[tasks."check:format"]
wait_for = [":setup"]
run = "uv run --frozen --group dev ruff format --check src tests"
sources = ["src/**/*.py", "tests/**/*.py", "pyproject.toml", "uv.lock"]
outputs = []
cache = { enabled = true }
deny_net = true

[tasks.fix]
depends = [":fix:*"]

[tasks."fix:format"]
depends = [":setup"]
run = "uv run --frozen --group dev ruff format src tests"
deny_net = true

[tasks.test]
description = "Run the experiment SDK pytest suite against a stub platform endpoint"
wait_for = [":setup"]
run = "uv run --frozen --group dev pytest -q"
sources = ["src/**/*.py", "tests/**/*.py", "pyproject.toml", "uv.lock"]
outputs = []
cache = { enabled = true }
