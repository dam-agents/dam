["db:check"]
depends = ["db:check:*"]

["db:check:tsc"]
dir = "{{config_root}}/packages/db"
depends = ["common:setup:pnpm"]
run = "pnpm exec tsc --noEmit"
sources = ["src/**/*.ts", "tsconfig.json", "../dev-config/tsconfig.base.json"]

["db:check:lint"]
dir = "{{config_root}}/packages/db"
depends = ["common:setup:pnpm"]
run = "pnpm exec eslint ."
sources = ["src/**/*.ts", "eslint.config.js", "../dev-config/eslint.base.js"]

["db:check:format"]
dir = "{{config_root}}/packages/db"
depends = ["common:setup:pnpm"]
run = "pnpm exec prettier --check 'src/**/*.ts'"
sources = ["src/**/*.ts", "../../.prettierrc"]

["db:fix"]
depends = ["db:fix:*"]

["db:fix:lint"]
dir = "{{config_root}}/packages/db"
depends = ["common:setup:pnpm"]
run = "pnpm exec eslint --fix ."

["db:fix:format"]
dir = "{{config_root}}/packages/db"
depends = ["common:setup:pnpm"]
run = "pnpm exec prettier --write 'src/**/*.ts'"

["db:new"]
description = "Scaffold the next hand-written migration + journal entry (db:new -- <name>)"
dir = "{{config_root}}/packages/db"
depends = ["common:setup:pnpm"]
run = "node scripts/new-migration.mjs"

["db:migrate"]
dir = "{{config_root}}/packages/db"
depends = ["common:setup:pnpm"]
run = "node scripts/migrate.mjs"

["db:drift"]
description = "Verify migrations reproduce schema.ts; needs Postgres via DRIFT_DATABASE_URL"
dir = "{{config_root}}/packages/db"
depends = ["common:setup:pnpm"]
run = "node scripts/check-drift.mjs"
