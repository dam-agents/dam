[tasks.check]
depends = [":check:*"]

[tasks.fix]
depends = [":fix:*"]

[tasks.scan]
depends = [":scan:*"]

[tasks."check:tsc"]
extends = "ts:check:tsc"

[tasks."check:lint"]
extends = "ts:check:lint"

[tasks."check:format"]
extends = "ts:check:format"

[tasks."fix:lint"]
extends = "ts:fix:lint"

[tasks."fix:format"]
extends = "ts:fix:format"

[tasks.test]
extends = "ts:test"

[tasks.run]
run = "pnpm exec vite"

[tasks.preview]
run = "pnpm exec vite preview"

[tasks.image]
dir = "{{vars.repo_root}}"
run = '''
#!/usr/bin/env bash
[ -n "${SKIP_IMAGE_BUILD:-}" ] && exit 0
docker build -f packages/ui/Dockerfile -t platform-ui:latest .
'''

[tasks."scan:trivy"]
extends = "image:scan:trivy"
