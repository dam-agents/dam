<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D6BE1" />
    <title>Platform – Home Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Per-weight local fallbacks for offline (file://) viewing.
         Each weight needs its own @font-face so the browser can
         select the correct file for font-weight: 600 / 700 etc. */
      @font-face { font-family: 'IBM Plex Sans'; font-weight: 300; font-display: swap; src: local('IBM Plex Sans Light'), local('IBMPlexSans-Light'); }
      @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-display: swap; src: local('IBM Plex Sans'), local('IBMPlexSans'); }
      @font-face { font-family: 'IBM Plex Sans'; font-weight: 500; font-display: swap; src: local('IBM Plex Sans Medium'), local('IBMPlexSans-Medium'); }
      @font-face { font-family: 'IBM Plex Sans'; font-weight: 600; font-display: swap; src: local('IBM Plex Sans SemiBold'), local('IBMPlexSans-SemiBold'); }
      @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; font-display: swap; src: local('IBM Plex Sans Bold'), local('IBMPlexSans-Bold'); }
      @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; font-display: swap; src: local('IBM Plex Mono'), local('IBMPlexMono'); }
      @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: local('IBM Plex Mono Medium'), local('IBMPlexMono-Medium'); }
      @font-face { font-family: 'IBM Plex Mono'; font-weight: 600; font-display: swap; src: local('IBM Plex Mono SemiBold'), local('IBMPlexMono-SemiBold'); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mock/main-prototype.tsx"></script>
  </body>
</html>
