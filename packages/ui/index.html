<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Runs AI agents in isolated sandboxes. An AI agent drives it with the dam CLI: read /llms.txt." />
    <meta name="theme-color" content="#0F62FE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/api/brand/icon.svg" />
    <link rel="apple-touch-icon" href="/api/brand/icon-180.png" />
    <link rel="manifest" href="/api/brand/manifest.webmanifest" />
    <!-- The title is filled in by the deployment's nginx and again at runtime
         by src/brand.ts after fetching /api/brand; apple-mobile-web-app-title
         is set by brand.ts alone. The PWA manifest is served dynamically by
         the api-server. -->
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      <p>This web app needs JavaScript.</p>
      <p>
        An AI agent drives this deployment with the <code>dam</code> CLI and its
        skill: read <a href="/llms.txt">/llms.txt</a>, or install the skill
        with <code>npx skills add &lt;this URL&gt; -g</code>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
