<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Cards — Slack Discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    :root {
      --bg: #ffffff;
      --fg: #121619;
      --muted: #f2f4f8;
      --muted-fg: #4d5358;
      --border: #dde1e6;
      --card: #ffffff;
      --accent: #0f62fe;
      --success-light: #defbe6;
      --success: #24a148;
      --warning: #ff832b;
      --template: #7c3aed;
      --template-light: #f5f3ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --fg: #f4f4f4;
        --muted: #262626;
        --muted-fg: #c6c6c6;
        --border: #393939;
        --card: #1e1e1e;
        --accent: #4589ff;
        --success-light: #044317;
        --success: #42be65;
        --warning: #ff832b;
        --template: #a78bfa;
        --template-light: #1e1533;
      }
    }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 40px 5%;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.65px;
      margin-bottom: 8px;
    }
    .description {
      font-size: 14px;
      color: var(--muted-fg);
      margin-bottom: 32px;
    }
    .toggle-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .toggle-btn {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .toggle-btn.active {
      background: var(--fg);
      color: var(--bg);
    }
    .toggle-btn:not(.active) {
      background: var(--muted);
      color: var(--muted-fg);
    }
    .toggle-btn:not(.active):hover {
      color: var(--fg);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      padding: 16px 20px;
      transition: background 0.15s;
    }
    .card:hover {
      background: color-mix(in srgb, var(--muted) 40%, var(--card));
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .card-name {
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-subtitle {
      font-size: 14px;
      color: var(--muted-fg);
      margin-top: 4px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 9999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-success {
      background: var(--success-light);
      color: var(--success);
    }
    .badge-muted {
      background: var(--muted);
      color: var(--muted-fg);
    }
    .badge-warning {
      background: color-mix(in srgb, var(--warning) 15%, transparent);
      color: var(--warning);
    }
    .badge-template {
      background: var(--template-light);
      color: var(--template);
    }
    .slack-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .slack-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--muted);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .slack-chip img {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .slack-chip span {
      font-size: 14px;
      color: var(--muted-fg);
    }
    /* Row style (current) */
    .row {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.15s;
    }
    .row:hover {
      background: color-mix(in srgb, var(--muted) 40%, var(--card));
    }
    .row-left { min-width: 0; flex: 1; }
    .row-right { flex-shrink: 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Agent Cards — Slack Discovery</h1>
  <p class="description">Preview of agent cards with Slack channel indicators. Toggle to compare with the current row layout.</p>

  <div class="toggle-bar">
    <button class="toggle-btn" id="btn-rows" onclick="toggle('rows')">Current rows</button>
    <button class="toggle-btn active" id="btn-cards" onclick="toggle('cards')">New cards</button>
  </div>

  <div id="cards-view" class="card-list"></div>
  <div id="rows-view" class="card-list hidden"></div>

  <script>
    const agents = [
      { name: "Frontend Engineer", kind: null, state: "running", subtitle: "claude-code:latest", channels: [{ id: "frontend-dev" }] },
      { name: "Backend API Agent", kind: null, state: "running", subtitle: "claude-code:latest", channels: [{ id: "backend-eng" }, { id: "incidents" }] },
      { name: "Infra Bot", kind: null, state: "hibernated", subtitle: "claude-code:latest", channels: [] },
      { name: "Test Runner", kind: null, state: "running", subtitle: "claude-code:latest", channels: [{ id: "ci-alerts" }] },
      { name: "Platform Docs", kind: "knowledge-base", state: "running", subtitle: "Knowledge base", channels: [{ id: "ask-platform" }] },
      { name: "HR Policy Bot", kind: "knowledge-base", state: "hibernated", subtitle: "Knowledge base", channels: [] },
      { name: "Security Runbooks", kind: "knowledge-base", state: "running", subtitle: "Knowledge base", channels: [{ id: "security-ops" }, { id: "incident-response" }] },
    ];

    const stateLabel = { running: "Running", hibernated: "Hibernating", starting: "Starting", error: "Error" };
    const stateClass = { running: "badge-success", hibernated: "badge-muted", starting: "badge-warning", error: "badge-warning" };

    function renderCards() {
      const el = document.getElementById("cards-view");
      el.innerHTML = agents.map(a => `
        <div class="card">
          <div class="card-top">
            <div style="min-width:0;flex:1">
              <div class="card-name">
                ${a.name}
                ${a.kind === "knowledge-base" ? '<span class="badge badge-template">Knowledge base</span>' : ""}
              </div>
              <div class="card-subtitle">${a.subtitle}</div>
            </div>
            <span class="badge ${stateClass[a.state]}">${stateLabel[a.state]}</span>
          </div>
          ${a.channels.length ? `
            <div class="slack-row">
              ${a.channels.map(ch => `
                <span class="slack-chip">
                  <img src="/icons/slack.svg" alt="" />
                  <span>#${ch.id}</span>
                </span>
              `).join("")}
            </div>
          ` : ""}
        </div>
      `).join("");
    }

    function renderRows() {
      const el = document.getElementById("rows-view");
      el.innerHTML = agents.map(a => `
        <div class="row">
          <div class="row-left">
            <div class="card-name">
              ${a.name}
              ${a.kind === "knowledge-base" ? '<span class="badge badge-template">Knowledge base</span>' : ""}
            </div>
            <div class="card-subtitle">${a.subtitle}</div>
          </div>
          <div class="row-right">
            <span class="badge ${stateClass[a.state]}">${stateLabel[a.state]}</span>
          </div>
        </div>
      `).join("");
    }

    function toggle(mode) {
      document.getElementById("cards-view").classList.toggle("hidden", mode !== "cards");
      document.getElementById("rows-view").classList.toggle("hidden", mode !== "rows");
      document.getElementById("btn-cards").classList.toggle("active", mode === "cards");
      document.getElementById("btn-rows").classList.toggle("active", mode === "rows");
    }

    renderCards();
    renderRows();
  </script>
</body>
</html>
