["bench:check"]
depends = ["bench:check:*"]

["bench:check:tsc"]
dir = "{{config_root}}/packages/bench"
depends = ["common:setup:pnpm"]
run = "pnpm exec tsc --noEmit"
sources = ["src/**/*.ts", "tsconfig.json", "../dev-config/tsconfig.base.json"]

["bench:check:lint"]
dir = "{{config_root}}/packages/bench"
depends = ["common:setup:pnpm"]
run = "pnpm exec eslint ."
sources = ["src/**/*.ts", "eslint.config.js", "../dev-config/eslint.base.js"]

["bench:check:format"]
dir = "{{config_root}}/packages/bench"
depends = ["common:setup:pnpm"]
run = "pnpm exec prettier --check 'src/**/*.ts'"
sources = ["src/**/*.ts", "../../.prettierrc"]

["bench:fix"]
depends = ["bench:fix:*"]

["bench:fix:lint"]
dir = "{{config_root}}/packages/bench"
depends = ["common:setup:pnpm"]
run = "pnpm exec eslint --fix ."

["bench:fix:format"]
dir = "{{config_root}}/packages/bench"
depends = ["common:setup:pnpm"]
run = "pnpm exec prettier --write 'src/**/*.ts'"

["bench:session-load"]
description = "Session-load latency benchmark (pass args after --: seed | run | report)"
dir = "{{config_root}}/packages/bench"
depends = ["common:setup:pnpm"]
run = "pnpm exec tsx src/main.ts"
