# The nous config environment, packed onto the default image.

[tools."pipx:AI-native-Systems-Research/agentic-strategy-evolution"]
version = "v0.5.0"

[oci.env]
# Its root generation segment, after the default image's key (oci's build_thin).
PLATFORM_ROOT_GENERATION = "nous-1"
NOUS_VENV = "/opt/nous-venv"
NOUS_ALLOW_AUTO_APPROVE = "1"
NOUS_CAMPAIGN_PARENT = "/home/agent/nous-campaigns"
NO_PROXY = "127.0.0.1,localhost,::1"
no_proxy = "127.0.0.1,localhost,::1"
