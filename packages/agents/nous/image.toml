# The nous config environment over claude-code's: mise -E claude-code,nous.

# The postinstall teaches the campaign schema `channels:`, which the channel
# bridge relies on (upstream issue 296).
[tools."pipx:AI-native-Systems-Research/agentic-strategy-evolution"]
version = "v0.4.0"
postinstall = '"$MISE_TOOL_INSTALL_PATH/nous/bin/python" {{config_root}}/nous/patch-campaign-schema.py'

[oci.env]
NOUS_VENV = "/opt/nous-venv"
NOUS_ALLOW_AUTO_APPROVE = "1"
NOUS_CAMPAIGN_PARENT = "/home/agent/nous-campaigns"
NO_PROXY = "127.0.0.1,localhost,::1"
no_proxy = "127.0.0.1,localhost,::1"
