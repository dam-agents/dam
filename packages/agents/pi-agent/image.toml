# Pi: this agent's config environment, `mise oci build -E pi-agent`, staged as
# mise/conf.d/harness.pi-agent.toml over base/base.toml. The copies name this
# directory's rootfs/ as the oci task stages it, harness/pi-agent/.

[tools]
"npm:@earendil-works/pi-coding-agent" = "0.85.1"
"npm:pi-acp" = "0.0.33"
"npm:@zhafron/pi-memory" = "1.0.2"

[oci.env]
PLATFORM_HARNESS = "pi"
PI_SKIP_VERSION_CHECK = "1"

[[oci.copy]]
host = "../../harness/pi-agent/app"
image = "/app"

[[oci.copy]]
host = "../../harness/pi-agent/usr"
image = "/usr"
