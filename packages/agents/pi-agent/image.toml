[tools]
"npm:@earendil-works/pi-coding-agent" = "1.3.0"
"npm:pi-acp" = "0.0.34"
# Offline pi installs no settings package, so pi-platform loads this one.
# aube refuses it by default for its few weekly downloads; 1.0.2 was reviewed.
"npm:@zhafron/pi-memory" = { version = "1.0.2", allow_low_downloads = true }

[oci.env]
PLATFORM_HARNESS = "pi"
# No startup calls to pi.dev (model catalog, version check, install telemetry)
# for the gateway to hold for approval.
PI_OFFLINE = "1"
PI_ACP_PI_COMMAND = "/usr/local/bin/pi-platform"
# Pi refuses to connect an MCP server whose header names an unset variable, so
# a pi that serves no platform session (a terminal, `pi mcp list`) sends a blank
# session ref, which the request trims to none. pi-acp-patch.mjs sets each chat
# session's own.
PLATFORM_SESSION_REF = " "
