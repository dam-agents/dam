# Pi: this agent's config environment, `mise oci build -E pi-agent`. The oci
# task stages it as mise/conf.d/harness.pi-agent.toml over base/base.toml, with
# this directory's rootfs/ at the same path, so copies climb out of conf.d.

[tools]
"npm:@earendil-works/pi-coding-agent" = "0.85.1"
"npm:pi-acp" = "0.0.33"
"npm:@zhafron/pi-memory" = "1.0.2"

[oci.env]
PLATFORM_HARNESS = "pi"
PI_SKIP_VERSION_CHECK = "1"

[[oci.copy]]
host = "../../pi-agent/rootfs/app"
image = "/app"

[[oci.copy]]
host = "../../pi-agent/rootfs/usr"
image = "/usr"
