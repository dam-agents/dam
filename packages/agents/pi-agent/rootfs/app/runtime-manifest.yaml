# Pi-agent manifest. Built-in drivers are on by default; this declares only the
# Pi-specific harness-config: model -> defaultModel, thinking level -> the ACP
# "mode" (defaultThinkingLevel). Pi's models are connection-dependent, so they're
# discovered at runtime (modelDiscovery) rather than listed statically.
manifestVersion: 1

drivers:
  harness-config:
    file: "$HOME/.pi/agent/settings.json"
    keys:
      model: "defaultModel"
      mode: "defaultThinkingLevel"
    catalog:
      options:
        - id: model
          name: Model
          description: AI model to use
          category: model
          choices: []
        - id: mode
          name: Thinking
          description: Reasoning effort level
          category: thought_level
          choices:
            - value: "off"
              name: "Off"
              description: "No extended thinking"
            - value: minimal
              name: "Minimal"
            - value: low
              name: "Low"
            - value: medium
              name: "Medium"
            - value: high
              name: "High"
            - value: xhigh
              name: "Extra High"
    # Sources in priority order; the first whose variable is set answers.
    # A Bedrock connection names the region's control-plane endpoint, which
    # lists the inference profiles invocable from that region; it comes first
    # because pi-dynamic-providers makes Bedrock the default provider whenever
    # a Bedrock connection is present. The OpenAI-compatible variables name an
    # endpoint the agent was pointed at — it fronts no provider of its own, so
    # either justifies a seeded model.
    modelDiscovery:
      - urlEnv:
          - AWS_ENDPOINT_URL_BEDROCK
        redirectEnv:
          - AWS_ENDPOINT_URL_BEDROCK
        pinEnv:
          - AWS_BEDROCK_MODEL
        path: "/inference-profiles?maxResults=1000"
        shape: bedrock-inference-profiles
      - urlEnv:
          - OPENAI_PROXY_URL
          - OPENAI_BASE_URL
        redirectEnv:
          - OPENAI_PROXY_URL
          - OPENAI_BASE_URL
        pinEnv:
          - OPENAI_PROXY_MODEL
          - OPENAI_MODEL
