[tasks.image]
extends = "agent:image"
description = "Build the gepa agent image (GEPA on the claude-code base), or reuse it from the registry when its source is unchanged"
depends = ["//packages/agents/claude-code:image"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# The Dockerfile pins a default; override it here with GEPA_VERSION=<value>.
build_args=()
[ -n "${GEPA_VERSION:-}" ] && build_args+=(--build-arg "GEPA_VERSION=${GEPA_VERSION}")
# ${build_args[@]+...} guards the empty-array expansion under `set -u` (bash 3.2 on macOS).
exec scripts/resolve-image.sh build-or-reuse gepa -- ${build_args[@]+"${build_args[@]}"} packages/agents/gepa
'''

[tasks.scan]
depends = [":scan:*"]

[tasks."scan:trivy"]
extends = "image:scan:trivy"
