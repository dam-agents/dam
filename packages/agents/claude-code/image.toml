# The claude-code config environment over base/base.toml: mise -E claude-code.

# The claude CLI the adapter bundles, linked beside the adapter's own bin.
[tools."npm:@agentclientprotocol/claude-agent-acp"]
version = "0.75.1"
postinstall = 'cd "$MISE_TOOL_INSTALL_PATH/bin" && ln -s ../lib/node_modules/@agentclientprotocol/claude-agent-acp/node_modules/@anthropic-ai/claude-agent-sdk-linux-*/claude claude'

[oci.env]
PLATFORM_HARNESS = "claude-code"
# No telemetry for the gateway to hold for approval; the CLI rides the pin.
DISABLE_TELEMETRY = "1"
DISABLE_ERROR_REPORTING = "1"
DISABLE_FEEDBACK_COMMAND = "1"
DISABLE_FEEDBACK_SURVEY = "1"
DISABLE_AUTOUPDATER = "1"

[[oci.copy]]
host = "../../claude-code/rootfs/app"
image = "/app"

[[oci.copy]]
host = "../../claude-code/rootfs/etc"
image = "/etc"

[[oci.copy]]
host = "../../claude-code/rootfs/usr"
image = "/usr"
