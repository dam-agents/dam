# Claude Code manifest. Built-in drivers are on by default; this declares only
# the Claude-specific harness-config, writing model/mode/effort defaults into
# $HOME/.claude/settings.json. Models use concrete aliases (opus/sonnet/haiku),
# never Claude's `default` alias — that resolves to a model the account can't reach.
manifestVersion: 1

# Claude Code's gateway model discovery keeps ids containing "claude",
# lowercased, so every catalog name reaches it as claude/<alias>/<id>.
# claudeTiers: the runtime fills the ANTHROPIC_DEFAULT_*_MODEL tier variables.
# The slots are the default provider's, so the router moves a side call on one
# (a title, a WebFetch summary, an alias-named subagent) to the session's
# provider by tier. The classifier's model comes from
# classifierModelEnv below, which is the name Claude Code sends; the router
# sends that call, one Claude Code classes as auxiliary, to the session
# provider's classifier, unless the session runs server-side auto mode (a
# Claude model on Anthropic or IBM, and no non-Claude subagent model), so a
# session moved elsewhere follows itself. A subagent or workflow agent naming
# that model is work and keeps the side-call rule.
# The context window takes two mechanisms, because Claude Code keeps no window
# from /v1/models: discovery parses each model as {id, display_name,
# description} and throws the rest away, and the per-model modelConfig route is
# off. CLAUDE_CODE_MAX_CONTEXT_TOKENS is the widest window, which is not a cap
# but the window an id it does not recognise runs with; every model it may run
# on gets its own window under modelSettings below, re-read per model, so a
# mid-session switch follows. A repo's own .claude/settings.json with a
# top-level autoCompactWindow replaces that map, and CLAUDE_CODE_AUTO_COMPACT_WINDOW
# would override every entry, so neither is set.
modelRouter:
  dialects: [anthropic-messages]
  sessionModel: { configOption: model }
  namePrefix: "claude/"
  lowercaseNames: true
  claudeTiers: true
  # Bedrock has paths and a stream of its own, so its Connection lists Claude
  # Code's own tier names and a session on one runs in its own Claude process
  # in Bedrock mode; the router passes its calls on unchanged.
  native:
    templates: [bedrock]
    models: [fable, opus, sonnet, haiku]
  # Auto mode asks the server to check each action on the model call itself,
  # and only a Claude model answers; a reply without the check makes Claude
  # Code warn and pay for classifier calls of its own. A session whose model or
  # subagent model is not Claude runs in a Claude process that does not ask.
  nonClaudeModelEnv:
    CLAUDE_CODE_AUTO_MODE_SERVER: "0"
  # Auto mode's classifier model, which Claude Code takes from its own knob
  # (inert below 2.1.302): a routed process is told the platform's preferred
  # classifier on the agent's default provider, so Claude Code has a name to
  # send. The router recognizes that name on an auxiliary call and sends it to
  # the session provider's classifier, or to the session's own model where
  # that provider lists none; a session in server-side auto mode keeps the
  # call. Both read the catalog when the call arrives, so a replaced listing
  # reaches a running process only when it recycles.
  # The Sonnet slot stays what it says, so a sonnet-aliased subagent still
  # runs where the person put it.
  classifierModelEnv: CLAUDE_CODE_AUTO_MODE_MODEL

# Claude Code sets the session's id on every shell command it runs, the same
# id the platform knows the session by; git records it in its trace, so a
# commit or push links the session that ran it.
sessionEnvVar: CLAUDE_CODE_SESSION_ID

# Declared so the runtime answers initialize before any harness process runs.
# Re-captured from the image pin by test:harness-initialize-capabilities.
initializeCapabilities:
  agentCapabilities: {"_meta": {"claudeCode": {"promptQueueing": true}, "authStatus": {}}, "promptCapabilities": {"image": true, "embeddedContext": true}, "mcpCapabilities": {"http": true, "sse": true}, "auth": {"logout": {}}, "providers": {}, "loadSession": true, "sessionCapabilities": {"additionalDirectories": {}, "close": {}, "delete": {}, "fork": {}, "list": {}, "resume": {}, "systemPrompt": {"mode": {"override": {}}}}}
  authMethods: []
  agentInfo: {"name": "@agentclientprotocol/claude-agent-acp", "title": "Claude Agent"}

# Claude Code reports whether it still works after it answered a prompt — a
# follow-up turn that handles the reports of its background agents — so a run
# ends, and its session closes, only once Claude Code is idle.
harnessState: claude-code

# claude-agent-acp takes a message into the running turn (_session/steering).
# Declared so a session result says so before any harness process runs;
# checked against the live initialize by test:harness-initialize-capabilities.
steering: native

# Cold session/load fills the runtime's transcript from Claude Code's on-disk
# session store without spawning the claude subprocess; the harness itself is
# loaded lazily on the first prompt. The module is hosted in a persistent
# runtime worker and imports the adapter as soon as the worker starts, so the
# first load after a wake does not wait about 450 ms for that import on a vm
# machine. To dump a session's replay by hand, call the lib's
# loadHistory from a node one-liner in the machine.
sessionHistory:
  module: "/usr/local/lib/harness-history-lib.mjs"
  exportName: "loadHistory"

# A rewind or a take-back cuts the closed session's on-disk conversation in
# place, under the same id, instead of forking it. Through the adapter a cut
# would be replayed whenever it rebuilds the session's query, so the module
# drives the bundled SDK itself, in a runtime worker of its own.
sessionCut:
  module: "/usr/local/lib/harness-cut-lib.mjs"
  exportName: "cutSession"

# claude-agent-acp is an adapter: each session's conversation runs in a
# `claude` process under it, usually the machine's largest. The memory reaper must
# never take one of those for a tool the agent started.
agentProcesses: ["claude"]

drivers:
  harness-config:
    file: "$HOME/.claude/settings.json"
    sessionModel: true
    # What one session can pick for itself. Mode and effort change inside the
    # live session; the cache TTL is read from the env at start, so a session
    # that picks one runs in a Claude process of its own.
    # claude-agent-acp has no config option for the subagent model, so it is
    # read from the env at start and a session that picks one runs in a Claude
    # process of its own.
    sessionSettings:
      mode: { mode: true, deriveStartMode: true }
      effort: { configOption: effort }
      cacheTtl: { env: [CLAUDE_CODE_PROMPT_CACHE_TTL, CLAUDE_CODE_SUBAGENT_PROMPT_CACHE_TTL] }
      subagentModel: { env: [CLAUDE_CODE_SUBAGENT_MODEL] }
      subagentEffort: { router: true }
    keys:
      model: "model"
      mode: "permissions.defaultMode"
      configOptions:
        effort: "effortLevel"
        cacheTtl: ["promptCacheTtl", "subagentPromptCacheTtl"]
    # The model value that switches one session to what the agent's own
    # Default gives (Claude Code's built-in default), which a schedule with no
    # model runs on.
    defaultModel: default
    # Claude Code takes no window from /v1/models, and
    # CLAUDE_CODE_MAX_CONTEXT_TOKENS is not a cap but the window an id it does
    # not recognise runs with, so every model gets its own here, applied as
    # min(its window, this). Re-read per model, so a mid-session switch follows.
    modelAutoCompactWindow:
      keyPath: modelSettings
      field: autoCompactWindow
      unknownWindow: 200000
    catalog:
      options:
        - id: model
          name: Model
          description: AI model to use
          category: model
          choices:
            - value: fable
              name: "Fable"
              description: "Fable 5.1 · Most capable for the hardest, longest-running tasks"
            - value: opus
              name: "Opus"
              description: "Opus 5.5 · Best for everyday, complex tasks"
            - value: sonnet
              name: "Sonnet"
              description: "Sonnet 5.5 · Efficient for routine tasks"
            - value: haiku
              name: "Haiku"
              description: "Haiku 4.5 · Fastest for quick answers"
        # No fixed choices: the picker offers the catalog.
        - id: subagentModel
          name: Subagent model
          description: Model Claude Code's subagents run on
          category: model
          subagents: true
          choices: []
        - id: mode
          name: Mode
          description: Session permission mode
          category: mode
          default: "auto"
          choices:
            - value: auto
              name: "Auto"
              description: "Use a model classifier to approve/deny permission prompts"
            - value: default
              name: "Ask for approvals"
              description: "Ask for permission before dangerous operations"
              needsApproval: true
            - value: acceptEdits
              name: "Accept edits"
              description: "Auto-accept file edit operations"
              needsApproval: true
            - value: plan
              name: "Plan mode"
              description: "Planning mode, no actual tool execution"
              needsApproval: true
            - value: dontAsk
              name: "Don't ask"
              description: "Don't prompt for permissions, deny if not pre-approved"
            - value: bypassPermissions
              name: "Bypass permissions"
              description: "Bypass all permission checks"
        # Claude Code's persisted effortLevel setting accepts low|medium|high|xhigh.
        # "max" is session-only (/effort, --effort, CLAUDE_CODE_EFFORT_LEVEL accept
        # it, gated to Opus 4.7+/Fable): Claude Code never persists it, and its
        # settings.json schema silently drops it — so it must not be offered here.
        - id: effort
          name: Effort
          description: Reasoning effort level
          category: thought_level
          default: "medium"
          choices:
            - value: low
              name: "Low"
            - value: medium
              name: "Medium"
            - value: high
              name: "High"
            - value: xhigh
              name: "Extra High"
              description: "May use excessive tokens. Use sparingly for the hardest tasks."
        # The router writes it over the effort of each call Claude Code marks as
        # a subagent's, and only where Claude Code sent one.
        - id: subagentEffort
          name: Subagent effort
          description: Reasoning effort of Claude Code's subagents
          category: thought_level
          subagents: true
          choices:
            - value: low
              name: "Low"
            - value: medium
              name: "Medium"
            - value: high
              name: "High"
            - value: xhigh
              name: "Extra High"
              description: "May use excessive tokens. Use sparingly for the hardest tasks."
        # promptCacheTtl and subagentPromptCacheTtl need Claude Code 2.1.242+.
        # Unset, Claude Code picks 1h only for a subscription's main conversation;
        # subagents, an API key and a cloud provider get 5m.
        - id: cacheTtl
          name: Prompt cache
          description: How long the prompt cache of the conversation and its subagents survives between turns
          category: cache
          default: "5m"
          choices:
            - value: 5m
              name: "5 minutes"
              description: "Cheaper cache writes · Expires after 5 idle minutes"
            - value: 1h
              name: "1 hour"
              description: "Survives long pauses between turns · Cache writes cost more"
      # Haiku supports neither "auto" mode nor effort levels.
      modelConstraints:
        haiku:
          mode: ["default", "acceptEdits", "plan", "dontAsk", "bypassPermissions"]
          effort: []
          subagentEffort: []
    # On a LiteLLM provider the tiers above all resolve to the gateway's
    # "latest" model, so the provider's other models are listed after them.
    # Names match what the router publishes (and /model writes):
    # lowercased, claude/-prefixed. No redirectEnv: the gateway maps the tiers,
    # so nothing is seeded.
    modelDiscovery:
      urlEnv:
        - ANTHROPIC_BASE_URL
      tokenEnv:
        - ANTHROPIC_AUTH_TOKEN
        - ANTHROPIC_API_KEY
      namePrefix: "claude/"
      lowercaseNames: true
      extendsCatalog: true
