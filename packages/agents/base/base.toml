# Shared by every `mise oci` agent image; each agent's image.toml is a config
# environment over it. Staged by //packages/agents:image as mise/conf.d/base.toml.

[tools]
node = "26"
pnpm = "12.3.4"
jq = "latest"
fd = "latest"
rg = "latest"
gh = "2.101.0"
uv = "latest"
python = "3.12"
kubectl = "latest"
k3s = "latest"

# The static bundle: trixie's docker.io is a release line behind.
[tools."http:docker"]
version = "29.8.1"

[tools."http:docker".platforms]
linux-x64 = { url = "https://download.docker.com/linux/static/stable/x86_64/docker-{{version}}.tgz" }
linux-arm64 = { url = "https://download.docker.com/linux/static/stable/aarch64/docker-{{version}}.tgz" }

# libatomic1 for node 26, libnss-extrausers for the agent account.
[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:catatonit" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:gawk" = "latest"
"apt:git" = "latest"
"apt:iptables" = "latest"
"apt:libatomic1" = "latest"
"apt:libnss-extrausers" = "latest"
"apt:openssh-server" = "latest"
"apt:openssl" = "latest"
"apt:patch" = "latest"
"apt:procps" = "latest"
"apt:unzip" = "latest"
"apt:xz-utils" = "latest"
"apt:zip" = "latest"

[oci]
# Google's mirror: no Docker Hub rate limit on CI.
from = "mirror.gcr.io/library/debian:trixie-slim"
mount_point = "/usr/local/share/mise"
user = "65532"
workdir = "/app"
entrypoint = ["/usr/bin/catatonit", "--", "/usr/local/bin/agent-entrypoint"]
cmd = ["node", "dist/server.js"]

[oci.env]
# mise prepends the tool bin directories.
PATH = "/app/node_modules/.bin:/usr/local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
HOME = "/home/agent"
SSL_CERT_FILE = "/etc/ssl/certs/ca-certificates.crt"
REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
PYTHONPATH = "/usr/local/lib/platform-python"
PORT = "8080"
