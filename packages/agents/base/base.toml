# Shared by every agent image; each harness's and workload's image.toml is a
# config environment over it. Staged by //packages/agents:oci as
# mise/conf.d/base.toml; its [oci] and [oci.env] are the images' config.

[tools]
node = "26"
aube = "latest"
jq = "latest"
fd = "latest"
rg = "latest"
gh = "2.101.0"
uv = "latest"
python = "3.12"
kubectl = "latest"
k3s = "latest"
"npm:playwright" = "1.63.0"
"npm:agent-browser" = "0.38.1"

# The static bundle: trixie's docker.io is a release line behind.
[tools."http:docker"]
version = "29.8.1"

[tools."http:docker".platforms]
linux-x64 = { url = "https://download.docker.com/linux/static/stable/x86_64/docker-{{version}}.tgz" }
linux-arm64 = { url = "https://download.docker.com/linux/static/stable/aarch64/docker-{{version}}.tgz" }

# docker's CLI plugins, which the image task links where docker looks for them.
# buildx's releases carry a provenance file mise would otherwise pick.
[tools."github:docker/buildx"]
version = "latest"
bin = "docker-buildx"

[tools."github:docker/buildx".platforms]
linux-x64 = { asset_pattern = "buildx-v{{ version }}.linux-amd64" }
linux-arm64 = { asset_pattern = "buildx-v{{ version }}.linux-arm64" }

[tools."github:docker/compose"]
version = "latest"

[oci]
user = "65532"
workdir = "/app"
entrypoint = ["/usr/bin/catatonit", "--", "/usr/local/bin/agent-entrypoint"]
cmd = ["node", "dist/server.js"]

[oci.env]
# mise prepends the tool bin directories. The agent's own aube globals come
# last, so nothing in the home shadows an image tool.
PATH = "/app/node_modules/.bin:/usr/local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/agent/.local/share/aube/bin"
HOME = "/home/agent"
SSL_CERT_FILE = "/etc/ssl/certs/ca-certificates.crt"
REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
PYTHONPATH = "/usr/local/lib/platform-python"
PORT = "8080"
# apt-get on a machine never waits on a prompt nobody can answer.
DEBIAN_FRONTEND = "noninteractive"
PLAYWRIGHT_BROWSERS_PATH = "/opt/ms-playwright"
# agent-browser's defaults make every command run on the one browser the user
# sees in the browser panel: Playwright's Chromium, headed on the virtual
# display platform-display runs and streams to the panel, a kiosk window with
# sound, on a profile that keeps the user's sign-ins. A flag still overrides
# its variable. Containers have no user namespaces for Chromium's sandbox, and
# a container's 64 MB /dev/shm crashes a heavy page's renderer, so Chromium
# keeps its shared memory in /tmp. Chromium's own Google account check and
# push-messaging check-in point at a closed loopback port: the gateway would
# hold each one for approval, though no page asked for it. The rest of its
# background traffic is off by policy (/etc/opt/chrome_for_testing/policies).
AGENT_BROWSER_EXECUTABLE_PATH = "/opt/ms-playwright/chromium"
AGENT_BROWSER_HEADED = "1"
AGENT_BROWSER_NO_XVFB = "1"
AGENT_BROWSER_PROFILE = "/home/agent/.local/share/platform/browser"
AGENT_BROWSER_SOCKET_DIR = "/tmp/agent-browser"
AGENT_BROWSER_ARGS = "--no-sandbox,--disable-dev-shm-usage,--kiosk,--hide-scrollbars,--no-first-run,--test-type,--disable-infobars,--autoplay-policy=no-user-gesture-required,--ozone-platform=x11,--gaia-url=http://127.0.0.1:9/,--gcm-checkin-url=http://127.0.0.1:9/checkin,--gcm-mcs-endpoint=http://127.0.0.1:9,--gcm-registration-url=http://127.0.0.1:9/register"
DISPLAY = ":99"
XDG_RUNTIME_DIR = "/tmp/platform-display"
PULSE_SERVER = "unix:/tmp/platform-display/pulse/native"
# A vm machine keeps its whole root while it boots images of one generation,
# so a deploy keeps what the agent installed outside HOME. Bump it only for a
# change that breaks a root an older image left: a new Debian release, or a
# file the entrypoint rewrites on every boot (/etc/passwd) changing in the
# image. A bump starts every machine on an empty root.
PLATFORM_ROOT_COMPAT = "1"
