# Shared by every `mise oci` agent image; each agent's image.toml is a config
# environment over it. Staged by //packages/agents:image as mise/conf.d/base.toml.

[tools]
node = "26"
aube = "latest"
jq = "latest"
fd = "latest"
rg = "latest"
gh = "2.101.0"
uv = "latest"
python = "3.12"
kubectl = "latest"
k3s = "latest"
"npm:playwright" = "1.63.0"
"npm:agent-browser" = "0.38.1"

# The static bundle: trixie's docker.io is a release line behind.
[tools."http:docker"]
version = "29.8.1"

[tools."http:docker".platforms]
linux-x64 = { url = "https://download.docker.com/linux/static/stable/x86_64/docker-{{version}}.tgz" }
linux-arm64 = { url = "https://download.docker.com/linux/static/stable/aarch64/docker-{{version}}.tgz" }

# libatomic1 for node 26, libnss-extrausers for the agent account, and from
# libasound2t64 on, what Playwright lists for its Chromium on trixie.
[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:catatonit" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:gawk" = "latest"
"apt:git" = "latest"
"apt:iptables" = "latest"
"apt:libatomic1" = "latest"
"apt:libnss-extrausers" = "latest"
"apt:openssh-server" = "latest"
"apt:openssl" = "latest"
"apt:patch" = "latest"
"apt:procps" = "latest"
"apt:unzip" = "latest"
"apt:xz-utils" = "latest"
"apt:zip" = "latest"
"apt:libasound2t64" = "latest"
"apt:libatk-bridge2.0-0t64" = "latest"
"apt:libatk1.0-0t64" = "latest"
"apt:libatspi2.0-0t64" = "latest"
"apt:libcairo2" = "latest"
"apt:libcups2t64" = "latest"
"apt:libdbus-1-3" = "latest"
"apt:libdrm2" = "latest"
"apt:libgbm1" = "latest"
"apt:libglib2.0-0t64" = "latest"
"apt:libnspr4" = "latest"
"apt:libnss3" = "latest"
"apt:libpango-1.0-0" = "latest"
"apt:libx11-6" = "latest"
"apt:libxcb1" = "latest"
"apt:libxcomposite1" = "latest"
"apt:libxdamage1" = "latest"
"apt:libxext6" = "latest"
"apt:libxfixes3" = "latest"
"apt:libxkbcommon0" = "latest"
"apt:libxrandr2" = "latest"
"apt:libfontconfig1" = "latest"
"apt:libfreetype6" = "latest"
"apt:fonts-liberation" = "latest"
"apt:fonts-noto-color-emoji" = "latest"
"apt:fonts-freefont-ttf" = "latest"
"apt:fonts-ipafont-gothic" = "latest"
"apt:fonts-wqy-zenhei" = "latest"
"apt:fonts-tlwg-loma-otf" = "latest"
"apt:fonts-unifont" = "latest"
"apt:xfonts-scalable" = "latest"

[oci]
# Google's mirror: no Docker Hub rate limit on CI.
from = "mirror.gcr.io/library/debian:trixie-slim"
mount_point = "/usr/local/share/mise"
user = "65532"
workdir = "/app"
entrypoint = ["/usr/bin/catatonit", "--", "/usr/local/bin/agent-entrypoint"]
cmd = ["node", "dist/server.js"]

[oci.env]
# mise prepends the tool bin directories. The agent's own aube globals come
# last, so nothing in the home shadows an image tool.
PATH = "/app/node_modules/.bin:/usr/local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/agent/.local/share/aube/bin"
HOME = "/home/agent"
SSL_CERT_FILE = "/etc/ssl/certs/ca-certificates.crt"
REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
PYTHONPATH = "/usr/local/lib/platform-python"
PORT = "8080"
# apt-get on a machine never waits on a prompt nobody can answer.
DEBIAN_FRONTEND = "noninteractive"
# The one Chromium both use; containers have no user namespaces for its sandbox.
PLAYWRIGHT_BROWSERS_PATH = "/opt/ms-playwright"
AGENT_BROWSER_ARGS = "--no-sandbox"
AGENT_BROWSER_EXECUTABLE_PATH = "/opt/ms-playwright/chrome"
