# Shared by every `mise oci` agent image; each agent's image.toml is a config
# environment over it. Staged by //packages/agents:image as mise/conf.d/base.toml.

[settings]
experimental = true
minimum_release_age = "7d"
npm.package_manager = "npm"
python.compile = false

[tools]
node = "26"
pnpm = "12.3.4"
jq = "latest"
fd = "latest"
rg = "latest"
gh = "2.101.0"
uv = "latest"
python = "3.12"
kubectl = "latest"
k3s = "latest"

# The static bundle: trixie's docker.io is a release line behind.
[tools."http:docker"]
version = "29.8.1"

[tools."http:docker".platforms]
linux-x64 = { url = "https://download.docker.com/linux/static/stable/x86_64/docker-{{version}}.tgz" }
linux-arm64 = { url = "https://download.docker.com/linux/static/stable/aarch64/docker-{{version}}.tgz" }

# libatomic1 for node 26, libnss-extrausers for the agent account.
[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:catatonit" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:gawk" = "latest"
"apt:git" = "latest"
"apt:iptables" = "latest"
"apt:libatomic1" = "latest"
"apt:libnss-extrausers" = "latest"
"apt:openssh-server" = "latest"
"apt:openssl" = "latest"
"apt:patch" = "latest"
"apt:procps" = "latest"
"apt:unzip" = "latest"
"apt:xz-utils" = "latest"
"apt:zip" = "latest"

[oci]
# Google's mirror: no Docker Hub rate limit on CI.
from = "mirror.gcr.io/library/debian:trixie-slim"
mount_point = "/usr/local/share/mise"
user = "65532"
workdir = "/app"
entrypoint = ["/usr/bin/catatonit", "--", "/usr/local/bin/agent-entrypoint"]
cmd = ["node", "dist/server.js"]

[oci.env]
# mise prepends the tool bin directories.
PATH = "/usr/local/share/tool-bin:/app/node_modules/.bin:/usr/local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
HOME = "/home/agent"
SSL_CERT_FILE = "/etc/ssl/certs/ca-certificates.crt"
REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
PYTHONPATH = "/usr/local/lib/platform-python"
PORT = "8080"

# Relative to mise/conf.d/. A copy cannot target /, hence one per directory;
# an agent's copies come later and win.
[[oci.copy]]
host = "../../base/rootfs/app"
image = "/app"

[[oci.copy]]
host = "../../base/rootfs/etc"
image = "/etc"

[[oci.copy]]
host = "../../base/rootfs/usr"
image = "/usr"

[[oci.copy]]
host = "../../base/rootfs/var"
image = "/var"

# Built on the host by the image task.
[[oci.copy]]
host = "../../build/app"
image = "/app"

[[oci.copy]]
host = "../../build/etc"
image = "/etc"

[[oci.copy]]
host = "../../build/home"
image = "/home"

[[oci.copy]]
host = "../../build/usr"
image = "/usr"
