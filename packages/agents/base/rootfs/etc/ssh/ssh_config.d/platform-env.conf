# `ssh env-<name>` reaches one of this agent's Environments, and `ssh sub-<id>`
# a sub-agent it spawned, over the link. platform-env sends the agent's link
# key over the link, which only the agent the machine accepts from can open,
# and the machine trusts it for that connection; its host key is new with each
# connection, so it is not kept. The exec makes the link key on first use: ssh
# reads its identities before the ProxyCommand has run, so the proxy would make
# it too late.
Match host env-*,sub-* exec "/usr/local/bin/platform-env key >/dev/null 2>&1; true"
	ProxyCommand /usr/local/bin/platform-env proxy %n
	User agent
	IdentityFile ~/.ssh/platform_env_ed25519
	IdentitiesOnly yes
	StrictHostKeyChecking no
	UserKnownHostsFile /dev/null
	LogLevel ERROR
	ServerAliveInterval 30
