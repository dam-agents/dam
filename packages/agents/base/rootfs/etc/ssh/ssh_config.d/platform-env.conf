# `ssh env-<name>` reaches one of this agent's Environments over the
# Environment Link. platform-env sends the agent's link key over the link,
# which only the owning agent can open, and the Environment trusts it for the
# boot; the Environment's host key is new with each Environment, so it is not
# kept. The exec makes the link key on first use: ssh reads its identities
# before the ProxyCommand has run, so the proxy would make it too late.
Match host env-* exec "/usr/local/bin/platform-env key >/dev/null 2>&1; true"
	ProxyCommand /usr/local/bin/platform-env proxy %n
	User agent
	IdentityFile ~/.ssh/platform_env_ed25519
	IdentitiesOnly yes
	StrictHostKeyChecking no
	UserKnownHostsFile /dev/null
	LogLevel ERROR
	ServerAliveInterval 30
