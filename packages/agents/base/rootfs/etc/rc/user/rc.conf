# Defaults for the agent's own services, ~/.config/rc/init.d: openrc's user
# services, run as root. A service script only needs a command; this makes
# openrc supervise it (restart when it exits), stop its whole process group,
# and log it to ~/.local/state/rc/<name>.log. A script or ~/.config/rc/rc.conf
# overrides any of it.
# What a service keeps of the environment openrc starts in, as for the image's
# own services (rc.conf.d/platform.conf, which user mode does not read): PATH,
# the gateway's proxy and CA variables and PLATFORM_ENVIRONMENT_OF. The rest of
# what the agent's own processes get, connection placeholders included, comes
# on top from ~/.config/rc/profile.env, which the agent runtime writes.
rc_env_allow="PATH HTTPS_PROXY HTTP_PROXY https_proxy http_proxy NO_PROXY no_proxy SSL_CERT_FILE SSL_CERT_DIR PLATFORM_ENVIRONMENT_OF"

supervisor="${supervisor-supervise-daemon}"
stopgroup="${stopgroup-yes}"
respawn_delay="${respawn_delay-2}"
respawn_max="${respawn_max-0}"
output_log="${output_log-${HOME}/.local/state/rc/${RC_SVCNAME}.log}"
error_log="${error_log-${output_log}}"
directory="${directory-${HOME}/work}"
