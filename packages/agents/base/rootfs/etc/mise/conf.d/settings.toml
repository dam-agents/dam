# The agent's mise, and the image build's: `mise oci` writes
# /etc/mise/config.toml with [tools] only. npm tools install through aube, as
# the build installs them, so a repository whose mise.lock pins one by its
# aube dependency graph installs here too.
[settings]
experimental = true
minimum_release_age = "7d"
npm.package_manager = "aube"
python.compile = false
