# What a service gets of the environment openrc starts it from: PATH, which
# names the image's tools, the agent's gateway and CA, which docker and k3s
# pull through, the image's XDG_RUNTIME_DIR, where `rc-service --user` finds
# the agent's services, and MISE_SYSTEM_DATA_DIR, where a login shell's mise
# finds the image's tools. Nothing else, so no credential reaches a service.
rc_env_allow="PATH HTTPS_PROXY HTTP_PROXY https_proxy http_proxy NO_PROXY no_proxy SSL_CERT_FILE SSL_CERT_DIR XDG_RUNTIME_DIR MISE_SYSTEM_DATA_DIR"
