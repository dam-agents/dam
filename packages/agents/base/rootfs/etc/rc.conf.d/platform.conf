# What a service gets of the environment openrc starts it from: PATH, which
# names the image's tools, and the agent's gateway and CA, which docker and k3s
# pull through, and PLATFORM_ENVIRONMENT_OF, by which platform-env serves the
# Environment Link only on an Environment. Nothing else, so no credential
# reaches a service.
rc_env_allow="PATH HTTPS_PROXY HTTP_PROXY https_proxy http_proxy NO_PROXY no_proxy SSL_CERT_FILE SSL_CERT_DIR PLATFORM_ENVIRONMENT_OF"
