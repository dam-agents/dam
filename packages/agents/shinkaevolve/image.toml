# The shinkaevolve config environment over claude-code's: mise -E claude-code,shinkaevolve.

# The sqlite3 CLI polls run progress in results/programs.sqlite.
[bootstrap.packages]
"apt:sqlite3" = "latest"

# The pillow floor and overrides.txt are CVE fixes the package's own pins do
# not reach.
[tools."pipx:shinka-evolve"]
version = "0.0.7"
uvx_args = "--with pillow>=12.3.0 --overrides {{config_root}}/shinkaevolve/overrides.txt"
postinstall = '"$MISE_TOOL_INSTALL_PATH/shinka-evolve/bin/python" -c "import shinka, hydra"'

[oci.env]
SHINKA_VENV = "/opt/shinka-venv"
SHINKA_OUTPUT_ROOT = "/home/agent/work/shinka-runs"
