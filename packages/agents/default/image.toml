# The image every harness Template boots: base's environment and the files of
# every harness, with base's tools and every harness's in a layer of their own
# at mise's system data dir, installed at build time by the image's own
# installer. The agent's own `mise use -g` installs into mise's default data
# dir, in the home.
# Until every agent runs a baked image, each node's installer still fills the
# directory container agents mount over that path, with the same versions.
# The oci task stages it apart from the other images (see `bare` there): the
# harnesses' tools become the image's system config, their env joins its own.
[oci.env]
PLATFORM_HARNESS = "claude-code"
MISE_SYSTEM_DATA_DIR = "/usr/share/mise"
# A vm machine keeps its whole root while it boots images of one root
# generation, so a deploy keeps what the agent installed outside HOME. The key
# is compared whole: change it only for a change that breaks a root an older
# image left, such as a new Debian release or a file in /etc an agent's write
# would hide. A new key starts every machine on an empty root. An image built
# on this one appends its own segment (oci's build_thin).
PLATFORM_ROOT_GENERATION = "default-1"
