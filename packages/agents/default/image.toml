# The image every harness Template boots: base's environment and the files of
# every harness, with no tool baked in. Base's tools and every harness's are
# installed on each node, by this same image, into the directory every agent
# pod and vm machine mounts read-only at mise's system data dir, so the image
# and the tools it runs agree on every version. The path is one no other image
# uses, since a pod gets the mount whatever its image; mise's own data dir
# stays writable for the agent's `mise use -g`. The oci task stages it apart
# from the other images (see `bare` there): the harnesses' tools become the
# image's system config, their env joins its own.
[oci.env]
PLATFORM_HARNESS = "claude-code"
PLATFORM_TOOLS_VOLUME = "/opt/platform/harness-tools"
MISE_SYSTEM_DATA_DIR = "/opt/platform/harness-tools"
