# Codex: this agent's config environment, `mise oci build -E codex`. The oci
# task stages it as mise/conf.d/harness.codex.toml over base/base.toml, with
# this directory's rootfs/ at the same path, so copies climb out of conf.d.

[tools]
"npm:@openai/codex" = "0.153.4"
"npm:@zed-industries/codex-acp" = "0.16.0"

[oci.env]
PLATFORM_HARNESS = "codex"
# Satisfies the CLI's startup check; the real credential is injected on the wire.
OPENAI_API_KEY = "dummy-placeholder"

[[oci.copy]]
host = "../../codex/rootfs/app"
image = "/app"

[[oci.copy]]
host = "../../codex/rootfs/etc"
image = "/etc"

[[oci.copy]]
host = "../../codex/rootfs/usr"
image = "/usr"
