[tools]
"npm:@openai/codex" = "0.158.0"
# The platform package ships its binary 0644 and aube, unlike npm, does not
# chmod a dependency's bin, so codex-acp's spawn of it fails with EACCES.
"npm:@zed-industries/codex-acp" = { version = "0.16.0", postinstall = "find \"$MISE_TOOL_INSTALL_PATH\" -path '*/codex-acp-linux-*/bin/codex-acp' -exec chmod +x {} +" }

[oci.env]
PLATFORM_HARNESS = "codex"
# Satisfies the CLI's startup check; the real credential is injected on the wire.
OPENAI_API_KEY = "dummy-placeholder"
