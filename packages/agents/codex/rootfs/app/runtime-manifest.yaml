# Codex runtime manifest. Codex reads MCP servers only from `[mcp_servers.*]`
# in its own config.toml — never from the $HOME/.mcp.json the built-in binding
# writes — so the driver targets that file instead. A streamable-HTTP server is
# keyed off `url` alone, with static headers under `http_headers`; the default
# binding's `type` / `headers` keys are not Codex's. Other drivers keep the
# defaults of the base manifest.
manifestVersion: 1

# Codex drops a served catalog whose entries carry no instructions template,
# so the router stamps a one-line template on every entry it serves.
modelRouter:
  dialects: [openai-responses]
  sessionModel: { configOption: model }
  # Codex refuses to list models or start a turn without a key, so the
  # runtime sets the router's placeholder; the router drops it.
  credentialEnv: [OPENAI_API_KEY]
  # Codex's subagents and auto-review ask for its built-in models by bare
  # name; the router puts them on the session's model instead.
  bareNamesFromSession: true

# Declared so the runtime answers initialize before any harness process runs.
# Re-captured from the image pin by test:harness-initialize-capabilities.
initializeCapabilities:
  agentCapabilities: {"auth": {"logout": {}}, "providers": {}, "loadSession": true, "promptCapabilities": {"embeddedContext": true, "image": true}, "sessionCapabilities": {"resume": {}, "list": {}, "close": {}, "delete": {}, "fork": {}, "additionalDirectories": {}, "subagents": {}}, "mcpCapabilities": {"acp": false, "http": true, "sse": false}, "_meta": {"authStatus": {}}}
  authMethods: [{"id": "api-key", "name": "API Key", "description": "Use an API key to authenticate", "_meta": {"api-key": {"provider": "openai"}}}, {"id": "chat-gpt", "name": "ChatGPT", "description": "Use ChatGPT to authenticate"}]
  agentInfo: {"name": "@agentclientprotocol/codex-acp", "title": "Codex"}

# Codex sets the thread id on every shell command it runs; codex-acp uses the
# thread id as the session's id, so git's trace names the session that ran a
# commit or push.
sessionEnvVar: CODEX_THREAD_ID

# Codex mints its own thread id for a terminal session's conversation. The
# SessionStart hook in /etc/codex/requirements.toml pins it here under the
# platform session id, so the session list shows that conversation once, under
# the terminal session.
terminalSessionPins: "$HOME/.codex/platform-sessions"

drivers:
  mcp-entry:
    path: "$HOME/.codex/config.toml"
    format: toml
    keyPath: mcp_servers
    urlKey: url
    headersKey: http_headers

  # Codex's built-in model list names OpenAI's own models, which an
  # OpenAI-compatible endpoint need not serve, so the list is discovered from
  # the endpoint the agent was granted. A `model` in config.toml outranks the
  # provider's OPENAI_MODEL pin: the harness scripts pass the pin only when the
  # file sets none. No redirectEnv — the OpenAI preset names api.openai.com
  # through the same variable, where Codex's own default is the better answer.
  harness-config:
    file: "$HOME/.codex/config.toml"
    format: toml
    # The router reads the subagent model itself: Codex's subagent threads
    # carry their own thread-id beside the session's.
    sessionSettings:
      effort: { configOption: reasoning_effort }
      subagentModel: { router: true }
      subagentEffort: { router: true }
    # No model key: the model is sent over ACP, never written into the shared
    # config.toml.
    keys:
      configOptions:
        effort: model_reasoning_effort
    catalog:
      options:
        - id: model
          name: Model
          description: AI model to use
          category: model
          choices: []
        # No fixed choices: the picker offers the catalog.
        - id: subagentModel
          name: Subagent model
          description: Model Codex's subagents run on
          category: model
          subagents: true
          choices: []
        - id: effort
          name: Effort
          description: Reasoning effort level
          category: thought_level
          default: "medium"
          choices:
            - value: minimal
              name: "Minimal"
            - value: low
              name: "Low"
            - value: medium
              name: "Medium"
            - value: high
              name: "High"
            - value: xhigh
              name: "Extra High"
        # The router writes it over the reasoning effort of each call on a
        # subagent thread, and only where Codex sent one.
        - id: subagentEffort
          name: Subagent effort
          description: Reasoning effort of Codex's subagents
          category: thought_level
          subagents: true
          choices:
            - value: minimal
              name: "Minimal"
            - value: low
              name: "Low"
            - value: medium
              name: "Medium"
            - value: high
              name: "High"
            - value: xhigh
              name: "Extra High"
    modelDiscovery:
      urlEnv:
        - OPENAI_BASE_URL
      tokenEnv:
        - OPENAI_API_KEY
      pinEnv:
        - OPENAI_MODEL
