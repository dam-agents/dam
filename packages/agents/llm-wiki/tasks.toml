["agents:llm-wiki:image"]
description = "Build the llm-wiki agent image"
dir = "{{config_root}}"
depends = ["agents:claude-code:image"]
run = '''
#!/usr/bin/env bash
[ -n "${SKIP_IMAGE_BUILD:-}" ] && exit 0
docker build -t platform-llm-wiki:latest packages/agents/llm-wiki
'''

["agents:llm-wiki:scan"]
depends = ["agents:llm-wiki:scan:*"]

["agents:llm-wiki:scan:trivy"]
dir = "{{config_root}}"
usage = '''
flag "--json" help="Emit Trivy JSON (exit 0) instead of failing on findings"
flag "--tag <tag>" help="Scan quay.io/dam-agents/llm-wiki:<tag> instead of building locally"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${usage_tag:-}" ]; then
  image="quay.io/dam-agents/llm-wiki:${usage_tag}"
else
  {{ mise_bin }} run agents:llm-wiki:image
  image="platform-llm-wiki:latest"
fi
if [[ "${usage_json:-false}" == "true" ]]; then
  exec trivy image --quiet --format json "$image"
fi
exec trivy image --quiet --exit-code 1 "$image"
'''
