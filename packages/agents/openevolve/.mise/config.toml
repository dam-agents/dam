[tasks.image]
extends = "agent:image"
description = "Build the openevolve agent image (OpenEvolve from PyPI on the claude-code base), or reuse it from the registry when its source is unchanged"
depends = ["//packages/agents/claude-code:image"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# The Dockerfile pins a default; override it here with OPENEVOLVE_VERSION=<value>.
build_args=()
[ -n "${OPENEVOLVE_VERSION:-}" ] && build_args+=(--build-arg "OPENEVOLVE_VERSION=${OPENEVOLVE_VERSION}")
# ${build_args[@]+...} guards the empty-array expansion under `set -u` (bash 3.2 on macOS).
exec {{ mise_bin }} run image:resolve -- build-or-reuse openevolve -- ${build_args[@]+"${build_args[@]}"} packages/agents/openevolve
'''

[tasks.scan]
depends = [":scan:*"]

[tasks."scan:trivy"]
extends = "image:scan:trivy"
