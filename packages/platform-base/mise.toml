# config.toml next to this file is the *image's* /etc/mise/config.toml (tools
# baked into platform-base), not project config — see the Dockerfile.
[tasks.image]
description = "Build the platform-base image (shared base layer for every agent image), or reuse it from the registry when its source is unchanged"
dir = "{{vars.repo_root}}"
run = "scripts/resolve-image.sh build-or-reuse platform-base -- -f packages/platform-base/Dockerfile ."

[tasks.scan]
depends = [":scan:*"]

[tasks."scan:trivy"]
extends = "image:scan:trivy"
vars = { local_image = "platform-base" }
