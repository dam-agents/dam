[tasks.check]
depends = ["//:setup:pnpm", ":check:*"]

[tasks.fix]
depends = [":fix:*"]

[tasks."check:tsc"]
extends = "ts:check:tsc"

[tasks."check:lint"]
extends = "ts:check:lint"

[tasks."check:format"]
extends = "ts:check:format"

[tasks."fix:lint"]
extends = "ts:fix:lint"

[tasks."fix:format"]
extends = "ts:fix:format"

[tasks.test]
extends = "ts:test"

[tasks.dev]
description = "Run agent-runtime in watch mode (tsx, loads .env)"
depends = ["//:setup:pnpm"]
run = "pnpm exec tsx watch --env-file=.env src/server.ts"
