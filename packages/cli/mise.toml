[tasks.check]
depends = ["//:common:setup:pnpm", ":check:*"]

[tasks.fix]
depends = [":fix:*"]

[tasks."check:tsc"]
extends = "ts:check:tsc"

[tasks."check:lint"]
extends = "ts:check:lint"

[tasks."check:format"]
extends = "ts:check:format"

[tasks."fix:lint"]
extends = "ts:fix:lint"

[tasks."fix:format"]
extends = "ts:fix:format"

[tasks.test]
extends = "ts:test"

[tasks.build]
description = "Build the dam CLI to dist/bin.js"
depends = ["//:common:setup:pnpm"]
run = "pnpm exec tsup"

[tasks.run]
description = "Build the dam CLI and run it from dist (pass args after --)"
depends = [":build"]
run = "node dist/bin.js"
