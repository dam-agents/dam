[task_config]
includes = ["{{vars.repo_root}}/.mise/ts-package.toml", ".mise/tasks"]

[tasks."check:tsc"]
extends = "ts:check:tsc"
sources = ["{src/**/*,playwright.config}.ts", "tsconfig.json", "{{vars.repo_root}}/packages/dev-config/tsconfig.base.json", "{{vars.repo_root}}/pnpm-lock.yaml"]

[tasks."check:format"]
extends = "ts:check:format"
run = "pnpm exec prettier --check 'src/**/*.ts' 'playwright.config.ts'"
sources = ["{src/**/*,playwright.config}.ts", "{{vars.repo_root}}/.prettierrc", "{{vars.repo_root}}/pnpm-lock.yaml"]

[tasks."fix:format"]
extends = "ts:fix:format"
run = "pnpm exec prettier --write 'src/**/*.ts' 'playwright.config.ts'"

[tasks."check:keep-awake"]
description = "The keep-awake timer ticks while the loop runs, stops on stop, and counts a failed wake"
run = "node src/lib/keep-awake.ts"
sources = ["src/lib/keep-awake.ts"]
outputs = []
deny_net = true
deny_write = true

[tasks."check:storage-look"]
description = "The emitted guest commands really print their bracket, a look across a settled-generation move is thrown away, and an absent grant is no grant"
run = "node src/lib/storage-look.ts"
sources = ["src/lib/storage-look.ts"]
outputs = []
deny_net = true
deny_write = true

[tasks."check:trpc-failures"]
description = "A failed tRPC call names its procedure, its status and the answer's body, and a passing one is untouched"
run = "node src/lib/trpc-failures.ts"
sources = ["src/lib/trpc-failures.ts"]
outputs = []
deny_net = true
deny_write = true
