# Deliberately a task, not a [deps] provider: `mise deps --monorepo` installs every
# provider, and this one is a large download plus `sudo apt` on Linux that only
# the e2e run tasks need.
[tasks.install-browsers]
description = "Download the Chromium binary Playwright drives (+ OS libs on Linux)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" = "Linux" ]; then
  pnpm exec playwright install --with-deps chromium
else
  pnpm exec playwright install chromium
fi
'''

# Defensive: the sandbox k3s ingress binds IPv4 only, so the specs' own
# fetches (Keycloak token mint, tRPC clients) resolve `*.localhost` v4-first
# instead of depending on happy-eyeballs fallback. The browser side gets the
# same via --host-resolver-rules in the config.
[tasks."run"]
description = "Run the smoke suite (src/tests/smoke/) — the always-on pipeline tier"
env = { NODE_OPTIONS = "--dns-result-order=ipv4first" }
depends = [":install-browsers"]
run = "pnpm exec playwright test"

[tasks."run-full"]
description = "Run the FULL suite: smoke plus the slow on-demand specs under src/tests/full/"
env = { NODE_OPTIONS = "--dns-result-order=ipv4first" }
depends = [":install-browsers"]
run = "E2E_FULL=1 pnpm exec playwright test"

[tasks."run-headed"]
description = "Run Playwright with a visible browser window"
env = { NODE_OPTIONS = "--dns-result-order=ipv4first" }
depends = [":install-browsers"]
run = "pnpm exec playwright test --headed"

[tasks."run-ui"]
description = "Open Playwright UI mode (time-travel debugger, watch mode)"
env = { NODE_OPTIONS = "--dns-result-order=ipv4first" }
depends = [":install-browsers"]
run = "pnpm exec playwright test --ui"

[tasks.check]
depends = [":check:*"]

[tasks.fix]
depends = [":fix:*"]

[tasks."check:tsc"]
extends = "ts:check:tsc"
sources = ["{src/**/*,playwright.config}.ts", "tsconfig.json", "{{vars.repo_root}}/packages/dev-config/tsconfig.base.json"]

[tasks."check:lint"]
extends = "ts:check:lint"

[tasks."check:format"]
extends = "ts:check:format"
run = "pnpm exec prettier --check 'src/**/*.ts' 'playwright.config.ts'"
sources = ["{src/**/*,playwright.config}.ts", "{{vars.repo_root}}/.prettierrc"]

[tasks."fix:lint"]
extends = "ts:fix:lint"

[tasks."fix:format"]
extends = "ts:fix:format"
run = "pnpm exec prettier --write 'src/**/*.ts' 'playwright.config.ts'"
