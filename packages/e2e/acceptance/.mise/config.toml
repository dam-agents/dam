[task_config]
includes = ["{{vars.repo_root}}/.mise/ts-package.toml", ".mise/tasks"]

[tasks."check:tsc"]
extends = "ts:check:tsc"
sources = ["{src/**/*,playwright.config}.ts", "tsconfig.json", "{{vars.repo_root}}/packages/dev-config/tsconfig.base.json", "{{vars.repo_root}}/pnpm-lock.yaml"]

[tasks."check:format"]
extends = "ts:check:format"
run = "pnpm exec prettier --check 'src/**/*.ts' 'playwright.config.ts'"
sources = ["{src/**/*,playwright.config}.ts", "{{vars.repo_root}}/.prettierrc", "{{vars.repo_root}}/pnpm-lock.yaml"]

[tasks."fix:format"]
extends = "ts:fix:format"
run = "pnpm exec prettier --write 'src/**/*.ts' 'playwright.config.ts'"

[tasks."check:boundary"]
description = "The acceptance suite depends on nothing but the public API contract and its test tools, and no import in it leaves the package, so it cannot import the server's internals"
run = "node --test .mise/lib/boundary.test.mjs && node .mise/lib/boundary.mjs"
sources = ["package.json", ".mise/lib/boundary*.mjs", "src/**/*", "playwright.config.ts"]
outputs = []
deny_net = true
deny_write = true
cache.enabled = true

[tasks."check:steps"]
description = "Every step in the feature files has a step definition, and every step definition is used by a feature file"
run = ["pnpm exec bddgen", "pnpm exec bddgen export --unused-steps | grep -q 'Unused steps (0)' || { pnpm exec bddgen export --unused-steps; exit 1; }"]
sources = ["features/**/*.feature", "src/**/*.ts", "playwright.config.ts"]
outputs = [".features-gen/**/*"]

[tasks."check:features"]
description = "The feature files follow the writing rules: a file is one capability in its area folder, an example sits under a Rule, shows one action, keeps Given, When, Then in order and names no part of the screen, a Rule with no example yet names its issue as @todo-<issue>; a journey names its surfaces"
run = "node --test .mise/lib/feature-lint.test.mjs .mise/lib/coverage.test.mjs && node .mise/lib/feature-lint.mjs"
sources = ["features/**/*.feature", ".mise/lib/feature-lint*.mjs", ".mise/lib/coverage*.mjs", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
deny_net = true
deny_write = true
cache.enabled = true

[tasks.coverage]
description = "Print each capability's Rules and Examples by area, the capabilities still todo with their issues, and those far past the median"
run = "node .mise/lib/coverage.mjs"
