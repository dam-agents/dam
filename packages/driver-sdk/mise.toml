[tasks.check]
depends = [":check:*"]

[tasks.fix]
depends = [":fix:*"]

[tasks."check:tsc"]
extends = "ts:check:tsc"

[tasks."check:lint"]
extends = "ts:check:lint"

[tasks."check:format"]
extends = "ts:check:format"

[tasks."fix:lint"]
extends = "ts:fix:lint"

[tasks."fix:format"]
extends = "ts:fix:format"

[tasks.test]
extends = "ts:test"

[tasks.build]
description = "Build the dependency-free driver-sdk.mjs bundle (tsup)"
run = "pnpm exec tsup"
