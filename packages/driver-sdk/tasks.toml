["driver-sdk:setup"]
dir = "{{config_root}}"
depends = ["common:setup:pnpm"]

["driver-sdk:check"]
depends = ["driver-sdk:check:*"]

["driver-sdk:check:tsc"]
dir = "{{config_root}}/packages/driver-sdk"
depends = ["driver-sdk:setup"]
run = "pnpm exec tsc --noEmit"
sources = ["src/**/*.ts", "tsconfig.json", "../dev-config/tsconfig.base.json"]

["driver-sdk:check:lint"]
dir = "{{config_root}}/packages/driver-sdk"
depends = ["common:setup:pnpm"]
run = "pnpm exec eslint ."
sources = ["src/**/*.ts", "eslint.config.js", "../dev-config/eslint.base.js"]

["driver-sdk:check:format"]
dir = "{{config_root}}/packages/driver-sdk"
depends = ["common:setup:pnpm"]
run = "pnpm exec prettier --check 'src/**/*.ts'"
sources = ["src/**/*.ts", "../../.prettierrc"]

["driver-sdk:fix"]
depends = ["driver-sdk:fix:*"]

["driver-sdk:fix:lint"]
dir = "{{config_root}}/packages/driver-sdk"
depends = ["common:setup:pnpm"]
run = "pnpm exec eslint --fix ."

["driver-sdk:fix:format"]
dir = "{{config_root}}/packages/driver-sdk"
depends = ["common:setup:pnpm"]
run = "pnpm exec prettier --write 'src/**/*.ts'"

["driver-sdk:test"]
description = "Run driver-sdk unit tests"
dir = "{{config_root}}"
run = 'pnpm --filter driver-sdk exec vitest run'

["driver-sdk:build"]
description = "Build the dependency-free driver-sdk.mjs bundle (tsup)"
dir = "{{config_root}}/packages/driver-sdk"
depends = ["driver-sdk:setup"]
run = "pnpm exec tsup"
