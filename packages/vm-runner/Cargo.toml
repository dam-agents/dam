[package]
name = "vm-runner"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The same release the runner image installs for its assets — see the version
# invariant in Dockerfile.vm-runner. `smolvm.pin` names the commit, and nothing
# else does: a path dependency is recorded in Cargo.lock as a bare version, with
# no source and no commit, so the lock says nothing about which tree is there.
smolvm = { path = ".smolvm" }
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
# --allow-from is a list of CIDRs the Go runner refuses to start on if any is
# malformed; parsing them by hand is how an allowlist quietly admits everybody.
ipnet = "2"
# kill(2) for a VMM that outlived its stop. Already in the lock by way of
# smolvm, so this adds an edge and no crate.
libc = "0.2"
# Already in the lock by way of smolvm, so this adds a dependency edge and no
# crate: an archive an earlier release cached still boots a machine, and the
# config saying how is inside it.
tar = "0.4"
# The TLS stack axum-server serves over. smolvm pulls in both of rustls's
# crypto backends, so rustls cannot choose one itself and the runner installs
# ring explicitly. Already in the lock by way of smolvm.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync"] }
# CancellationToken and TaskTracker: the runner's lifetime, and the barrier
# closing it waits on. Already in the lock by way of smolvm.
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
# Drives the router in-process, the way the controller's client reaches it,
# without binding a socket. Both are already in the lock by way of axum.
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# Backdating a file is how the cache's two time windows — a stale claim and an
# abandoned scratch tree — are tested without waiting out thirty minutes.
filetime = "0.2"

[lints.clippy]
all = "deny"
