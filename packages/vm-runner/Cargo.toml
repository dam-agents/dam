[package]
name = "vm-runner"
version = "0.0.0"
edition = "2021"
publish = false

# The runner and platform-init, the entrypoint it hands every machine. They are
# two packages rather than two binaries of one because cargo builds a package's
# library for each of its binaries, and this library is the runner — smolvm,
# tokio, the TLS stack — none of which the guest's static binary should carry.
# smolvm's clone is a workspace of its own and stays out of this one. The root
# package is a member without being listed; listing "." would name every path
# below it, the clone included, and override the exclude.
[workspace]
members = ["platform-init"]
default-members = [".", "platform-init"]
exclude = [".smolvm"]

[dependencies]
# The same release the runner image installs for its assets: `smolvm.pin` names
# it for both, and it alone names the commit — a path dependency is recorded
# in Cargo.lock as a bare version, with no source and no commit, so the lock
# says nothing about which tree is there.
smolvm = { path = ".smolvm" }
# The guest contract. The paths this runner writes a machine's share at are
# the ones platform-init reads it from, because both link the one file.
platform-init = { path = "platform-init" }
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
# kill(2) for a VMM that outlived its stop. Already in the lock by way of
# smolvm, so this adds an edge and no crate.
libc = "0.2"
# Already in the lock by way of smolvm, so this adds a dependency edge and no
# crate: an archive an install with no registry stages boots a machine, and the
# config saying how is inside it.
tar = "0.4"
# The TLS stack axum-server serves over. smolvm pulls in both of rustls's
# crypto backends, so rustls cannot choose one itself and the runner installs
# ring explicitly. Already in the lock by way of smolvm.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# A kept disk template is named by the SHA-256 of the compressed one it was
# expanded from. hex spells a digest, which sha2 0.11 no longer formats with
# `{:x}`. Both are already in the lock by way of smolvm.
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync"] }
# CancellationToken and TaskTracker: the runner's lifetime, and the barrier
# closing it waits on. Already in the lock by way of smolvm.
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Reads a seed upload's body frame by frame, so a home of many GiB is never
# held in memory. Already in the lock by way of axum.
http-body-util = "0.1"
# The seed uploader's client: streamed request bodies over rustls, trusting
# only the runner's CA. No provider of its own: vm-seed installs ring, as the
# runner does. futures-util turns the uploader's channel into the body stream.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# Drives the router in-process, the way the controller's client reaches it,
# without binding a socket. Already in the lock by way of axum.
tower = { version = "0.5", features = ["util"] }
# Backdating a file is how eviction's oldest-write-first order is tested.
filetime = "0.2"
# The address a guest reaches its host at, read from smolvm's own network
# defaults so the controller's copy in contract/guest.json cannot drift from it.
# In the lock by way of smolvm, so this adds an edge and no crate.
smolvm-network = { path = ".smolvm/crates/smolvm-network" }

[lints.clippy]
all = "deny"
