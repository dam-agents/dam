# The smolvm source is cloned just in time by fetch-smolvm and depended on by
# path, because Cargo cannot fetch it as a git dependency — see that task.
[tasks.check]
depends = [":check:*"]

[tasks."check:build"]
depends = [":fetch-smolvm"]

[tasks."check:clippy"]
depends = [":fetch-smolvm"]

[tasks.test]
depends = [":fetch-smolvm"]

[tasks.fix]
depends = [":fix:*"]
