# Cargo cannot fetch smolvm as a git dependency, so the pinned source is cloned
# and depended on by path — see .mise/fetch-smolvm for why. It is a dependency
# provider and not a task: every cargo task here needs the clone present, and a
# task that depended on it would inherit no cache key and become uncacheable.
# So every cargo task lists `smolvm.pin` in its sources: the provider's staleness
# never reaches a task's key, and a pin that moves `commit=` alone leaves
# `Cargo.lock` untouched (smolvm is a path dependency there). Undeclared, a
# cached pass taken against the old source replays.
[deps.smolvm]
description = "Clone the pinned smolvm source this crate builds against"
auto = true
sources = ["smolvm.pin"]
outputs = [".smolvm/.pinned"]
run = "./.mise/fetch-smolvm"

# A C toolchain for a Linux machine without one: .mise/zig/env points cargo
# and the cc crate at zig only when no `cc` is on the PATH, so a machine that
# has one builds with it as before. On macOS cargo needs Apple's command line
# tools anyway, so zig is not installed there.
[tools]
zig = { version = "0.16", os = ["linux"] }

[env]
_.source = "{{config_root}}/.mise/zig/env"

[tasks.check]
depends = [":check:*"]

[tasks.fix]
depends = [":fix:*"]
