[tasks.check]
depends = [":check:*"]

[tasks.fix]
depends = [":fix:*"]

[tasks."check:tsc"]
extends = "ts:check:tsc"

[tasks."check:lint"]
extends = "ts:check:lint"

[tasks."check:format"]
extends = "ts:check:format"

[tasks."fix:lint"]
extends = "ts:fix:lint"

[tasks."fix:format"]
extends = "ts:fix:format"

[tasks."gen:crd-types"]
description = "Regenerate the Agent CR spec TS types from the controller's CRDs. AgentSpec derives from AgentSpecCR, so the Go-authored types are the single source."
# Chain: api/v1/*.go --(controller:generate)--> CRD yaml --(here)--> crd-types.gen.ts
# Not cached: it depends on controller:generate, which has no cache key.
depends = ["//packages/controller:generate"]
sources = ["{{vars.repo_root}}/helm/crds/agent-platform.ai_agents.yaml", "scripts/gen-crd-types.sh", "{{vars.repo_root}}/.prettierrc", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = ["src/crd-types.gen.ts"]
run = "bash scripts/gen-crd-types.sh {{vars.repo_root}} src/crd-types.gen.ts"

[tasks."check:gen"]
description = "Fail if the committed CRD types are stale vs the committed CRDs (drift gate). Generates to a temp file and diffs — it never rewrites the committed file, which the tsc consumers read concurrently during `mise run check`."
sources = ["{{vars.repo_root}}/helm/crds/agent-platform.ai_agents.yaml", "src/crd-types.gen.ts", "scripts/gen-crd-types.sh", "{{vars.repo_root}}/.prettierrc", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache = { enabled = true }
deny_net = true
deny_write = true
run = '''
#!/usr/bin/env bash
set -eo pipefail
# /tmp is the only writable path under deny_write; $TMPDIR is elsewhere on macOS.
tmp="$(TMPDIR=/tmp mktemp -d)/crd-types.gen.ts"
bash scripts/gen-crd-types.sh "{{vars.repo_root}}" "$tmp"
if ! diff -u src/crd-types.gen.ts "$tmp"; then
  echo "crd-types.gen.ts is stale — run: mise run //packages/api-server-api:gen:crd-types" >&2
  exit 1
fi
'''
