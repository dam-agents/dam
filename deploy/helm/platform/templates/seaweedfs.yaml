{{- if .Values.seaweedfs.enabled }}
{{- $swName := include "platform.seaweedfs.fullname" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $swName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  type: ClusterIP
  ports:
    - port: 8333
      targetPort: 8333
      protocol: TCP
      name: s3
  selector:
    app.kubernetes.io/component: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $swName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
  {{- include "platform.annotations" (dict "root" $ "component" .Values.seaweedfs) | nindent 2 }}
spec:
  serviceName: {{ $swName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: seaweedfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: seaweedfs
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- include "platform.podAnnotations" (dict "root" $ "component" .Values.seaweedfs) | nindent 6 }}
    spec:
      {{- include "platform.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          # All-in-one server; volume files capped at 1 GiB with count grown
          # by free disk, so the store stays inside the PVC.
          args:
            - server
            - -dir=/data
            - -master.volumeSizeLimitMB=1024
            - -volume.max=0
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3-config.json
          ports:
            - containerPort: 8333
              name: s3
          {{- if .Values.probes.enabled }}
          # TCP probes: the S3 gateway rejects unauthenticated HTTP with 403,
          # which an httpGet probe would misread as unhealthy.
          readinessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          {{- end }}
          resources:
            {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: s3-config
          secret:
            secretName: {{ include "platform.seaweedfs.secrets.fullname" . }}
            items:
              - key: s3-config.json
                path: s3-config.json
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.seaweedfs.storageClass }}
        storageClassName: {{ .Values.seaweedfs.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.seaweedfs.storage }}
{{- end }}
