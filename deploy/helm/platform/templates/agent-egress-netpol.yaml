{{- /*
Agent pod egress NetworkPolicy.

Per ADR-042, NetworkPolicy is a defense-in-depth perimeter only —
intra-cluster destination access control lives in Istio
AuthorizationPolicy. In ambient mode istio-cni rewrites every
mesh-bound packet's destination to local ztunnel before this filter
runs, so per-destination-pod rules don't fire. The only role this NP
can honestly serve is permitting the legitimate non-mesh paths (DNS)
and the mesh entrance (`istio-system:15008`), failing closed on
anything else as a failsafe if istio-cni redirect doesn't apply.

The rules are identical for every agent pod (long-lived pair + fork),
so one chart-rendered NP with selector `role=agent` replaces the
previous per-pair controller-rendered policy.

Companion gateway-egress NP (`gateway-egress-netpol.yaml`) handles
the symmetric perimeter on the gateway side, plus the external
internet allow with `clusterCidrs` excepted.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.fullname" . }}-agent-egress
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    agent-platform.ai/role: agent
spec:
  podSelector:
    matchLabels:
      agent-platform.ai/role: agent
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15008
