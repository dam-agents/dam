{{- if .Values.seaweedfs.enabled }}
{{- /* Shared SeaweedFS credentials: one generated pair persisted across
       upgrades via lookup (postgres-secrets.yaml pattern), plus the S3
       identities file granting it Admin. */ -}}
{{- $secretName := include "platform.seaweedfs.secrets.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $accessKeyId := .Values.seaweedfs.accessKeyId }}
{{- $secretAccessKey := "" }}
{{- if $existing }}
  {{- $secretAccessKey = index $existing.data "secretAccessKey" | default "" | b64dec }}
{{- end }}
{{- if not $secretAccessKey }}
  {{- $secretAccessKey = default (randAlphaNum 32) .Values.seaweedfs.secretAccessKey }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  accessKeyId: {{ $accessKeyId | b64enc | quote }}
  secretAccessKey: {{ $secretAccessKey | b64enc | quote }}
  s3-config.json: {{ printf `{"identities":[{"name":"platform","credentials":[{"accessKey":%q,"secretKey":%q}],"actions":["Admin","Read","Write"]}]}` $accessKeyId $secretAccessKey | b64enc | quote }}
{{- end }}
