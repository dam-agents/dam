{{- if .Values.createAgentNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    agent-platform.ai/managed-by: platform
    # ADR-041: opt the agent namespace into Istio ambient. ztunnel
    # transparently mTLSes pod-to-pod traffic; AuthorizationPolicy on
    # the gateway / ext-authz / harness Services enforces per-instance
    # SPIFFE identity.
    istio.io/dataplane-mode: ambient
    # ADR-042: route every workload's outbound through the egress
    # waypoint (`agent-ns-egress-waypoint.yaml`). The waypoint's
    # AuthorizationPolicy admits only `<id>-gateway` SAs, so a
    # compromised agent cannot bypass HTTPS_PROXY to reach the open
    # internet directly via ztunnel.
    istio.io/use-waypoint: {{ include "platform.fullname" . }}-agent-egress-waypoint
{{- end }}
