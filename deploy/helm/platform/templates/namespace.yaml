{{- if .Values.createAgentNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    agent-platform.ai/managed-by: platform
    # ADR-041: opt the agent namespace into Istio ambient. Gateway pods
    # and fork pods are mesh peers. Per ADR-042, **agent** pods opt
    # back out at the pod level (`istio.io/dataplane-mode: none` on the
    # pod template) so their egress is gated by kernel-level
    # NetworkPolicy rather than mesh routing — the agent's only
    # legitimate destination is its paired gateway, which NP can
    # enforce structurally without ambient's complications.
    istio.io/dataplane-mode: ambient
{{- end }}
