{{- /*
Egress waypoint for the agent namespace (ADR-042).

In ambient mesh, ztunnel transparently forwards non-mesh destinations
(external IPs) when no policy is attached to a destination. Without
this waypoint a compromised agent could bypass HTTPS_PROXY, send
outbound through ztunnel, and reach the open internet directly —
NetworkPolicy can't gate this because istio-cni redirects all
outbound to ztunnel before the NP filter evaluates, and external
destinations have no SPIFFE identity for a destination-side
AuthorizationPolicy to attach to.

The waypoint gives Istio a workload to attach policy to: ztunnel
routes outbound from agent-ns workloads through this waypoint pod
(Istio synthesises a Deployment from this Gateway resource); the
attached AuthorizationPolicy then gates by source principal —
admitting only gateway pod SAs (`<id>-gateway`, including fork
gateways `<forkName>-gateway`).

`istio.io/waypoint-for: none` keeps the waypoint egress-only — it
must not intercept ingress to services in the agent namespace
(per-instance policies on the gateway / agent pods already handle
ingress).
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "platform.fullname" . }}-agent-egress-waypoint
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    istio.io/waypoint-for: none
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      protocol: HBONE
      port: 15008
