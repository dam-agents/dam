{{/*
Curated public-repo registry. A single ConfigMap in the RELEASE namespace with
one `repos.yaml` data key holding the `.Values.agentRepos` list. Mounted into
the api-server pod (see apiserver/app.yaml) and loaded once at boot — same
pattern as agent-templates (ADR-058).

Each entry seeds an agent's working directory by `git clone` at creation time;
the platform never tracks the repo afterward. Public repos only.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform.fullname" . }}-agent-repos
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
data:
  repos.yaml: |
    {{- toYaml .Values.agentRepos | nindent 4 }}
