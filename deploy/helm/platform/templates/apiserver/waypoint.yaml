# Istio waypoint that fronts the api-server's harness Service.
# Istio's mesh-controller observes this Gateway resource (gatewayClassName:
# istio-waypoint) and synthesises the waypoint Deployment + Pod itself —
# this chart never declares Pod/Deployment YAML for the waypoint. The
# waypoint terminates inbound HBONE from ztunnel so per-agent L7
# AuthorizationPolicies can apply.
#
# Label discipline: the waypoint Pod inherits this resource's labels.
# `app.kubernetes.io/component: apiserver` is deliberately OMITTED — it
# would collide with the harness Service's pod selector and turn the
# waypoint Pod into a phantom endpoint, breaking the harness path with
# ECONNRESET on every other request.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.istio.waypointName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.selectorLabels" . | nindent 4 }}
    # Standard Istio label that narrows the waypoint to Service-targeted
    # (HBONE) traffic.
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
{{- $replicas := int (.Values.apiServer.replicas | default 1) }}
{{- if gt $replicas 1 }}
---
# An HA api-server is only as available as this waypoint: every harness call
# (MCP, hello, trigger handoff) traverses it, so it matches the api-server
# replica for replica. A Gateway has no replicas field and Istio's synthesized
# Deployment defaults to 1 and leaves the count unmanaged, so an HPA with
# min == max is the documented way to pin one for an auto-deployed gateway.
# No metric is declared because a clamped count can never move; the API server
# defaults a CPU target in regardless, and it stays inert.
# RING_HASH pinning survives scale-out: same endpoint set, same ring.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.istio.waypointName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.istio.waypointName }}
  minReplicas: {{ $replicas }}
  maxReplicas: {{ $replicas }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.istio.waypointName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ .Values.istio.waypointName }}
{{- end }}
