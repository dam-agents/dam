{{- $harnessSvc := printf "%s-apiserver-harness" .Release.Name -}}
# Pins each harness caller to one api-server replica.
#
# The api-server holds MCP streamable-HTTP sessions in process, one map per
# replica, so a session's follow-up requests must land where the session was
# opened. The harness Service declares `sessionAffinity: ClientIP` for that,
# but the Service carries `istio.io/use-waypoint` — and `sessionAffinity` is a
# kube-proxy feature that the waypoint's Envoy bypasses entirely. Without this
# DestinationRule the waypoint load-balances the harness cluster LEAST_REQUEST,
# per request, and every agent's MCP tool calls break as soon as the
# Deployment runs more than one replica.
#
# `useSourceIp` is the equivalent hash for the waypoint: ambient preserves the
# original client IP through HBONE, and each caller is a per-agent gateway pod
# with a stable IP, so hashing on it lands an agent's whole session on one
# replica. Verify after changing this — the waypoint cluster's `lb_policy`
# must read RING_HASH, not LEAST_REQUEST:
#   kubectl exec <waypoint-pod> -- pilot-agent request GET config_dump
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $harnessSvc }}-affinity
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  host: {{ $harnessSvc }}.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        useSourceIp: true
