# ADR-039: identity-to-path enforcement for the harness Service is owned
# by per-instance AuthorizationPolicies that the controller renders for
# each running instance. We deliberately do NOT add a namespace-wide ALLOW
# policy here — Istio OR-s ALLOW policies, so a coarse "any agent SA"
# rule would silently grant cross-instance access, defeating the per-
# instance check the controller installs.
#
# What the chart does install is the pod-level DENY below: even though
# every legitimate harness call goes through the waypoint, an in-mesh pod
# could in principle dial the api-server pod IP directly on :4001,
# skipping the waypoint and skipping the per-instance APs that target
# the harness Service. Denying any source other than the waypoint's own
# SA closes that gap. The waypoint Deployment that Istio synthesises
# from the Gateway resource runs as a ServiceAccount of the same name in
# the release namespace.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "platform.fullname" . }}-apiserver-harness-direct
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: apiserver
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: DENY
  rules:
    - to:
        - operation:
            ports:
              - {{ .Values.apiServer.harnessServerPort | quote }}
      from:
        - source:
            notPrincipals:
              - "{{ .Values.istio.trustDomain }}/ns/{{ .Release.Namespace }}/sa/{{ .Values.istio.waypointName }}"
