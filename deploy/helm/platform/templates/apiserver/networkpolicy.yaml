{{- if .Values.apiServer.networkPolicy.enabled }}
{{- /*
  Ingress restriction for the api-server pod.

  Three ports, three trust scopes:
    - `http` (UI / tRPC): open in-cluster; Keycloak JWT gates it at L7.
    - `harness` (MCP, pod-files SSE, /internal/trigger): post-ADR-039 the
      agent reaches this through the istio waypoint, so the destination
      sees the waypoint pod as the source — not the agent. Allowing it
      means matching the waypoint's pod selector in the release ns.
    - `ext-authz` (HITL Check): NOT routed through the waypoint (the
      harness Service carries the use-waypoint annotation; the public+
      ext-authz Service does not). Source is still the agent / fork
      pod itself, so the agent-namespace + `agent-platform.ai/instance`
      selector still matches.

  Each ingress rule is OR-ed. The harness and ext-authz rules are
  intentionally separate so a misconfiguration that bypasses the waypoint
  cannot accidentally fall through onto the ext-authz path.
*/}}
{{- $appName := printf "%s-apiserver" (include "platform.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $appName }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: apiserver
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # http: open. UI, mobile, ingress controller, anything in-cluster.
    # Application-layer auth (Keycloak JWT) is the gate here.
    - ports:
        - protocol: TCP
          port: {{ .Values.apiServer.port }}

    # harness: only the istio waypoint pod (ADR-039). After ambient routes
    # agent traffic through the waypoint, the source IP arriving at the
    # api-server pod is the waypoint's, not the agent's. The Gateway-API
    # mesh-controller stamps `gateway.networking.k8s.io/gateway-name` on
    # the synthesised waypoint Pod — that's the stable selector key.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ .Values.istio.waypointName }}
      ports:
        - protocol: TCP
          port: {{ .Values.apiServer.harnessServerPort }}

    # ext-authz: agent + fork pods only. Does NOT go through the waypoint
    # (the public+ext-authz Service deliberately does not carry the
    # use-waypoint annotation), so the source is the agent/fork pod itself.
    # `agent-platform.ai/instance` is set by the controller on both
    # StatefulSet pods and fork Jobs; Exists covers both.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.agentNamespace | quote }}
          podSelector:
            matchExpressions:
              - key: agent-platform.ai/instance
                operator: Exists
      ports:
        - protocol: TCP
          port: {{ .Values.apiServer.extAuthzPort }}
{{- end }}
