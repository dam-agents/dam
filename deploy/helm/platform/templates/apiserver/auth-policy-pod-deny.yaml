{{- /*
ADR-040: pod-level DENY ringfencing the api-server pod.

The waypoint AuthorizationPolicies (rendered per-instance by the
controller) only apply to traffic ROUTED THROUGH the waypoint Service.
Without this rule, an in-mesh pod could dial the api-server pod IP
directly on :15008 and reach the harness handler bypassing the waypoint
entirely (and therefore bypassing the per-instance principal-to-`:id`
check). Same hazard for ext-authz: a release-namespace pod (controller,
ui, postgres) sharing the namespace with the api-server is structurally
in a position to dial the harness port directly unless we deny it.

This policy DENIES every inbound mesh request to the api-server pod
except:
  - the waypoint principal (cluster.local/ns/<release-ns>/sa/<waypoint>)
    on the harness port — Istio names the waypoint SA after the
    Gateway resource;
  - any per-instance SA in the agent namespace on the ext-authz port
    (per-instance ext-authz Services + their AuthorizationPolicies
    enforce principal == matching SA);
  - any source on the public HTTP port (Keycloak JWT is the
    application-layer gate).

Trust-surface notes:
  - Release-ns pods other than the waypoint cannot reach the harness
    port (rule 3 below). They CAN reach the public HTTP port — that
    is intentional; they're peers of the api-server and may legitimately
    call it (controller does not, today, but the policy is permissive
    here so we don't have to enumerate every release-ns peer).
  - Non-mesh sources (e.g. Traefik in `kube-system` for the ingress
    path) are NOT subject to this policy — Istio AuthorizationPolicy
    only applies to mesh traffic. Cluster-edge ingress is gated by
    NetworkPolicy and the Ingress resource.

Istio AuthorizationPolicy semantics: when both ALLOW and DENY policies
apply, DENY wins. ALLOWs are OR-ed, DENY is enforced first. So this
policy co-exists with the per-instance ALLOWs the controller writes.
*/ -}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "platform.fullname" . }}-apiserver-pod-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
spec:
  # Pod-level selector — applies to traffic terminating directly at the
  # api-server pod (i.e. NOT via the waypoint, which has its own SA).
  selector:
    matchLabels:
      app.kubernetes.io/component: apiserver
      app.kubernetes.io/instance: {{ .Release.Name }}
  action: DENY
  rules:
    # 1. Anything from outside both the agent and release namespaces is
    #    denied. The waypoint Pod lives in the release namespace, so
    #    admitting the release ns lets it through; agent-ns pods reach
    #    only the ext-authz port (rule 2 narrows that).
    - from:
        - source:
            notNamespaces:
              - {{ .Values.agentNamespace | quote }}
              - {{ .Release.Namespace | quote }}
    # 2. Agent-ns sources hitting the harness port directly (pod-IP
    #    bypass) are denied — harness must traverse the waypoint, where
    #    per-instance AuthorizationPolicies enforce principal == URL :id.
    - to:
        - operation:
            ports:
              - {{ .Values.apiServer.harnessServerPort | quote }}
      from:
        - source:
            namespaces:
              - {{ .Values.agentNamespace | quote }}
    # 3. Release-ns sources hitting the harness port that are NOT the
    #    waypoint principal are denied. Istio names the waypoint SA after
    #    the Gateway resource (so it matches `istio.waypointName`). This
    #    closes the "other release-ns pod calls harness directly" gap.
    - to:
        - operation:
            ports:
              - {{ .Values.apiServer.harnessServerPort | quote }}
      from:
        - source:
            namespaces:
              - {{ .Release.Namespace | quote }}
            notPrincipals:
              - "{{ .Values.istio.trustDomain }}/ns/{{ .Release.Namespace }}/sa/{{ .Values.istio.waypointName }}"
