{{- /*
  ADR-045: 32-byte AES-256-GCM key for column-level encryption of
  identity_links.refresh_token in the api-server. `lookup` returns the
  existing Secret on upgrades so the key is stable; first install / `helm
  template` (no API server) generates fresh. Losing this Secret forces
  every linked user to re-OAuth.
*/}}
{{- $secretName := include "platform.apiserver.encryptionKey.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $key := "" }}
{{- if and $existing $existing.data $existing.data.key }}
  {{- $key = index $existing.data "key" | b64dec }}
{{- else }}
  {{- $key = randBytes 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
type: Opaque
data:
  key: {{ $key | b64enc | quote }}
