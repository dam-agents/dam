{{/*
API Server RBAC — ServiceAccount, Roles, RoleBindings (release ns + agent ns)
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
---
# Read-only Role in release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
rules:
  # No configmaps/pods: the api-server reads neither anywhere —
  # agents are CRs, templates are file-mounted, and reachability is
  # the Agent's Ready condition.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "platform.apiserver.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.apiserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Read/write Role in agent namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
rules:
  # the api-server is the sole writer of the Agent custom
  # resource spec (create/patch/delete); the controller owns its status.
  - apiGroups: ["agent-platform.ai"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # UserBudgets are operator-written and controller-enforced; the api-server
  # only reads the caller's own (a direct get by the CEL-pinned name) for the
  # reserved-vs-ceiling meter (#1900).
  - apiGroups: ["agent-platform.ai"]
    resources: ["userbudgets"]
    verbs: ["get"]
  # Secrets for credentials. ConfigMaps are gone from the api-server's API
  # surface: agents are CRs and the chart-shipped templates
  # are mounted as files, loaded at boot — not read via the K8s API.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # No persistentvolumeclaims: the controller owns the PVC lifecycle.
  # No pods: reachability is the Agent's Ready condition, and restart
  # is a roll-rev annotation patch — the api-server never reads pods.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "platform.apiserver.serviceAccountName" . }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "platform.apiserver.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platform.apiserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
