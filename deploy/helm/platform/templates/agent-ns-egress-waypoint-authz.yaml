{{- /*
AuthorizationPolicy on the agent-ns egress waypoint.

`targetRefs` attaches the policy to the waypoint Gateway. Any ALLOW
attached to a workload switches it to default-deny for non-matching
sources, so the waypoint refuses every outbound that doesn't satisfy
the rules below.

The SPIFFE wildcard `sa/*-gateway` matches gateway pod SAs for both
long-lived pairs (`<id>-gateway`) and forks (`<forkName>-gateway`)
under ADR-042's per-pair split. Agent pod SAs (`<id>`, `<forkName>`)
don't match — agent processes bypassing HTTPS_PROXY and dialing the
open internet directly are denied at the waypoint.

Destination filtering is intentionally NOT done here. The gateway's
Envoy runs an ext_authz filter on every credentialed and SNI-miss
egress (ADR-035); the api-server's ext-authz handler either matches
the destination against the instance's configured egress rules or
falls through to a HITL approval (denying when host info is missing).
That gates *where* gateway pods can dial; this waypoint policy only
gates *which workloads* are allowed to use the gateway-egress path
at all.
*/}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "platform.fullname" . }}-agent-egress-waypoint-allow
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "platform.fullname" . }}-agent-egress-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "{{ .Values.istio.trustDomain }}/ns/{{ .Values.agentNamespace }}/sa/*-gateway"
