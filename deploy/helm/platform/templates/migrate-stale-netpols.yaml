{{- /*
ADR-041 migration: drop stale pair-key NetworkPolicies left over from
ADR-038's enforcement model.

The old controller wrote per-instance pair-key NetworkPolicies (`<id>-egress`,
`<id>-gateway-egress`) in the agent namespace. ADR-041 retires that
mechanism in favour of mesh AuthorizationPolicy and removes the
controller's `networkpolicies` write RBAC, so the new controller cannot
delete the leftover NPs itself.

Once the agent namespace gets `istio.io/dataplane-mode=ambient`, ztunnel
encapsulates pod-to-pod traffic on HBONE port 15008. The stale NPs only
admit the application port (10000 for the gateway, 8080 for the agent),
so they block ambient mesh connectivity for every existing instance
until the instance is deleted + recreated.

This pre-upgrade Job deletes any NetworkPolicy in `agentNamespace`
carrying `agent-platform.ai/pair` (the label the old controller stamped
on every per-instance NP). New instances created post-upgrade have no
NetworkPolicies at all (the controller stopped writing them), so this
Job is a no-op on a fresh install. helm.sh/hook-delete-policy reaps
the Job + RBAC after a successful run.

Removable in a future minor: once every supported deployment has
upgraded past ADR-041, this template can be deleted.
*/ -}}
{{- $jobName := printf "%s-migrate-stale-netpols" (include "platform.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $jobName }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $jobName }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $jobName }}
subjects:
  - kind: ServiceAccount
    name: {{ $jobName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $jobName }}
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          # alpine/k8s ships kubectl + a shell on alpine. Bitnami's
          # `bitnami/kubectl` was retired from Docker Hub mid-2025.
          image: alpine/k8s:1.30.4
          command:
            - sh
            - -c
            - |
              set -eo pipefail
              ns={{ .Values.agentNamespace | quote }}
              # The label `agent-platform.ai/pair` was stamped by the old
              # controller on every per-instance NetworkPolicy and is not
              # used anywhere else, so this selector is precise.
              count=$(kubectl -n "$ns" get networkpolicy -l agent-platform.ai/pair -o name 2>/dev/null | wc -l | tr -d ' ')
              echo "ADR-041 migration: deleting $count stale pair-key NetworkPolicy(s) in $ns"
              if [ "$count" != "0" ]; then
                kubectl -n "$ns" delete networkpolicy -l agent-platform.ai/pair --ignore-not-found
              fi
