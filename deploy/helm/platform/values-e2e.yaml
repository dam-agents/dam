# E2E test cluster overlay. Layered on top of values-local.yaml
# by `mise run e2e`. Flips the e2e.enabled gate so the api-server registers
# its control tRPC namespace and the mock harness becomes drivable from
# Playwright. values-local.yaml already enables `keycloak.testUser` (dev/dev).

e2e:
  enabled: true

# Override values-local's transitional NFS server (#2988): the e2e cluster
# must prove the platform runs with no shared filesystem available.
nfsProvisioner:
  enabled: false

# Only the mock image is built for the e2e cluster, so every template
# values-local.yaml leaves enabled must be disabled here: one that renders
# into the agent ConfigMap makes cluster:install load an image CI never built,
# and the e2e job pulls only controller/api-server/ui/keycloak/mock. nous is
# listed even though values-local disables it too — re-enabling it there for a
# campaign must not take e2e down with it.
agentTemplates:
  claude-code:
    enabled: false
  nous:
    enabled: false
