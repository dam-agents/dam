# E2E test cluster overlay. Layered on top of values-local.yaml
# by `mise run e2e`. Flips the e2e.enabled gate so the api-server registers
# its control tRPC namespace and the mock harness becomes drivable from
# Playwright. values-local.yaml already enables `keycloak.testUser` (dev/dev).

e2e:
  enabled: true

# Shorten the queued-prompt park window from its 90s default. A spec that
# proves prompts outlive an abandoned tab has to wait the window out in real
# time, so the production value would cost every such spec a minute and a
# half of sleeping.
controller:
  agent:
    templateDefaults:
      env:
        - name: QUEUE_PARK_MS
          value: "8000"

# Override values-local's transitional NFS server (#2988): the e2e cluster
# must prove the platform runs with no shared filesystem available.
nfsProvisioner:
  enabled: false

# Only the mock image is built for the e2e cluster — disable the agent
# templates values-local.yaml leaves enabled (claude-code and nous). Any
# enabled template is rendered, and cluster:install then tries to
# `docker save platform-<name>:latest` it; in CI that image is neither pulled
# (only controller/api-server/ui/keycloak/mock are) nor built (SKIP_IMAGE_BUILD=1),
# so a stray enabled template fails the load with "reference does not exist".
agentTemplates:
  claude-code:
    enabled: false
  nous:
    enabled: false
