# Local dev: images built with docker and loaded into k3s directly.
# Used via: helm install -f values-local.yaml

ui:
  image:
    repository: platform-ui
    tag: latest
    pullPolicy: Never

apiServer:
  image:
    repository: platform-api-server
    tag: latest
    pullPolicy: Never

controller:
  image:
    repository: platform-controller
    tag: latest
    pullPolicy: Never
  logLevel: debug
  agent:
    templateDefaults:
      imagePullPolicy: IfNotPresent

# Transitional (#2988): keep the deprecated NFS server alive so an IN-PLACE
# upgrade of an existing dev cluster doesn't delete it while unmigrated RWX
# agent volumes still live on it — the storage migration needs the source
# volumes readable to drain them. New agents never touch it (workspaces are
# ReadWriteOnce); on a fresh cluster it just idles. values-e2e.yaml disables
# it so the e2e cluster proves the no-shared-filesystem path. Drops together
# with the chart's nfsProvisioner block once dev clusters are drained.
nfsProvisioner:
  enabled: true

# Merges over the values.yaml catalog. Every template gets a local image
# override so enabling one later never pulls from quay.
agentTemplates:
  claude-code:
    image:
      repository: platform-claude-code
      tag: latest

  # Rendered (and thus built/loaded) only when virtualization.enabled is set
  # on the install (e.g. `mise run cluster:install -- --set=virtualization.enabled=true`).
  # The `=` form is required — cluster:install only matches `--set=*`, so a
  # space-separated `--set foo=bar` is silently dropped.
  claude-code-vm:
    image:
      repository: platform-claude-code-vm
      tag: latest

  codex:
    enabled: false
    image:
      repository: platform-codex
      tag: latest

  pi-agent:
    enabled: false
    image:
      repository: platform-pi-agent
      tag: latest

  bob:
    enabled: false
    image:
      repository: platform-bob
      tag: latest

  nous:
    enabled: true
    image:
      repository: platform-nous
      tag: latest

  openevolve:
    enabled: false
    image:
      repository: platform-openevolve
      tag: latest

  shinkaevolve:
    enabled: false
    image:
      repository: platform-shinkaevolve
      tag: latest

  gepa:
    enabled: false
    image:
      repository: platform-gepa
      tag: latest

  # Both presets share the one locally-built skydiscover image.
  adaevolve:
    enabled: false
    image:
      repository: platform-skydiscover
      tag: latest

  evox:
    enabled: false
    image:
      repository: platform-skydiscover
      tag: latest

  # Test fixture; not in the values.yaml catalog — the mock image is never
  # release-tagged (CI pushes per-commit shas for the e2e job only).
  mock:
    enabled: true
    description: "Scripted mock agent (E2E test fixture)"
    image:
      repository: platform-mock
      tag: latest
    storageSize: "1Gi"
    env:
      - name: MOCK_DEFAULT_REPLY
        value: "Hello from the mock agent."

  k-search:
    enabled: false
    image:
      repository: platform-k-search
      tag: latest

  k-search-local:
    image:
      repository: platform-k-search
      tag: latest

# Local dev convenience: route requests with any Host header (including
# IP literals like 127.0.0.1) to the app, so the cluster is reachable
# however the developer happens to address it.
ingress:
  catchAllAppHost: true

keycloak:
  # Known dev admin password for the local cluster — never used in production.
  admin:
    password: admin
  image:
    repository: platform-keycloak
    tag: latest
    pullPolicy: Never
  # Bootstrap a known dev/dev user for local cluster — never enabled in production.
  testUser:
    enabled: true
    username: dev
    password: dev
  extraRedirectUris:
    - "*"
  extraWebOrigins:
    - "*"
  # Human-readable Keycloak logs for `mise run cluster:logs` during dev.
  log:
    consoleOutput: "default"

# terms.* are required by the chart validators. Dev placeholder so a
# local install renders and installs without extra flags.
terms:
  version: dev
  text: "Dev placeholder Terms of Use."
