# Local dev: images built with docker and loaded into k3s directly.
# Used via: helm install -f values-local.yaml

ui:
  image:
    repository: platform-ui
    tag: latest
    pullPolicy: Never

apiServer:
  image:
    repository: platform-api-server
    tag: latest
    pullPolicy: Never

controller:
  image:
    repository: platform-controller
    tag: latest
    pullPolicy: Never
  logLevel: debug
  agent:
    base:
      storageClass: platform-rwx
      # DAM-in-DAM (dam-kt9): let agents reach the inner cluster's Kubernetes
      # API (26444) and buildkit daemon (21234) across the lima host gateway.
      # Install-wide — every agent gets the allowance; harmless when no inner
      # VM is running (nothing listens on those ports).
      extraEgress:
        - cidr: 192.168.5.2/32
          ports: [26444, 21234]
    templateDefaults:
      imagePullPolicy: IfNotPresent

nfsProvisioner:
  enabled: true

# Helm replaces lists wholesale — this `agentTemplates` array fully
# overrides the one in values.yaml. Every field that the chart sets on
# bundled templates must be repeated here, plus the locally-built image.
# All four templates are enabled by default for local dev.
agentTemplates:
  - name: claude-code
    enabled: true
    description: "Default Claude Code agent"
    image:
      repository: platform-claude-code
      tag: latest
    storageSize: "5Gi"

  - name: codex
    enabled: false
    description: "OpenAI Codex coding agent"
    image:
      repository: platform-codex
      tag: latest
    storageSize: "5Gi"

  - name: pi-agent
    enabled: false
    description: "Pi coding agent with multi-LLM support"
    image:
      repository: platform-pi-agent
      tag: latest
    storageSize: "2Gi"

  - name: bob
    enabled: false
    description: "Bob shell agent"
    image:
      repository: platform-bob
      tag: latest
    storageSize: "2Gi"
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

  - name: mock
    enabled: true
    description: "Scripted mock agent (E2E test fixture)"
    image:
      repository: platform-mock
      tag: latest
    storageSize: "1Gi"
    env:
      - name: MOCK_DEFAULT_REPLY
        value: "Hello from the mock agent."

  # DAM-in-DAM dev loop (dam-kt9). Runs in THIS (outer) cluster; rebuilds
  # platform images via the inner cluster's buildkit and deploys them into
  # the inner cluster. On for local dev — cluster:install builds
  # platform-dev-agent; the build+deploy loop additionally needs the inner VM
  # plus the extraEgress allowance above. NO_PROXY pins the inner API +
  # buildkit to direct egress: the controller routes all other traffic
  # through the paired gateway, which can't proxy raw TCP (buildkit) or the
  # IP-literal inner API.
  - name: dev-agent
    enabled: true
    description: "DAM-in-DAM dev loop (build + deploy into the inner cluster)"
    image:
      repository: platform-dev-agent
      tag: latest
    storageSize: "10Gi"
    init: dev-bootstrap
    env:
      - name: NO_PROXY
        value: "192.168.5.2"
      - name: no_proxy
        value: "192.168.5.2"
      - name: REPO_REF
        value: "feat/dam-in-dam"

# Local dev convenience: route requests with any Host header (including
# IP literals like 127.0.0.1) to the app, so the cluster is reachable
# however the developer happens to address it.
ingress:
  catchAllAppHost: true

keycloak:
  # Known dev admin password for the local cluster — never used in production.
  admin:
    password: admin
  image:
    repository: platform-keycloak
    tag: latest
    pullPolicy: Never
  # Bootstrap a known dev/dev user for local cluster — never enabled in production.
  testUser:
    enabled: true
    username: dev
    password: dev
  extraRedirectUris:
    - "*"
  extraWebOrigins:
    - "*"
  # Human-readable Keycloak logs for `mise run cluster:logs` during dev.
  log:
    consoleOutput: "default"

# terms.* are required by the chart validators (ADR-047). Dev placeholder so a
# local install renders and installs without extra flags.
terms:
  version: dev
  text: "Dev placeholder Terms of Use. See ADR-047."
