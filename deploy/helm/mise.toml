[tasks.check]
depends = [":check:*"]

# Build chart dependencies (the clickstack telemetry subchart + its nested
# opentelemetry-collector) into charts/ from Chart.lock. lint and render both need the
# dependency present, so they depend on this. `helm repo add` is idempotent.
[tasks.deps]
dir = "{{config_root}}/platform"
run = """
helm repo add clickstack https://clickhouse.github.io/ClickStack-helm-charts >/dev/null 2>&1 || true
helm dependency build .
"""
sources = ["Chart.yaml", "Chart.lock"]
outputs = ["charts/*.tgz"]
cache = { enabled = true }

[tasks."check:lint"]
depends = [":deps"]
dir = "{{config_root}}/platform"
run = "helm lint ."
sources = ["**/*.yaml", "**/*.yml", "**/*.tpl", "charts/*.tgz"]
outputs = []
cache = { enabled = true }
deny_net = true
deny_write = true

# Render with the telemetry backend enabled so its manifests are schema-checked too. The
# clickstack subchart emits operator custom resources (ClickHouseCluster/KeeperCluster/
# MongoDBCommunity) that kubeconform has no schema for — skip them alongside the existing
# CRD/Istio kinds. Not network-sandboxed: kubeconform fetches its schemas.
[tasks."check:render"]
depends = [":deps"]
dir = "{{config_root}}/platform"
run = "helm template platform . --include-crds --set terms.version=test --set terms.text='Test Terms' --set clickstack.enabled=true | kubeconform -strict -summary -skip Certificate,Issuer,ClusterIssuer,AuthorizationPolicy,DestinationRule,Gateway,SecurityContextConstraints,CustomResourceDefinition,ClickHouseCluster,KeeperCluster,MongoDBCommunity"
sources = ["**/*.yaml", "**/*.yml", "**/*.tpl", "charts/*.tgz"]
outputs = []
cache = { enabled = true }
