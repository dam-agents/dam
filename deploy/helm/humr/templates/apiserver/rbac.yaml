{{/*
API Server RBAC — ServiceAccount, Roles, RoleBindings (release ns + agent ns)
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "humr.apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "humr.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
---
# Read-only Role in release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "humr.apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "humr.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "humr.apiserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "humr.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "humr.apiserver.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "humr.apiserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Read/write Role in agent namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "humr.apiserver.serviceAccountName" . }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "humr.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # `delete` powers instance restart: deleting pod-{id}-0 makes the StatefulSet
    # recreate it with the current spec — functionally equivalent to a rolling
    # restart for replicas=1 without racing against the controller's reconcile.
    verbs: ["get", "list", "watch", "delete"]
  # POC shell relay (dam-wn6) — `/api/instances/:id/shell` execs `tmux new -A
  # -s humr claude` inside the agent pod and bridges the pod-exec WebSocket to
  # the local CLI. Required even when shellSecret is empty so the helm chart
  # stays consistent across enable/disable toggles.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "humr.apiserver.serviceAccountName" . }}
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "humr.labels" . | nindent 4 }}
    app.kubernetes.io/component: apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "humr.apiserver.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "humr.apiserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
