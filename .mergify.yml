# The merge queue for main. A PR queues once its own CI/CD run's `verify`
# passed (mise check and the reduced smoke set) and the ruleset's approval is
# in; Mergify reads the approval and `verify` from the Main protection ruleset
# itself. Mergify tests each queued PR on top of main and the PRs queued ahead
# of it, as a draft queue PR from mergify/merge-queue/*, whose CI/CD run cd.yml
# treats as a merge group: both e2e lanes, in full. No batch_size: the Open
# Source plan has no batches, so each queue PR holds one more PR than the one
# ahead of it.
queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - label=queue
      - check-success=verify
    # Evaluated on the queue PR. A check distinct from `verify` makes the queue
    # two-step, which turns off Direct Merge (merging an up-to-date PR on its
    # own CI, without a queue PR run).
    merge_conditions:
      - check-success=verify-queue
    merge_method: squash
    # One rerun of a failed queue PR before its PR is ejected: most queue e2e
    # failures are flakes. A retry count above 0 also makes Mergify always open a
    # queue PR and never check a PR in place, where `verify-queue` never runs.
    max_checks_retries: 1

merge_queue:
  # Up to 3 queue PRs at once, each holding every PR queued ahead of it.
  max_parallel_checks: 3
  # A PR whose own queue PR failed still merges when a later queue PR that
  # holds it passes, as GitHub's queue did with HEADGREEN.
  skip_intermediate_results: true

pull_request_rules:
  - name: queue on the queue label
    conditions:
      - base=main
      - label=queue
    actions:
      queue:
        name: default
