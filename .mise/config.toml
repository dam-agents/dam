# Every package is a mise config root: its tasks live in <package>/mise.toml and
# are addressed as //<path>:<task> (e.g. `mise run //packages/ui:check`, or
# `mise :check` from inside the package). Repo-level tasks (setup/check/test
# aggregators, cluster ops, release) stay at the root — as [tasks] here or file
# tasks under .mise/tasks/ — and are
# addressed bare (`mise run check`) or as //:<task> from a package. This file
# is the root config (.mise/config.toml); mise.lock sits beside it.
monorepo_root = true

[monorepo]
config_roots = ["packages/*", "packages/agents/*", "packages/e2e/*", "packages/e2e/agents/*", "helm", "docs"]

[vars]
# Inside a package, {{config_root}} is the package dir; templates and tasks that
# run from the repo root use this instead.
repo_root = "{{config_root}}"

# Project dependencies (`mise deps`): run before every `mise run`/`mise x` when
# their inputs changed or outputs are missing. `mise run setup` installs them
# across all config roots; `--no-deps` skips them.
[deps.corepack]
description = "Enable corepack so pnpm resolves to package.json's packageManager"
sources = ["package.json"]
run = "corepack enable"

[deps.pnpm]
auto = true
depends = ["corepack"]
sources = [
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "packages/*/package.json",
  "packages/agents/pi-agent/workspace/.pi/agent/extensions/*/package.json",
  "package.json",
]
outputs = ["node_modules/.modules.yaml"]

[tools]
nodejs = "24"
# The experiment-sdk tasks run through uv (locked dev group: ruff, pytest) —
# declared here so CI runners get the binary; uv manages python itself.
uv = "0.9"

# Go
go = "1.26"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.22.0"

# Generates the api-server's Agent CR spec TS type from the controller's CRD
# (api-server:gen:crd-types) — keeps the Go-authored schema the single source.
"npm:json-schema-to-typescript" = "latest"

# Java + Maven — required by keycloakify to package the theme JAR (packages/keycloak-theme)
java = "21"
maven = "latest"

# Kubernetes
helm = "4.2.0"
kubeconform = "latest"
"lima" = "2"
"go:sigs.k8s.io/crdify" = "latest"

# Security scanning
"zizmor" = "latest"
"trivy" = "latest"

# misc
fd = "latest"
yq = "latest"
gum = "latest"
gh = "latest"
pinact = "latest"

[settings]
experimental = true
task.disable_spec_from_run_scripts = true

[hooks]
postinstall = ["{{ mise_bin }} setup"]


[task_config]
# Paths are relative to the repo root. .mise/tasks/ holds file tasks: each
# executable is a task named by its path (.mise/tasks/check/version →
# check:version); shared modules live non-executable under .mise/tasks/lib/.
# Repo-level one-liners and aggregators are the [tasks] at the end of this file;
# anything with a script body is a file task. the cluster:* operations are the
# file tasks under .mise/tasks/cluster/.
includes = [".mise/tasks"]

# Artifact cache (repo-root tasks): a task with `sources` and `outputs` (or
# `outputs = []` for pure checks) is keyed by source content + tool versions and
# replayed on a hit. Package tasks opt in explicitly (task_config does not reach
# other config roots) — the templates below do so.
[task_config.cache]
enabled = true

# -- Task templates ----------------------------------------------------------
# Shared shapes for the per-package mise.toml files (`extends = "<name>"`).
# Local `run`/`depends`/`sources` replace the template's; `env`/`tools` merge.
#
# Sandboxing (checks only — test suites bind loopback sockets and write runner
# caches, and the network sandbox blocks every inet socket, loopback included):
# checks never need the network, and `deny_write` blocks every write outside
# /tmp — the tree and $HOME (credentials, shell rc) alike — so it only goes on
# tools that write nothing. Landlock (Linux) / Seatbelt (macOS); Windows runs
# unsandboxed with a warning.
#
# No task depends on an install step: node_modules comes from the [deps.pnpm]
# provider, which runs before `mise run` (a dependency without a cache key
# would make every dependent uncacheable). The lockfile is in every cache key
# via `sources`.
#
# `^check:tsc` = the same task in every upstream workspace package (pnpm
# workspace graph). Internal packages export ./src/*.ts, so a downstream tsc
# and vitest read upstream sources directly; running (and hashing) upstream
# first is what keeps the artifact cache honest across package boundaries.

[task_templates."ts:check:tsc"]
depends = [{ task = "^check:tsc", optional = true }]
run = "pnpm exec tsc --noEmit"
sources = ["src/**/*.ts", "src/**/*.tsx", "tsconfig.json", "{{vars.repo_root}}/packages/dev-config/tsconfig.base.json", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache = { enabled = true }
deny_net = true
deny_write = true

[task_templates."ts:check:lint"]
run = "pnpm exec eslint ."
sources = ["src/**/*.ts", "src/**/*.tsx", "eslint.config.js", "{{vars.repo_root}}/packages/dev-config/eslint.base.js", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache = { enabled = true }
deny_net = true
deny_write = true

[task_templates."ts:check:format"]
run = "pnpm exec prettier --check 'src/**/*.{ts,tsx,css}'"
sources = ["src/**/*.ts", "src/**/*.tsx", "src/**/*.css", "{{vars.repo_root}}/.prettierrc"]
outputs = []
cache = { enabled = true }
deny_net = true
deny_write = true

[task_templates."ts:fix:lint"]
run = "pnpm exec eslint --fix ."
deny_net = true

[task_templates."ts:fix:format"]
run = "pnpm exec prettier --write 'src/**/*.{ts,tsx,css}'"
deny_net = true

[task_templates."ts:test"]
description = "Run the package's vitest suite"
depends = [{ task = "^check:tsc", optional = true }]
run = "pnpm exec vitest run"
sources = ["src/**", "vitest*.config.ts", "tsconfig.json", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache = { enabled = true }

# Agent image on the platform-base layer. Component name = package dir name;
# see .mise/tasks/image/resolve for the build-or-reuse decision.
[task_templates."agent:image"]
description = "Build the agent image, or reuse it from the registry when its source is unchanged"
dir = "{{vars.repo_root}}"
depends = ["//packages/platform-base:image"]
run = "{{ mise_bin }} run image:resolve -- build-or-reuse {{ config_root | split(pat='/') | last }} -- packages/agents/{{ config_root | split(pat='/') | last }}"

# Trivy scan of a component image. Registry name and local tag derive from the
# package dir name; override with `vars = { image = "…", local_image = "…" }`
# where they differ (keycloak-theme → keycloak, platform-base has no prefix).
[task_templates."image:scan:trivy"]
dir = "{{vars.repo_root}}"
usage = '''
flag "--json" help="Emit Trivy JSON (exit 0) instead of failing on findings"
flag "--tag <tag>" help="Scan the registry image at <tag> instead of building locally"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
{% set name = config_root | split(pat='/') | last %}
if [ -n "${usage_tag:-}" ]; then
  image="quay.io/dam-agents/{{ vars.image | default(value=name) }}:${usage_tag}"
else
  {{ mise_bin }} -C {{ config_root }} run :image
  image="{{ vars.local_image | default(value="platform-" ~ name) }}:latest"
fi
if [[ "${usage_json:-false}" == "true" ]]; then
  exec trivy image --quiet --format json "$image"
fi
exec trivy image --quiet --exit-code 1 "$image"
'''

# -- Repo-level tasks -------------------------------------------------------

# -- Aggregation --
# `x:*` matches the repo-root leaves (check:zizmor, …), `//...:x` the same task
# in every package config root (`//...` never includes the root itself).
# Dependencies are not tasks: the [deps] providers (here and in the package
# configs) run before any `mise run`, so no task depends on an install step.
[tasks.setup]
description = "Install every project dependency ([deps] providers in all config roots)"
run = "{{ mise_bin }} deps --monorepo"

[tasks.check]
depends = ["check:*", "//...:check"]

[tasks.fix]
depends = ["//...:fix"]

[tasks.scan]
depends = ["scan:*", "//...:scan"]

[tasks.test]
depends = ["//...:test"]

# -- Git hooks --
[tasks."git-hooks:pre-commit"]
hide = true
depends = ["check"]

# -- Common --
# A file task that loses its executable bit vanishes from the task list, and a
# `check:*` wildcard then skips it silently instead of failing.
[tasks."check:task-files"]
description = "Every file task under .mise/tasks (here and in the docs root) is executable"
run = """
bad=$(find .mise/tasks docs/.mise/tasks -type f -not -path '*/lib/*' -not -perm -u+x)
[ -z "$bad" ] || { echo "not executable (chmod +x):"; echo "$bad"; exit 1; }
"""
outputs = []
deny_net = true
deny_write = true

[tasks."check:zizmor"]
description = "Static security analysis for GitHub Actions workflows"
dir = "{{config_root}}"
run = "zizmor --min-confidence medium .github/workflows/"

[tasks."check:pinact"]
description = "Every GitHub Actions `uses:` must be pinned to a full commit SHA"
dir = "{{config_root}}"
# -no-api keeps this purely syntactic: upstream retagging a release must
# never fail a build that did not change. Bump pins with `pinact run -u`.
run = "pinact run -fix=false -no-api"

# -- Cluster --

[tasks."cluster:helm"]
description = "Redeploy chart only (no image rebuild, no image load, no pod restart). Use for values/template/secret changes. Forwards extra args to cluster:install."
raw = true
run = "exec env SKIP_IMAGE_BUILD=1 SKIP_IMAGE_LOAD=1 mise run cluster:install \"$@\""
