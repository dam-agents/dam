# 2026.10.4 (2026-10-07) is under the 7-day floor: it builds pipx venvs on
# mise's own Python, not whichever one uv finds. Floor passes 2026-10-14.
min_version = "2026.10.5"
monorepo_root = true

[monorepo]
config_roots = ["packages/*", "packages/agents/*", "packages/e2e/*", "packages/e2e/agents/*", "helm", "docs"]
lockfile = true

[env]
# A git hook exports these, and they point every git command at the committing
# worktree whatever the cwd: a task's git ls-files lists paths from the wrong
# directory, and the smolvm clone checks out into the worktree's index. Unset,
# git finds the repo from the cwd. STAGED and MISE_PRE_COMMIT still pass through.
GIT_DIR = false
GIT_WORK_TREE = false
GIT_INDEX_FILE = false
GIT_PREFIX = false
# mr boxington's store budget: compiled output shared by every checkout on the
# machine, collected as it fills. A developer sets a different one in
# `mise.local.toml`.
MBX_GC_MAX_TOTAL_SIZE = "60GiB"

[vars]
repo_root = "{{config_root}}"
# Each pin is the newest build of its tag that cleared the 7-day floor, timed
# by publication (the Red Hat catalog's push_date) rather than the build label,
# which issue #5291's tag-to-digest comparison ignores:
#   nodejs:26             pushed 2026-10-15T02:23:49Z, eligible 2026-10-22T02:23:49Z
#   core-runtime:latest   pushed 2026-10-15T02:31:23Z, eligible 2026-10-22T02:31:23Z
# The digests the tags name now were pushed 2026-10-22T06:24Z and T06:10Z, so
# they qualify from 2026-10-29.
base_image_api_server = "registry.access.redhat.com/hi/nodejs:26@sha256:c46573a1d159c05370bada02d6049f38fbdcfa6418c0868ad404f4b92743475c"
base_image_controller = "registry.access.redhat.com/hi/core-runtime:latest@sha256:12ebc4493ccbb80fd47175c9c670ea590c4e7140a7c4858e038ac2df42be8ca8"
# 26.8.1 (2026-10-13T08:59Z) fixes the pcre2 CVEs in 26.8.0 and Keycloak's own
# advisories, so it carries a dated exception that ends 2026-10-20T08:59Z. It
# is still the newest tag upstream publishes.
base_image_keycloak = "quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244"
# nginx 1.30.6's floor exception is spent: this build was pushed
# 2026-10-15T06:51:53Z, so it has been eligible since 2026-10-22T06:51:53Z. It
# fixes CVE-2026-15176, CVE-2026-93479, CVE-2026-95101, CVE-2026-97629 and
# CVE-2026-97205. The digest the tag names now is another build of the same
# 1.30.6, pushed 2026-10-22T07:48:02Z, so it qualifies from 2026-10-29.
base_image_ui = "registry.access.redhat.com/hi/nginx:1.30@sha256:63ef79903a967e6bf45ed76e7c5f8bf28fb7457931162e0d645e75bcdeee0c49"
base_image_debian = "mirror.gcr.io/library/debian:trixie-slim"

[deps.pnpm]
auto = true

[tools]
"aqua:rustsec/rustsec/cargo-audit" = "latest"
"conda:tar" = "latest"
"conda:coreutils" = "latest"
"conda:bash" = "latest"
"conda:pigz" = "latest"
"github:Boshen/cargo-shear" = "latest"
# panache formats Markdown with semantic line breaks; config in panache.toml.
# 3.16.0 (2026-10-13T07:09Z) clears the 7-day floor on 2026-10-20T07:09Z;
# until then 3.15.0 (2026-10-09) is the newest eligible release.
"github:jolars/panache" = "3.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.22.0"
"go:sigs.k8s.io/crdify" = "latest"
"npm:json-schema-to-typescript" = "latest"
crane = "latest"
gh = "latest"
go = "1.27"
gum = "latest"
helm = "latest"
# 2.2.0 (2026-10-14) is under the 7-day floor; 2.1.0 is the newest release
# past it. The check is check:actions.
jactionlint = "2.1.0"
java = "temurin-25"
jq = "latest"
kubeconform = "latest"
lima = "latest"
maven = "latest"
# Caches Cargo builds across checkouts and worktrees; the wrapper below is what
# routes this repo's `cargo` through it. See "The Rust build cache" in the
# README.
"mr-boxington" = "latest"
nodejs = "26"
pinact = "latest"
pnpm = "latest"
rust = { version = "latest", components = "rustfmt,clippy" }
# check:actions pipes every `run:` script through it; without it jactionlint
# only parses them, and in CI the runner image's own copy would decide.
shellcheck = "latest"
trivy = "latest"
usage = "latest"
uv = "latest"
yq = "latest"
# 1.31.1 (2026-10-15) is under the 7-day floor; 1.30.1 is the newest release
# past it. check:zizmor runs it beside jactionlint: the default profile leaves
# parts of some zizmor audits out, the dynamic-matrix injection among them.
zizmor = "1.30.1"

# Cargo runs through mr boxington, which is what makes a build here restore the
# crates another checkout or worktree already compiled. This is the wrapper
# `mbx setup` writes, declared in the project instead of a developer's config,
# so nothing touches the global mise config or rust-analyzer's settings.
# `MBX_DISABLE=1 cargo …` bypasses it for one command.
[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[settings]
npm.package_manager = "aube"
experimental = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
task.disable_spec_from_run_scripts = true

[task_templates."ts:check:tsc"]
description = "TypeScript type-checks"
depends = ["^check:tsc"]
run = "pnpm exec tsc --noEmit"
sources = ["src/**/*.{ts,tsx}", "tsconfig.json", "{{vars.repo_root}}/packages/dev-config/tsconfig.base.json", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache.enabled = true
deny_net = true
deny_write = true

[task_templates."ts:check:lint"]
description = "ESLint passes"
run = "pnpm exec eslint ."
sources = ["src/**/*.{ts,tsx}", "eslint.config.js", "{{vars.repo_root}}/packages/dev-config/eslint.base.js", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache.enabled = true
deny_net = true
deny_write = true

[task_templates."ts:check:format"]
description = "Sources are Prettier-formatted"
run = "pnpm exec prettier --check 'src/**/*.{ts,tsx,css}'"
sources = ["src/**/*.{ts,tsx,css}", "{{vars.repo_root}}/.prettierrc", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache.enabled = true
deny_net = true
deny_write = true

[task_templates."ts:fix:lint"]
description = "Apply ESLint fixes"
run = "pnpm exec eslint --fix ."
deny_net = true

[task_templates."ts:fix:format"]
description = "Format sources with Prettier"
run = "pnpm exec prettier --write 'src/**/*.{ts,tsx,css}'"
deny_net = true

[task_templates."ts:test"]
description = "Run the package's vitest suite"
depends = ["^check:tsc"]
run = "pnpm exec vitest run"
sources = ["src/**", "vitest*.config.ts", "tsconfig.json", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache.enabled = true

[tasks.check]
description = "Run every check"
depends = ["check:*", "//...:check"]

[tasks.fix]
description = "Apply every fix: formatters, linters, generators"
depends = ["fix:comment-types", "fix:markdown"]
run = [{ tasks = ["fix:skill-manifest", "fix:skills-lock", "//docs:fix", "//packages/...:fix"] }]

[tasks.test]
description = "Run every test suite"
depends = ["//...:test"]

[tasks."check:task-files"]
description = "Every file task under a .mise/tasks directory is executable"
run = """
bad=$(git ls-files -co --exclude-standard | grep -E '(^|/)[.]mise/tasks/' | while read -r f; do [ ! -f "$f" ] || [ -x "$f" ] || echo "$f"; done)
[ -z "$bad" ] || { echo "not executable (chmod +x):"; echo "$bad"; exit 1; }
"""
outputs = []
deny_net = true
deny_write = true

[tasks."check:comment-types"]
description = "Every code comment carries a registered type prefix (see Code comments in AGENTS.md)"
run = { task = "fix:comment-types", args = ["--check"] }

[tasks."check:markdown"]
description = "Markdown prose has one sentence per line"
run = { task = "fix:markdown", args = ["--check"] }

[tasks."check:skills-lock"]
description = "skills-lock.json lists exactly the contributor skills under .agents/skills"
run = { task = "fix:skills-lock", args = ["--check"] }

[tasks."check:skill-manifest"]
description = "Every shipped image skill's content hash is in the append-only shipped-skill manifest"
run = "pnpm --filter agent-runtime exec tsx scripts/skill-manifest.ts check"
deny_net = true

[tasks."fix:skill-manifest"]
description = "Append the shipped image skills' content hashes to the shipped-skill manifest"
run = "pnpm --filter agent-runtime exec tsx scripts/skill-manifest.ts generate"
deny_net = true

