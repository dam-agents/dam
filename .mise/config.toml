min_version = "2026.10.2"
monorepo_root = true

[monorepo]
config_roots = ["packages/*", "packages/agents/*", "packages/e2e/*", "packages/e2e/agents/*", "helm", "docs"]
lockfile = true

[env]
CC_x86_64_unknown_linux_gnu = "{{config_root}}/.mise/zig/cc"
AR_x86_64_unknown_linux_gnu = "{{config_root}}/.mise/zig/ar"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "{{config_root}}/.mise/zig/cc"
CC_aarch64_unknown_linux_gnu = "{{config_root}}/.mise/zig/cc"
AR_aarch64_unknown_linux_gnu = "{{config_root}}/.mise/zig/ar"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "{{config_root}}/.mise/zig/cc"

[vars]
repo_root = "{{config_root}}"
base_image_api_server = "registry.access.redhat.com/hi/nodejs:26@sha256:c5b2afb85ecfff60c935a8c8df1851020f711b9211217309d4b59fcda8e0e22f"
base_image_controller = "registry.access.redhat.com/hi/core-runtime:latest@sha256:06f90824df42c6d2dae1ff7b457b3d24e0e0901554dbf2f69d3fbd0886cd0635"
base_image_keycloak = "quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc"
base_image_ui = "registry.access.redhat.com/hi/nginx:1.30@sha256:7c88ec5f1177a2ab937e3fb99c3e42c367c629a7632e5c90a9dc607a9e4d1dcc"
base_image_debian = "mirror.gcr.io/library/debian:trixie-slim"

[deps.pnpm]
auto = true

[tools]
"aqua:rustsec/rustsec/cargo-audit" = "latest"
"conda:tar" = "latest"
"conda:coreutils" = "latest"
"conda:bash" = "latest"
"conda:pigz" = "latest"
"github:Boshen/cargo-shear" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.22.0"
"go:sigs.k8s.io/crdify" = "latest"
"npm:json-schema-to-typescript" = "latest"
"npm:knip" = "latest"
crane = "latest"
fd = "latest"
gh = "latest"
go = "1.27"
gum = "latest"
helm = "latest"
java = "temurin-25"
jq = "latest"
kubeconform = "latest"
lima = "latest"
maven = "latest"
nodejs = "26"
pinact = "latest"
pnpm = "latest"
rust = { version = "latest", components = "rustfmt,clippy" }
trivy = "latest"
usage = "latest"
uv = "latest"
yq = "latest"
zig = { version = "latest", os = ["linux"] }
zizmor = "latest"

[settings]
npm.package_manager = "aube"
experimental = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
task.disable_spec_from_run_scripts = true

[task_templates."ts:check:tsc"]
description = "TypeScript type-checks"
depends = ["^check:tsc"]
run = "pnpm exec tsc --noEmit"
sources = ["src/**/*.{ts,tsx}", "tsconfig.json", "{{vars.repo_root}}/packages/dev-config/tsconfig.base.json", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache.enabled = true
deny_net = true
deny_write = true

[task_templates."ts:check:lint"]
description = "ESLint passes"
run = "pnpm exec eslint ."
sources = ["src/**/*.{ts,tsx}", "eslint.config.js", "{{vars.repo_root}}/packages/dev-config/eslint.base.js", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache.enabled = true
deny_net = true
deny_write = true

[task_templates."ts:check:format"]
description = "Sources are Prettier-formatted"
run = "pnpm exec prettier --check 'src/**/*.{ts,tsx,css}'"
sources = ["src/**/*.{ts,tsx,css}", "{{vars.repo_root}}/.prettierrc", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache.enabled = true
deny_net = true
deny_write = true

[task_templates."ts:fix:lint"]
description = "Apply ESLint fixes"
run = "pnpm exec eslint --fix ."
deny_net = true

[task_templates."ts:fix:format"]
description = "Format sources with Prettier"
run = "pnpm exec prettier --write 'src/**/*.{ts,tsx,css}'"
deny_net = true

[task_templates."ts:test"]
description = "Run the package's vitest suite"
depends = ["^check:tsc"]
run = "pnpm exec vitest run"
sources = ["src/**", "vitest*.config.ts", "tsconfig.json", "{{vars.repo_root}}/pnpm-lock.yaml"]
outputs = []
cache.enabled = true

[tasks.check]
description = "Run every check"
depends = ["check:*", "//...:check"]

[tasks.fix]
description = "Apply every fix: formatters, linters, generators"
depends = ["fix:comment-types"]
run = [{ tasks = ["fix:skill-manifest", "//docs:fix", "//packages/...:fix"] }]

[tasks.test]
description = "Run every test suite"
depends = ["//...:test"]

[tasks."check:task-files"]
description = "Every file task under a .mise/tasks directory is executable"
run = """
bad=$(fd --hidden --type f --full-path '/[.]mise/tasks/' --exec-batch sh -c 'for f; do [ -x "$f" ] || echo "$f"; done' sh)
[ -z "$bad" ] || { echo "not executable (chmod +x):"; echo "$bad"; exit 1; }
"""
outputs = []
deny_net = true
deny_write = true

[tasks."check:comment-types"]
description = "Every code comment carries a registered type prefix (see Code comments in AGENTS.md)"
run = { task = "fix:comment-types", args = ["--check"] }

[tasks."check:skill-manifest"]
description = "Every shipped image skill's content hash is in the append-only shipped-skill manifest"
run = "pnpm --filter agent-runtime exec tsx scripts/skill-manifest.ts check"
deny_net = true

[tasks."fix:skill-manifest"]
description = "Append the shipped image skills' content hashes to the shipped-skill manifest"
run = "pnpm --filter agent-runtime exec tsx scripts/skill-manifest.ts generate"
deny_net = true

