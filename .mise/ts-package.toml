# The tasks every TypeScript package has, which its .mise/config.toml takes
# with `[task_config] includes`. A task the package defines itself replaces
# the one here.
[check]
description = "Run this package's checks"
depends = [":check:*"]

[fix]
description = "Apply this package's fixes"
depends = [":fix:*"]

["check:tsc"]
extends = "ts:check:tsc"

["check:lint"]
extends = "ts:check:lint"

["check:format"]
extends = "ts:check:format"

["fix:lint"]
extends = "ts:fix:lint"

["fix:format"]
extends = "ts:fix:format"
