schemaVersion: v1
id: nous
name: Nous
description: >-
  Hypothesis-driven experimentation campaigns against a target system the
  agent clones, builds, patches and measures. Runs on the pre-built Nous
  image.
category: research
docsUrl: https://github.com/dam-agents/dam/blob/main/packages/agents/nous/README.md
image:
  ref: quay.io/dam-agents/nous:0.2.18-dev-97ce11b16dd1
  harness: claude-code
  providers: [ibm-litellm, anthropic]
connections:
  - accepts: [ibm-litellm, anthropic]
    required: true
    note: Nous drives Claude through the Claude Agent SDK; an API-key style credential is needed.
  - accepts: [github, github-enterprise]
    note: Needed to clone private target repositories and publish results.
hibernationTimeoutMin: 0
parameters:
  - name: target repository
    required: true
  - name: campaign goal
    required: true
    note: What to optimize and how it is measured.
