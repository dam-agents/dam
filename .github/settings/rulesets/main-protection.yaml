bypass_actors:
  - actor_id: null
    actor_type: OrganizationAdmin
    bypass_mode: exempt
  - actor_id: 5
    actor_type: RepositoryRole
    bypass_mode: exempt
conditions:
  ref_name:
    exclude: []
    include:
      - ~DEFAULT_BRANCH
enforcement: active
name: Main protection
rules:
  - type: deletion
  - type: non_fast_forward
  - parameters:
      allowed_merge_methods:
        - squash
        - rebase
        - merge
      dismiss_stale_reviews_on_push: false
      # Only the Developers team dismisses reviews, as the legacy branch
      # protection had it.
      dismissal_restriction:
        allowed_actors:
          - id: 17367424
            type: Team
        enabled: true
      require_code_owner_review: false
      require_extra_approval_for_unattributed_changes: true
      require_last_push_approval: false
      required_approving_review_count: 1
      required_review_thread_resolution: false
      required_reviewers: []
    type: pull_request
  - parameters:
      do_not_enforce_on_create: false
      required_status_checks:
        - context: verify
          integration_id: 15368
      strict_required_status_checks_policy: false
    type: required_status_checks
  - parameters:
      check_response_timeout_minutes: 100
      # HEADGREEN: a batch passes when its last entry's group does, so a
      # failed group does not eject a PR a later passing group contains.
      # Fewer rebuilds after ejections; main is green at each batch's end.
      grouping_strategy: HEADGREEN
      max_entries_to_build: 5
      max_entries_to_merge: 5
      merge_method: SQUASH
      min_entries_to_merge: 1
      min_entries_to_merge_wait_minutes: 5
    type: merge_queue
target: branch
