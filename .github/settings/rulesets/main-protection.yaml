bypass_actors:
  - actor_id: null
    actor_type: OrganizationAdmin
    bypass_mode: always
  - actor_id: 5
    actor_type: RepositoryRole
    bypass_mode: always
  # Mergify's GitHub App. `exempt` is the one mode that covers its queue
  # branches and its merges; it still enforces this ruleset's approval and
  # required checks as queue conditions.
  - actor_id: 10562
    actor_type: Integration
    bypass_mode: exempt
conditions:
  ref_name:
    exclude: []
    include:
      - ~DEFAULT_BRANCH
enforcement: active
name: Main protection
rules:
  - type: deletion
  - type: non_fast_forward
  - parameters:
      allowed_merge_methods:
        - squash
        - rebase
        - merge
      dismiss_stale_reviews_on_push: false
      # Only the Developers team dismisses reviews, as the legacy branch
      # protection had it.
      dismissal_restriction:
        allowed_actors:
          - id: 17367424
            type: Team
        enabled: true
      require_code_owner_review: false
      require_extra_approval_for_unattributed_changes: true
      require_last_push_approval: false
      required_approving_review_count: 1
      required_review_thread_resolution: false
      required_reviewers: []
    type: pull_request
  - parameters:
      do_not_enforce_on_create: false
      required_status_checks:
        - context: verify
          integration_id: 15368
      strict_required_status_checks_policy: false
    type: required_status_checks
target: branch
