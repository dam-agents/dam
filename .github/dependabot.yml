# Security-only: open-pull-requests-limit: 0 disables version updates
# while registering the correct directory for security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: gomod
    directory: /packages/controller
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: /packages/vm-runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: uv
    directory: /packages/driver-sdk-py
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
