          echo "compilations=$(grep -acE '(Compiling|Checking) ' /tmp/ci-mbx-trial-bench.log)"
      # Keeps this trial's footprint to two entries per mode: everything
      # but the newest goes before this job's own save lands.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: linux-x64-mbx-v1-target-rust-
        run: |
          set -uo pipefail
          gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | select(.key|startswith(env.PREFIX)) | "\(.created_at) \(.id)"' \
            | sort | head -n -1 | while read -r _ id; do
                gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
