# Trial only: measures the Rust cache of PR #5463. Deleted before that PR reports.
name: mbx bench

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # The cleanup step deletes this pull request's own trial entries.
  actions: write # zizmor: ignore[excessive-permissions] (trial cleanup)

jobs:
  old-cold:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/vm-runner/target
          key: rust-bench-old-cold
          restore-keys: rust-bench-absent-
      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository]
      - name: Rust tasks
        env:
          MODE: old
          SCENARIO: cold
        run: |
          set -o pipefail
          start=$(date +%s)
          mise run --continue-on-error //packages/vm-runner:check:lint ::: //packages/vm-runner:test 2>&1 | tee /tmp/ci-mbx-trial-bench.log
          echo "total=$(( $(date +%s) - start ))s"
          echo "### $MODE $SCENARIO"
          grep -aE 'Finished in|mbx\[cache\]:' /tmp/ci-mbx-trial-bench.log | tail -8
          echo "compilations=$(grep -acE '(Compiling|Checking) ' /tmp/ci-mbx-trial-bench.log)"

  old-warm1:
    needs: [old-cold]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
