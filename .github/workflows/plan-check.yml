name: Plan check

# docs/plan/<feature>/ is a working artifact of plan-feature: it starts the
# feature branch and must be deleted before the feature merges. This check is
# red while the plan is on the branch and flips green once the cleanup commit
# lands — make it a required status check so a plan can never reach main.
# Draft PRs are skipped (skipped counts as passing for required checks);
# ready_for_review re-triggers the run when the PR leaves draft.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  no-plan-files:
    name: no docs/plan in merge result
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail if docs/plan exists
        run: |
          set -euo pipefail
          files=$(git ls-files -- docs/plan)
          if [ -n "$files" ]; then
            echo "::error::docs/plan/ must be deleted before merge (plan-feature working artifact):"
            printf '%s\n' "$files"
            exit 1
          fi
          echo "No plan files present."
