name: CodeQL (go)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "packages/controller/**"
      - ".github/workflows/codeql-analyze.yml"
      - ".github/workflows/codeql-go.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-go-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/codeql-analyze.yml
    with:
      language: go
      build-mode: autobuild
