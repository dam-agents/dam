name: vm soak

# Soaks the vm Backend at the smolvm release the vm-runner pins: `mise run
# e2e:vm-soak` on a fresh KVM runner, which installs the e2e cluster with
# virtualization and drives one vm agent through sustained load and repeated
# stop/start cycles. It is aimed at failures a single boot never shows — a
# guest exiting silently under load, a machine whose network does not come back
# after a restart — so it runs nightly and on demand rather than per PR, where
# cd.yml's e2e-vm lane covers one boot of each kind.
#
# There are no build jobs in this workflow, so e2e:ci-images builds whatever is
# not published at its source sha on this runner and pulls the rest, as a PR's
# e2e does. The steps otherwise follow cd.yml's e2e-vm job; setup-mise is
# referenced as `./` for the reason cd.yml gives.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: Stop/start cycles after the load phase
        default: "20"
      load-minutes:
        description: Minutes of sustained load before the cycles
        default: "15"

permissions:
  contents: read

concurrency:
  group: vm-soak-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: quay.io/dam-agents
  SOURCE_DATE_EPOCH: "1735689600"
  MISE_LOCKED: "1"

jobs:
  soak:
    name: vm soak
    runs-on: ubuntu-latest
    # The install, twenty cycles of a stop, a boot and the checks after it, and
    # the load phase, with room for a slow boot in each cycle.
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      IS_SANDBOX: "1"
      E2E_VIRTUALIZATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # e2e:ci-images resolves every image by its source history.
          fetch-depth: 0
      - name: Open /dev/kvm to the runner user
        run: |
          set -euo pipefail
          [ -e /dev/kvm ] || { echo "::error::this runner has no /dev/kvm, and the soak needs a KVM-capable runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          python3 -c 'import os; os.close(os.open("/dev/kvm", os.O_RDWR))'
          ls -l /dev/kvm /dev/net/tun
      # cd.yml's check-test saves the pnpm store on main; read-only here.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository]
        with:
          quay-username: ${{ secrets.QUAY_USERNAME }}
          quay-password: ${{ secrets.QUAY_PASSWORD }}
      - name: Provision k3s in the background
        run: |
          nohup bash -c '.mise/tasks/cluster/provision-host etc/lima/k3s-test.yaml; echo $? > /tmp/k3s-provision.status' \
            > /tmp/k3s-provision.log 2>&1 &
      # See cd.yml's e2e job: before the background build, so neither races
      # the other.
      - run: mise run //packages/keycloak-theme:build
      - run: mise deps install --only pnpm
      - name: Build or fetch the images in the background
        env:
          CI_IMAGES_BUILD: "1"
        run: nohup .mise/tasks/e2e/ci-images /tmp/ci-images.status > /tmp/ci-images.log 2>&1 &
      - id: playwright
        run: |
          set -euo pipefail
          v="$(sed -n 's/^  playwright-core@\([0-9][^:]*\):.*/\1/p' pnpm-lock.yaml | head -n1)"
          [ -n "$v" ] || { echo "::error::pnpm-lock.yaml resolves no playwright-core"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Soak
        timeout-minutes: 225
        env:
          SKIP_IMAGE_BUILD: "1"
          CI_IMAGES_STATUS: /tmp/ci-images.status
          # Inputs are empty on the nightly run, which takes the task's
          # defaults; the task rejects anything but a whole number.
          CYCLES: ${{ inputs.cycles }}
          LOAD_MINUTES: ${{ inputs.load-minutes }}
        run: |
          timeout 180 bash -c 'until [ -s /tmp/k3s-provision.status ]; do sleep 1; done' ||
            { echo "::error::the background k3s provision is still running after 3 minutes"; exit 1; }
          args=()
          [ -z "$CYCLES" ] || args+=("--cycles=$CYCLES")
          [ -z "$LOAD_MINUTES" ] || args+=("--load-minutes=$LOAD_MINUTES")
          mise run e2e:vm-soak ${args[@]+-- "${args[@]}"}
      - name: Image fetch log
        if: ${{ !cancelled() }}
        run: cat /tmp/ci-images.log
      - name: k3s provision log
        if: ${{ !cancelled() }}
        run: cat /tmp/k3s-provision.log
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-vm-soak
          path: |
            packages/e2e/playwright/playwright-report/
            packages/e2e/playwright/test-results/
          retention-days: 14
          if-no-files-found: ignore
