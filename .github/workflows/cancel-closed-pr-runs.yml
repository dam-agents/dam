name: Cancel closed PR runs

# GitHub keeps a PR's CI/CD run going after the PR merges or closes. Each run
# holds about fifteen runner slots, so a run nobody will read keeps main's
# run waiting for runners. Closing a PR cancels its unfinished CI/CD runs.

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    name: cancel the closed PR's CI/CD runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel unfinished CI/CD runs for the PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh run list -R "$GITHUB_REPOSITORY" --workflow cd.yml --event pull_request \
            --branch "$BRANCH" --limit 50 --json databaseId,status \
            -q '.[] | select(.status != "completed") | .databaseId' |
            while read -r id; do
              gh run cancel -R "$GITHUB_REPOSITORY" "$id" || true
            done
