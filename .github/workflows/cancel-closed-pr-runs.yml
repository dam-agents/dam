name: Cancel closed PR runs

# GitHub keeps a PR's CI/CD run going after the PR merges or closes. Each run
# holds about fifteen runner slots, so a run nobody will read keeps main's
# run waiting for runners. Closing a PR cancels its unfinished CI/CD runs.
# Only the runs of the PR's last head commit: Mergify closes a batch PR when
# the batch is done, split or reset, and may open the next batch PR, with a
# new commit, on the same mergify/merge-queue/* branch. An open PR's older
# commits have no runs left to cancel; its concurrency group cancelled them.

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancel:
    name: cancel the closed PR's CI/CD runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel unfinished CI/CD runs for the PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh run list -R "$GITHUB_REPOSITORY" --workflow cd.yml --event pull_request \
            --branch "$BRANCH" --commit "$HEAD_SHA" --limit 50 --json databaseId,status \
            -q '.[] | select(.status != "completed") | .databaseId' |
            while read -r id; do
              gh run cancel -R "$GITHUB_REPOSITORY" "$id" || true
            done
