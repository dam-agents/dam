name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: quay.io/dam-agents
  SOURCE_DATE_EPOCH: "1735689600"
  MISE_VERSION: "2026.9.12"
  MISE_LOCKED: "1"

jobs:
  check:
    name: mise check
    runs-on: ubuntu-latest
    # Twenty minutes, not ten. A cold run installs its tools, compiles smolvm
    # from source and then has caches to write back, and a run measured at
    # 10m04s was killed in that tail after `mise run check` had already passed —
    # which reports as cancelled and reads as a red PR. Since #3857 a PR run
    # never saves, so a branch cannot warm itself: if main's entry is missing or
    # its key has moved, every PR pays the full cold cost until the next main
    # push rewrites it. That run is the one this budget has to fit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/task-artifacts
          key: mise-task-artifacts-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            mise-task-artifacts-${{ runner.os }}-${{ github.job }}-
            mise-task-artifacts-${{ runner.os }}-
      - id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/vm-runner/target
          key: rust-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/vm-runner/Cargo.toml', 'packages/vm-runner/Cargo.lock', 'packages/vm-runner/smolvm.pin') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ github.job }}-
            rust-${{ runner.os }}-
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/controller/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-
            go-${{ runner.os }}-
      - run: mise run check
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/task-artifacts
          key: mise-task-artifacts-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/controller/go.sum') }}
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/vm-runner/target
          key: rust-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/vm-runner/Cargo.toml', 'packages/vm-runner/Cargo.lock', 'packages/vm-runner/smolvm.pin') }}

  test:
    name: mise test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Twenty minutes, not ten. A cold run installs its tools, compiles smolvm
    # from source and then has caches to write back, and a run measured at
    # 10m04s was killed in that tail after `mise run check` had already passed —
    # which reports as cancelled and reads as a red PR. Since #3857 a PR run
    # never saves, so a branch cannot warm itself: if main's entry is missing or
    # its key has moved, every PR pays the full cold cost until the next main
    # push rewrites it. That run is the one this budget has to fit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/task-artifacts
          key: mise-task-artifacts-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            mise-task-artifacts-${{ runner.os }}-${{ github.job }}-
            mise-task-artifacts-${{ runner.os }}-
      - id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/vm-runner/target
          key: rust-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/vm-runner/Cargo.toml', 'packages/vm-runner/Cargo.lock', 'packages/vm-runner/smolvm.pin') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ github.job }}-
            rust-${{ runner.os }}-
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/controller/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-
            go-${{ runner.os }}-
      - run: mise run test
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/task-artifacts
          key: mise-task-artifacts-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/controller/go.sum') }}
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/vm-runner/target
          key: rust-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/vm-runner/Cargo.toml', 'packages/vm-runner/Cargo.lock', 'packages/vm-runner/smolvm.pin') }}

  # appversion and the merge-* jobs only tag images, and nothing on a PR reads
  # a tag: e2e pulls by digest, agents build from platform-base's digest, and
  # publishing and scanning run on main and tags. A PR skips them. Runner slots
  # are what a PR waits on: run 35789042417 queued its builds for up to 9m44s
  # while the builds themselves took seconds.
  appversion:
    name: derive app version
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      composite: ${{ steps.c.outputs.composite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: c
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:12}"
          if [ "$REF_TYPE" = "tag" ] && [ "${REF_NAME#v}" != "$REF_NAME" ]; then
            composite="${REF_NAME#v}"
          else
            appver="$(grep -E '^appVersion:' helm/Chart.yaml | head -n1 | sed -E 's/^appVersion:[[:space:]]*//; s/["'"'"']//g')"
            composite="${appver}-dev-${short}"
          fi
          echo "composite=$composite" >> "$GITHUB_OUTPUT"
          echo "::notice::composite app version: $composite"

  changes:
    name: detect stale images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform_base: ${{ steps.d.outputs.platform_base }}
      platform_base_tag: ${{ steps.d.outputs.platform_base_tag }}
      agents: ${{ steps.d.outputs.agents }}
      archs: ${{ steps.d.outputs.archs }}
      workloads: ${{ steps.d.outputs.workloads }}
      claude_code_base_tag: ${{ steps.d.outputs.claude_code_base_tag }}
      source_shas: ${{ steps.d.outputs.source_shas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          [ "$EVENT" = pull_request ] || export RESOLVE_NO_REUSE=1
          [ "$MAIN_PUSH" != true ] || export RESOLVE_REUSE_AGENTS=1
          # By path: this job has no mise; the same file is the image:resolve task.
          out="$(.mise/tasks/image/resolve gha-outputs)"
          printf '%s\n' "$out" | tee -a "$GITHUB_OUTPUT"
          printf '::notice::%s\n' "$(printf '%s' "$out" | tr '\n' ' ')"

  build-images:
    needs: [changes]
    # A PR builds in build-images-pr instead.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      matrix:
        component: [controller, vm-runner, api-server, ui, keycloak]
        arch: ${{ fromJSON(needs.changes.outputs.archs) }}
        include:
          - component: controller
            dockerfile: packages/controller/Dockerfile
            context: packages/controller
          - component: vm-runner
            dockerfile: packages/controller/Dockerfile.vm-runner
            context: packages/controller
            # The runner is the Rust crate, built from a second named context.
            build-contexts: vm-runner=packages/vm-runner
          - component: api-server
            dockerfile: packages/api-server/Dockerfile
            context: .
          - component: ui
            dockerfile: packages/ui/Dockerfile
            context: .
          - component: keycloak
            dockerfile: packages/keycloak-theme/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - if: matrix.component == 'keycloak'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
      - if: matrix.component == 'keycloak'
        run: mise run //packages/keycloak-theme:build
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build-contexts }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          # Only the registry buildcache. A gha cache export was also written
          # here, on PR runs, with mode=max — every intermediate layer of every
          # component, gigabytes per run, into the 10 GB GitHub gives the whole
          # repository and evicts from oldest first. A PR run can read back
          # only what it wrote itself, so those gigabytes bought re-push hits
          # on one PR and in exchange evicted the Go, mise-tool and Playwright
          # caches that every run reads. The registry buildcache has no such
          # cap, is written by main and is readable from every PR, so PR runs
          # read it and write nothing.
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max,image-manifest=true', env.IMAGE_PREFIX, matrix.component, matrix.arch) || '' }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  build-images-pr:
    name: build images
    # One job for a PR's amd64 images, where main runs a matrix job per
    # component. Most of a PR's builds are registry-cache hits, a few seconds
    # each, so each matrix job was mostly its own setup and a turn in the
    # queue for a runner slot. Here the builds run in parallel on one runner.
    # mock joins them unless platform-base moved: then build-mock builds it on
    # top of this run's platform-base.
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Build
        env:
          SHA: ${{ github.sha }}
          PLATFORM_BASE_BUILT: ${{ needs.changes.outputs.platform_base }}
          PLATFORM_BASE_TAG: ${{ needs.changes.outputs.platform_base_tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/meta /tmp/logs
          pids=() names=()
          # build <name> <dockerfile> <context> <output> [extra args...]
          build() {
            local name=$1 file=$2 ctx=$3 out=$4; shift 4
            docker buildx build --platform linux/amd64 -f "$file" \
              --cache-from "type=registry,ref=$IMAGE_PREFIX/$name:buildcache-amd64" \
              --output "$out" --metadata-file "/tmp/meta/$name.json" "$@" "$ctx" \
              > "/tmp/logs/$name.log" 2>&1 &
            pids+=($!) names+=("$name")
          }
          digest_out() { echo "type=image,name=$IMAGE_PREFIX/$1,push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true"; }
          build controller packages/controller/Dockerfile packages/controller "$(digest_out controller)"
          build api-server packages/api-server/Dockerfile . "$(digest_out api-server)"
          build ui packages/ui/Dockerfile . "$(digest_out ui)"
          # e2e does not run the vm-runner, so a PR only proves it builds.
          build vm-runner packages/controller/Dockerfile.vm-runner packages/controller type=cacheonly
          if [ "$PLATFORM_BASE_BUILT" != true ]; then
            build mock packages/e2e/agents/mock/Dockerfile . "type=image,name=$IMAGE_PREFIX/mock:$SHA,push=true" \
              --build-arg "BASE_IMAGE=$IMAGE_PREFIX/platform-base:$PLATFORM_BASE_TAG"
          fi
          # The keycloak image bakes in the theme JAR, built here while the
          # other images build.
          mise run //packages/keycloak-theme:build
          build keycloak packages/keycloak-theme/Dockerfile . "$(digest_out keycloak)"
          failed=()
          for i in "${!pids[@]}"; do wait "${pids[$i]}" || failed+=("${names[$i]}"); done
          for n in "${names[@]}"; do
            echo "::group::$n"; cat "/tmp/logs/$n.log"; echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then echo "::error::failed to build: ${failed[*]}"; exit 1; fi
          for c in controller api-server ui keycloak; do
            d="$(jq -r '."containerimage.digest"' "/tmp/meta/$c.json")"
            mkdir -p "/tmp/digests/$c" && touch "/tmp/digests/$c/${d#sha256:}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-controller-amd64
          path: /tmp/digests/controller/*
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-api-server-amd64
          path: /tmp/digests/api-server/*
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-ui-amd64
          path: /tmp/digests/ui/*
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-keycloak-amd64
          path: /tmp/digests/keycloak/*
          retention-days: 1
          if-no-files-found: error

  merge-images:
    name: merge multi-arch manifests
    needs: [changes, build-images, appversion, check]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        component: [controller, vm-runner, api-server, ui, keycloak]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          tags: |
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.appversion.outputs.composite }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ fromJSON(needs.changes.outputs.source_shas)['keycloak'] }},enable=${{ matrix.component == 'keycloak' && github.event_name != 'pull_request' }}
            type=raw,value=${{ fromJSON(needs.changes.outputs.source_shas)['vm-runner'] }},enable=${{ matrix.component == 'vm-runner' && github.event_name != 'pull_request' }}
      - name: Create manifest list and push
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

  build-platform-base:
    needs: [changes]
    if: ${{ needs.changes.outputs.platform_base == 'true' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.changes.outputs.archs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/platform-base/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/platform-base,push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          # Registry buildcache only: see build-images.
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/platform-base:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/platform-base:buildcache-{1},mode=max,image-manifest=true', env.IMAGE_PREFIX, matrix.arch) || '' }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-platform-base-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge-platform-base:
    name: merge multi-arch platform-base manifest
    needs: [build-platform-base, appversion, changes, check]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.platform_base == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-platform-base-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/platform-base
          tags: |
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.appversion.outputs.composite }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ fromJSON(needs.changes.outputs.source_shas)['platform-base'] }},enable=${{ github.event_name != 'pull_request' }}
      - name: Create manifest list and push
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/platform-base
        run: |
          set -euo pipefail
          cd /tmp/digests
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

  build-agents:
    # From build-platform-base's digest, not merge-platform-base's tag: the
    # tag waits on `check`, which is not what an agent build depends on.
    # merge-agents keeps the `check` gate on publishing.
    needs: [build-platform-base, changes]
    if: ${{ needs.changes.outputs.agents != '[]' && !cancelled() && !failure() }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.agents) }}
        arch: ${{ fromJSON(needs.changes.outputs.archs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.platform_base == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-platform-base-${{ matrix.arch }}
          path: /tmp/base-digest
      - id: base
        env:
          BUILT: ${{ needs.changes.outputs.platform_base }}
          TAG: ${{ needs.changes.outputs.platform_base_tag }}
        run: |
          set -euo pipefail
          if [ "$BUILT" = true ]; then ref="$IMAGE_PREFIX/platform-base@sha256:$(ls /tmp/base-digest)"; else ref="$IMAGE_PREFIX/platform-base:$TAG"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: packages/agents/${{ matrix.component }}
          file: packages/agents/${{ matrix.component }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # A PR builds its agents only to prove they build: e2e runs the mock,
          # and nothing reads a PR's agent tags. Exporting is most of the cost —
          # k-search spent 9 of its 10 minutes compressing, re-timestamping and
          # pushing layers after a one-minute build — so a PR exports nothing.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true', env.IMAGE_PREFIX, matrix.component) }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          # Registry buildcache only: see build-images.
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max,image-manifest=true', env.IMAGE_PREFIX, matrix.component, matrix.arch) || '' }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge-agents:
    name: merge multi-arch agent manifests
    needs: [build-agents, appversion, changes, check]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.agents != '[]' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.agents) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          tags: |
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.appversion.outputs.composite }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ fromJSON(needs.changes.outputs.source_shas)[matrix.component] }},enable=${{ github.event_name != 'pull_request' }}
      - name: Create manifest list and push
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

  build-workloads:
    needs: [merge-agents, changes]
    if: ${{ needs.changes.outputs.workloads != '[]' && !cancelled() && !failure() }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      # one flaky workload build must not cancel the siblings
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.workloads) }}
        arch: ${{ fromJSON(needs.changes.outputs.archs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: packages/agents/${{ matrix.component }}
          file: packages/agents/${{ matrix.component }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}/claude-code:${{ needs.changes.outputs.claude_code_base_tag }}
          # Registry buildcache only: see build-images.
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max,image-manifest=true', env.IMAGE_PREFIX, matrix.component, matrix.arch) || '' }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge-workloads:
    name: merge multi-arch workload manifests
    needs: [build-workloads, appversion, changes]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.workloads != '[]' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.workloads) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
          tags: |
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.appversion.outputs.composite }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ fromJSON(needs.changes.outputs.source_shas)[matrix.component] }},enable=${{ github.event_name != 'pull_request' }}
      - name: Create manifest list and push
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

  build-mock:
    name: build mock (e2e fixture)
    needs: [build-platform-base, changes]
    # On a PR, build-images-pr builds mock unless platform-base moved.
    if: >-
      ${{ !startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure() &&
          (github.event_name != 'pull_request' || needs.changes.outputs.platform_base == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.platform_base == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-platform-base-amd64
          path: /tmp/digests
      - id: base
        env:
          BUILT: ${{ needs.changes.outputs.platform_base }}
          TAG: ${{ needs.changes.outputs.platform_base_tag }}
        run: |
          set -euo pipefail
          if [ "$BUILT" = true ]; then ref="$IMAGE_PREFIX/platform-base@sha256:$(ls /tmp/digests)"; else ref="$IMAGE_PREFIX/platform-base:$TAG"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/e2e/agents/mock/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/mock:${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          # Registry buildcache only: see build-images.
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/mock:buildcache-amd64
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/mock:buildcache-amd64,mode=max,image-manifest=true', env.IMAGE_PREFIX) || '' }}

  e2e:
    name: mise e2e
    # No `needs` on the builds: bringing the cluster up takes minutes and needs
    # no image, so it runs while they build. e2e:ci-images waits for them in
    # the background, and cluster:install waits for it at the image load. A
    # failed build still fails this job, there.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # The builds' own time now counts against this budget.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      IS_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Fetch this run's images in the background
        env:
          GH_TOKEN: ${{ github.token }}
          # The jobs that make the images e2e loads; see e2e:ci-images.
          CI_IMAGES_JOBS: >-
            ${{ github.event_name == 'pull_request'
                && 'detect stale images|build images|build mock (e2e fixture)'
                || 'detect stale images|build-images (controller, amd64)|build-images (vm-runner, amd64)|build-images (api-server, amd64)|build-images (ui, amd64)|build-images (keycloak, amd64)|build mock (e2e fixture)' }}
        run: nohup .mise/tasks/e2e/ci-images /tmp/ci-images.status > /tmp/ci-images.log 2>&1 &
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: mise run e2e
        env:
          SKIP_IMAGE_BUILD: "1"
          CI_IMAGES_STATUS: /tmp/ci-images.status
      - name: Image fetch log
        if: ${{ !cancelled() }}
        run: cat /tmp/ci-images.log

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright/playwright-report/
            packages/e2e/playwright/test-results/
          retention-days: 7
          if-no-files-found: ignore

  mirror-images:
    name: mirror third-party images
    if: >-
      ${{ github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false
      - name: Mirror
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
          mise run image:mirror

  publish:
    name: publish release
    needs: [changes, merge-images, merge-agents, merge-workloads, appversion]
    if: >-
      ${{ github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
          needs.changes.result == 'success' &&
          needs.appversion.result == 'success' &&
          needs.merge-images.result == 'success' &&
          needs.merge-agents.result == 'success' &&
          (needs.merge-workloads.result == 'success' || needs.merge-workloads.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Log in to Helm OCI registry
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | helm registry login quay.io --username "$QUAY_USERNAME" --password-stdin
      - id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ [Rr][Cc] ]]; then
            echo "npmTag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "npmTag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Helm chart dependencies
        run: mise -C helm deps

      - name: Pin content-tagged image tags
        env:
          SOURCE_SHAS: ${{ needs.changes.outputs.source_shas }}
        run: mise run image:pin-tags -- "$SOURCE_SHAS"

      - name: Push Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMPOSITE: ${{ needs.appversion.outputs.composite }}
        run: |
          helm package helm --version "$VERSION" --app-version "$COMPOSITE"
          helm push "platform-${VERSION}.tgz" oci://quay.io/dam-agents/charts

      - name: Publish CLI to npm
        env:
          NPM_TAG: ${{ steps.version.outputs.npmTag }}
        run: |
          mise run //packages/cli:build
          pnpm --filter @dam-agents/cli publish --access public --no-git-checks --provenance --tag "$NPM_TAG"

  publish-dev:
    name: publish dev chart
    needs: [changes, merge-images, merge-agents, merge-workloads, appversion]
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' && !cancelled() &&
          needs.changes.result == 'success' &&
          needs.appversion.result == 'success' &&
          needs.merge-images.result == 'success' &&
          (needs.merge-agents.result == 'success' || needs.merge-agents.result == 'skipped') &&
          (needs.merge-workloads.result == 'success' || needs.merge-workloads.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Log in to Helm OCI registry
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | helm registry login quay.io --username "$QUAY_USERNAME" --password-stdin

      - name: Build Helm chart dependencies
        run: mise -C helm deps

      - name: Pin content-tagged image tags
        env:
          SOURCE_SHAS: ${{ needs.changes.outputs.source_shas }}
        run: mise run image:pin-tags -- "$SOURCE_SHAS"

      - name: Push Helm chart
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMPOSITE: ${{ needs.appversion.outputs.composite }}
        run: |
          helm package helm --version "0.0.0-main.${RUN_NUMBER}" --app-version "$COMPOSITE"
          helm push "platform-0.0.0-main.${RUN_NUMBER}.tgz" oci://quay.io/dam-agents/charts
          helm package helm --version 0.0.0-main --app-version "$COMPOSITE"
          helm push platform-0.0.0-main.tgz oci://quay.io/dam-agents/charts

  go-vuln:
    name: govulncheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Detect vulnerabilities
        run: |
          set -euo pipefail
          rc=0
          results=$(mise -C packages/controller x -- govulncheck -format json ./...) || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::govulncheck exited $rc, so this is not a scan result"
            exit 1
          fi
          printf '%s' "$results" | jq -se 'any(.[]; .config != null)' > /dev/null
          out=$(printf '%s' "$results" | jq -s '
            [ .[]
              | select(.finding != null and .finding.trace[0].function != null)
              | .finding
              | { id: .osv,
                  url: ("https://pkg.go.dev/vuln/" + .osv),
                  severity: "unknown",
                  scope: "controller (Go)",
                  pkg: (.trace[0].package // .trace[0].module),
                  fixed: (.fixed_version // "") } ]
            | unique_by(.id)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::govulncheck: $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: findings-go-vuln
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  cargo-audit:
    name: cargo audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Detect vulnerabilities
        run: |
          set -euo pipefail
          results=$(mise -C packages/vm-runner x --no-deps -- cargo audit --json) || true
          printf '%s' "$results" | jq -e '.vulnerabilities.list' > /dev/null
          out=$(printf '%s' "$results" | jq '
            [ .vulnerabilities.list[]
              | { id: .advisory.id,
                  url: ("https://rustsec.org/advisories/" + .advisory.id),
                  severity: "unknown",
                  scope: "vm-runner (Rust)",
                  pkg: .package.name,
                  fixed: ((.versions.patched // []) | join(", ")) } ]
            | unique_by(.id + "|" + .pkg)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::cargo audit: $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: findings-cargo-audit
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  npm-audit:
    name: pnpm audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Detect vulnerabilities
        run: |
          set -euo pipefail
          results=$(mise x --no-deps -- pnpm audit --prod --json) || true
          printf '%s' "$results" | jq -e 'has("advisories") and has("metadata")' > /dev/null
          out=$(printf '%s' "$results" | jq '
            [ (.advisories // {}) | to_entries[] | .value
              | { id: (((.cves // []) | first) // .github_advisory_id // (.id | tostring)),
                  url: (.url // ""),
                  severity: (.severity // "unknown"),
                  scope: "pnpm audit",
                  pkg: .module_name,
                  fixed: (.patched_versions // "") } ]
            | unique_by(.id + "|" + .pkg)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::pnpm audit: $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: findings-npm-audit
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  mend-sca:
    name: Mend SCA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      MEND_URL: https://ibmets.whitesourcesoftware.com
      MEND_EMAIL: eal_apm0047897service_user@ibm.com
      MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
      MEND_ORGNAME: Enterprise Applications
      MEND_PRODUCTNAME: EAL_APM0047897
      MEND_PROJECTNAME: platform-sca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mend CLI
        run: |
          curl -fsSL https://downloads.mend.io/cli/linux_amd64/mend -o /usr/local/bin/mend
          chmod +x /usr/local/bin/mend

      - name: Detect vulnerabilities
        run: |
          set -euo pipefail

          results=$(mend dep --dir . \
            --scope "${MEND_ORGNAME}//${MEND_PRODUCTNAME}//${MEND_PROJECTNAME}" \
            --update --format json --non-interactive)

          out=$(echo "$results" | jq '
            [.. | objects | select(.vulnerabilities) |
              .name as $lib | .vulnerabilities[] |
              { id: .name, url: .url, severity: .severity,
                scope: "Mend SCA", pkg: $lib,
                fixed: (.topFix.fixResolution // "") }]
            | unique_by(.id + "|" + .pkg)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::Mend SCA: $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: findings-mend-sca
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  trivy-components:
    name: image:resolve list-components
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      components: ${{ steps.list.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          set -euo pipefail
          components=$(.mise/tasks/image/resolve list-components | tr ' ' '\n' | jq -cR . | jq -cs .)
          echo "Images to scan: $components"
          echo "components=$components" >> "$GITHUB_OUTPUT"

  container-scan:
    name: trivy ${{ matrix.component }}
    needs:
      [
        trivy-components,
        merge-images,
        merge-platform-base,
        merge-agents,
        merge-workloads,
      ]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.trivy-components.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Detect vulnerabilities
        id: scan
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          COMPONENT: ${{ matrix.component }}
          SHA: ${{ github.sha }}
          IMAGE_PREFIX: quay.io/dam-agents
        run: |
          set -euo pipefail
          echo "artifact=findings-trivy-${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo '[]' > findings.json
          if [ -n "${QUAY_USERNAME:-}" ] && [ -n "${QUAY_PASSWORD:-}" ]; then
            echo "${QUAY_PASSWORD}" | docker login quay.io -u "${QUAY_USERNAME}" --password-stdin
          fi
          # trivy.yaml at the repo root sets ignore-unfixed.
          report=$(mise x --no-deps -- trivy image --quiet --format json "${IMAGE_PREFIX}/${COMPONENT}:${SHA}") || {
            echo "::notice::Trivy scan skipped for ${COMPONENT} (no ${SHA} image — reused unchanged, or its build failed); see log"
            exit 0
          }
          out=$(echo "$report" | jq '
            ((.ArtifactName // "") | split("/") | last | split(":") | first) as $component
            | [ (.Results // [])[] | (.Vulnerabilities // [])[]
                | { id: .VulnerabilityID,
                    url: (.PrimaryURL // ""),
                    severity: (.Severity // "unknown"),
                    scope: $component,
                    pkg: (.PkgName + " " + .InstalledVersion),
                    fixed: (.FixedVersion // "") } ]
            | unique_by(.id + "|" + .pkg)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::Trivy (${COMPONENT}): $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ steps.scan.outputs.artifact }}
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  manage-security-issues:
    name: File security issues
    needs: [go-vuln, cargo-audit, npm-audit, mend-sca, container-scan]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: findings-*
          path: findings
      - name: Reconcile summary issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCANNERS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          unfinished=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<<"$SCANNERS")
          if [ -n "$unfinished" ]; then
            echo "::warning::scanner(s) did not finish: $unfinished; the summary issue is left as it is"
            exit 0
          fi

          files=(findings/*/findings.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::no findings artifacts to process"
            exit 0
          fi

          title="Security vulnerabilities (automated scan)"
          existing=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --search "in:title \"$title\"" \
            --json number \
            --jq '.[0].number // empty')

          count=$(jq -s 'add // [] | unique_by([.id, .scope, .pkg]) | length' "${files[@]}")
          echo "::notice::$count finding(s) across all scanners"

          if [ "$count" -eq 0 ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "All vulnerabilities resolved — no findings in the latest scan."
            fi
            exit 0
          fi

          body=$(jq -s -r --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '
            { critical: 0, high: 1, medium: 2, moderate: 2, low: 3 } as $rank
            | add // []
            | unique_by([.id, .scope, .pkg])
            | sort_by([($rank[.severity | ascii_downcase] // 4), .scope, .pkg])
            | ([ "Open vulnerabilities found by the scheduled scanners (\(length) total).",
                 "This issue is regenerated on every scan — last update: [run](\($run)).",
                 "",
                 "| CVE | Severity | Image / source | Package | Fixed in |",
                 "| --- | --- | --- | --- | --- |" ]
               + map("| [\(.id)](\(.url)) | \(.severity | ascii_upcase) | \(.scope) | `\(.pkg)` | `\(if .fixed == "" then "—" else .fixed end)` |")
               + [ "",
                   "---",
                   "See [docs/security/supply-chain.md](../blob/main/docs/security/supply-chain.md) for the remediation flow." ])
            | join("\n")
          ' "${files[@]}")

          # GitHub caps issue bodies at 65536 chars; a too-long body 422s the API call
          if [ "${#body}" -gt 65000 ]; then
            body="${body:0:65000}"$'\n\n---\n**Truncated** — full findings in the workflow run artifacts.'
          fi

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${GITHUB_REPOSITORY}" --body "$body"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --body "$body" \
              --label "security,vulnerability"
          fi
