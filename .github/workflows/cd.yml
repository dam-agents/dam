name: CI/CD

# One run per event. This file decides what each event's run does and passes
# it on as inputs; build.yml (mise check and the images, then the dev chart
# and the security scan) and e2e.yml (the smoke suite's two jobs) read the inputs
# and never the event. On main, build.yml hands what the run published to
# security.yml, which scans it. A tag's release publishes from here.
#
# Steps that repeat across jobs live in .github/actions: setup-mise (mise and
# the quay.io login) and agent-tools. They are referenced as `./`, not the
# `$/` self-repository form zizmor prefers: for `$/`, GitHub stages the whole
# repository as an action, and an agent rootfs's symlink into the image breaks
# that staging. A cache key that a restore and a save, or several jobs, must
# spell identically is written once per file as a YAML anchor (&name) and
# aliased (*name) after that.

on:
  pull_request:
  # The merge queue's gate: a merge group verifies like a PR and publishes
  # nothing a consumer reads, only cache tags for later groups (build.yml's
  # build-images). The push to main that follows only builds and publishes;
  # see e2e.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
      # security.yml's summary issues.
      issues: write
    uses: $/.github/workflows/build.yml
    with:
      verify: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      # A tag, the nightly run and a dispatch publish every image afresh; a
      # PR, a merge group or a main push reuses what its source did not change.
      fresh: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
      main-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      release: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}

  # A push skips both jobs: on main, the merge group before it ran them on the
  # same tree; a tag only publishes.
  e2e:
    if: ${{ github.event_name != 'push' }}
    permissions:
      contents: read
      # e2e:ci-images reads this run's jobs and downloads its artifacts.
      actions: read
    uses: $/.github/workflows/e2e.yml
    with:
      verify: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      fresh: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
      save-caches: ${{ github.ref == 'refs/heads/main' }}
      # A pull request runs the reduced smoke set; the merge queue, the nightly
      # run and a tag run all of it.
      pr-scope: ${{ github.event_name == 'pull_request' }}
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  publish:
    name: publish release
    # Here, not in build.yml: npm's trusted publishing and provenance name
    # this file, so the CLI must publish from it.
    needs: [build]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every tool: the CLI build below is a `mise run`. helm is mise's pin.
      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository]
        with:
          cache: "false"
          quay-username: ${{ secrets.QUAY_USERNAME }}
          quay-password: ${{ secrets.QUAY_PASSWORD }}
      - name: Log in to Helm OCI registry
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | helm registry login quay.io --username "$QUAY_USERNAME" --password-stdin
      - id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ [Rr][Cc] ]]; then
            echo "npmTag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "npmTag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Helm chart dependencies
        run: helm/.mise/deps

      - name: Pin content-tagged image tags and digests
        env:
          SOURCE_SHAS: ${{ needs.build.outputs.source_shas }}
        run: .mise/tasks/image/pin-tags "$SOURCE_SHAS"

      - name: Push Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMPOSITE: ${{ needs.build.outputs.composite }}
        run: |
          helm package helm --version "$VERSION" --app-version "$COMPOSITE"
          helm push "platform-${VERSION}.tgz" oci://quay.io/dam-agents/charts

      - name: Publish CLI to npm
        env:
          NPM_TAG: ${{ steps.version.outputs.npmTag }}
        run: |
          mise run //packages/cli:build
          pnpm --filter @dam-agents/cli publish --access public --no-git-checks --provenance --tag "$NPM_TAG"

  verify:
    name: verify
    # The one check the merge queue and PRs require. Required checks are
    # matched by job name, and a matrix job that is skipped reports under its
    # bare name, so `build-images (arm64)` would never report on a run that
    # changes no agent and the queue would wait on it forever. A job in a
    # called workflow reports as `<calling job> / <name>`, so this one stays
    # here. A skipped job is one this change does not need, as for a
    # docs-only change.
    needs: [build, e2e]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
