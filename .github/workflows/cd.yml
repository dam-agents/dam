name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: quay.io/dam-agents
  SOURCE_DATE_EPOCH: "1735689600"
  MISE_VERSION: "2026.9.13"
  MISE_LOCKED: "1"

jobs:
  check-test:
    name: mise check
    # `mise run check` and `mise run test` side by side in one job: each took
    # about three minutes, most of it the same setup, and each held its own
    # runner slot and turn in the queue. A tag runs only `check`.
    runs-on: ubuntu-latest
    # Thirty minutes. A cold run installs its tools, compiles smolvm from
    # source and then has caches to write back, and a run measured at 10m04s
    # for `check` alone was killed in that tail after it had already passed —
    # which reports as cancelled and reads as a red PR. Since #3857 a PR run
    # never saves, so a branch cannot warm itself: if main's entry is missing or
    # its key has moved, every PR pays the full cold cost until the next main
    # push rewrites it. That run is the one this budget has to fit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The caches restore before mise-action: its cold install of the go:
      # tools fills ~/go/pkg/mod with read-only files the go cache's tar then
      # cannot overwrite, and that restore fails.
      - id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/task-artifacts
          key: mise-task-artifacts-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            mise-task-artifacts-${{ runner.os }}-${{ github.job }}-
            mise-task-artifacts-${{ runner.os }}-
      # The Rust target is only compiled into when a vm-runner task misses the
      # task cache, which takes a change to its crate or its tools since the
      # commit that cache was saved at.
      - id: rust-needed
        env:
          MATCHED: ${{ steps.task-cache.outputs.cache-matched-key }}
        run: |
          sha="${MATCHED##*-}"
          if [ -n "$sha" ] && git cat-file -e "$sha" 2>/dev/null &&
            git diff --quiet "$sha" HEAD -- packages/vm-runner mise.lock .mise/config.toml; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: rust-cache
        if: steps.rust-needed.outputs.needed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/vm-runner/target
          key: rust-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/vm-runner/Cargo.toml', 'packages/vm-runner/platform-init/Cargo.toml', 'packages/vm-runner/Cargo.lock', 'packages/vm-runner/smolvm.pin') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ github.job }}-
            rust-${{ runner.os }}-
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/controller/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-
            go-${{ runner.os }}-
      - id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache_save: ${{ github.event_name != 'pull_request' }}
      # Every artifact's atime goes back to the epoch, so the ones this run
      # reads stand out afterwards; see the prune below.
      - run: |
          find ~/.cache/mise/task-artifacts -type f -exec touch -a -d @0 {} + 2>/dev/null || true
          touch "$RUNNER_TEMP/check-start"
      - env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$TAG" = true ]; then mise run check; else mise run --continue-on-error check ::: test; fi
      # Main saves only what this run compiled or read. A Rust or Go cache
      # saved after every task came from the task cache would hold an empty
      # target under the new key, and the next miss would compile from scratch.
      # The task cache otherwise keeps every artifact it ever held.
      - id: built
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          newer() { [ -n "$(find "$1" -newer "$RUNNER_TEMP/check-start" -type f -print -quit 2>/dev/null)" ]; }
          newer packages/vm-runner/target && echo "rust=true" >> "$GITHUB_OUTPUT"
          newer ~/.cache/go-build && echo "go=true" >> "$GITHUB_OUTPUT"
          cd ~/.cache/mise/task-artifacts
          find . -type f -anewer "$RUNNER_TEMP/check-start" | sed 's|.*/||; s|\..*||' | sort -u > "$RUNNER_TEMP/used"
          find . -type f | while read -r f; do b="${f##*/}"; grep -qxF "${b%%.*}" "$RUNNER_TEMP/used" || rm -f "$f"; done
          du -sh .
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/task-artifacts
          key: mise-task-artifacts-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' && steps.built.outputs.go == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/controller/go.sum') }}
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true' && steps.built.outputs.rust == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/vm-runner/target
          key: rust-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.lock', 'packages/vm-runner/Cargo.toml', 'packages/vm-runner/platform-init/Cargo.toml', 'packages/vm-runner/Cargo.lock', 'packages/vm-runner/smolvm.pin') }}
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # appversion and the merge-* jobs only tag images, and nothing on a PR reads
  # a tag: e2e pulls by digest, and publishing and scanning run on main and
  # tags. A PR skips them. Runner slots are what a PR waits on: run
  # 35789042417 queued its builds for up to 9m44s while the builds themselves
  # took seconds.
  appversion:
    name: derive app version
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      composite: ${{ steps.c.outputs.composite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: c
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:12}"
          if [ "$REF_TYPE" = "tag" ] && [ "${REF_NAME#v}" != "$REF_NAME" ]; then
            composite="${REF_NAME#v}"
          else
            appver="$(grep -E '^appVersion:' helm/Chart.yaml | head -n1 | sed -E 's/^appVersion:[[:space:]]*//; s/["'"'"']//g')"
            composite="${appver}-dev-${short}"
          fi
          echo "composite=$composite" >> "$GITHUB_OUTPUT"
          echo "::notice::composite app version: $composite"

  changes:
    name: detect stale images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.d.outputs.agents }}
      archs: ${{ steps.d.outputs.archs }}
      workloads: ${{ steps.d.outputs.workloads }}
      images: ${{ steps.d.outputs.images }}
      mock: ${{ steps.d.outputs.mock }}
      source_shas: ${{ steps.d.outputs.source_shas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: crane
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          # A tag, the nightly run and a dispatch publish every image afresh;
          # a PR or a main push reuses what its source did not change.
          [ "$EVENT" = pull_request ] || [ "$MAIN_PUSH" = true ] || export RESOLVE_NO_REUSE=1
          # By path: mise here installs crane alone; the same file is the image:resolve task.
          out="$(.mise/tasks/image/resolve gha-outputs)"
          printf '%s\n' "$out" | tee -a "$GITHUB_OUTPUT"
          printf '::notice::%s\n' "$(printf '%s' "$out" | tr '\n' ' ')"

  build-images:
    # One job per arch builds the stale ones of the five images side by side;
    # see image:ci-build. merge-images tags the rest. A PR builds its images in
    # e2e instead: see e2e:ci-images.
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.images != '[]' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.changes.outputs.archs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The vm-runner's release build: its crates, cargo's target and the smolvm
      # and crane downloads, per arch.
      # Keyed by the exact Rust version and the crate's lock and pins, with no
      # older entry to fall back on, so an entry holds one lockfile's build and
      # never piles up the artifacts of the crates a bump replaced. The
      # workspace's own crates recompile every run anyway: cargo fingerprints a
      # path dependency by mtime, and a fresh checkout moves every one.
      - id: rust-release-key
        run: |
          set -euo pipefail
          rust="$(sed -n '/^\[\[tools\.rust\]\]$/{n;s/^version = "\(.*\)"$/\1/p;}' mise.lock)"
          [ -n "$rust" ] || { echo "::error::mise.lock names no rust version"; exit 1; }
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - id: rust-release
        if: ${{ contains(fromJSON(needs.changes.outputs.images), 'vm-runner') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/platform-vm-runner
            packages/vm-runner/target
          key: rust-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-release-key.outputs.rust }}-${{ hashFiles('packages/vm-runner/Cargo.lock', 'packages/vm-runner/Cargo.toml', 'packages/vm-runner/platform-init/Cargo.toml', 'packages/vm-runner/smolvm.pin') }}
      # check-test's Go and pnpm caches, read-only, for the images that build
      # from them. Before mise-action, for the reason check-test gives.
      - if: ${{ contains(fromJSON(needs.changes.outputs.images), 'controller') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod
          key: go-${{ runner.os }}-check-test-${{ hashFiles('mise.lock', 'packages/controller/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-check-test-
            go-${{ runner.os }}-
      - if: ${{ contains(fromJSON(needs.changes.outputs.images), 'ui') || contains(fromJSON(needs.changes.outputs.images), 'api-server') || contains(fromJSON(needs.changes.outputs.images), 'keycloak') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          IMAGES: ${{ join(fromJSON(needs.changes.outputs.images), ' ') }}
        run: |
          read -r -a images <<< "$IMAGES"
          .mise/tasks/image/ci-build "$ARCH" "${images[@]}"
      # Main writes it on a miss, once the build has compiled into it; a PR's e2e
      # job reads the amd64 one.
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-release.outputs.cache-hit != 'true' && hashFiles('packages/vm-runner/target/release/vm-runner') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/platform-vm-runner
            packages/vm-runner/target
          key: rust-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-release-key.outputs.rust }}-${{ hashFiles('packages/vm-runner/Cargo.lock', 'packages/vm-runner/Cargo.toml', 'packages/vm-runner/platform-init/Cargo.toml', 'packages/vm-runner/smolvm.pin') }}
      # The keycloak theme build, for e2e on a PR. This job starts from an
      # empty task cache, so the entry holds this run's artifacts alone, and
      # only a run that built keycloak has any.
      - if: ${{ matrix.arch == 'amd64' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.changes.outputs.images), 'keycloak') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/task-artifacts
          key: mise-task-artifacts-${{ runner.os }}-keycloak-theme-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-images-${{ matrix.arch }}
          path: /tmp/digests
          retention-days: 1
          if-no-files-found: error

  merge-images:
    name: merge multi-arch manifests
    needs: [changes, build-images, appversion, check-test]
    # build-images is skipped when every image is reused; then this job only
    # tags.
    if: ${{ github.event_name != 'pull_request' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ needs.changes.outputs.images != '[]' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-images-*
          path: /tmp/digests
          merge-multiple: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: crane usage
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
      - name: Create manifest lists and push
        env:
          COMPOSITE: ${{ needs.appversion.outputs.composite }}
          SOURCE_SHAS: ${{ needs.changes.outputs.source_shas }}
          # Every image carries its source-sha tag: image:resolve reuses by it.
          SOURCE_SHA_TAGGED: controller vm-runner api-server ui keycloak
          # keycloak's merge takes minutes of copying inside the registry; its
          # registry requests are logged to find where the time goes.
          CI_MERGE_DEBUG: keycloak
        run: .mise/tasks/image/ci-merge /tmp/digests controller vm-runner api-server ui keycloak

  build-agents:
    # One job per arch builds the agents one after another; see
    # image:ci-build. merge-agents keeps the `check` gate on publishing.
    needs: [changes]
    if: ${{ needs.changes.outputs.agents != '[]' && !cancelled() && !failure() }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.changes.outputs.archs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: nodejs pnpm crane usage
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
      # Not `$/`: GitHub stages the whole repository as an action for it, and
      # an agent rootfs's symlink into the image breaks that staging.
      - uses: ./.github/actions/agent-tools # zizmor: ignore[self-repository]
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          AGENTS: ${{ join(fromJSON(needs.changes.outputs.agents), ' ') }}
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          # A PR only proves its agents build.
          read -r -a agents <<< "$AGENTS"
          [ "$PR" != true ] || agents=("${agents[@]/%/:cacheonly}")
          .mise/tasks/image/ci-build --serial "$ARCH" "${agents[@]}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-agents-${{ matrix.arch }}
          path: /tmp/digests
          retention-days: 1
          if-no-files-found: error

  merge-agents:
    name: merge multi-arch agent manifests
    needs: [build-agents, appversion, changes, check-test]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.agents != '[]' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-agents-*
          path: /tmp/digests
          merge-multiple: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: crane usage
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
      - name: Create manifest lists and push
        env:
          AGENTS: ${{ join(fromJSON(needs.changes.outputs.agents), ' ') }}
          COMPOSITE: ${{ needs.appversion.outputs.composite }}
          SOURCE_SHAS: ${{ needs.changes.outputs.source_shas }}
        run: |
          read -r -a agents <<< "$AGENTS"
          SOURCE_SHA_TAGGED="$AGENTS" .mise/tasks/image/ci-merge /tmp/digests "${agents[@]}"

  build-workloads:
    # One job per arch, one workload after another, like build-agents, and
    # beside it: a workload builds claude-code's environment in, not on a
    # published claude-code image. Every workload builds even after one fails,
    # but merge-workloads then merges none.
    needs: [changes]
    if: ${{ needs.changes.outputs.workloads != '[]' && !cancelled() && !failure() }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      # One arch's failed build must not cancel the other's, which then
      # reports nothing of its own.
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.changes.outputs.archs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: nodejs pnpm crane usage
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
      # Not `$/`: GitHub stages the whole repository as an action for it, and
      # an agent rootfs's symlink into the image breaks that staging.
      - uses: ./.github/actions/agent-tools # zizmor: ignore[self-repository]
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          WORKLOADS: ${{ join(fromJSON(needs.changes.outputs.workloads), ' ') }}
          # k-search's venv layers, kept in the registry; see //packages/agents:oci.
          # A main push reuses them, every other run installs afresh and
          # replaces them.
          AGENT_LAYER_CACHE: ${{ env.IMAGE_PREFIX }}
          AGENT_LAYER_CACHE_REFRESH: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
        run: |
          read -r -a workloads <<< "$WORKLOADS"
          .mise/tasks/image/ci-build --serial "$ARCH" "${workloads[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-workloads-${{ matrix.arch }}
          path: /tmp/digests
          retention-days: 1
          if-no-files-found: error

  merge-workloads:
    name: merge multi-arch workload manifests
    needs: [build-workloads, appversion, changes, check-test]
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.workloads != '[]' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-workloads-*
          path: /tmp/digests
          merge-multiple: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: crane usage
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
      - name: Create manifest lists and push
        env:
          WORKLOADS: ${{ join(fromJSON(needs.changes.outputs.workloads), ' ') }}
          COMPOSITE: ${{ needs.appversion.outputs.composite }}
          SOURCE_SHAS: ${{ needs.changes.outputs.source_shas }}
        run: |
          read -r -a workloads <<< "$WORKLOADS"
          SOURCE_SHA_TAGGED="$WORKLOADS" .mise/tasks/image/ci-merge /tmp/digests "${workloads[@]}"

  build-mock:
    name: build mock (e2e fixture)
    needs: [changes]
    # On a PR, e2e builds the mock itself. Otherwise only a mock whose source
    # sha has no image builds; e2e pulls it by that tag.
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.mock == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The push tag is the mock's source sha, which needs the history.
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: nodejs pnpm crane usage
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
      # Not `$/`: GitHub stages the whole repository as an action for it, and
      # an agent rootfs's symlink into the image breaks that staging.
      - uses: ./.github/actions/agent-tools # zizmor: ignore[self-repository]
      - name: Build
        run: .mise/tasks/image/ci-build amd64 mock:source

  e2e:
    name: mise e2e
    # No `needs` on the builds: bringing the cluster up takes minutes and needs
    # no image, so it runs while they build. e2e:ci-images builds them here on
    # a PR, or waits for this run's build jobs, in the background, and
    # cluster:install waits for it at the image load. A failed build still
    # fails this job, there.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # The builds' own time now counts against this budget.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      IS_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # e2e:ci-images resolves every image by its source history.
          fetch-depth: 0
      # See build-images. Before mise-action, like check-test's.
      - if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/task-artifacts
          key: mise-task-artifacts-${{ runner.os }}-keycloak-theme-${{ github.sha }}
          restore-keys: mise-task-artifacts-${{ runner.os }}-keycloak-theme-
      # check-test saves it, and the Go cache below.
      - if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # Only a PR that changes the controller builds it here; one that does not
      # pulls main's image.
      - id: controller-changed
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- $(.mise/tasks/image/resolve paths controller); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.controller-changed.outputs.changed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod
          key: go-${{ runner.os }}-check-test-${{ hashFiles('mise.lock', 'packages/controller/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-check-test-
            go-${{ runner.os }}-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
      # The keycloak image bakes in the theme JAR. Built here, before the
      # background build starts, so it does not race e2e:install's own run of
      # the same task, which is then a cache hit.
      - if: github.event_name == 'pull_request'
        run: mise run //packages/keycloak-theme:build
      # Before the background build: its pnpm install would race e2e:install's.
      - if: github.event_name == 'pull_request'
        run: mise deps install --only pnpm
      # build-images' vm-runner release build, for the one e2e:ci-images proves.
      - id: rust-release-key
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          rust="$(sed -n '/^\[\[tools\.rust\]\]$/{n;s/^version = "\(.*\)"$/\1/p;}' mise.lock)"
          [ -n "$rust" ] || { echo "::error::mise.lock names no rust version"; exit 1; }
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/platform-vm-runner
            packages/vm-runner/target
          key: rust-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-release-key.outputs.rust }}-${{ hashFiles('packages/vm-runner/Cargo.lock', 'packages/vm-runner/Cargo.toml', 'packages/vm-runner/platform-init/Cargo.toml', 'packages/vm-runner/smolvm.pin') }}
      - name: Build or fetch this run's images in the background
        env:
          GH_TOKEN: ${{ github.token }}
          CI_VM_RUNNER_STATUS: /tmp/vm-runner-build.status
          # The jobs that make the images e2e loads; see e2e:ci-images.
          CI_IMAGES_BUILD: ${{ github.event_name == 'pull_request' && '1' || '' }}
          CI_IMAGES_IMAGES_JOB: build-images (amd64)
          CI_IMAGES_MOCK_JOB: build mock (e2e fixture)
          # As the `changes` job sets it, so both resolve the same images stale.
          RESOLVE_NO_REUSE: ${{ github.event_name != 'pull_request' && github.event_name != 'push' && '1' || '' }}
        run: nohup .mise/tasks/e2e/ci-images /tmp/ci-images.status > /tmp/ci-images.log 2>&1 &
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Under the job's timeout, so a hung image build fails the step and the
      # log steps below still run; the job's own timeout cancels them too.
      - run: mise run e2e
        timeout-minutes: 35
        env:
          SKIP_IMAGE_BUILD: "1"
          CI_IMAGES_STATUS: /tmp/ci-images.status
      - name: Image fetch log
        if: ${{ !cancelled() }}
        run: cat /tmp/ci-images.log
      # The vm-runner build e2e:ci-images left running in the background.
      - name: vm-runner build
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: |
          set -euo pipefail
          [ -e /tmp/vm-runner-build.log ] || { echo "::error::the vm-runner build never started; see the image fetch log"; exit 1; }
          for _ in $(seq 180); do [ -s /tmp/vm-runner-build.status ] && break; sleep 10; done
          cat /tmp/vm-runner-build.log || true
          [ "$(cat /tmp/vm-runner-build.status 2>/dev/null)" = 0 ]

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright/playwright-report/
            packages/e2e/playwright/test-results/
          retention-days: 7
          if-no-files-found: ignore

  mirror-images:
    name: mirror third-party images
    if: >-
      ${{ github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Crane alone, and the task by path: `mise run` would install every tool
      # first, which took this job a minute and a half.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: crane
          cache: false
      - name: Mirror
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          echo "$QUAY_PASSWORD" | crane auth login quay.io --username "$QUAY_USERNAME" --password-stdin
          .mise/tasks/image/mirror

  publish:
    name: publish release
    needs: [changes, merge-images, merge-agents, merge-workloads, appversion]
    if: >-
      ${{ github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
          needs.changes.result == 'success' &&
          needs.appversion.result == 'success' &&
          needs.merge-images.result == 'success' &&
          needs.merge-agents.result == 'success' &&
          (needs.merge-workloads.result == 'success' || needs.merge-workloads.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every tool: the CLI build below is a `mise run`. helm is mise's pin.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false
      - name: Log in to Helm OCI registry
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | helm registry login quay.io --username "$QUAY_USERNAME" --password-stdin
      - id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ [Rr][Cc] ]]; then
            echo "npmTag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "npmTag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Helm chart dependencies
        run: helm/.mise/deps

      - name: Pin content-tagged image tags
        env:
          SOURCE_SHAS: ${{ needs.changes.outputs.source_shas }}
        run: .mise/tasks/image/pin-tags "$SOURCE_SHAS"

      - name: Push Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMPOSITE: ${{ needs.appversion.outputs.composite }}
        run: |
          helm package helm --version "$VERSION" --app-version "$COMPOSITE"
          helm push "platform-${VERSION}.tgz" oci://quay.io/dam-agents/charts

      - name: Publish CLI to npm
        env:
          NPM_TAG: ${{ steps.version.outputs.npmTag }}
        run: |
          mise run //packages/cli:build
          pnpm --filter @dam-agents/cli publish --access public --no-git-checks --provenance --tag "$NPM_TAG"

  publish-dev:
    name: publish dev chart
    needs: [changes, merge-images, merge-agents, merge-workloads, appversion]
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' && !cancelled() &&
          needs.changes.result == 'success' &&
          needs.appversion.result == 'success' &&
          needs.merge-images.result == 'success' &&
          (needs.merge-agents.result == 'success' || needs.merge-agents.result == 'skipped') &&
          (needs.merge-workloads.result == 'success' || needs.merge-workloads.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise's pinned helm alone. The chart's dependencies and the tag pins
      # run by path: `mise -C helm deps` and `mise run` install every tool
      # first, which took this job a minute and a half.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: helm
          cache: false
      - name: Log in to Helm OCI registry
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "$QUAY_PASSWORD" | helm registry login quay.io --username "$QUAY_USERNAME" --password-stdin

      - name: Build Helm chart dependencies
        run: helm/.mise/deps

      - name: Pin content-tagged image tags
        env:
          SOURCE_SHAS: ${{ needs.changes.outputs.source_shas }}
        run: .mise/tasks/image/pin-tags "$SOURCE_SHAS"

      - name: Push Helm chart
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMPOSITE: ${{ needs.appversion.outputs.composite }}
        run: |
          helm package helm --version "0.0.0-main.${RUN_NUMBER}" --app-version "$COMPOSITE"
          helm push "platform-0.0.0-main.${RUN_NUMBER}.tgz" oci://quay.io/dam-agents/charts
          helm package helm --version 0.0.0-main --app-version "$COMPOSITE"
          helm push platform-0.0.0-main.tgz oci://quay.io/dam-agents/charts

  base-pins:
    name: base image pins
    # image:pack bases are pinned by digest, so no rebuild picks up a base
    # update by itself. The nightly run keeps one issue open while a pin is
    # behind its tag; update-vulnerable-deps bumps it with image:bump-bases.
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: crane usage
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Reconcile the stale-pins issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # By path: --check exits 1 when a pin is stale, which is not a failure here.
          stale="$(.mise/tasks/image/bump-bases --check)"
          code=$?
          if [ "$code" -ne 0 ] && [ -z "$stale" ]; then exit "$code"; fi
          title="Base image pins are behind (automated)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -z "$stale" ]; then
            [ -z "$existing" ] || gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "Every base image pin matches its tag again."
            exit 0
          fi
          body="$(printf '%s\n' "$stale" | awk -v run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '
            BEGIN {
              print "A base image tag moved past its pin, so the images built on it miss its updates."
              print "Re-pin with `mise run image:bump-bases`. Last checked: [run](" run ")."
              print ""
              print "| Task | Tag | Pinned | Current |"
              print "| --- | --- | --- | --- |"
            }
            { printf "| `%s` | `%s` | `%s` | `%s` |\n", $1, $2, substr($3, 1, 19), substr($4, 1, 19) }')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" \
              --label "security,vulnerability"
          fi

  go-vuln:
    name: govulncheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
          cache_save: ${{ github.event_name != 'pull_request' }}

      - name: Detect vulnerabilities
        working-directory: packages/controller
        run: |
          set -euo pipefail
          rc=0
          results=$(govulncheck -format json ./...) || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::govulncheck exited $rc, so this is not a scan result"
            exit 1
          fi
          printf '%s' "$results" | jq -se 'any(.[]; .config != null)' > /dev/null
          out=$(printf '%s' "$results" | jq -s '
            [ .[]
              | select(.finding != null and .finding.trace[0].function != null)
              | .finding
              | { id: .osv,
                  url: ("https://pkg.go.dev/vuln/" + .osv),
                  severity: "unknown",
                  scope: "controller (Go)",
                  pkg: (.trace[0].package // .trace[0].module),
                  fixed: (.fixed_version // "") } ]
            | unique_by(.id)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::govulncheck: $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: findings-go-vuln
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  cargo-audit:
    name: cargo audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-audit reads Cargo.lock alone, so it runs without cargo.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: aqua:rustsec/rustsec/cargo-audit
          cache_save: ${{ github.event_name != 'pull_request' }}

      - name: Detect vulnerabilities
        working-directory: packages/vm-runner
        run: |
          set -euo pipefail
          results=$(cargo-audit audit --json) || true
          printf '%s' "$results" | jq -e '.vulnerabilities.list' > /dev/null
          out=$(printf '%s' "$results" | jq '
            [ .vulnerabilities.list[]
              | { id: .advisory.id,
                  url: ("https://rustsec.org/advisories/" + .advisory.id),
                  severity: "unknown",
                  scope: "vm-runner (Rust)",
                  pkg: .package.name,
                  fixed: ((.versions.patched // []) | join(", ")) } ]
            | unique_by(.id + "|" + .pkg)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::cargo audit: $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: findings-cargo-audit
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  npm-audit:
    name: pnpm audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: nodejs pnpm
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Detect vulnerabilities
        run: |
          set -euo pipefail
          results=$(pnpm audit --prod --json) || true
          printf '%s' "$results" | jq -e 'has("advisories") and has("metadata")' > /dev/null
          out=$(printf '%s' "$results" | jq '
            [ (.advisories // {}) | to_entries[] | .value
              | { id: (((.cves // []) | first) // .github_advisory_id // (.id | tostring)),
                  url: (.url // ""),
                  severity: (.severity // "unknown"),
                  scope: "pnpm audit",
                  pkg: .module_name,
                  fixed: (.patched_versions // "") } ]
            | unique_by(.id + "|" + .pkg)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::pnpm audit: $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: findings-npm-audit
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  mend-sca:
    name: Mend SCA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      MEND_URL: https://ibmets.whitesourcesoftware.com
      MEND_EMAIL: eal_apm0047897service_user@ibm.com
      MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
      MEND_ORGNAME: Enterprise Applications
      MEND_PRODUCTNAME: EAL_APM0047897
      MEND_PROJECTNAME: platform-sca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mend CLI
        run: |
          curl -fsSL https://downloads.mend.io/cli/linux_amd64/mend -o /usr/local/bin/mend
          chmod +x /usr/local/bin/mend

      - name: Detect vulnerabilities
        run: |
          set -euo pipefail

          results=$(mend dep --dir . \
            --scope "${MEND_ORGNAME}//${MEND_PRODUCTNAME}//${MEND_PROJECTNAME}" \
            --update --format json --non-interactive)

          out=$(echo "$results" | jq '
            [.. | objects | select(.vulnerabilities) |
              .name as $lib | .vulnerabilities[] |
              { id: .name, url: .url, severity: .severity,
                scope: "Mend SCA", pkg: $lib,
                fixed: (.topFix.fixResolution // "") }]
            | unique_by(.id + "|" + .pkg)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::Mend SCA: $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: findings-mend-sca
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  trivy-components:
    name: image:resolve list-components
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      components: ${{ steps.list.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          set -euo pipefail
          components=$(.mise/tasks/image/resolve list-components | tr ' ' '\n' | jq -cR . | jq -cs .)
          echo "Images to scan: $components"
          echo "components=$components" >> "$GITHUB_OUTPUT"

  container-scan:
    name: trivy ${{ matrix.component }}
    needs:
      [
        trivy-components,
        merge-images,
        merge-agents,
        merge-workloads,
      ]
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.trivy-components.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: crane trivy
          cache_save: ${{ github.event_name != 'pull_request' }}

      - name: Detect vulnerabilities
        id: scan
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          COMPONENT: ${{ matrix.component }}
          SHA: ${{ github.sha }}
          IMAGE_PREFIX: quay.io/dam-agents
        run: |
          set -euo pipefail
          echo "artifact=findings-trivy-${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo '[]' > findings.json
          if [ -n "${QUAY_USERNAME:-}" ] && [ -n "${QUAY_PASSWORD:-}" ]; then
            echo "${QUAY_PASSWORD}" | crane auth login quay.io --username "${QUAY_USERNAME}" --password-stdin
          fi
          # trivy.yaml at the repo root sets ignore-unfixed.
          report=$(trivy image --quiet --format json "${IMAGE_PREFIX}/${COMPONENT}:${SHA}") || {
            echo "::notice::Trivy scan skipped for ${COMPONENT} (no ${SHA} image — reused unchanged, or its build failed); see log"
            exit 0
          }
          out=$(echo "$report" | jq '
            ((.ArtifactName // "") | split("/") | last | split(":") | first) as $component
            | [ (.Results // [])[] | (.Vulnerabilities // [])[]
                | { id: .VulnerabilityID,
                    url: (.PrimaryURL // ""),
                    severity: (.Severity // "unknown"),
                    scope: $component,
                    pkg: (.PkgName + " " + .InstalledVersion),
                    fixed: (.FixedVersion // "") } ]
            | unique_by(.id + "|" + .pkg)
          ')
          printf '%s\n' "${out:-[]}" > findings.json
          echo "::notice::Trivy (${COMPONENT}): $(jq length findings.json) finding(s)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ steps.scan.outputs.artifact }}
          path: findings.json
          if-no-files-found: ignore
          retention-days: 1

  manage-security-issues:
    name: File security issues
    needs: [go-vuln, cargo-audit, npm-audit, mend-sca, container-scan]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: findings-*
          path: findings
      - name: Reconcile summary issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCANNERS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          unfinished=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<<"$SCANNERS")
          if [ -n "$unfinished" ]; then
            echo "::warning::scanner(s) did not finish: $unfinished; the summary issue is left as it is"
            exit 0
          fi

          files=(findings/*/findings.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::no findings artifacts to process"
            exit 0
          fi

          title="Security vulnerabilities (automated scan)"
          existing=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --search "in:title \"$title\"" \
            --json number \
            --jq '.[0].number // empty')

          count=$(jq -s 'add // [] | unique_by([.id, .scope, .pkg]) | length' "${files[@]}")
          echo "::notice::$count finding(s) across all scanners"

          if [ "$count" -eq 0 ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "All vulnerabilities resolved — no findings in the latest scan."
            fi
            exit 0
          fi

          body=$(jq -s -r --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '
            { critical: 0, high: 1, medium: 2, moderate: 2, low: 3 } as $rank
            | add // []
            | unique_by([.id, .scope, .pkg])
            | sort_by([($rank[.severity | ascii_downcase] // 4), .scope, .pkg])
            | ([ "Open vulnerabilities found by the scheduled scanners (\(length) total).",
                 "This issue is regenerated on every scan — last update: [run](\($run)).",
                 "",
                 "| CVE | Severity | Image / source | Package | Fixed in |",
                 "| --- | --- | --- | --- | --- |" ]
               + map("| [\(.id)](\(.url)) | \(.severity | ascii_upcase) | \(.scope) | `\(.pkg)` | `\(if .fixed == "" then "—" else .fixed end)` |")
               + [ "",
                   "---",
                   "See [docs/security/supply-chain.md](../blob/main/docs/security/supply-chain.md) for the remediation flow." ])
            | join("\n")
          ' "${files[@]}")

          # GitHub caps issue bodies at 65536 chars; a too-long body 422s the API call
          if [ "${#body}" -gt 65000 ]; then
            body="${body:0:65000}"$'\n\n---\n**Truncated** — full findings in the workflow run artifacts.'
          fi

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${GITHUB_REPOSITORY}" --body "$body"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --body "$body" \
              --label "security,vulnerability"
          fi
