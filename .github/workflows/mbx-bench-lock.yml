# Trial only: the lockfile scenario of PR #5463's measurement. Deleted before that PR reports.
name: mbx bench lock

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write # zizmor: ignore[excessive-permissions] (trial cleanup)

jobs:
  old-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/vm-runner/target
          key: rust-bench-old-lock
          restore-keys: rust-Linux-check-test-
      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository]
      - run: echo "MBX_DISABLE=1" >> "$GITHUB_ENV"
      - name: Edit the lockfile
        working-directory: packages/vm-runner
        env:
          MBX_DISABLE: "1"
        run: |
          set -euo pipefail
          # The workspace has a path dependency on the smolvm clone, which
          # re-resolution needs to see.
          ./.mise/fetch-smolvm
          cargo update -p memchr --precise 2.7.4
          git diff Cargo.lock
      - name: Rust tasks
        env:
          MODE: old
        run: |
          set -o pipefail
          start=$(date +%s)
          mise run --continue-on-error //packages/vm-runner:check:lint ::: //packages/vm-runner:test 2>&1 | tee /tmp/ci-mbx-trial-bench.log
          echo "total=$(( $(date +%s) - start ))s"
          echo "### $MODE lock"
          grep -aE 'Finished in|mbx\[cache\]:' /tmp/ci-mbx-trial-bench.log | tail -8
          echo "compilations=$(grep -acE '(Compiling|Checking) ' /tmp/ci-mbx-trial-bench.log)"

  target-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository]
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          github-cache-mode: target
          cache-generation: targetx
          working-directory: packages/vm-runner
      - name: Edit the lockfile
        working-directory: packages/vm-runner
        env:
          MBX_DISABLE: "1"
        run: |
          set -euo pipefail
          # The workspace has a path dependency on the smolvm clone, which
          # re-resolution needs to see.
          ./.mise/fetch-smolvm
          cargo update -p memchr --precise 2.7.4
          git diff Cargo.lock
      - name: Rust tasks
        env:
          MODE: target
        run: |
          set -o pipefail
          start=$(date +%s)
          mise run --continue-on-error //packages/vm-runner:check:lint ::: //packages/vm-runner:test 2>&1 | tee /tmp/ci-mbx-trial-bench.log
          echo "total=$(( $(date +%s) - start ))s"
          echo "### $MODE lock"
          grep -aE 'Finished in|mbx\[cache\]:' /tmp/ci-mbx-trial-bench.log | tail -8
          echo "compilations=$(grep -acE '(Compiling|Checking) ' /tmp/ci-mbx-trial-bench.log)"

  objects-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-bench-objects-lock
          restore-keys: cargo-bench-objects-
      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository]
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          github-cache-mode: objects
          cache-generation: objectsx
          working-directory: packages/vm-runner
      - name: Edit the lockfile
        working-directory: packages/vm-runner
        env:
          MBX_DISABLE: "1"
        run: |
          set -euo pipefail
          # The workspace has a path dependency on the smolvm clone, which
          # re-resolution needs to see.
          ./.mise/fetch-smolvm
          cargo update -p memchr --precise 2.7.4
          git diff Cargo.lock
      - name: Rust tasks
        env:
          MODE: objects
        run: |
          set -o pipefail
          start=$(date +%s)
          mise run --continue-on-error //packages/vm-runner:check:lint ::: //packages/vm-runner:test 2>&1 | tee /tmp/ci-mbx-trial-bench.log
          echo "total=$(( $(date +%s) - start ))s"
          echo "### $MODE lock"
          grep -aE 'Finished in|mbx\[cache\]:' /tmp/ci-mbx-trial-bench.log | tail -8
          echo "compilations=$(grep -acE '(Compiling|Checking) ' /tmp/ci-mbx-trial-bench.log)"
