name: Daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vuln:
    name: mise controller:scan:govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - run: mise run controller:setup

      - name: Scan and file issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # JSON mode always exits 0; findings come from the stream, not the code.
          results=$(mise run controller:scan:govulncheck --json) || true

          # Keep only symbol-level (actually called) findings, joined with their
          # OSV definition, one issue per advisory id.
          mapfile -t findings < <(printf '%s' "$results" | jq -c -s '
            (reduce .[] as $m ({}; if $m.osv then . + {($m.osv.id): $m.osv} else . end)) as $defs
            | [ .[]
                | select(.finding != null and .finding.trace[0].function != null)
                | .finding as $f
                | { id: $f.osv,
                    fixed: ($f.fixed_version // ""),
                    package: ($f.trace[0].package // $f.trace[0].module),
                    summary: ($defs[$f.osv].summary // ""),
                    details: ($defs[$f.osv].details // ""),
                    aliases: (($defs[$f.osv].aliases // []) | join(", ")) }]
            | unique_by(.id)
            | .[]')

          if [ "${#findings[@]}" -eq 0 ]; then
            echo "::notice::govulncheck: no called vulnerabilities detected"
            exit 0
          fi

          for finding in "${findings[@]}"; do
            id=$(echo "$finding" | jq -r '.id')
            fixed=$(echo "$finding" | jq -r '.fixed')
            package=$(echo "$finding" | jq -r '.package')
            summary=$(echo "$finding" | jq -r '.summary')
            details=$(echo "$finding" | jq -r '.details')
            aliases=$(echo "$finding" | jq -r '.aliases')
            url="https://pkg.go.dev/vuln/${id}"

            title="[${id}] vulnerability in ${package} (govulncheck)"

            existing=$(gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "in:title \"${id}\" \"${package}\"" \
              --json number \
              --jq '.[0].number // empty')

            if [ -n "$existing" ]; then
              gh issue comment "$existing" \
                --repo "${GITHUB_REPOSITORY}" \
                --body "Still present. Package: \`${package}\`. Fixed in: \`${fixed:-—}\`."
              continue
            fi

            issue_body=$(printf '%s\n' \
              "**Source:** govulncheck (Go call-graph analysis)" \
              "**ID:** [\`${id}\`](${url})${aliases:+ (aliases: ${aliases})}" \
              "**Package:** \`${package}\`" \
              "**Fixed in:** \`${fixed:-—}\`" \
              "" \
              "${summary}" \
              "" \
              "${details}" \
              "" \
              "---" \
              "See [docs/security/supply-chain.md](../blob/main/docs/security/supply-chain.md) for the remediation flow.")

            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --body "$issue_body" \
              --label "security,vulnerability"
          done

  npm-audit:
    name: mise common:scan:npm-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - run: mise run common:setup:pnpm
      - name: Scan and file issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          results=$(mise run common:scan:npm-audit --json) || true
          mapfile -t findings < <(printf '%s' "$results" | jq -c '
            [ (.advisories // {}) | to_entries[] | .value
              | { id: (((.cves // []) | first) // .github_advisory_id // (.id | tostring)),
                  module: .module_name,
                  severity: (.severity // "unknown"),
                  title: (.title // ""),
                  url: (.url // ""),
                  patched: (.patched_versions // ""),
                  recommendation: (.recommendation // ""),
                  overview: (.overview // "") }]
            | unique_by(.id + "|" + .module)
            | .[]')

          if [ "${#findings[@]}" -eq 0 ]; then
            echo "::notice::pnpm audit: no vulnerabilities detected"
            exit 0
          fi

          for finding in "${findings[@]}"; do
            id=$(echo "$finding" | jq -r '.id')
            module=$(echo "$finding" | jq -r '.module')
            severity=$(echo "$finding" | jq -r '.severity')
            title_text=$(echo "$finding" | jq -r '.title')
            url=$(echo "$finding" | jq -r '.url')
            patched=$(echo "$finding" | jq -r '.patched')
            recommendation=$(echo "$finding" | jq -r '.recommendation')
            overview=$(echo "$finding" | jq -r '.overview')

            title="[${id}] ${severity} vulnerability in ${module} (pnpm audit)"

            existing=$(gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "in:title \"${id}\" \"${module}\"" \
              --json number \
              --jq '.[0].number // empty')

            if [ -n "$existing" ]; then
              gh issue comment "$existing" \
                --repo "${GITHUB_REPOSITORY}" \
                --body "Still present. Package: \`${module}\`. Patched: \`${patched:-—}\`."
              continue
            fi

            issue_body=$(printf '%s\n' \
              "**Source:** pnpm audit (npm advisory database)" \
              "**Advisory:** [\`${id}\`](${url}) (${severity})" \
              "**Package:** \`${module}\`" \
              "**Patched versions:** \`${patched:-—}\`" \
              "**Recommendation:** ${recommendation:-—}" \
              "" \
              "**${title_text}**" \
              "" \
              "${overview}" \
              "" \
              "---" \
              "See [docs/security/supply-chain.md](../blob/main/docs/security/supply-chain.md) for the remediation flow.")

            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --body "$issue_body" \
              --label "security,vulnerability"
          done

  mend-sca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 15
    env:
      MEND_URL: https://ibmets.whitesourcesoftware.com
      MEND_EMAIL: eal_apm0047897service_user@ibm.com
      MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
      MEND_ORGNAME: Enterprise Applications
      MEND_PRODUCTNAME: EAL_APM0047897
      MEND_PROJECTNAME: platform-sca
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Mend CLI
        run: |
          curl -fsSL https://downloads.mend.io/cli/linux_amd64/mend -o /usr/local/bin/mend
          chmod +x /usr/local/bin/mend

      - name: Run SCA scan and file issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          results=$(mend dep --dir . \
            --scope "${MEND_ORGNAME}//${MEND_PRODUCTNAME}//${MEND_PROJECTNAME}" \
            --update --format json --non-interactive)

          mapfile -t findings < <(echo "$results" | jq -c '
            [.. | objects | select(.vulnerabilities) |
              .name as $lib | .vulnerabilities[] |
              { cve: .name, severity: .severity, score: .cvss3_score,
                description: .description, url: .url,
                library: $lib, fix: (.topFix.fixResolution // "—") }]
            | unique_by(.cve + "|" + .library)
            | .[]')

          if [ "${#findings[@]}" -eq 0 ]; then
            echo "::notice::Mend SCA: no vulnerabilities detected"
            exit 0
          fi

          for finding in "${findings[@]}"; do
            cve=$(echo "$finding" | jq -r '.cve')
            severity=$(echo "$finding" | jq -r '.severity')
            score=$(echo "$finding" | jq -r '.score')
            description=$(echo "$finding" | jq -r '.description')
            url=$(echo "$finding" | jq -r '.url')
            library=$(echo "$finding" | jq -r '.library')
            fix=$(echo "$finding" | jq -r '.fix')

            title="[${cve}] ${severity} vulnerability in ${library} (SCA)"

            existing=$(gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "in:title \"${cve}\" \"${library}\"" \
              --json number \
              --jq '.[0].number // empty')

            if [ -n "$existing" ]; then
              gh issue comment "$existing" \
                --repo "${GITHUB_REPOSITORY}" \
                --body "Still present. Library: \`${library}\`. Fix: \`${fix}\`."
              continue
            fi

            issue_body=$(printf '%s\n' \
              "**Source:** Mend SCA" \
              "**CVE:** [\`${cve}\`](${url}) (${severity}, CVSS ${score})" \
              "**Library:** \`${library}\`" \
              "**Fix:** \`${fix}\`" \
              "" \
              "${description}" \
              "" \
              "---" \
              "See [docs/security/supply-chain.md](../blob/main/docs/security/supply-chain.md) for the remediation flow.")

            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --body "$issue_body" \
              --label "security,vulnerability"
          done

  quay-vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo:
          - api-server
          - claude-code
          - controller
          - google-workspace-agent
          - pi-agent
          - platform-base
          - ui
    steps:
      - name: Scan and file issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUAY_REPO: dam-agents/${{ matrix.repo }}
          TAG: latest
          QUAY_OAUTH_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${QUAY_OAUTH_TOKEN:-}" ]; then
            echo "::warning::QUAY_OAUTH_TOKEN not set; skipping Quay scan for ${QUAY_REPO}"
            exit 0
          fi

          auth=(-H "Authorization: Bearer ${QUAY_OAUTH_TOKEN}")

          digest=$(curl -fsSL "${auth[@]}" \
            "https://quay.io/api/v1/repository/${QUAY_REPO}/tag/?onlyActiveTags=true&filter_tag_name=eq:${TAG}" \
            | jq -r '.tags[0].manifest_digest // empty')

          if [ -z "$digest" ]; then
            echo "::notice::No '${TAG}' tag yet for ${QUAY_REPO}"
            exit 0
          fi

          scan_digest="$digest"
          manifest=$(curl -fsSL "${auth[@]}" \
            "https://quay.io/api/v1/repository/${QUAY_REPO}/manifest/${digest}")
          if [ "$(echo "$manifest" | jq -r '.is_manifest_list')" = "true" ]; then
            scan_digest=$(echo "$manifest" | jq -r '
              ((.manifest_data // "") | try fromjson catch {}) as $idx
              | ($idx.manifests // []) as $m
              | ( [ $m[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest ]
                  + [ $m[] | select(.platform.os == "linux" and ((.platform.architecture // "unknown") != "unknown")) | .digest ] )
              | .[0] // empty')
            if [ -z "$scan_digest" ]; then
              echo "::notice::No scannable linux child manifest for ${QUAY_REPO}@${digest}"
              exit 0
            fi
          fi

          security=$(curl -fsSL "${auth[@]}" \
            "https://quay.io/api/v1/repository/${QUAY_REPO}/manifest/${scan_digest}/security?vulnerabilities=true")

          status=$(echo "$security" | jq -r '.status')
          if [ "$status" != "scanned" ]; then
            echo "::notice::Scan not ready for ${QUAY_REPO}@${digest} (status=${status})"
            exit 0
          fi

          # Flatten + dedupe vulns by (CVE, package). Filter on severity here
          # if you want to suppress Low/Medium noise; left wide-open for now
          # so nothing is hidden by default.
          mapfile -t findings < <(echo "$security" | jq -c '
            [.data.Layer.Features[]
              | . as $f
              | (.Vulnerabilities // [])[]
              | { cve: .Name, severity: .Severity, link: .Link,
                  description: .Description, fixed_by: .FixedBy,
                  package: $f.Name, version: $f.Version }]
            | unique_by(.cve + "|" + .package)
            | .[]')

          if [ "${#findings[@]}" -eq 0 ]; then
            echo "::notice::Clean scan for ${QUAY_REPO}@${digest}"
            exit 0
          fi

          for finding in "${findings[@]}"; do
            cve=$(echo "$finding" | jq -r '.cve')
            severity=$(echo "$finding" | jq -r '.severity')
            link=$(echo "$finding" | jq -r '.link')
            description=$(echo "$finding" | jq -r '.description')
            package=$(echo "$finding" | jq -r '.package')
            version=$(echo "$finding" | jq -r '.version')
            fixed_by=$(echo "$finding" | jq -r '.fixed_by')

            title="[${cve}] ${severity} vulnerability in ${QUAY_REPO}"

            existing=$(gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "in:title \"${cve}\" \"${QUAY_REPO}\"" \
              --json number \
              --jq '.[0].number // empty')

            comment_body=$(printf '%s\n' \
              "Still present on tag \`${TAG}\` (manifest \`${digest}\`)." \
              "Package: \`${package}\` ${version}." \
              "Fixed by: \`${fixed_by:-—}\`.")

            if [ -n "$existing" ]; then
              gh issue comment "$existing" \
                --repo "${GITHUB_REPOSITORY}" \
                --body "$comment_body"
              continue
            fi

            issue_body=$(printf '%s\n' \
              "**Image:** \`${QUAY_REPO}:${TAG}\` (\`${digest}\`)" \
              "**CVE:** \`${cve}\` (${severity})" \
              "**Package:** \`${package}\` ${version}" \
              "**Fixed by:** \`${fixed_by:-—}\`" \
              "" \
              "${description}" \
              "" \
              "[View advisory](${link})" \
              "" \
              "---" \
              "See [docs/security/supply-chain.md](../blob/main/docs/security/supply-chain.md) for the remediation flow.")

            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --body "$issue_body" \
              --label "security,vulnerability"
          done
