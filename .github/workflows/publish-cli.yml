name: Publish CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # need history to verify a tagged commit is on main

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Install dependencies
        run: mise run setup

      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from origin/main. Tags must point to a commit on main."
            exit 1
          fi

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match packages/cli/package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build and pack (dry-run)
        run: |
          mise run cli:build
          cd packages/cli
          pnpm pack --pack-destination /tmp/dam-cli-pack
          echo "=== Tarball contents ==="
          tar -tzf /tmp/dam-cli-pack/*.tgz | sort

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: pnpm --filter @dam-agents/cli publish --access public --no-git-checks --provenance
