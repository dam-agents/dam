name: CodeQL analyze

# One language's code scanning, called by the codeql-<language>.yml workflows.
# Each caller carries its own `paths` filter, so a pull request that touches no
# file of a language never starts that language's workflow, and holds no runner
# slot for it. Default setup could not filter: it analysed every language on
# every pull request.
#
# The category matches default setup's (`/language:<language>`), so alerts keep
# their history across the switch.
#
# A caller that sets `quality` also runs the `code-quality` query suite next to
# the default security suite, on the same database and in the same upload, so
# its findings are code scanning alerts. GitHub's Code Quality product itself
# cannot run here: the action accepts `analysis-kinds: code-quality` only in the
# workflow GitHub generates, and drops it from any other.

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      build-mode:
        required: true
        type: string
      quality:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/controller/go.mod
          cache: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.quality && 'code-quality' || '' }}
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ inputs.language }}
