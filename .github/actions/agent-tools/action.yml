name: agent tools
description: >-
  The default image's tools layer, as its installer made it, and the other
  images' own tools, for this arch, which the lockfile and the image files fix;
  each build installs only what it lacks. A miss restores the newest older
  entry, so a lockfile change reinstalls only the other images' tools it
  changed (the tools layer is made again whole), and then writes the entry: any
  job on main that misses writes it, since each may run without the others. A
  PR or a tag never writes one: at over a gigabyte, its entry would count
  against the repo's 10 GB and evict main's. Needs mise with node, pnpm, crane,
  uv and usage, and sudo.
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/platform-agent-oci/build/data
          ~/.cache/platform-agent-oci/harness-tools
        key: agent-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/agents/base/image.lock', 'packages/agents/base/image-locks/**', 'packages/agents/base/miserc.toml', 'packages/agents/base/rootfs/etc/mise/conf.d/settings.toml', 'packages/agents/*/image.toml', 'packages/agents/base/base.toml', 'packages/agents/*/*.py', 'packages/agents/*/*.txt', 'packages/e2e/agents/mock/image.toml', 'packages/agents/default/rootfs/usr/local/bin/install-harness-tools') }}
        restore-keys: agent-tools-v2-${{ runner.os }}-${{ runner.arch }}-
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: packages/agents/.mise/tasks/oci --warm
    - if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/platform-agent-oci/build/data
          ~/.cache/platform-agent-oci/harness-tools
        key: ${{ steps.restore.outputs.cache-primary-key }}
