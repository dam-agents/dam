name: agent tools
description: >-
  Every mise image's tools and Chromium for this arch, which the lockfile and
  the image files fix; each build installs only what it lacks. A miss restores
  the newest older entry, so a lockfile change reinstalls only the tools it
  changed, and then writes the entry: any job that misses writes it, since each
  may run without the others. Needs mise with node, pnpm, crane and usage.
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/platform-agent-oci/build/data
          ~/.cache/platform-agent-oci/build/ms-playwright
        key: agent-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/agents/base/image.lock', 'packages/agents/base/image-locks/**', 'packages/agents/base/miserc.toml', 'packages/agents/base/rootfs/etc/mise/conf.d/settings.toml', 'packages/agents/*/image.toml', 'packages/agents/base/base.toml', 'packages/agents/*/*.py', '!packages/agents/base/own-layout.py', 'packages/agents/*/*.txt', 'packages/e2e/agents/mock/image.toml') }}
        restore-keys: agent-tools-${{ runner.os }}-${{ runner.arch }}-
    - if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: packages/agents/.mise/tasks/oci --warm
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/platform-agent-oci/build/data
          ~/.cache/platform-agent-oci/build/ms-playwright
        key: ${{ steps.restore.outputs.cache-primary-key }}
