# Docs tasks (//docs:*): file tasks under .mise/tasks/. Sources are relative to
# this directory.
[tasks.check]
depends = [":check:*"]

[tasks."check:adr-index"]
description = "The committed ADR index must match what regeneration produces. Pure files, no services, fail closed on drift."
run = "{{ mise_bin }} run //docs:generate:adr-index -- --check"
sources = ["adrs/*.md", ".mise/tasks/generate/adr-index"]
outputs = []
cache.enabled = true
deny_net = true
deny_write = true

# Regenerate docs/activity-events.md from the event registry. The table is a
# projection of what the code emits, never hand-maintained — the ticket that
# asked for it (#3259) requires a reader to answer "is this action captured?"
# without reading code, and a hand-written list would drift the first time an
# event moved.
[tasks."generate:activity-events"]
dir = "{{vars.repo_root}}/packages/api-server"
run = "node scripts/event-coverage.mjs --doc"

# Guard: the committed table must match regeneration. Same fail-closed shape as
# check:adr-index.
[tasks."check:activity-events"]
dir = "{{vars.repo_root}}/packages/api-server"
run = "node scripts/event-coverage.mjs --check-doc"
