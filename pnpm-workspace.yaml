packages:
  - "packages/*"
  - "packages/e2e/agents/mock"
  - "packages/e2e/agents/mock-api"
  - "packages/e2e/playwright"
  - "packages/agents/pi-agent/workspace/.pi/agent/extensions/*"
minimumReleaseAge: 10080 # 7 days (in minutes)
minimumReleaseAgeExclude:
  # fast-uri@3.1.7 (2026-09-02) is the only 3.x release fixing CVE-2026-84292
  # and CVE-2026-84394, and it is younger than the 7-day floor. Drop this
  # entry once the release ages past the floor.
  - "fast-uri@3.1.7"
  # qs@6.16.0 (2026-08-29) is the only release fixing CVE-2026-82417 and
  # CVE-2026-82562, and it is younger than the 7-day floor. Drop this entry
  # once the release ages past the floor.
  - "qs@6.16.0"
  # The pi-agent image pins @earendil-works/pi-coding-agent 0.85.0 (2026-09-04)
  # and the pi-dynamic-providers extension type-checks against the same
  # version; the fork publishes all its packages in lockstep. Drop these once
  # the release ages past the floor.
  - "@earendil-works/pi-coding-agent@0.85.0"
  - "@earendil-works/pi-agent-core@0.85.0"
  - "@earendil-works/pi-ai@0.85.0"
  - "@earendil-works/pi-tui@0.85.0"
  - "@earendil-works/pi-client@0.85.0"
  - "@earendil-works/pi-protocol@0.85.0"
  - "@earendil-works/pi-telemetry@0.85.0"
  - "@earendil-works/chord@0.85.0"
  - "@anthropic-ai/sdk@0.123.0"
trustPolicy: no-downgrade
trustPolicyExclude:
  # rollup@2.80.0 is pinned by transitive deps still on the v2 line while
  # the rest of the tree is on v4.60.1. pnpm's `no-downgrade` policy flags
  # it because v2 predates the trust signals (OIDC provenance, trusted
  # publisher) added to v4. Same upstream (rollup team), no open security
  # advisories at the time of exclusion; only a publisher-side signal
  # regression. Transitive-only, not a direct dep.
  - "rollup@2.80.0"
  # semver@6.3.1 is the legacy semver-v6 line pulled in by transitive deps
  # that haven't moved to v7 yet. Same upstream as semver@7.7.4 in the
  # tree (npm core team), no open advisories at the time of exclusion;
  # `no-downgrade` flagged it for the same publisher-side trust delta as
  # rollup@2.80.0. Transitive-only.
  - "semver@6.3.1"
  # chokidar dropped OIDC provenance for 4.0.2/4.0.3 (Dec 2024) — same
  # maintainer (paulmillr), GitHub tag matches, restored in 5.0.0 via
  # `trustedPublisher: github`. Benign publisher-side workflow change.
  - "chokidar@4.0.3"
  # tinyexec@1.2.2 downgraded from trusted-publisher (1.1.1) to provenance-
  # attestation. Same upstream (tinylibs), no open advisories. Pulled in
  # transitively by vitest. Only surfaces in `pnpm deploy --legacy` paths
  # (platform-base Dockerfile) because legacy deploy bypasses the lockfile
  # and re-resolves to latest. Normal pnpm install pins 1.1.1 via the
  # lockfile and is unaffected.
  - "tinyexec@1.2.2"
allowBuilds:
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@google/genai': true
  '@ibm/plex': false
  argon2: true
  esbuild: true
  grpc-tools: true
  koffi: true
  msgpackr-extract: false
  protobufjs: true
  sharp: true
overrides:
  "@anthropic-ai/sdk@<0.91.1": "0.91.1"
  "@babel/core@<7.29.6": "7.29.6"
  "@hono/node-server@<2.0.10": "2.0.12"
  "@humanfs/node@<0.16.8": "0.16.8"
  "@opentelemetry/propagator-jaeger@<2.9.0": "2.9.0"
  "axios@<1.18.0": "1.18.0"
  "baseline-browser-mapping@<2.11.0": "2.11.0"
  "body-parser@<2.3.0": "2.3.0"
  "brace-expansion@2": "2.1.4"
  "brace-expansion@5": "5.0.9"
  "browserslist@<4.28.7": "4.28.7"
  "esbuild@<0.25.0": "0.25.12"
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  "fast-uri@<3.1.7": "3.1.7"
  "form-data@<4.0.6": "4.0.6"
  "ip-address@<10.3.1": "10.3.1"
  "js-yaml@<4.3.2": "4.3.2"
  "nanoid@3": "3.3.18"
  "postcss@<8.5.23": "8.5.23"
  "protobufjs@<7.6.5": "7.6.5"
  "qs@<6.16.0": "6.16.0"
  "serialize-javascript@<7.0.5": "7.0.5"
  "tar@<7.5.21": "7.5.21"
  "undici@8": "8.9.0"
  "ws@<8.21.0": "8.21.0"

