packages:
  - "packages/*"
  - "packages/e2e/agents/mock"
  - "packages/e2e/agents/mock-api"
  - "packages/e2e/playwright"
  - "packages/agents/pi-agent/rootfs/usr/local/share/pi-platform/extensions/*"
minimumReleaseAge: 10080 # 7 days (in minutes)
minimumReleaseAgeExclude:
  # rrule-temporal@2.2.7 (2026-09-25) fixes sub-daily rules with BYxxx parts
  # ignoring the INTERVAL cadence, which 2.2.6 gets wrong for pinned schedules.
  # Drop this entry once it is older than 7 days (2026-10-02).
  - "rrule-temporal@2.2.7"
  # The pi-agent image pins @earendil-works/pi-coding-agent 1.0.2 (2026-10-04)
  # and the pi-dynamic-providers extension type-checks against the same
  # version; the fork publishes all its packages in lockstep. Drop these once
  # the release ages past the floor (2026-10-11).
  - "@earendil-works/chord@1.0.2"
  - "@earendil-works/pi-agent-core@1.0.2"
  - "@earendil-works/pi-ai@1.0.2"
  - "@earendil-works/pi-codemode@1.0.2"
  - "@earendil-works/pi-coding-agent@1.0.2"
  - "@earendil-works/pi-mcp@1.0.2"
  - "@earendil-works/pi-telemetry@1.0.2"
  - "@earendil-works/pi-tui@1.0.2"
  # @earendil-works/pi-ai 1.0.2 pins @anthropic-ai/sdk 0.129.0 (2026-09-28).
  # Drop this once it ages past the floor (2026-10-05).
  - "@anthropic-ai/sdk@0.129.0"
trustPolicy: no-downgrade
trustPolicyExclude:
  # rollup@2.80.0 is pinned by transitive deps still on the v2 line while
  # the rest of the tree is on v4.60.1. pnpm's `no-downgrade` policy flags
  # it because v2 predates the trust signals (OIDC provenance, trusted
  # publisher) added to v4. Same upstream (rollup team), no open security
  # advisories at the time of exclusion; only a publisher-side signal
  # regression. Transitive-only, not a direct dep.
  - "rollup@2.80.0"
  # semver@6.3.1 is the legacy semver-v6 line pulled in by transitive deps
  # that haven't moved to v7 yet. Same upstream as semver@7.7.4 in the
  # tree (npm core team), no open advisories at the time of exclusion;
  # `no-downgrade` flagged it for the same publisher-side trust delta as
  # rollup@2.80.0. Transitive-only.
  - "semver@6.3.1"
  # chokidar dropped OIDC provenance for 4.0.2/4.0.3 (Dec 2024) — same
  # maintainer (paulmillr), GitHub tag matches, restored in 5.0.0 via
  # `trustedPublisher: github`. Benign publisher-side workflow change.
  - "chokidar@4.0.3"
allowBuilds:
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@google/genai': true
  '@ibm/plex': false
  argon2: true
  esbuild: true
  grpc-tools: true
  koffi: true
  msgpackr-extract: false
  protobufjs: true
  sharp: true
overrides:
  "@hono/node-server@<2.0.10": "2.0.12"
  # ip-address <10.7.1 carries security advisories. It is transitive only
  # (express-rate-limit, socks), and both accept ^10, so the override keeps
  # them satisfied while Dependabot cannot bump a transitive dep on its own.
  "ip-address@<10.7.1": "10.7.2"
  "esbuild@<0.25.0": "0.25.12"
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  "serialize-javascript@<7.0.5": "7.0.5"

packageExtensions:
  "drizzle-kit":
    "peerDependencies":
      "drizzle-orm": "*"
  "keycloakify":
    "peerDependencies":
      "react": "*"
      "react-dom": "*"
      "@types/react": "*"
      "@types/react-dom": "*"
    "peerDependenciesMeta":
      "@types/react":
        "optional": true
      "@types/react-dom":
        "optional": true
