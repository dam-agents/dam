packages:
  - "packages/*"
  - "packages/e2e/agents/mock"
  - "packages/e2e/agents/mock-api"
  - "packages/e2e/playwright"
  - "packages/agents/pi-agent/rootfs/usr/local/share/pi-platform/extensions/*"
minimumReleaseAge: 10080 # 7 days (in minutes)
minimumReleaseAgeExclude:
  # qs 6.16.1 (2026-10-14) fixes CVE-2026-110816, reached through express's
  # body-parser. Drop this once it ages past the floor (2026-10-21).
  - "qs@6.16.1"
  # undici 8.12.2 and 7.30.1 (2026-10-15) are the first releases that fix
  # CVE-2026-109383, CVE-2026-109829, CVE-2026-109869 and CVE-2026-87018.
  # Drop this once they age past the floor (2026-10-22).
  - "undici@8.12.2"
  - "undici@7.30.1"
trustPolicy: no-downgrade
trustPolicyExclude:
  # rollup@2.80.0 is pinned by transitive deps still on the v2 line while
  # the rest of the tree is on v4.60.1. pnpm's `no-downgrade` policy flags
  # it because v2 predates the trust signals (OIDC provenance, trusted
  # publisher) added to v4. Same upstream (rollup team), no open security
  # advisories at the time of exclusion; only a publisher-side signal
  # regression. Transitive-only, not a direct dep.
  - "rollup@2.80.0"
  # semver@6.3.1 is the legacy semver-v6 line pulled in by transitive deps
  # that haven't moved to v7 yet. Same upstream as semver@7.7.4 in the
  # tree (npm core team), no open advisories at the time of exclusion;
  # `no-downgrade` flagged it for the same publisher-side trust delta as
  # rollup@2.80.0. Transitive-only.
  - "semver@6.3.1"
  # chokidar dropped OIDC provenance for 4.0.2/4.0.3 (Dec 2024) — same
  # maintainer (paulmillr), GitHub tag matches, restored in 5.0.0 via
  # `trustedPublisher: github`. Benign publisher-side workflow change.
  - "chokidar@4.0.3"
allowBuilds:
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@carbon/pictograms-react': false
  '@google/genai': true
  '@ibm/plex': false
  esbuild: true
  grpc-tools: true
  koffi: true
  msgpackr-extract: false
  protobufjs: true
  sharp: true
overrides:
  "esbuild@<0.25.0": "0.25.12"
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  # CVE-2026-109383, -109829, -109869 and -87018 are fixed only in undici
  # 7.30.1 and 8.12.2. The vulnerable copies come from peer resolutions no
  # direct bump reaches: @slack/socket-mode's ^7 peer and pi-ai's optional 8
  # peer. Drop both once those peers resolve at or above the fix.
  "undici@^7": "7.30.1"
  "undici@^8": "8.12.2"
  # CVE-2026-111997 is fixed in ip-address 10.7.4. socks and
  # express-rate-limit both allow it, and keep 10.7.2 in the lock.
  "ip-address@<10.7.4": "10.7.4"

packageExtensions:
  "drizzle-kit":
    "peerDependencies":
      "drizzle-orm": "*"
  "keycloakify":
    "peerDependencies":
      "react": "*"
      "react-dom": "*"
      "@types/react": "*"
      "@types/react-dom": "*"
    "peerDependenciesMeta":
      "@types/react":
        "optional": true
      "@types/react-dom":
        "optional": true
