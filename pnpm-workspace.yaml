packages:
  - "packages/*"
  - "packages/e2e/agents/mock"
  - "packages/e2e/agents/mock-api"
  - "packages/e2e/playwright"
  - "packages/e2e/acceptance"
  - "packages/agents/pi-agent/rootfs/usr/local/share/pi-platform/extensions/*"
minimumReleaseAge: 10080 # 7 days (in minutes)
minimumReleaseAgeExclude:
  # The pi-agent image pins @earendil-works/pi-coding-agent 1.5.1 (2026-11-09
  # 23:45 UTC), the first release that keeps a margin for the input estimate
  # when it asks for the rest of a model's window as output, which the
  # CurveBender models' output limits rely on; the extensions type-check and
  # the Pi tests run against the same version, and the fork publishes all its
  # packages in lockstep. Drop these once the release ages past the floor
  # (2026-11-16 23:45 UTC).
  - "@earendil-works/pi-agent-core@1.5.1"
  - "@earendil-works/pi-ai@1.5.1"
  - "@earendil-works/pi-codemode@1.5.1"
  - "@earendil-works/pi-coding-agent@1.5.1"
  - "@earendil-works/pi-mcp@1.5.1"
  - "@earendil-works/pi-schema@1.5.1"
  - "@earendil-works/pi-telemetry@1.5.1"
  - "@earendil-works/pi-tui@1.5.1"
trustPolicy: no-downgrade
trustPolicyExclude:
  # rollup@2.80.0 is pinned by transitive deps still on the v2 line while
  # the rest of the tree is on v4.60.1. pnpm's `no-downgrade` policy flags
  # it because v2 predates the trust signals (OIDC provenance, trusted
  # publisher) added to v4. Same upstream (rollup team), no open security
  # advisories at the time of exclusion; only a publisher-side signal
  # regression. Transitive-only, not a direct dep.
  - "rollup@2.80.0"
  # semver@6.3.1 is the legacy semver-v6 line pulled in by transitive deps
  # that haven't moved to v7 yet. Same upstream as semver@7.7.4 in the
  # tree (npm core team), no open advisories at the time of exclusion;
  # `no-downgrade` flagged it for the same publisher-side trust delta as
  # rollup@2.80.0. Transitive-only.
  - "semver@6.3.1"
  # chokidar dropped OIDC provenance for 4.0.2/4.0.3 (Dec 2024) — same
  # maintainer (paulmillr), GitHub tag matches, restored in 5.0.0 via
  # `trustedPublisher: github`. Benign publisher-side workflow change.
  - "chokidar@4.0.3"
allowBuilds:
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@google/genai': true
  '@ibm/plex': false
  esbuild: true
  grpc-tools: true
  koffi: true
  msgpackr-extract: false
  protobufjs: true
  sharp: true
overrides:
  "esbuild@<0.25.0": "0.25.12"

packageExtensions:
  "drizzle-kit":
    "peerDependencies":
      "drizzle-orm": "*"
  "keycloakify":
    "peerDependencies":
      "react": "*"
      "react-dom": "*"
      "@types/react": "*"
      "@types/react-dom": "*"
    "peerDependenciesMeta":
      "@types/react":
        "optional": true
      "@types/react-dom":
        "optional": true
