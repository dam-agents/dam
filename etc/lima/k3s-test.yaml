images:
  - location: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2
    arch: aarch64
  - location: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
    arch: x86_64

cpus: 4
# Matches k3s.yaml: Istio ambient (istiod + istio-cni + ztunnel +
# waypoint) adds ~1 GiB on top of the platform stack. On 4 GiB the keycloak
# JVM boot exceeds the 2-min keycloak-config-cli retry deadline because
# every pod is fighting for memory. Bumping here doesn't resize an existing
# VM — `mise run e2e` always nukes the prior VM first, so this takes effect
# on the next run.
# 16 GiB: the guest's /tmp is a tmpfs of half the RAM, and cluster:import copies
# each image tar there — the mock agent's is 4.3 GiB, beside the default image's
# 1.7 GiB on the vm lane — so 8 GiB gave it 3.9 GiB and the import failed with
# "No space left on device" on every Mac. 40 GiB of disk holds the unpacked
# images the larger import lands.
memory: 16GiB
disk: 40GiB

# Skip lima's default rootless containerd + buildkit + stargz setup —
# k3s ships its own containerd and we never invoke `nerdctl` from the host.
# This shaves ~2 minutes off cold-boot provisioning.
containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/sh
      set -e
      mkdir -p /etc/rancher/k3s
      cat > /etc/rancher/k3s/config.yaml << 'EOF'
      kubelet-arg:
        - "container-log-max-size=10Mi"
        - "container-log-max-files=3"
      EOF
      # One process's out-of-memory kill must not take its container with it: on
      # cgroup v2 the kubelet groups a container's kills unless its configuration
      # sets singleProcessOOMKill, so one VM agent's overrun would end its runner
      # and every machine of that owner (issue #5614). No kubelet command-line
      # flag carries the setting, so it is a kubelet configuration file, which
      # k3s copies into the kubelet's own drop-in dir wherever kubelet-arg names
      # it: in place before the kubelet first starts, and re-read at each start.
      cat > /etc/rancher/k3s/kubelet-single-process-oom-kill.yaml << 'EOF'
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      singleProcessOOMKill: true
      EOF
      mkdir -p /etc/rancher/k3s/config.yaml.d
      cat > /etc/rancher/k3s/config.yaml.d/50-single-process-oom-kill.yaml << 'EOF'
      kubelet-arg+:
        - "config=/etc/rancher/k3s/kubelet-single-process-oom-kill.yaml"
      EOF
      # Nested guests are only usable with transparent huge pages pinned on:
      # under Ubuntu's `madvise` a nested boot took 3 to 25 s and pegged its
      # vCPUs, which the vm lane sees as agents stuck "starting". Red Hat
      # hosts default to `always`, and the runner's memory layout assumes it.
      # A sysfs write alone would be lost on reboot, so a unit re-applies it.
      # A sandbox runs OpenRC or no init at all, and never reboots: there the
      # one write is the whole job, and a sysfs this kernel won't take is a
      # warning, not a failed provision.
      if [ -d /run/systemd/system ]; then
        cat > /etc/systemd/system/transparent-hugepage.service << 'THP'
      [Unit]
      Description=Pin transparent huge pages on for the nested VM runners
      After=local-fs.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo always > /sys/kernel/mm/transparent_hugepage/enabled'

      [Install]
      WantedBy=multi-user.target
      THP
        systemctl enable --now transparent-hugepage.service
      elif ! { echo always > /sys/kernel/mm/transparent_hugepage/enabled; } 2>/dev/null; then
        echo "WARNING: transparent huge pages are not pinned on; nested VMs boot slowly." >&2
      fi
      if [ ! -d /var/lib/rancher/k3s ]; then
        # Pinned: k3s ships the Gateway API CRDs through its own gateway-api-crd
        # chart, so GATEWAY_API_VERSION in .mise/tasks/cluster/install must match the
        # bundle this k3s carries (v1.6.1 in v1.37.1).
        export INSTALL_K3S_VERSION="v1.37.1+k3s1"
        export INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644 --https-listen-port 16445"
        # Skip the k3s-selinux RPM when SELinux isn't active (absent or Disabled):
        # its binary relabel step fails under set -e on a disabled-SELinux host.
        if ! { command -v getenforce >/dev/null 2>&1 && [ "$(getenforce)" != Disabled ]; }; then
          export INSTALL_K3S_SKIP_SELINUX_RPM=true
        fi
        # Two network fetches happen here: this installer script, and the k3s
        # release tarball it pulls from GitHub. Either one failing aborted the
        # whole provision, and `curl | sh` hid a failed script fetch outright —
        # sh reads empty input and exits 0, so the run continued with no k3s and
        # died 120s later on a missing kubeconfig. Fetch to a file so the failure
        # is visible, and retry the pair: the installer is re-runnable, and a
        # transient GitHub error is not worth losing a cluster provision over.
        # The script comes from the pinned release tag on GitHub, not get.k3s.io:
        # it then matches the version it installs, and the provision depends on
        # GitHub alone.
        installer=$(mktemp /tmp/k3s-install.XXXXXX)
        attempt=1
        while :; do
          if curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors "https://raw.githubusercontent.com/k3s-io/k3s/${INSTALL_K3S_VERSION}/install.sh" -o "$installer" && sh "$installer"; then
            break
          fi
          if [ "$attempt" -ge 4 ]; then
            rm -f "$installer"
            echo "k3s install failed after $attempt attempts" >&2
            exit 1
          fi
          echo "k3s install attempt $attempt failed; retrying in $((attempt * 10))s" >&2
          sleep $((attempt * 10))
          attempt=$((attempt + 1))
        done
        rm -f "$installer"
      fi
      mkdir -p /var/lib/rancher/k3s/server/manifests
      cat > /var/lib/rancher/k3s/server/manifests/traefik-config.yaml << 'EOF'
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: traefik
        namespace: kube-system
      spec:
        valuesContent: |
          ports:
            platform:
              port: 6555
              expose:
                default: true
              exposedPort: 6555
              protocol: TCP
      EOF

probes:
  - mode: readiness
    description: k3s is ready
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until test -f /etc/rancher/k3s/k3s.yaml; do sleep 3; done"; then
        echo >&2 "k3s is not running yet"
        exit 1
      fi

copyToHost:
  - guest: /etc/rancher/k3s/k3s.yaml
    host: "{{.Dir}}/copied-from-guest/kubeconfig.yaml"
    deleteOnStop: true

portForwards:
  - guestPort: 6555
    hostPort: 6555
  - guestPort: 16445
    hostPort: 16445

message: |
  Test k3s cluster is ready. Access services via port 6555.
  KUBECONFIG: {{.Dir}}/copied-from-guest/kubeconfig.yaml
