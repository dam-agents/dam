# Lima VM template for platform k3s cluster
# Based on template:k3s with custom port forwarding

images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64

# ClickStack (`clickstack.enabled`) adds ~2.1 CPU of pod requests — mongodb
# alone asks for 1 CPU. On 4 cores that left 40m free and agent pods sat
# Pending forever with FailedScheduling: Insufficient cpu.
#
# 10 is the host's full logical-CPU count (vz time-shares vCPUs, so the host
# stays responsive). At 8, an experiment fanning out workers within the old
# 8-CPU budget ceiling drove the VM's load average past 20: kubelet probes
# timed out, the node flapped NotReady, and Keycloak crash-looped on liveness
# kills until the UI lost auth entirely. The per-user budget ceiling in
# values-local.yaml must stay below this count so the platform stack always
# keeps headroom.
#
# The same starvation runs in reverse from the HOST: with the VM sized to
# every host core, a sustained CPU hog on the host (a forgotten dev server,
# a runaway build) stalls the guest's vCPUs long enough to blow 3-second
# liveness probes — postgres/redis get SIGTERMed while "Completed", the
# api-server 500s, and a running experiment dies with it, all while the VM's
# own load average looks innocent. When probes time out cluster-wide but
# `free`/`df` inside the VM look fine, check `uptime` and top CPU consumers
# on the host first, not the cluster.
cpus: 10
# Istio ambient (istiod + istio-cni + ztunnel + waypoint Deployment) adds
# ~1 GiB of pod requests on top of the existing platform stack. On 4 GiB the
# k3s scheduler hit FailedScheduling: Insufficient memory for new agent pods.
#
# Bumping `cpus:`/`memory:` here does not resize an existing VM. Devs on an
# older VM can resize in place without losing cluster state:
#   mise run cluster:stop
#   limactl edit platform-k3s     # match cpus/memory to this file
#   limactl start platform-k3s
# A single Nous campaign benchmarking a process manager peaked past 4 GiB in
# one worker (three ~1 GiB pm2 daemons + the SDK harness, OOM-killing the
# container), and the worker's budget ceiling has to fit inside what the VM
# can actually schedule — 16 GiB left agent workloads competing with the
# ~5 GiB platform stack.
memory: 20GiB
disk: 200GiB

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/sh
      set -e
      # Bound kubelet container-log usage at ~30 MiB per pod so a chatty/looping
      # pod can't fill the dev VM disk (issue #244). cluster:install also
      # ensures this file exists on existing VMs.
      mkdir -p /etc/rancher/k3s
      cat > /etc/rancher/k3s/config.yaml << 'EOF'
      kubelet-arg:
        - "container-log-max-size=10Mi"
        - "container-log-max-files=3"
      EOF
      if [ ! -d /var/lib/rancher/k3s ]; then
        # Pinned: the bundled Traefik's traefik-crd chart also ships the Gateway API
        # CRDs, so GATEWAY_API_VERSION in .mise/tasks/cluster/install must match the
        # bundle this k3s carries (v1.5.1 in v1.36.4, Traefik chart v40.1).
        export INSTALL_K3S_VERSION="v1.36.4+k3s1"
        export INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644 --https-listen-port 16443"
        # Skip the k3s-selinux RPM when SELinux isn't active (absent or Disabled):
        # its binary relabel step fails under set -e on a disabled-SELinux host.
        if ! { command -v getenforce >/dev/null 2>&1 && [ "$(getenforce)" != Disabled ]; }; then
          export INSTALL_K3S_SKIP_SELINUX_RPM=true
        fi
        # Two network fetches happen here: this installer script, and the k3s
        # release tarball it pulls from GitHub. Either one failing aborted the
        # whole provision, and `curl | sh` hid a failed script fetch outright —
        # sh reads empty input and exits 0, so the run continued with no k3s and
        # died 120s later on a missing kubeconfig. Fetch to a file so the failure
        # is visible, and retry the pair: the installer is re-runnable, and a
        # transient GitHub error is not worth losing a cluster provision over.
        installer=$(mktemp /tmp/k3s-install.XXXXXX)
        attempt=1
        while :; do
          if curl -sfL --retry 3 --retry-delay 2 --retry-all-errors https://get.k3s.io -o "$installer" && sh "$installer"; then
            break
          fi
          if [ "$attempt" -ge 4 ]; then
            rm -f "$installer"
            echo "k3s install failed after $attempt attempts" >&2
            exit 1
          fi
          echo "k3s install attempt $attempt failed; retrying in $((attempt * 10))s" >&2
          sleep $((attempt * 10))
          attempt=$((attempt + 1))
        done
        rm -f "$installer"
      fi
      # Configure Traefik to also listen on port 4444 (auto-forwarded by lima)
      mkdir -p /var/lib/rancher/k3s/server/manifests
      cat > /var/lib/rancher/k3s/server/manifests/traefik-config.yaml << 'EOF'
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: traefik
        namespace: kube-system
      spec:
        valuesContent: |
          ports:
            platform:
              port: 4444
              expose:
                default: true
              exposedPort: 4444
              protocol: TCP
      EOF

probes:
  - mode: readiness
    description: k3s is ready
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until test -f /etc/rancher/k3s/k3s.yaml; do sleep 3; done"; then
        echo >&2 "k3s is not running yet"
        exit 1
      fi

copyToHost:
  - guest: /etc/rancher/k3s/k3s.yaml
    host: "{{.Dir}}/copied-from-guest/kubeconfig.yaml"
    deleteOnStop: true

portForwards:
  - guestPort: 4444
    hostPort: 4444
  - guestPort: 16443
    hostPort: 16443
  # Deny-by-default: lima otherwise auto-forwards every 0.0.0.0 listener in the
  # guest (e.g. Traefik's :80/:443, kubelet :10250, rpcbind :111) and clobbers
  # host ports used by other projects. guestIP: 0.0.0.0 + proto: any is lima's
  # canonical catch-all; must come after the explicit allows above.
  # See https://github.com/lima-vm/lima/issues/2901 — ignore rules with the
  # default guestIP (127.0.0.1) are deliberately skipped for 0.0.0.0 listeners.
  - guestIP: 0.0.0.0
    proto: any
    ignore: true

message: |
  k3s is ready. Access services via http://platform.localhost:4444
  KUBECONFIG: {{.Dir}}/copied-from-guest/kubeconfig.yaml
