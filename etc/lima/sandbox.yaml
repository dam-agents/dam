# Lima VM template for the platform sandbox node: the non-Kubernetes machine
# that runs vm-backend agents as smolvm microVMs. cluster:install creates it
# (alongside the k3s VM) when virtualization.enabled is set, then installs the
# smolvm CLI and the sandbox-node agent on it.

images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64

# smolvm needs /dev/kvm: Apple silicon exposes it to a vz guest only with
# nested virtualization (M3+/macOS 15), and the k3s VM is created with the same
# flag so both sit on lima's user-v2 network, which is what lets the two VMs
# dial each other directly (the controller → node API, api-server → machine
# port, machine → gateway ClusterIP routed via the k3s VM).
vmType: vz
nestedVirtualization: true
networks:
  - lima: user-v2

# Every machine takes its own vCPUs and RAM from this budget, on top of the
# platform stack in the k3s VM. Oversubscribing the host is fine — vz
# time-shares vCPUs — but the sum of machine memory must fit here.
cpus: 6
memory: 12GiB
disk: 100GiB

containerd:
  system: false
  user: false

portForwards:
  # Deny-by-default, like the k3s template: nothing on this VM is for the host.
  - guestIP: 0.0.0.0
    proto: any
    ignore: true

message: |
  sandbox node is ready. Machines: limactl shell platform-sandbox sudo smolvm machine ls
