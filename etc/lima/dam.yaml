# The dev VM. On macOS the whole platform runs in here — gVisor, network
# namespaces and nftables all need a Linux kernel, so there is no "run it on
# the host" mode any more, and this file is the development environment.
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

cpus: 6
memory: "12GiB"
disk: "80GiB"

mounts:
  - location: "~/git"
    writable: true
  - location: "/tmp/lima"
    writable: true

# The UI and the api-server; agent sandboxes are never exposed off the VM.
portForwards:
  - guestPort: 4000
    hostPort: 4000
  - guestPort: 8080
    hostPort: 8081

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      apt-get update
      apt-get install -y containerd nftables iproute2 openssl \
        postgresql redis-server nginx-light rsync jq curl

      # Node from upstream: the archive's is too old for the api-server, and
      # the version has to match what the repo builds against.
      NODE_VERSION=24.9.0
      case "$(uname -m)" in
        aarch64) NODE_ARCH=arm64 ;;
        x86_64)  NODE_ARCH=x64 ;;
      esac
      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" \
        | tar -xJ -C /usr/local --strip-components=1

      # nerdctl and the CNI plugins are not in Ubuntu's archive.
      NERDCTL_VERSION=2.1.2
      ARCH=$(dpkg --print-architecture)
      curl -fsSL "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-${ARCH}.tar.gz" \
        | tar -xz -C /usr/local/bin nerdctl

      # gVisor: the sandbox boundary, so a dev VM without it is not a dev VM.
      ARCH_GVISOR=$(uname -m)
      URL="https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH_GVISOR}"
      curl -fsSL -o /usr/local/bin/runsc "${URL}/runsc"
      curl -fsSL -o /usr/local/bin/containerd-shim-runsc-v1 "${URL}/containerd-shim-runsc-v1"
      chmod 0755 /usr/local/bin/runsc /usr/local/bin/containerd-shim-runsc-v1

      # Envoy is the paired gateway, and Ubuntu ships no package for it.
      ENVOY_VERSION=1.36.1
      case "$(uname -m)" in
        aarch64) ENVOY_ARCH=aarch_64 ;;
        x86_64)  ENVOY_ARCH=x86_64 ;;
      esac
      curl -fsSL -o /usr/local/bin/envoy \
        "https://github.com/envoyproxy/envoy/releases/download/v${ENVOY_VERSION}/envoy-${ENVOY_VERSION}-linux-${ENVOY_ARCH}"
      chmod 0755 /usr/local/bin/envoy

      mkdir -p /etc/containerd
      cat >/etc/containerd/config.toml <<'CONF'
      version = 2
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
        runtime_type = "io.containerd.runsc.v1"
      CONF
      systemctl restart containerd

      id dam-gateway >/dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin dam-gateway

probes:
  - description: "containerd answers with the runsc handler registered"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      timeout 120s bash -c "until nerdctl info >/dev/null 2>&1; do sleep 2; done"
      test -x /usr/local/bin/runsc
