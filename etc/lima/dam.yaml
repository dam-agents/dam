# The dev VM. On macOS the whole platform runs in here — gVisor, network
# namespaces and nftables all need a Linux kernel, so there is no "run it on
# the host" mode any more, and this file is the development environment.
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# A node runs the api-server, one Envoy per agent and the agent sandboxes. It
# no longer runs Postgres, Redis or Keycloak — those are on the cluster — so
# this is sized for agents alone. Several nodes on one laptop add up: two of
# these plus the cluster VM is the normal dev shape.
cpus: 4
memory: "8GiB"
disk: "80GiB"

mounts:
  - location: "~/git"
    writable: true
  - location: "/tmp/lima"
    writable: true

# The api-server, which serves the UI too, and the peer port nodes reach each
# other on. Agent sandboxes are never exposed off the VM; the shared services
# live on the cluster, not here.
#
# Two lima guests cannot address each other directly on this network — each
# reaches the host and nothing else — so a node's address to its peers is the
# host plus whatever this forwards to. That is a property of running nodes as
# lima guests, not of the peer link.
portForwards:
  - guestPort: 4000
    hostPort: 4000
  - guestPort: 4002
    hostPort: 4002

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      apt-get update
      # Only what the distribution packages. Node, Envoy and runsc come from
      # their own releases through packages/dam-vm/bin/dam-toolchain, which
      # vm:install runs from the mounted checkout — the same script the bootc
      # image runs, so a dev node and a real one cannot drift apart.
      apt-get install -y nftables iproute2 openssl rsync jq curl xz-utils zstd

probes:
  - description: "the node has what the platform shells out to that the distribution ships"
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v nft ip openssl curl
