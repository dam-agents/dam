# After creating the app from this manifest, generate an app-level token in the
# Slack UI: Basic Information -> App-Level Tokens -> Generate Token and Scopes.
# Required scope: connections:write (socket mode). Add authorizations:read if
# you need to list installations.

display_information:
  name: DAM
  description: Deploy Agents MASSIVELY
  background_color: "#2c2d30"
  long_description: >
    Platform runs isolated AI agent harnesses on Kubernetes. This Slack app lets
    you trigger agent sessions, receive run updates, and chat with agents
    directly from channels and DMs.

features:
  app_home:
    # Turn on the Messages tab so people can actually type to the bot — without
    # this Slack shows "Sending messages to this app has been turned off" and
    # direct messages never reach the app. read_only=false lets them send.
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  # The Agents & AI Apps feature. The working status on a turn
  # (assistant.threads.setStatus) needs this feature and the assistant:write
  # scope requested below — declaring one without the other leaves it dark.
  assistant_view:
    assistant_description: >
      Chat with your agents, start runs, and follow their progress without
      leaving Slack.
  bot_user:
    display_name: DAM
    always_online: true
  slash_commands:
    - command: /dam
      description: Connect an agent to this conversation, or delete one of its posts
      usage_hint: "bind | unbind | delete <message link>"
      should_escape: false

oauth_config:
  # Every workspace, the app's own included, connects through the platform's
  # install flow, which needs this redirect URL; no bot token is copied from
  # Slack. Workspaces other than the app's own also need public distribution
  # activated (Manage Distribution). Replace the host with the platform's own —
  # the URL is fetched by the installing admin's browser, never by Slack, so an
  # internal host behind a VPN is fine. Token rotation (OAuth & Permissions)
  # also needs a redirect URL registered before Slack lets it be turned on.
  redirect_urls:
    - https://platform.example.com/api/slack/install/callback
  scopes:
    bot:
      - commands
      # Posting replies (chat.postMessage), the one-person notices a turn
      # can need (chat.postEphemeral), and deleting an agent's post when its
      # owner runs the delete command (chat.delete).
      - chat:write
      # The working status on a turn (assistant.threads.setStatus). Listed here
      # as well as implied by the assistant_view feature above — Slack's own
      # assistant templates request it explicitly beside that feature.
      - assistant:write
      # The agent-driven `react` tool (reactions.add) — the agent's own emoji
      # reactions, including the contextual ack it opens ambient turns with.
      - reactions:write
      # describe_message_reactions (reactions.get): who reacted to a message
      # and with what emoji — invisible to the agent otherwise. Optional: a
      # workspace that withholds it gets the tool answering that the scope is
      # missing, rather than the tool disappearing for every workspace.
      - reactions:read
      # Cross-workspace outbound: list the channels the bot is in, check
      # membership before posting, and open direct messages.
      - channels:read
      - groups:read
      - im:write
      # Resolving the user ids the agent sees in a conversation to the people
      # behind them (users.info). Both optional: a workspace without users:read
      # gets describe_channel_users answering that the scope is missing, and one
      # with users:read but not users:read.email resolves people without their
      # email.
      - users:read
      - users:read.email
      - app_mentions:read
      # Attachments: url_private downloads inbound; outbound uploads
      # (files.getUploadURLExternal, then the bytes, then
      # files.completeUploadExternal; or files.uploadV2), and deleting them
      # with their post (files.delete).
      - files:read
      - files:write
      # Channel history backs context injection on new sessions, the
      # message.* event subscriptions below (ambient mode) require it too, and
      # the delete command reads the linked post back to find its footer.
      - channels:history
      - groups:history
      # Direct messages and group DMs: read inbound messages (im:history backs
      # the message.im subscription below) and inject history into fresh
      # sessions. A group DM needs mpim:history for that injection — without it
      # the prompt build throws and the turn posts an error instead of a reply.
      - im:history
      - mpim:history

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      # Plain channel messages: only read when a binding has ambient mode on;
      # public and private channels respectively.
      - message.channels
      - message.groups
      # 1:1 direct messages: every message is addressed to the bot, so a bound
      # DM relays plain messages (no mention needed). Group DMs stay
      # mention-driven, so they arrive via app_mention — no message.mpim.
      - message.im
      # A workspace whose credential has stopped working is marked rather than
      # cleaned up: its bindings and identity links stay, and re-authorizing
      # clears the mark. Without these the platform only finds out when a call
      # fails.
      - app_uninstalled
      - tokens_revoked
      # The bot's own invite into a channel. Acted on only when the joining
      # member is the bot itself: the inviter gets a private bind link, so
      # nobody has to discover the slash command. Needs no scope beyond the
      # channels:read / groups:read already requested above.
      - member_joined_channel
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
